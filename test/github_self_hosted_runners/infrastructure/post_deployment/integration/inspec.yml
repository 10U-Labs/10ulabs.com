name: github-runners-infrastructure-integration
title: GitHub Self-Hosted Runners Infrastructure Integration Tests
maintainer: 10U Foundation, Inc
copyright: 10U Foundation, Inc
copyright_email: engineering@10ulabs.com
license: MIT
summary: Integration tests for GitHub Self-Hosted Runners infrastructure (cross-resource relationships)
version: 1.0.0
inspec_version: '>= 5.0'

depends:
  - name: inspec-aws
    git: https://github.com/inspec/inspec-aws.git

inputs:
  - name: account_id
    type: String
    description: AWS Account ID
    required: false

  - name: region
    type: String
    description: AWS Region
    required: false
    value: us-east-1

  - name: vpc_name
    type: String
    description: VPC Name
    required: true
    value: github-runners-vpc

  - name: lambda_name
    type: String
    description: Lambda Function Name
    required: true
    value: github-runner_webhook-handler

  - name: api_gateway_name
    type: String
    description: API Gateway Name
    required: true
    value: github-runner_webhook
