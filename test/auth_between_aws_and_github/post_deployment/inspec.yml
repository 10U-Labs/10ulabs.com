name: auth-between-aws-and-github
title: AWS-GitHub Authentication Infrastructure Compliance Validation
maintainer: 10U Foundation, Inc
copyright: 10U Foundation, Inc
copyright_email: engineering@10ulabs.com
license: MIT
summary: Validates that bilateral authorization infrastructure between AWS and GitHub is secure and correctly configured
version: 1.0.0
inspec_version: '>= 5.0'

depends:
  - name: inspec-aws
    git: https://github.com/inspec/inspec-aws.git

inputs:
  - name: account_id
    type: String
    description: AWS Account ID
    required: false

  - name: region
    type: String
    description: AWS Region
    required: false
    value: us-east-1

  - name: iam_role_name
    type: String
    description: IAM Role Name for GitHub Actions
    required: false
    value: GitHubActionsRole

  - name: github_org
    type: String
    description: GitHub Organization
    required: false

  - name: github_repo
    type: String
    description: GitHub Repository
    required: false

  - name: github_pat_secret_name
    type: String
    description: Secrets Manager secret name for GitHub PAT
    required: false
    value: github-runner/credentials
