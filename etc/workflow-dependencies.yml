---
# Workflow Dependency Graph
#
# This file defines the dependency relationships between GitHub Actions
# workflows. The orchestrator.yml workflow uses this to determine which
# workflows to trigger when files change.
#
# For each workflow:
#   - name: The display name (must match the 'name:' field in the workflow)
#   - paths: File patterns that trigger this workflow
#   - depends_on: List of workflows (by key) that must complete before this
api_backend:
  depends_on:
    - www_shared
  name: Ensuring API backend exists and is properly configured
  paths:
    - '.github/workflows/api_backend.yml'
    - 'src/api/backend/**'
    - 'src/www/api/**'
    - 'test/api/backend/**'
    - 'test/api/conftest.py'
api_shared_ecr:
  depends_on:
    - endpoint_health
  name: Ensuring ECR repository exists and is properly configured
  paths:
    - '.github/workflows/api_shared_ecr.yml'
    - 'lib/terraform/**'
    - 'src/api/shared/ecr/**'
    - 'test/api/shared/ecr/**'
bootstrap:
  depends_on: []
  name: Ensuring bootstrap infrastructure exists and is properly configured
  paths:
    - '.github/workflows/bootstrap.yml'
    - 'src/bootstrap/**'
    - 'test/bootstrap/**'
claude:
  depends_on: []
  name: Testing Claude Code hooks
  paths:
    - '.claude/**'
    - '.github/workflows/claude.yml'
    - 'test/claude/**'
endpoint_health:
  depends_on:
    - api_backend
  name: Ensuring health endpoint exists and is properly configured
  paths:
    - '.github/workflows/endpoint_health.yml'
    - 'src/api/endpoints/health/**'
    - 'test/api/endpoints/health/**'
endpoint_v1_contact:
  depends_on:
    - endpoint_v1_ecs_runner
  name: Ensuring contact endpoint exists and is properly configured
  paths:
    - '.github/workflows/endpoint_v1_contact.yml'
    - 'src/api/endpoints/contact/**'
    - 'test/api/endpoints/contact/**'
endpoint_v1_ec2_runner:
  depends_on:
    - endpoint_v1_image_for_ec2_runners
  name: >-
    Ensuring the /v1/ec2-runner API endpoint exists and is properly configured
  paths:
    - '.github/workflows/endpoint_v1_ec2_runner.yml'
    - 'src/api/endpoints/ec2_runner/**'
    - 'test/api/conftest.py'
    - 'test/api/endpoints/ec2_runner/**'
endpoint_v1_echo:
  depends_on:
    - endpoint_v1_ecs_runner
  name: Ensuring echo endpoint exists and is properly configured
  paths:
    - '.github/workflows/endpoint_v1_echo.yml'
    - 'src/api/endpoints/echo/**'
    - 'test/api/endpoints/echo/**'
endpoint_v1_ecs_runner:
  depends_on:
    - endpoint_v1_image_for_ecs_runners
  name: >-
    Ensuring the /v1/ecs-runner API endpoint exists and is properly configured
  paths:
    - '.github/workflows/endpoint_v1_ecs_runner.yml'
    - 'src/api/endpoints/ecs_runner/**'
    - 'test/api/conftest.py'
    - 'test/api/endpoints/ecs_runner/**'
endpoint_v1_image_for_ec2_runners:
  depends_on:
    - endpoint_v1_image_for_ec2_runners_post
  name: Deploying image_for_ec2_runners endpoint
  paths:
    - '.github/workflows/endpoint_v1_image_for_ec2_runners.yml'
    - 'src/api/endpoints/image_for_ec2_runners/endpoint/**'
    - 'test/api/endpoints/image_for_ec2_runners/endpoint/**'
endpoint_v1_image_for_ec2_runners_post:
  depends_on:
    - endpoint_health
  name: Building AMI for EC2 self-hosted runners
  paths:
    - '.github/workflows/endpoint_v1_image_for_ec2_runners_post.yml'
    - 'lib/python/ec2_fleet/**'
    - 'src/api/endpoints/image_for_ec2_runners/post/**'
    - 'test/api/endpoints/image_for_ec2_runners/post/**'
endpoint_v1_image_for_ecs_runners:
  depends_on:
    - api_shared_ecr
  name: Building Docker image for ECS runners
  paths:
    - '.github/workflows/endpoint_v1_image_for_ecs_runners.yml'
    - 'src/api/endpoints/image_for_ecs_runners/**'
    - 'test/api/endpoints/image_for_ecs_runners/**'
endpoint_v1_rack_designer:
  depends_on:
    - endpoint_v1_ecs_runner
  name: Ensuring Rack Designer exists and is properly configured
  paths:
    - '.github/workflows/endpoint_v1_rack_designer.yml'
    - 'src/api/endpoints/rack_designer/**'
    - 'src/www/paths/rack_designer/**'
    - 'test/api/endpoints/rack_designer/**'
endpoint_v1_runners:
  depends_on:
    - endpoint_v1_ec2_runner
    - endpoint_v1_ecs_runner
  name: >-
    Ensuring the /v1/runners API endpoint exists and is properly configured
  paths:
    - '.github/workflows/endpoint_v1_runners.yml'
    - 'src/api/endpoints/runners/**'
    - 'test/api/conftest.py'
    - 'test/api/endpoints/runners/**'
endpoint_v1_simulation_soc:
  depends_on:
    - endpoint_v1_ecs_runner
  name: >-
    Ensuring the /v1/simulation-soc API endpoint exists and is properly
    configured
  paths:
    - '.github/workflows/endpoint_v1_simulation_soc.yml'
    - 'src/api/endpoints/simulation_soc/**'
    - 'src/www/paths/simulations/soc/**'
    - 'test/api/endpoints/simulation_soc/**'
www_index:
  depends_on:
    - endpoint_v1_contact
  name: Ensuring www index (home page) exists and is properly configured
  paths:
    - '.github/workflows/www_index.yml'
    - 'src/www/paths/index/**'
    - 'test/www/paths/index/**'
www_shared:
  depends_on:
    - bootstrap
  name: Ensuring www shared infrastructure exists and is properly configured
  paths:
    - '.github/workflows/www_shared.yml'
    - 'src/www/shared/**'
    - 'test/www/shared/**'
