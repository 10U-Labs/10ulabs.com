---
# Workflow Dependency Graph
#
# This file defines the dependency relationships between GitHub Actions
# workflows. The orchestrator.yml workflow uses this to determine which
# workflows to trigger when files change.
#
# For each workflow:
#   - depends_on: List of workflows (by key) that must complete before this
#   - name: The display name (must match the 'name:' field in the workflow)
#   - paths: File patterns that trigger this workflow
agents_agent_creator:
  depends_on:
    - agents_workflow_fixer
  name: Deploying Agent Creator
  paths:
    - '.github/workflows/agents_agent_creator.yml'
    - 'src/agents/agent_creator/**'
    - 'test/agents/agent_creator/**'
agents_agent_deleter:
  depends_on:
    - agents_workflow_fixer
  name: Deploying Agent Deleter
  paths:
