<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="10U Labs Rack Front View Designer - Design 10 inch server racks">
    <title>10U Labs Rack Front View Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            min-height: 600px;
        }

        .palette {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

        .palette h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .component-item {
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: move;
            transition: all 0.3s ease;
            user-select: none;
        }

        .component-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .component-item:active {
            cursor: grabbing;
        }

        .component-name {
            font-weight: bold;
            color: #333;
        }

        .main-area {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
        }

        .main-area.no-selection {
            grid-template-columns: 1fr;
        }

        .rack-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rack-container {
            background: #2c3e50;
            border-radius: 10px;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .rack {
            background: #34495e;
            border: 4px solid #1a252f;
            border-radius: 5px;
            position: relative;
            width: 400px;
            display: flex;
            flex-direction: column-reverse;
        }

        .rack-slot {
            height: 40px;
            border-bottom: 1px solid #4a5f7f;
            position: relative;
            background: linear-gradient(90deg, #2c3e50 0%, #34495e 100%);
            transition: background 0.2s ease;
        }

        .rack-slot:first-child {
            border-bottom: none;
        }

        .rack-slot.drag-over {
            background: #3a5a7a;
        }

        .rack-slot-number {
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .placed-component {
            position: absolute;
            left: 0;
            right: 0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .placed-component:hover {
            filter: brightness(1.1);
        }

        .placed-component.selected {
            box-shadow: 0 0 0 3px #fff, 0 0 0 6px #667eea;
        }

        .placed-component.dragging {
            cursor: grabbing;
            opacity: 0.7;
        }

        .component-remove {
            position: absolute;
            right: 10px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .component-remove:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .height-control {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .height-control label {
            font-weight: 500;
            color: #555;
        }

        .height-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
            min-width: 50px;
            text-align: center;
        }

        .height-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .height-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .height-btn:active {
            transform: translateY(0);
        }

        .height-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-left: auto;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
        }

        .reset-btn:active {
            transform: translateY(0);
        }

        .details-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .details-panel h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .form-group input[type="text"],
        .form-group input[type="color"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="color"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input[type="color"] {
            height: 50px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            margin-top: 10px;
        }

        .btn-danger:hover {
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
        }

        .component-info {
            background: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .component-info p {
            color: #555;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 5px;
        }

        .component-info p:last-child {
            margin-bottom: 0;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            padding: 20px;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }

            .main-area {
                grid-template-columns: 1fr;
            }

            .rack {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>10U Labs Rack Front View Designer</h1>
        <p>Design your 10" server rack configuration</p>
    </div>

    <div class="container">
        <div class="palette">
            <h2>Components</h2>
            <div class="component-item" draggable="true" data-component="server" data-size="2" data-default-color="#3498db">
                <div class="component-name">Server (2U)</div>
            </div>
            <div class="component-item" draggable="true" data-component="switch" data-size="1" data-default-color="#f39c12">
                <div class="component-name">Switch (1U)</div>
            </div>
            <div class="component-item" draggable="true" data-component="ups" data-size="2" data-default-color="#e74c3c">
                <div class="component-name">UPS (2U)</div>
            </div>
            <div class="component-item" draggable="true" data-component="ventilation" data-size="1" data-default-color="#95a5a6">
                <div class="component-name">Ventilation Panel (1U)</div>
            </div>
            <div class="component-item" draggable="true" data-component="wifi-bridge" data-size="1" data-default-color="#2ecc71">
                <div class="component-name">WiFi Bridge (1U)</div>
            </div>
        </div>

        <div class="main-area" id="mainArea">
            <div class="rack-section">
                <div class="rack-container">
                    <div class="rack" id="rack"></div>
                </div>
                <div class="height-control">
                    <label>Rack Height:</label>
                    <button class="height-btn" id="decreaseHeight">−</button>
                    <span class="height-value" id="heightValue">5U</span>
                    <button class="height-btn" id="increaseHeight">+</button>
                    <button class="reset-btn" onclick="resetRack()">Reset</button>
                </div>
            </div>

            <div class="details-panel" id="detailsPanel" style="display: none;">
                <h2>Component Details</h2>
                <div class="component-info">
                    <p><strong>Type:</strong> <span id="detailType">-</span></p>
                    <p><strong>Size:</strong> <span id="detailSize">-</span></p>
                    <p><strong>Position:</strong> <span id="detailPosition">-</span></p>
                </div>
                <div class="form-group">
                    <label for="componentName">Name</label>
                    <input type="text" id="componentName" placeholder="Enter component name">
                </div>
                <div class="form-group">
                    <label for="componentColor">Background Color</label>
                    <input type="color" id="componentColor">
                </div>
                <button class="btn" onclick="applyChanges()">Apply Changes</button>
                <button class="btn btn-danger" onclick="deleteComponent()">Delete Component</button>
            </div>
        </div>
    </div>

    <script>
        let rackHeight = 5;
        let placedComponents = [];
        let selectedComponentId = null;

        const defaultColors = {
            'server': '#3498db',
            'wifi-bridge': '#2ecc71',
            'ventilation': '#95a5a6',
            'ups': '#e74c3c',
            'switch': '#f39c12'
        };

        function initRack() {
            const rack = document.getElementById('rack');
            rack.innerHTML = '';

            for (let i = rackHeight; i >= 1; i--) {
                const slot = document.createElement('div');
                slot.className = 'rack-slot';
                slot.dataset.slot = i;

                const slotNumber = document.createElement('div');
                slotNumber.className = 'rack-slot-number';
                slotNumber.textContent = i;
                slot.appendChild(slotNumber);

                slot.addEventListener('dragover', handleDragOver);
                slot.addEventListener('drop', handleDrop);
                slot.addEventListener('dragleave', handleDragLeave);

                rack.appendChild(slot);
            }
        }

        function handleDragStart(e) {
            const componentType = e.target.dataset.component;
            const componentSize = e.target.dataset.size;

            if (componentType) {
                e.dataTransfer.setData('componentType', componentType);
                e.dataTransfer.setData('componentSize', componentSize);
                e.dataTransfer.effectAllowed = 'copy';
            } else {
                const componentId = e.target.dataset.componentId;
                e.dataTransfer.setData('existingComponent', componentId);
                e.dataTransfer.effectAllowed = 'move';
                e.target.classList.add('dragging');
            }
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            const slot = parseInt(e.currentTarget.dataset.slot);
            const existingComponentId = e.dataTransfer.getData('existingComponent');

            if (existingComponentId) {
                moveComponent(existingComponentId, slot);
            } else {
                const componentType = e.dataTransfer.getData('componentType');
                const componentSize = parseInt(e.dataTransfer.getData('componentSize'));
                addComponent(componentType, componentSize, slot);
            }
        }

        function addComponent(type, size, startSlot) {
            if (!canPlaceComponent(startSlot, size)) {
                alert(`Cannot place component: slots ${startSlot} to ${startSlot + size - 1} are not available or exceed rack height.`);
                return;
            }

            const component = {
                id: Date.now().toString(),
                type: type,
                size: size,
                startSlot: startSlot,
                customName: null,
                customColor: null
            };

            placedComponents.push(component);
            renderComponents();
        }

        function moveComponent(componentId, newStartSlot) {
            const component = placedComponents.find(c => c.id === componentId);
            if (!component) return;

            const otherComponents = placedComponents.filter(c => c.id !== componentId);

            for (let i = newStartSlot; i < newStartSlot + component.size; i++) {
                if (i > rackHeight) {
                    alert(`Cannot place component: exceeds rack height.`);
                    return;
                }

                for (const other of otherComponents) {
                    const otherEnd = other.startSlot + other.size - 1;
                    if (i >= other.startSlot && i <= otherEnd) {
                        alert(`Cannot place component: slot ${i} is occupied.`);
                        return;
                    }
                }
            }

            component.startSlot = newStartSlot;
            renderComponents();
        }

        function canPlaceComponent(startSlot, size, excludeId = null) {
            const endSlot = startSlot + size - 1;

            if (endSlot > rackHeight) {
                return false;
            }

            for (let i = startSlot; i < startSlot + size; i++) {
                for (const component of placedComponents) {
                    if (excludeId && component.id === excludeId) continue;
                    const componentEnd = component.startSlot + component.size - 1;
                    if (i >= component.startSlot && i <= componentEnd) {
                        return false;
                    }
                }
            }

            return true;
        }

        function removeComponent(componentId) {
            placedComponents = placedComponents.filter(c => c.id !== componentId);
            if (selectedComponentId === componentId) {
                deselectComponent();
            }
            renderComponents();
        }

        function selectComponent(componentId) {
            selectedComponentId = componentId;
            const component = placedComponents.find(c => c.id === componentId);

            if (component) {
                document.getElementById('detailType').textContent = getComponentName(component.type);
                document.getElementById('detailSize').textContent = `${component.size}U`;
                document.getElementById('detailPosition').textContent = `${component.startSlot}U - ${component.startSlot + component.size - 1}U`;
                document.getElementById('componentName').value = component.customName || getComponentName(component.type);
                document.getElementById('componentColor').value = component.customColor || defaultColors[component.type];
                document.getElementById('detailsPanel').style.display = 'block';
                document.getElementById('mainArea').classList.remove('no-selection');
            }

            renderComponents();
        }

        function deselectComponent() {
            selectedComponentId = null;
            document.getElementById('detailsPanel').style.display = 'none';
            document.getElementById('mainArea').classList.add('no-selection');
            renderComponents();
        }

        function applyChanges() {
            if (!selectedComponentId) return;

            const component = placedComponents.find(c => c.id === selectedComponentId);
            if (component) {
                const newName = document.getElementById('componentName').value.trim();
                const newColor = document.getElementById('componentColor').value;

                component.customName = newName || null;
                component.customColor = newColor;

                renderComponents();
            }
        }

        function deleteComponent() {
            if (!selectedComponentId) return;

            if (confirm('Are you sure you want to delete this component?')) {
                removeComponent(selectedComponentId);
            }
        }

        function renderComponents() {
            document.querySelectorAll('.placed-component').forEach(el => el.remove());

            const rack = document.getElementById('rack');
            const slotHeight = 40;

            placedComponents.forEach(component => {
                const componentEl = document.createElement('div');
                componentEl.className = `placed-component`;
                componentEl.dataset.componentId = component.id;
                componentEl.draggable = true;

                if (component.id === selectedComponentId) {
                    componentEl.classList.add('selected');
                }

                const bottomPosition = (component.startSlot - 1) * slotHeight;
                componentEl.style.bottom = `${bottomPosition}px`;
                componentEl.style.height = `${component.size * slotHeight}px`;

                const color = component.customColor || defaultColors[component.type];
                componentEl.style.background = color;
                componentEl.style.border = `2px solid ${adjustBrightness(color, -20)}`;

                const nameSpan = document.createElement('span');
                nameSpan.textContent = component.customName || getComponentName(component.type);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'component-remove';
                removeBtn.textContent = '×';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeComponent(component.id);
                };

                componentEl.appendChild(nameSpan);
                componentEl.appendChild(removeBtn);

                componentEl.addEventListener('dragstart', handleDragStart);
                componentEl.addEventListener('dragend', handleDragEnd);
                componentEl.addEventListener('click', (e) => {
                    if (e.target !== removeBtn) {
                        selectComponent(component.id);
                    }
                });

                rack.appendChild(componentEl);
            });
        }

        function getComponentName(type) {
            const names = {
                'server': 'Server',
                'wifi-bridge': 'WiFi Bridge',
                'ventilation': 'Ventilation Panel',
                'ups': 'UPS',
                'switch': 'Switch'
            };
            return names[type] || type;
        }

        function adjustBrightness(color, amount) {
            const num = parseInt(color.replace('#', ''), 16);
            const r = Math.max(0, Math.min(255, (num >> 16) + amount));
            const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
            const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
            return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }

        function updateHeight(delta) {
            const newHeight = rackHeight + delta;

            if (newHeight < 1 || newHeight > 42) {
                return;
            }

            const maxUsedSlot = placedComponents.reduce((max, c) => {
                return Math.max(max, c.startSlot + c.size - 1);
            }, 0);

            if (newHeight < maxUsedSlot) {
                alert(`Cannot reduce height below ${maxUsedSlot}U: components are using those slots.`);
                return;
            }

            rackHeight = newHeight;
            document.getElementById('heightValue').textContent = `${rackHeight}U`;
            initRack();
            renderComponents();
        }

        function resetRack() {
            if (placedComponents.length > 0) {
                if (confirm('Are you sure you want to remove all components from the rack?')) {
                    placedComponents = [];
                    deselectComponent();
                    renderComponents();
                }
            }
        }

        document.getElementById('increaseHeight').addEventListener('click', () => updateHeight(1));
        document.getElementById('decreaseHeight').addEventListener('click', () => updateHeight(-1));

        document.querySelectorAll('.component-item').forEach(item => {
            item.addEventListener('dragstart', handleDragStart);
        });

        document.addEventListener('click', (e) => {
            if (selectedComponentId &&
                !e.target.closest('.placed-component') &&
                !e.target.closest('.details-panel')) {
                deselectComponent();
            }
        });

        initRack();
        document.getElementById('mainArea').classList.add('no-selection');
    </script>

    <div class="footer">
        Copyright &copy; 10U Labs, LLC 2025. All rights reserved.
    </div>
</body>
</html>
