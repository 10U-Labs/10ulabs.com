<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="10U Labs Rack Designer - Design 10 inch server racks">
    <title>10U Labs Rack Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            display: grid;
            grid-template-columns: 300px 1fr 250px;
            gap: 30px;
            min-height: 600px;
        }

        .palette {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

        .palette h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .component-item {
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: move;
            transition: all 0.3s ease;
            user-select: none;
        }

        .component-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .component-item:active {
            cursor: grabbing;
        }

        .component-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .component-size {
            font-size: 0.85rem;
            color: #666;
        }

        .rack-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rack-container {
            background: #2c3e50;
            border-radius: 10px;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .rack {
            background: #34495e;
            border: 4px solid #1a252f;
            border-radius: 5px;
            position: relative;
            width: 400px;
            display: flex;
            flex-direction: column-reverse;
        }

        .rack-slot {
            height: 40px;
            border-bottom: 1px solid #4a5f7f;
            position: relative;
            background: linear-gradient(90deg, #2c3e50 0%, #34495e 100%);
            transition: background 0.2s ease;
        }

        .rack-slot:first-child {
            border-bottom: none;
        }

        .rack-slot.drag-over {
            background: #3a5a7a;
        }

        .rack-slot-number {
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .placed-component {
            position: absolute;
            left: 0;
            right: 0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            color: white;
            font-weight: 500;
            cursor: grab;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .placed-component:hover {
            filter: brightness(1.1);
        }

        .placed-component:active {
            cursor: grabbing;
        }

        .placed-component.server {
            background: linear-gradient(135deg, #3498db, #2980b9);
            border: 2px solid #2573a7;
            height: 80px;
        }

        .placed-component.wifi-bridge {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: 2px solid #229954;
            height: 40px;
        }

        .placed-component.ventilation {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            border: 2px solid #6c7a7b;
            height: 40px;
        }

        .placed-component.ups {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: 2px solid #a93226;
            height: 80px;
        }

        .placed-component.switch {
            background: linear-gradient(135deg, #f39c12, #d68910);
            border: 2px solid #b9770e;
            height: 40px;
        }

        .component-remove {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .component-remove:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .controls {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

        .controls h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .control-group input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .control-group input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .info-box h3 {
            color: #2980b9;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .info-box p {
            color: #555;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }

            .rack {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>10U Labs Rack Designer</h1>
        <p>Design your 10" server rack configuration</p>
    </div>

    <div class="container">
        <div class="palette">
            <h2>Components</h2>
            <div class="component-item" draggable="true" data-component="server" data-size="2">
                <div class="component-name">Server</div>
                <div class="component-size">2U</div>
            </div>
            <div class="component-item" draggable="true" data-component="wifi-bridge" data-size="1">
                <div class="component-name">WiFi Bridge</div>
                <div class="component-size">1U</div>
            </div>
            <div class="component-item" draggable="true" data-component="ventilation" data-size="1">
                <div class="component-name">Ventilation Panel</div>
                <div class="component-size">1U</div>
            </div>
            <div class="component-item" draggable="true" data-component="ups" data-size="2">
                <div class="component-name">UPS</div>
                <div class="component-size">2U</div>
            </div>
            <div class="component-item" draggable="true" data-component="switch" data-size="1">
                <div class="component-name">Switch</div>
                <div class="component-size">1U</div>
            </div>
        </div>

        <div class="rack-area">
            <div class="rack-container">
                <div class="rack" id="rack"></div>
            </div>
        </div>

        <div class="controls">
            <h2>Settings</h2>
            <div class="info-box">
                <h3>Current Rack</h3>
                <p>Height: <span id="currentHeight">5</span>U</p>
                <p>Used: <span id="usedSlots">0</span>U</p>
                <p>Free: <span id="freeSlots">5</span>U</p>
            </div>
            <div class="control-group">
                <label for="rackHeight">Rack Height (U)</label>
                <input type="number" id="rackHeight" min="1" max="42" value="5">
            </div>
            <button class="btn" onclick="clearRack()">Clear Rack</button>
        </div>
    </div>

    <script>
        let rackHeight = 5;
        let placedComponents = [];

        function initRack() {
            const rack = document.getElementById('rack');
            rack.innerHTML = '';

            for (let i = rackHeight; i >= 1; i--) {
                const slot = document.createElement('div');
                slot.className = 'rack-slot';
                slot.dataset.slot = i;

                const slotNumber = document.createElement('div');
                slotNumber.className = 'rack-slot-number';
                slotNumber.textContent = i;
                slot.appendChild(slotNumber);

                slot.addEventListener('dragover', handleDragOver);
                slot.addEventListener('drop', handleDrop);
                slot.addEventListener('dragleave', handleDragLeave);

                rack.appendChild(slot);
            }

            updateStats();
        }

        function handleDragStart(e) {
            const componentType = e.target.dataset.component;
            const componentSize = e.target.dataset.size;

            if (componentType) {
                e.dataTransfer.setData('componentType', componentType);
                e.dataTransfer.setData('componentSize', componentSize);
                e.dataTransfer.effectAllowed = 'copy';
            } else {
                const componentId = e.target.dataset.componentId;
                e.dataTransfer.setData('existingComponent', componentId);
                e.dataTransfer.effectAllowed = 'move';
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            const slot = parseInt(e.currentTarget.dataset.slot);
            const existingComponentId = e.dataTransfer.getData('existingComponent');

            if (existingComponentId) {
                moveComponent(existingComponentId, slot);
            } else {
                const componentType = e.dataTransfer.getData('componentType');
                const componentSize = parseInt(e.dataTransfer.getData('componentSize'));
                addComponent(componentType, componentSize, slot);
            }
        }

        function addComponent(type, size, startSlot) {
            if (!canPlaceComponent(startSlot, size)) {
                alert(`Cannot place component: slots ${startSlot} to ${startSlot + size - 1} are not available or exceed rack height.`);
                return;
            }

            const component = {
                id: Date.now().toString(),
                type: type,
                size: size,
                startSlot: startSlot
            };

            placedComponents.push(component);
            renderComponents();
            updateStats();
        }

        function moveComponent(componentId, newStartSlot) {
            const component = placedComponents.find(c => c.id === componentId);
            if (!component) return;

            const otherComponents = placedComponents.filter(c => c.id !== componentId);

            for (let i = newStartSlot; i < newStartSlot + component.size; i++) {
                if (i > rackHeight) {
                    alert(`Cannot place component: exceeds rack height.`);
                    return;
                }

                for (const other of otherComponents) {
                    const otherEnd = other.startSlot + other.size - 1;
                    if (i >= other.startSlot && i <= otherEnd) {
                        alert(`Cannot place component: slot ${i} is occupied.`);
                        return;
                    }
                }
            }

            component.startSlot = newStartSlot;
            renderComponents();
            updateStats();
        }

        function canPlaceComponent(startSlot, size) {
            const endSlot = startSlot + size - 1;

            if (endSlot > rackHeight) {
                return false;
            }

            for (let i = startSlot; i < startSlot + size; i++) {
                for (const component of placedComponents) {
                    const componentEnd = component.startSlot + component.size - 1;
                    if (i >= component.startSlot && i <= componentEnd) {
                        return false;
                    }
                }
            }

            return true;
        }

        function removeComponent(componentId) {
            placedComponents = placedComponents.filter(c => c.id !== componentId);
            renderComponents();
            updateStats();
        }

        function renderComponents() {
            document.querySelectorAll('.placed-component').forEach(el => el.remove());

            const rack = document.getElementById('rack');
            const rackRect = rack.getBoundingClientRect();
            const slotHeight = 40;

            placedComponents.forEach(component => {
                const componentEl = document.createElement('div');
                componentEl.className = `placed-component ${component.type}`;
                componentEl.dataset.componentId = component.id;
                componentEl.draggable = true;

                const bottomPosition = (component.startSlot - 1) * slotHeight;
                componentEl.style.bottom = `${bottomPosition}px`;
                componentEl.style.height = `${component.size * slotHeight}px`;

                const nameSpan = document.createElement('span');
                nameSpan.textContent = getComponentName(component.type);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'component-remove';
                removeBtn.textContent = '×';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeComponent(component.id);
                };

                componentEl.appendChild(nameSpan);
                componentEl.appendChild(removeBtn);

                componentEl.addEventListener('dragstart', handleDragStart);

                rack.appendChild(componentEl);
            });
        }

        function getComponentName(type) {
            const names = {
                'server': 'Server',
                'wifi-bridge': 'WiFi Bridge',
                'ventilation': 'Ventilation Panel',
                'ups': 'UPS',
                'switch': 'Switch'
            };
            return names[type] || type;
        }

        function updateStats() {
            const usedSlots = placedComponents.reduce((sum, c) => sum + c.size, 0);
            const freeSlots = rackHeight - usedSlots;

            document.getElementById('currentHeight').textContent = rackHeight;
            document.getElementById('usedSlots').textContent = usedSlots;
            document.getElementById('freeSlots').textContent = freeSlots;
        }

        function clearRack() {
            if (placedComponents.length > 0) {
                if (confirm('Are you sure you want to clear all components from the rack?')) {
                    placedComponents = [];
                    renderComponents();
                    updateStats();
                }
            }
        }

        document.getElementById('rackHeight').addEventListener('change', function(e) {
            const newHeight = parseInt(e.target.value);

            if (newHeight < 1) {
                e.target.value = 1;
                return;
            }

            if (newHeight > 42) {
                e.target.value = 42;
                return;
            }

            const maxUsedSlot = placedComponents.reduce((max, c) => {
                return Math.max(max, c.startSlot + c.size - 1);
            }, 0);

            if (newHeight < maxUsedSlot) {
                alert(`Cannot reduce height below ${maxUsedSlot}U: components are using those slots.`);
                e.target.value = rackHeight;
                return;
            }

            rackHeight = newHeight;
            initRack();
            renderComponents();
        });

        document.querySelectorAll('.component-item').forEach(item => {
            item.addEventListener('dragstart', handleDragStart);
        });

        initRack();
    </script>
</body>
</html>
