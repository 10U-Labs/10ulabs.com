<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="10U Labs Rack Front View Designer - Design 10 inch server racks">
    <title>10U Labs Rack Front View Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="header">
        <h1>10U Labs Rack Front View Designer</h1>
        <p>Design your 10" server rack configuration</p>
    </div>

    <div class="container">
        <div class="palette">
            <h2>Components</h2>
            <div class="component-item" draggable="true" data-component="server" data-size="2" data-default-color="#3498db">
                <div class="component-name">Server (2U)</div>
            </div>
            <div class="component-item" draggable="true" data-component="switch" data-size="1" data-default-color="#f39c12">
                <div class="component-name">Switch (1U)</div>
            </div>
            <div class="component-item" draggable="true" data-component="ups" data-size="2" data-default-color="#e74c3c">
                <div class="component-name">UPS (2U)</div>
            </div>
            <div class="component-item" draggable="true" data-component="ventilation" data-size="1" data-default-color="#95a5a6">
                <div class="component-name">Ventilation Panel (1U)</div>
            </div>
            <div class="component-item" draggable="true" data-component="wifi-bridge" data-size="1" data-default-color="#2ecc71">
                <div class="component-name">WiFi Bridge (1U)</div>
            </div>

            <button class="reset-btn" onclick="resetRack()" style="width: 100%; margin-top: 20px; margin-left: 0;">Reset</button>

            <div class="height-control" style="margin-top: 20px; flex-direction: column; align-items: stretch; gap: 10px;">
                <label style="text-align: center;">Rack Height</label>
                <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <button class="height-btn" id="decreaseHeight">−</button>
                    <span class="height-value" id="heightValue">5U</span>
                    <button class="height-btn" id="increaseHeight">+</button>
                </div>
            </div>
        </div>

        <div class="main-area" id="mainArea">
            <div class="rack-section">
                <div class="rack-container">
                    <div class="rack" id="rack"></div>
                </div>
            </div>

            <div class="details-panel" id="detailsPanel" style="display: none;">
                <h2>Component Details</h2>
                <div class="component-info">
                    <p><strong>Type:</strong> <span id="detailType">-</span></p>
                    <p><strong>Size:</strong> <span id="detailSize">-</span></p>
                    <p><strong>Position:</strong> <span id="detailPosition">-</span></p>
                </div>
                <div class="form-group">
                    <label for="componentName">Name</label>
                    <input type="text" id="componentName" placeholder="Enter component name">
                </div>
                <div class="form-group">
                    <label for="componentColor">Background Color</label>
                    <input type="color" id="componentColor">
                </div>
                <button class="btn" onclick="applyChanges()">Apply Changes</button>
                <button class="btn btn-danger" onclick="deleteComponent()">Delete Component</button>
            </div>
        </div>
    </div>

    <div class="footer">
        Copyright &copy; 10U Labs, LLC 2025. All rights reserved.
    </div>

    <script src="js/app.js"></script>
</body>
</html>
