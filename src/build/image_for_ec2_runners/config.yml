commands: |
  sudo apt-get update
  sudo apt-get install -y curl git jq python3-pip unzip wget
  sudo python3 -m pip install --break-system-packages boto3 boto3-stubs[ecr] botocore dnspython dockerfile-parse mypy pylint pytest python-hcl2 pyyaml requests types-PyYAML types-dockerfile-parse types-requests yamllint
  wget https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_${OS_ARCHITECTURE} -O /tmp/yq && sudo mv /tmp/yq /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq
  sudo install -m 0755 -d /etc/apt/keyrings
  curl -fsSL https://download.docker.com/linux/debian/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
  sudo apt-get update
  sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
  sudo systemctl enable docker
  sudo useradd -m -s /bin/bash github-runner
  sudo usermod -aG docker github-runner
  curl -o /tmp/actions-runner.tar.gz -L https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-${RUNNER_ARCH}-${RUNNER_VERSION}.tar.gz
  sudo -u github-runner mkdir -p /home/github-runner/actions-runner
  sudo -u github-runner tar xzf /tmp/actions-runner.tar.gz -C /home/github-runner/actions-runner
  sudo /home/github-runner/actions-runner/bin/installdependencies.sh
  wget https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/debian_${OS_ARCHITECTURE}/amazon-ssm-agent.deb -O /tmp/amazon-ssm-agent.deb
  sudo dpkg -i /tmp/amazon-ssm-agent.deb
  sudo systemctl enable amazon-ssm-agent
  wget https://s3.amazonaws.com/amazoncloudwatch-agent/debian/${OS_ARCHITECTURE}/latest/amazon-cloudwatch-agent.deb -O /tmp/amazon-cloudwatch-agent.deb
  sudo dpkg -i /tmp/amazon-cloudwatch-agent.deb
os_family: debian
os_version: "13"
region: us-east-1
runner_version: "2.330.0"
