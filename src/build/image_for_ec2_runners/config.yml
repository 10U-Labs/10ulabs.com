commands: |
  ARCH=$(dpkg --print-architecture)
  RUNNER_USER=github-runner
  VERSION_RUNNER=2.330.0
  VERSION_YQ=4.44.1
  sudo apt-get update
  sudo apt-get install -y ca-certificates curl
  sudo install -m 0755 -d /etc/apt/keyrings
  sudo curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  sudo chmod a+r /etc/apt/keyrings/docker.asc
  printf 'Types: deb\nURIs: https://download.docker.com/linux/debian\nSuites: %s\nComponents: stable\nSigned-By: /etc/apt/keyrings/docker.asc\n' "$(. /etc/os-release && echo $VERSION_CODENAME)" | sudo tee /etc/apt/sources.list.d/docker.sources > /dev/null
  sudo apt-get update
  sudo apt-get install -y \
    containerd.io \
    docker-buildx-plugin \
    docker-ce \
    docker-ce-cli \
    git \
    jq \
    python3-pip \
    unzip \
    wget
  sudo python3 -m pip install --break-system-packages \
    boto3 \
    boto3-stubs[ecr] \
    botocore \
    dnspython \
    dockerfile-parse \
    mypy \
    paramiko \
    pylint \
    pytest \
    python-hcl2 \
    pyyaml \
    requests \
    types-paramiko \
    types-PyYAML \
    types-dockerfile-parse \
    types-requests \
    yamllint
  sudo curl -o /usr/local/bin/yq -L https://github.com/mikefarah/yq/releases/download/v${VERSION_YQ}/yq_linux_${ARCH} &&
    sudo chmod +x /usr/local/bin/yq
  sudo useradd -m -s /bin/bash $RUNNER_USER
  sudo usermod -aG docker $RUNNER_USER
  curl -o /tmp/actions-runner.tar.gz -L \
    https://github.com/actions/runner/releases/download/v${VERSION_RUNNER}/actions-runner-linux-${ARCH}-${VERSION_RUNNER}.tar.gz
  sudo -u $RUNNER_USER mkdir -p /home/$RUNNER_USER/actions-runner
  sudo -u $RUNNER_USER tar xzf /tmp/actions-runner.tar.gz -C /home/$RUNNER_USER/actions-runner
  sudo /home/$RUNNER_USER/actions-runner/bin/installdependencies.sh
  curl -o /tmp/amazon-ssm-agent.deb -L \
    https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/debian_${ARCH}/amazon-ssm-agent.deb
  sudo dpkg -i /tmp/amazon-ssm-agent.deb
  sudo systemctl enable amazon-ssm-agent
  curl -o /tmp/amazon-cloudwatch-agent.deb -L \
    https://s3.amazonaws.com/amazoncloudwatch-agent/debian/${ARCH}/latest/amazon-cloudwatch-agent.deb
  sudo dpkg -i /tmp/amazon-cloudwatch-agent.deb
  rm -rf /tmp/*
  sudo systemctl enable docker
source_ami: debian-13-arm64-20251117-2299
