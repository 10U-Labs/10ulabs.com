commands: |
  # Define variables
  ARCH=$(dpkg --print-architecture)
  DOCKER_GPG=/etc/apt/keyrings/docker.gpg
  RUNNER_USER=github-runner
  VERSION_CODENAME=$(grep '^VERSION_CODENAME=' /etc/os-release | cut -d= -f2)

  # Add Docker repository
  sudo install -m 0755 -d /etc/apt/keyrings
  curl -fsSL https://download.docker.com/linux/debian/gpg |
    sudo gpg --dearmor -o $DOCKER_GPG
  echo "deb [arch=$ARCH signed-by=$DOCKER_GPG] \
    https://download.docker.com/linux/debian $VERSION_CODENAME stable" |
    sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

  # Install system packages
  sudo apt-get update
  sudo apt-get install -y \
    containerd.io \
    curl \
    docker-buildx-plugin \
    docker-ce \
    docker-ce-cli \
    git \
    jq \
    python3-pip \
    unzip \
    wget
  sudo systemctl enable docker

  # Install Python packages
  sudo python3 -m pip install --break-system-packages \
    boto3 \
    boto3-stubs[ecr] \
    botocore \
    dnspython \
    dockerfile-parse \
    mypy \
    pylint \
    pytest \
    python-hcl2 \
    pyyaml \
    requests \
    types-PyYAML \
    types-dockerfile-parse \
    types-requests \
    yamllint

  # Install yq
  curl -o /tmp/yq -L \
    https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_${ARCH}
  sudo mv /tmp/yq /usr/local/bin/yq
  sudo chmod +x /usr/local/bin/yq

  # Install GitHub Actions runner
  sudo useradd -m -s /bin/bash $RUNNER_USER
  sudo usermod -aG docker $RUNNER_USER
  curl -o /tmp/actions-runner.tar.gz -L \
    https://github.com/actions/runner/releases/download/v2.330.0/actions-runner-linux-arm64-2.330.0.tar.gz
  sudo -u $RUNNER_USER mkdir -p /home/$RUNNER_USER/actions-runner
  sudo -u $RUNNER_USER tar xzf /tmp/actions-runner.tar.gz -C /home/$RUNNER_USER/actions-runner
  sudo /home/$RUNNER_USER/actions-runner/bin/installdependencies.sh

  # Install AWS SSM Agent
  curl -o /tmp/amazon-ssm-agent.deb -L \
    https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/debian_${ARCH}/amazon-ssm-agent.deb
  sudo dpkg -i /tmp/amazon-ssm-agent.deb
  sudo systemctl enable amazon-ssm-agent

  # Install AWS CloudWatch Agent
  curl -o /tmp/amazon-cloudwatch-agent.deb -L \
    https://s3.amazonaws.com/amazoncloudwatch-agent/debian/${ARCH}/latest/amazon-cloudwatch-agent.deb
  sudo dpkg -i /tmp/amazon-cloudwatch-agent.deb
source_ami: debian-13-arm64-20251117-2299
