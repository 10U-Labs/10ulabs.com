---
# RTL Simulation Runner Configuration
# Instance: c8i.4xlarge (16 vCPU, 32 GB RAM, large L3 cache for Verilator)

runner:
  user: github-runner
  version: "2.321.0"
  group: rtl-runners

instance:
  type: c8i.4xlarge
  ami_base: ubuntu-24.04-amd64
  disk_size_gb: 100
  disk_type: gp3
  disk_iops: 3000
  disk_throughput: 125

tools:
  chipyard:
    version: "1.11.0"
    install_path: /opt/chipyard
  verilator:
    version: "5.024"
    install_path: /opt/verilator
  riscv_toolchain:
    version: "2024.04.12"
    install_path: /opt/riscv

packages:
  - build-essential
  - git
  - curl
  - wget
  - openjdk-17-jdk
  - python3
  - python3-pip
  - python3-venv
  - scala
  - sbt
  - autoconf
  - automake
  - autotools-dev
  - libmpc-dev
  - libmpfr-dev
  - libgmp-dev
  - gawk
  - bison
  - flex
  - texinfo
  - gperf
  - libtool
  - patchutils
  - bc
  - zlib1g-dev
  - libexpat-dev
  - ninja-build
  - cmake
  - libglib2.0-dev
  - libfdt-dev
  - libpixman-1-dev
  - device-tree-compiler

environment:
  RISCV: /opt/riscv
  CHIPYARD_DIR: /opt/chipyard
  VERILATOR_ROOT: /opt/verilator
  PATH: /opt/riscv/bin:/opt/verilator/bin:$PATH
