---
# RTL Synthesis Runner Configuration
# Instance: r8i.4xlarge (16 vCPU, 128 GB RAM for memory-intensive synthesis)

runner:
  user: github-runner
  version: "2.321.0"
  group: rtl-runners

instance:
  type: r8i.4xlarge
  ami_base: ubuntu-24.04-amd64
  disk_size_gb: 200
  disk_type: gp3
  disk_iops: 4000
  disk_throughput: 250

tools:
  openlane:
    version: "2.1.0"
    install_path: /opt/openlane
  sky130_pdk:
    version: "1.0.457"
    install_path: /opt/pdk/sky130
  magic:
    version: "8.3.468"
    install_path: /opt/magic
  klayout:
    version: "0.29.0"
    install_path: /opt/klayout
  yosys:
    version: "0.40"
    install_path: /opt/yosys
  openroad:
    version: "2.0"
    install_path: /opt/openroad

packages:
  - build-essential
  - git
  - curl
  - wget
  - python3
  - python3-pip
  - python3-venv
  - tcl
  - tcl-dev
  - tk
  - tk-dev
  - libcairo2-dev
  - libncurses-dev
  - libx11-dev
  - libxpm-dev
  - libxft-dev
  - libxext-dev
  - libreadline-dev
  - libffi-dev
  - graphviz
  - xdot
  - clang
  - bison
  - flex
  - libboost-all-dev
  - swig
  - cmake
  - ninja-build

environment:
  PDK_ROOT: /opt/pdk
  PDK: sky130A
  OPENLANE_ROOT: /opt/openlane
  PATH: /opt/openlane:/opt/magic/bin:/opt/klayout:/opt/yosys/bin:/opt/openroad/bin:$PATH
