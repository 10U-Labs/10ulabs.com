---
# RTL GPU Acceleration Runner Configuration
# Instance: g6e.xlarge (4 vCPU, 16 GB RAM, NVIDIA L40S GPU for RTLflow)

runner:
  user: github-runner
  version: "2.321.0"
  group: rtl-runners

instance:
  type: g6e.xlarge
  ami_base: nvidia-cuda-ubuntu-24.04
  disk_size_gb: 100
  disk_type: gp3
  disk_iops: 3000
  disk_throughput: 125

tools:
  cuda:
    version: "12.4"
    install_path: /usr/local/cuda
  rtlflow:
    version: main
    repository: https://github.com/dian-lun-lin/RTLflow
    install_path: /opt/rtlflow
  verilator:
    version: "5.024"
    install_path: /opt/verilator

packages:
  - build-essential
  - git
  - curl
  - wget
  - python3
  - python3-pip
  - python3-venv
  - cmake
  - ninja-build
  - libboost-all-dev
  - nvidia-cuda-toolkit
  - nvidia-cuda-dev

nvidia:
  driver_version: "550"
  cuda_version: "12.4"
  cudnn_version: "8.9"

environment:
  CUDA_HOME: /usr/local/cuda
  PATH: /usr/local/cuda/bin:/opt/rtlflow/bin:/opt/verilator/bin:$PATH
  LD_LIBRARY_PATH: /usr/local/cuda/lib64:$LD_LIBRARY_PATH
