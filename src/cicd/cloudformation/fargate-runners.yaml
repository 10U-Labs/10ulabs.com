AWSTemplateFormatVersion: '2010-09-09'
Description: 'GitHub Actions Self-Hosted Runners on ECS Fargate Spot'

Parameters:
  Cpu:
    Type: String
    Description: Task CPU (256, 512, 1024, 2048, 4096)

  Memory:
    Type: String
    Description: Task Memory in MB (must be compatible with CPU)

  SpotWeight:
    Type: Number
    Description: Weight for Fargate Spot capacity provider

  OnDemandBase:
    Type: Number
    Description: Base number of on-demand instances

  MinInstances:
    Type: Number
    Description: Minimum number of runner instances

  MaxInstances:
    Type: Number
    Description: Maximum number of runner instances

  DesiredCount:
    Type: Number
    Description: Desired number of runner instances

  RunnerLabels:
    Type: String
    Description: Comma-separated list of runner labels

  TargetCpuUtilization:
    Type: Number
    Description: Target CPU utilization percentage for auto-scaling

  TargetMemoryUtilization:
    Type: Number
    Description: Target memory utilization percentage for auto-scaling

  ScaleInCooldown:
    Type: Number
    Description: Scale-in cooldown period in seconds

  ScaleOutCooldown:
    Type: Number
    Description: Scale-out cooldown period in seconds

  LogRetentionDays:
    Type: Number
    Description: CloudWatch Logs retention period in days

  GitHubToken:
    Type: String
    NoEcho: true
    Description: GitHub Personal Access Token for runner registration

  GitHubRepo:
    Type: String
    Description: GitHub repository (owner/repo format)

  ImageUri:
    Type: String
    Description: ECR image URI for the runner

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the runners will be deployed

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of private subnet IDs for the runners

Resources:
  # ECS Cluster
  RunnerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'
      CapacityProviders:
        - FARGATE_SPOT
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: !Ref SpotWeight
          Base: 0
        - CapacityProvider: FARGATE
          Weight: 1
          Base: !Ref OnDemandBase
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-cluster'

  # CloudWatch Log Group
  RunnerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: !Ref LogRetentionDays

  # Task Execution Role
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: GetSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameters
                Resource: '*'

  # Task Role
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunnerPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt RunnerLogGroup.Arn

  # Security Group
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for GitHub Actions Fargate runners
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  # Secret for GitHub Token
  GitHubTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-github-token'
      Description: GitHub Personal Access Token for runner registration
      SecretString: !Ref GitHubToken

  # Task Definition
  RunnerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: github-runner
          Image: !Ref ImageUri
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RunnerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: runner
          Environment:
            - Name: GITHUB_REPO
              Value: !Ref GitHubRepo
            - Name: RUNNER_LABELS
              Value: !Ref RunnerLabels
            - Name: RUNNER_GROUP
              Value: default
          Secrets:
            - Name: GITHUB_TOKEN
              ValueFrom: !Ref GitHubTokenSecret

  # ECS Service
  RunnerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${AWS::StackName}-service'
      Cluster: !Ref RunnerCluster
      TaskDefinition: !Ref RunnerTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: !Ref SpotWeight
          Base: 0
        - CapacityProvider: FARGATE
          Weight: 1
          Base: !Ref OnDemandBase
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref RunnerSecurityGroup
          Subnets: !Ref PrivateSubnetIds
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-service'

  # Auto Scaling Target
  ServiceScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxInstances
      MinCapacity: !Ref MinInstances
      ResourceId: !Sub service/${RunnerCluster}/${RunnerService.Name}
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  # Auto Scaling Policy - CPU
  ServiceScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref TargetCpuUtilization
        ScaleInCooldown: !Ref ScaleInCooldown
        ScaleOutCooldown: !Ref ScaleOutCooldown

  # Auto Scaling Policy - Memory
  ServiceScalingPolicyMemory:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-memory-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: !Ref TargetMemoryUtilization
        ScaleInCooldown: !Ref ScaleInCooldown
        ScaleOutCooldown: !Ref ScaleOutCooldown

Outputs:
  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref RunnerCluster

  ServiceName:
    Description: ECS Service Name
    Value: !GetAtt RunnerService.Name

  TaskDefinitionArn:
    Description: Task Definition ARN
    Value: !Ref RunnerTaskDefinition

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref RunnerSecurityGroup
