AWSTemplateFormatVersion: '2010-09-09'
Description: 'Static Website with S3, CloudFront, and Route53'

Parameters:
  DomainName:
    Type: String
    Description: Domain name for the website (e.g., 10ulabs.com)

  BucketName:
    Type: String
    Description: S3 bucket name for website content

  DefaultRootObject:
    Type: String
    Default: index.html
    Description: Default root object for CloudFront

  PriceClass:
    Type: String
    Default: PriceClass_100
    Description: CloudFront price class
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All

  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN (must be in us-east-1). Leave empty to create new certificate.

  CreateHostedZone:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create Route53 hosted zone

  HostedZoneId:
    Type: String
    Default: ''
    Description: Existing Route53 hosted zone ID (if not creating new one)

Conditions:
  CreateCertificate: !Equals [!Ref CertificateArn, '']
  CreateZone: !Equals [!Ref CreateHostedZone, 'true']
  UseExistingZone: !Not [!Condition CreateZone]

Resources:
  # S3 Bucket for website content (private)
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended  # Versioning disabled as required
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub '${DomainName}-website'
        - Key: Domain
          Value: !Ref DomainName

  # CloudFront Origin Access Identity
  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${DomainName}'

  # S3 Bucket Policy to allow CloudFront access
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAI
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOAI}'
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'

  # ACM Certificate (if not provided)
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub '*.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !If
            - CreateZone
            - !Ref HostedZone
            - !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub '${DomainName}-certificate'

  # Route53 Hosted Zone (if creating new)
  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreateZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub 'Hosted zone for ${DomainName}'
      Tags:
        - Key: Name
          Value: !Sub '${DomainName}-zone'

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: !Ref DefaultRootObject
        Comment: !Sub 'CDN for ${DomainName}'

        # Origins
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOAI}'

        # Default cache behavior
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000

        # Custom error responses
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300

        # Aliases and certificate
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        ViewerCertificate:
          AcmCertificateArn: !If
            - CreateCertificate
            - !Ref Certificate
            - !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        # Price class
        PriceClass: !Ref PriceClass

      Tags:
        - Key: Name
          Value: !Sub '${DomainName}-distribution'

  # Route53 DNS Records (apex)
  ApexRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !If
        - CreateZone
        - !Ref HostedZone
        - !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        EvaluateTargetHealth: false

  # Route53 DNS Records (www)
  WwwRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !If
        - CreateZone
        - !Ref HostedZone
        - !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # Route53 DNS Records (AAAA for IPv6)
  ApexRecordIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !If
        - CreateZone
        - !Ref HostedZone
        - !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwRecordIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !If
        - CreateZone
        - !Ref HostedZone
        - !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Description: S3 bucket name
    Value: !Ref WebsiteBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  BucketArn:
    Description: S3 bucket ARN
    Value: !GetAtt WebsiteBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'

  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  DistributionDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-DistributionDomain'

  WebsiteURL:
    Description: Website URL
    Value: !Sub 'https://${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-WebsiteURL'

  HostedZoneId:
    Description: Route53 hosted zone ID
    Value: !If
      - CreateZone
      - !Ref HostedZone
      - !Ref HostedZoneId
    Export:
      Name: !Sub '${AWS::StackName}-HostedZoneId'

  HostedZoneNameServers:
    Description: Route53 name servers (update your domain registrar)
    Condition: CreateZone
    Value: !Join [', ', !GetAtt HostedZone.NameServers]

  CertificateArn:
    Description: ACM certificate ARN
    Value: !If
      - CreateCertificate
      - !Ref Certificate
      - !Ref CertificateArn
    Export:
      Name: !Sub '${AWS::StackName}-CertificateArn'
