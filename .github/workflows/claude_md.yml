jobs:
  concluding-claude-md-is-already-formatted-properly:
    if: needs.determining-if-claude-md-should-be-formatted.outputs.claude_md_should_be_properly_formatted == 'false'
    name: Concluding CLAUDE.md is already properly formatted
    needs: determining-if-claude-md-should-be-formatted
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  concluding-claude-md-should-be-formatted:
    if: needs.determining-if-claude-md-should-be-formatted.outputs.claude_md_should_be_properly_formatted == 'true'
    name: Concluding CLAUDE.md should be properly formatted
    needs: determining-if-claude-md-should-be-formatted
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  concluding-readme-should-be-updated:
    if: always() && needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated == 'true'
    name: Concluding README.md should be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  concluding-readme-should-not-be-updated:
    if: always() && needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated == 'false'
    name: Concluding README.md should not be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  determining-if-claude-md-should-be-formatted:
    name: Determining if CLAUDE.md should be properly formatted
    needs: unit-testing
    outputs:
      claude_md_should_be_properly_formatted: ${{ steps.check.outputs.claude_md_should_be_properly_formatted }}
      errors: ${{ steps.capture-errors.outputs.errors }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install markdownlint tools
        run: npm install -g markdownlint-cli2 markdownlint-cli
      - continue-on-error: true
        id: check
        name: Check if CLAUDE.md needs formatting
        run: |
          if markdownlint-cli2 CLAUDE.md > /dev/null 2>&1; then
            echo "claude_md_should_be_properly_formatted=false" >> $GITHUB_OUTPUT;
            echo "";
            echo "Setting ''claude_md_should_be_properly_formatted'' to ''false'' for subsequent jobs.";
          else
            echo "claude_md_should_be_properly_formatted=true" >> $GITHUB_OUTPUT;
            echo "";
            echo "Setting ''claude_md_should_be_properly_formatted'' to ''true'' for subsequent jobs.";
          fi
      - id: capture-errors
        if: steps.check.outputs.claude_md_should_be_properly_formatted == 'true'
        name: Capture markdownlint errors
        run: |
          ERRORS=$(npx markdownlint-cli CLAUDE.md --json 2>&1 || true)
          echo "errors<<EOF" >> $GITHUB_OUTPUT
          echo "$ERRORS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
  determining-if-readme-should-be-updated:
    if: |
      always() &&
      (needs.formatting-claude-md.result == 'success' ||
       needs.concluding-claude-md-is-already-formatted-properly.result == 'success')
    name: Determining if README.md should be updated
    needs:
      - concluding-claude-md-is-already-formatted-properly
      - formatting-claude-md
    outputs:
      readme_should_be_updated: ${{ steps.check.outputs.readme_should_be_updated }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.account_id' scripts/transform_to_compliant_markdown/config.json);
          REGION=$(jq -r '.region' scripts/transform_to_compliant_markdown/config.json);
          MODEL_ID=$(jq -r '.bedrock.model_id' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_REASONING=$(jq -r '.bedrock.max_tokens_reasoning' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_GENERATION=$(jq -r '.bedrock.max_tokens' scripts/transform_to_compliant_markdown/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - id: check
        name: Check if README needs update
        run: |
          python scripts/readme/readme.py \
            --project-dir scripts/transform_to_compliant_markdown \
            --test-dir test/transform_to_compliant_markdown \
            --check \
            --prompt-check scripts/readme/prompt_check.md \
            --prompt-update scripts/readme/prompt_update.md \
            --aws-region "${{ steps.config.outputs.region }}" \
            --bedrock-model-id "${{ steps.config.outputs.model_id }}" \
            --max-tokens-reasoning "${{ steps.config.outputs.max_tokens_reasoning }}" \
            --max-tokens-generation "${{ steps.config.outputs.max_tokens_generation }}" \
            --output-file "$GITHUB_OUTPUT"
  formatting-claude-md:
    name: Formatting CLAUDE.md
    needs:
      - concluding-claude-md-should-be-formatted
      - determining-if-claude-md-should-be-formatted
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.account_id' scripts/transform_to_compliant_markdown/config.json);
          REGION=$(jq -r '.region' scripts/transform_to_compliant_markdown/config.json);
          MODEL_ID=$(jq -r '.bedrock.model_id' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_REASONING=$(jq -r '.bedrock.max_tokens_reasoning' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_GENERATION=$(jq -r '.bedrock.max_tokens' scripts/transform_to_compliant_markdown/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install dependencies
        run: pip install boto3
      - name: Format CLAUDE.md with Bedrock
        run: |
          python scripts/transform_to_compliant_markdown/transform_to_compliant_markdown.py \
            --file CLAUDE.md \
            --aws-region "${{ steps.config.outputs.region }}" \
            --bedrock-model-id "${{ steps.config.outputs.model_id }}" \
            --max-tokens-generation "${{ steps.config.outputs.max_tokens_generation }}" \
            --max-tokens-reasoning "${{ steps.config.outputs.max_tokens_reasoning }}" \
            --prompt-file scripts/transform_to_compliant_markdown/prompt.md \
            --markdownlint-errors '${{ needs.determining-if-claude-md-should-be-formatted.outputs.errors }}'
      - name: Commit and push CLAUDE.md formatting
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add CLAUDE.md
          if git diff --cached --quiet; then
            echo "No changes to CLAUDE.md"
          else
            git commit -m "Auto-format CLAUDE.md with Bedrock [skip ci]"
            for i in {1..5}; do
              if git push; then
                echo "Successfully pushed CLAUDE.md update"
                exit 0
              fi
              echo "Push failed (attempt $i/5), pulling and retrying..."
              git pull --rebase origin main
              sleep $((2 ** i))
            done
            echo "Failed to push after 5 attempts"
            exit 1
          fi
  performing-static-analysis:
    if: |
      (github.event_name == 'workflow_dispatch') ||
      !contains(github.event.head_commit.message, '[skip ci]')
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          pip install pylint mypy yamllint boto3 boto3-stubs[bedrock-runtime] &&
          npm install -g jsonlint
      - name: Linting JSON configuration files
        run: |
          echo "Validating JSON syntax...";
          jsonlint -q scripts/transform_to_compliant_markdown/config.json;
          echo "No errors found - JSON validation passed successfully";
      - name: Linting Python files
        run: |
          pylint \
            scripts/transform_to_compliant_markdown/transform_to_compliant_markdown.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Linting YAML files
        run: |
          echo "Running yamllint on claude_md.yml...";
          CONFIG='{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}';
          yamllint --config-data "$CONFIG" .github/workflows/claude_md.yml &&
          echo "No errors found - YAML linting passed successfully"
      - name: Static type checking Python files with mypy
        run: |
          python -m mypy scripts/transform_to_compliant_markdown/transform_to_compliant_markdown.py
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: |
          pip install pytest boto3
      - name: Run unit tests
        run: |
          pytest test/transform_to_compliant_markdown/test_unit.py -v
  updating-readme:
    if: always() && needs.concluding-readme-should-be-updated.result == 'success'
    name: Updating README.md
    needs: concluding-readme-should-be-updated
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.account_id' scripts/transform_to_compliant_markdown/config.json);
          REGION=$(jq -r '.region' scripts/transform_to_compliant_markdown/config.json);
          MODEL_ID=$(jq -r '.bedrock.model_id' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_REASONING=$(jq -r '.bedrock.max_tokens_reasoning' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_GENERATION=$(jq -r '.bedrock.max_tokens' scripts/transform_to_compliant_markdown/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - name: Update README with Bedrock
        run: |
          python scripts/readme/readme.py \
            --project-dir scripts/transform_to_compliant_markdown \
            --update \
            --prompt-check scripts/readme/prompt_check.md \
            --prompt-update scripts/readme/prompt_update.md \
            --aws-region "${{ steps.config.outputs.region }}" \
            --bedrock-model-id "${{ steps.config.outputs.model_id }}" \
            --max-tokens-reasoning "${{ steps.config.outputs.max_tokens_reasoning }}" \
            --max-tokens-generation "${{ steps.config.outputs.max_tokens_generation }}" \
            --output-file "$GITHUB_OUTPUT"
      - name: Commit and push README if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add scripts/transform_to_compliant_markdown/README.md
          if git diff --cached --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "Update claude_md README.md [skip ci]"
            for i in {1..5}; do
              if git push; then
                echo "Successfully pushed README update"
                exit 0
              fi
              echo "Push failed (attempt $i/5), pulling and retrying..."
              git pull --rebase origin main
              sleep $((2 ** i))
            done
            echo "Failed to push after 5 attempts"
            exit 1
          fi
name: Ensuring CLAUDE.md is properly formatted and README.md is up to date
on:
  push:
    branches:
      - main
    paths:
      - CLAUDE.md
      - .github/workflows/claude_md.yml
  workflow_dispatch: null
