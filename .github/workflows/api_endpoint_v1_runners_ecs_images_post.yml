---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Build and deploy Docker image for ECS runners
    permissions:
      actions: write
      contents: read
      id-token: write
    runs-on: >-
      ${{
        (vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]'))
        && 'ubuntu-latest'
        || fromJSON(format(
          '["ec2", "general-purpose", "arm", "spot", "runner-{0}"]',
          github.run_id))
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - continue-on-error: true
        id: no_linter_configs_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no linter config files (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-linter-config-files@latest
        with:
          directories: ${{ github.workspace }}
          linters: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_linter_configs_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no linter config files (self-hosted)
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - continue-on-error: true
        id: no_inline_disables_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no inline lint disables (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-inline-lint-disables@latest
        with:
          files: ${{ github.workspace }}/**/*
          linters: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_inline_disables_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no inline lint disables (self-hosted)
        run: >-
          assert-no-inline-lint-disables
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/**/*
      - continue-on-error: true
        id: one_assert_per_pytest_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert one assert per pytest (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-one-assert-per-pytest@latest
        with:
          files: ${{ github.workspace }}/test/**/*.py
          verbose: true
      - continue-on-error: true
        id: one_assert_per_pytest_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert one assert per pytest (self-hosted)
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            dockerfile-parse \
            mypy \
            pylint \
            pytest \
            python-hcl2 \
            pyyaml \
            requests \
            types-dockerfile-parse \
            types-PyYAML \
            types-requests \
            yamllint
      - continue-on-error: true
        id: yamllint
        name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/api_endpoint_v1_runners_ecs_images_post.yml
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install npm dependencies
        run: npm install -g jscpd jsonlint
      - continue-on-error: true
        id: jsonlint
        name: Linting JSON files
        run: |
          jsonlint -q src/api/endpoints/runners/ecs/images/post/config.json
          jsonlint -q \
            src/api/endpoints/runners/ecs/images/post/cloudwatch-agent-config.json
      - continue-on-error: true
        id: pylint_source
        name: Run pylint on source
        run: |
          python3 -m pylint \
            src/api/endpoints/runners/ecs/images/post/*.py \
            --fail-on=C,R,W --fail-under=10.0
      - continue-on-error: true
        id: pylint_tests
        name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/ test/ \
            --fail-on=C,R,W --fail-under=10.0
      - continue-on-error: true
        id: mypy_source
        name: Run mypy on source
        run: |
          python3 -m mypy \
            src/api/endpoints/runners/ecs/images/post/*.py
      - continue-on-error: true
        id: mypy_tests
        name: Run mypy on tests
        run: |
          MYPYPATH=lib/python:src/api/endpoints/runners/lambda python3 -m mypy \
            lib/python/ test/
      - continue-on-error: true
        id: jscpd_source
        name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ src/api/endpoints/runners/ecs/images/post/
      - continue-on-error: true
        id: jscpd_tests
        name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install hadolint
        run: |
          HADOLINT_VERSION=$(curl -fsSL \
            https://api.github.com/repos/hadolint/hadolint/releases/latest | \
            jq -r '.tag_name')
          HADOLINT_URL="https://github.com/hadolint/hadolint/releases/download"
          HADOLINT_URL="${HADOLINT_URL}/${HADOLINT_VERSION}"
          HADOLINT_URL="${HADOLINT_URL}/hadolint-Linux-x86_64"
          sudo curl -fsSL -o /usr/local/bin/hadolint "$HADOLINT_URL"
          sudo chmod +x /usr/local/bin/hadolint
      - continue-on-error: true
        id: hadolint
        name: Validate Dockerfile
        run: |
          DOCKERFILE=src/api/endpoints/runners/ecs/images/post/Dockerfile
          hadolint --ignore DL3008 --ignore DL3013 \
            --ignore DL3015 --ignore DL3016 $DOCKERFILE
      - continue-on-error: true
        id: unit_tests
        name: Run unit tests
        run: |
          TEST=test/api/endpoints/runners/ecs/images/post/pre_deployment/unit/
          python3 -m pytest \
            $TEST --confcutdir=test --verbose --pythonwarnings=error
      - id: config
        name: Extract configuration values
        run: |
          TF_SHARED_LOCALS=lib/terraform/common/locals.tf
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          ECR_REPOSITORY_NAME=$( \
            grep -A1 'output "ecr_repository_name_runners"' \
            lib/terraform/common/outputs.tf | \
            grep 'value' | cut -d'"' -f2)
          FARGATE_CPU_ARCHITECTURE=$(grep 'fargate_cpu_architecture' \
            src/api/endpoints/runners/ecs/terraform.tfvars | \
            cut -d'"' -f2 | tr '[:upper:]' '[:lower:]')
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/api/common/runners/ecs/providers.tf | \
            cut -d'"' -f2 | sed 's/>= //')
          echo "aws_account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "ecr_repository_name=$ECR_REPOSITORY_NAME" >> $GITHUB_OUTPUT
          echo "fargate_cpu_architecture=$FARGATE_CPU_ARCHITECTURE" \
            >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}
          terraform_wrapper: false
      - continue-on-error: true
        id: pre_integration_tests
        name: Run pre-deployment integration tests
        run: |
          TEST=test/api/endpoints/runners/ecs/images/post/pre_deployment
          python3 -m pytest \
            $TEST/integration/ \
            --capture=no --confcutdir=test --verbose --pythonwarnings=error
      - id: docker_config
        name: Load Docker build configuration
        run: |
          CONFIG_FILE=src/api/endpoints/runners/ecs/images/post/config.json
          GH_VER=$(jq -r '.gh_version' $CONFIG_FILE)
          HADOLINT_VER=$(jq -r '.hadolint_version' $CONFIG_FILE)
          NODE_VER=$(jq -r '.node_version' $CONFIG_FILE)
          RUNNER_VER=$(jq -r '.runner_version' $CONFIG_FILE)
          TERRAFORM_VER=$(jq -r '.terraform_version' $CONFIG_FILE)
          TFLINT_VER=$(jq -r '.tflint_version' $CONFIG_FILE)
          YQ_VER=$(jq -r '.yq_version' $CONFIG_FILE)
          echo "gh_version=$GH_VER" >> $GITHUB_OUTPUT
          echo "hadolint_version=$HADOLINT_VER" >> $GITHUB_OUTPUT
          echo "node_version=$NODE_VER" >> $GITHUB_OUTPUT
          echo "runner_version=$RUNNER_VER" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VER" >> $GITHUB_OUTPUT
          echo "tflint_version=$TFLINT_VER" >> $GITHUB_OUTPUT
          echo "yq_version=$YQ_VER" >> $GITHUB_OUTPUT
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: build
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Build and push Docker image (QEMU)
        run: |
          cd src/api/endpoints/runners/ecs/images/post
          BUILD_TAG=$(date -u +%Y-%m-%d-%H-%M-%S-%3N)
          ACCT_ID='${{ steps.config.outputs.aws_account_id }}'
          REGION='${{ vars.AWS_REGION }}'
          REPO='${{ steps.config.outputs.ecr_repository_name }}'
          CPU='${{ steps.config.outputs.fargate_cpu_architecture }}'
          ECR_URL="${ACCT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPO}"
          CACHE_URL="${ECR_URL}:buildcache"
          GH_VER='${{ steps.docker_config.outputs.gh_version }}'
          HADOLINT_VER='${{ steps.docker_config.outputs.hadolint_version }}'
          NODE_VER='${{ steps.docker_config.outputs.node_version }}'
          RUNNER_VER='${{ steps.docker_config.outputs.runner_version }}'
          TERRAFORM_VER='${{ steps.docker_config.outputs.terraform_version }}'
          TFLINT_VER='${{ steps.docker_config.outputs.tflint_version }}'
          YQ_VER='${{ steps.docker_config.outputs.yq_version }}'
          docker buildx build \
            --platform linux/$CPU \
            --cache-from type=registry,ref=${CACHE_URL} \
            --cache-to type=registry,ref=${CACHE_URL},mode=max \
            --build-arg GH_VERSION=$GH_VER \
            --build-arg HADOLINT_VERSION=$HADOLINT_VER \
            --build-arg NODE_VERSION=$NODE_VER \
            --build-arg RUNNER_ARCH=$CPU \
            --build-arg RUNNER_VERSION=$RUNNER_VER \
            --build-arg TERRAFORM_VERSION=$TERRAFORM_VER \
            --build-arg TFLINT_VERSION=$TFLINT_VER \
            --build-arg YQ_VERSION=$YQ_VER \
            -t $ECR_URL:available \
            -t $ECR_URL:$BUILD_TAG \
            --push \
            .
          echo "image_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "ecr_repository=$REPO" >> $GITHUB_OUTPUT
      - id: build-ec2
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true' &&
          github.event.inputs.github_hosted != 'true' &&
          !contains(github.event.head_commit.message, '[github-hosted]')
        name: Build and push Docker image (EC2)
        run: |
          cd src/api/endpoints/runners/ecs/images/post
          BUILD_TAG=$(date -u +%Y-%m-%d-%H-%M-%S-%3N)
          ACCT_ID='${{ steps.config.outputs.aws_account_id }}'
          REGION='${{ vars.AWS_REGION }}'
          REPO='${{ steps.config.outputs.ecr_repository_name }}'
          CPU='${{ steps.config.outputs.fargate_cpu_architecture }}'
          ECR_URL="${ACCT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPO}"
          CACHE_URL="${ECR_URL}:buildcache"
          GH_VER='${{ steps.docker_config.outputs.gh_version }}'
          HADOLINT_VER='${{ steps.docker_config.outputs.hadolint_version }}'
          NODE_VER='${{ steps.docker_config.outputs.node_version }}'
          RUNNER_VER='${{ steps.docker_config.outputs.runner_version }}'
          TERRAFORM_VER='${{ steps.docker_config.outputs.terraform_version }}'
          TFLINT_VER='${{ steps.docker_config.outputs.tflint_version }}'
          YQ_VER='${{ steps.docker_config.outputs.yq_version }}'
          docker buildx build \
            --platform linux/$CPU \
            --cache-from type=registry,ref=${CACHE_URL} \
            --cache-to type=registry,ref=${CACHE_URL},mode=max \
            --build-arg GH_VERSION=$GH_VER \
            --build-arg HADOLINT_VERSION=$HADOLINT_VER \
            --build-arg NODE_VERSION=$NODE_VER \
            --build-arg RUNNER_ARCH=$CPU \
            --build-arg RUNNER_VERSION=$RUNNER_VER \
            --build-arg TERRAFORM_VERSION=$TERRAFORM_VER \
            --build-arg TFLINT_VERSION=$TFLINT_VER \
            --build-arg YQ_VERSION=$YQ_VER \
            -t $ECR_URL:available \
            -t $ECR_URL:$BUILD_TAG \
            --push \
            .
          echo "image_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "ecr_repository=$REPO" >> $GITHUB_OUTPUT
      - continue-on-error: true
        id: post_integration_tests
        name: Run post-deployment integration tests
        run: |
          TEST=test/api/endpoints/runners/ecs/images/post/post_deployment
          python3 -m pytest \
            $TEST/integration/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - name: Get GitHub PAT from Parameter Store
        run: |
          terraform -chdir=src/bootstrap init -backend=true \
            -input=false > /dev/null
          GITHUB_TOKEN_SECRET_NAME=$(terraform -chdir=src/bootstrap \
            output -raw ssm_parameter_name_for_github_pat)
          GITHUB_PAT=$(aws ssm get-parameter \
            --name "$GITHUB_TOKEN_SECRET_NAME" --with-decryption \
            --query 'Parameter.Value' --output text)
          echo "GITHUB_PAT=$GITHUB_PAT" >> $GITHUB_ENV
      - continue-on-error: true
        id: e2e_tests
        name: Run E2E tests
        run: |
          TEST=test/api/endpoints/runners/ecs/images/post/post_deployment
          python3 -m pytest \
            $TEST/e2e/ --confcutdir=test --verbose --pythonwarnings=error
      - name: Promote image
        run: |
          POST_DIR=src/api/endpoints/runners/ecs/images/post
          SCRIPT=$POST_DIR/promote_docker_image.py
          REPO='${{ steps.config.outputs.ecr_repository_name }}'
          BUILD_TAG='${{ steps.build.outputs.image_tag }}'
          EC2_TAG='${{ steps.build-ec2.outputs.image_tag }}'
          TAG="${BUILD_TAG:-$EC2_TAG}"
          REGION='${{ vars.AWS_REGION }}'
          python3 $SCRIPT \
            --repository "$REPO" \
            --image-tag "$TAG" \
            --region "$REGION"
      - env:
          S01: ${{ steps.no_linter_configs_gh.outcome }}
          S02: ${{ steps.no_linter_configs_sh.outcome }}
          S03: ${{ steps.no_inline_disables_gh.outcome }}
          S04: ${{ steps.no_inline_disables_sh.outcome }}
          S05: ${{ steps.one_assert_per_pytest_gh.outcome }}
          S06: ${{ steps.one_assert_per_pytest_sh.outcome }}
          S07: ${{ steps.yamllint.outcome }}
          S08: ${{ steps.jsonlint.outcome }}
          S09: ${{ steps.pylint_source.outcome }}
          S10: ${{ steps.pylint_tests.outcome }}
          S11: ${{ steps.mypy_source.outcome }}
          S12: ${{ steps.mypy_tests.outcome }}
          S13: ${{ steps.jscpd_source.outcome }}
          S14: ${{ steps.jscpd_tests.outcome }}
          S15: ${{ steps.hadolint.outcome }}
          S16: ${{ steps.unit_tests.outcome }}
          S17: ${{ steps.pre_integration_tests.outcome }}
          S18: ${{ steps.post_integration_tests.outcome }}
          S19: ${{ steps.e2e_tests.outcome }}
        name: Assert no step failed
        run: |
          failed=""
          f="failure"
          [ "$S01" = "$f" ] && failed="$failed no_linter_configs_gh"
          [ "$S02" = "$f" ] && failed="$failed no_linter_configs_sh"
          [ "$S03" = "$f" ] && failed="$failed no_inline_disables_gh"
          [ "$S04" = "$f" ] && failed="$failed no_inline_disables_sh"
          [ "$S05" = "$f" ] && failed="$failed one_assert_per_pytest_gh"
          [ "$S06" = "$f" ] && failed="$failed one_assert_per_pytest_sh"
          [ "$S07" = "$f" ] && failed="$failed yamllint"
          [ "$S08" = "$f" ] && failed="$failed jsonlint"
          [ "$S09" = "$f" ] && failed="$failed pylint_source"
          [ "$S10" = "$f" ] && failed="$failed pylint_tests"
          [ "$S11" = "$f" ] && failed="$failed mypy_source"
          [ "$S12" = "$f" ] && failed="$failed mypy_tests"
          [ "$S13" = "$f" ] && failed="$failed jscpd_source"
          [ "$S14" = "$f" ] && failed="$failed jscpd_tests"
          [ "$S15" = "$f" ] && failed="$failed hadolint"
          [ "$S16" = "$f" ] && failed="$failed unit_tests"
          [ "$S17" = "$f" ] && failed="$failed pre_integration_tests"
          [ "$S18" = "$f" ] && failed="$failed post_integration_tests"
          [ "$S19" = "$f" ] && failed="$failed e2e_tests"
          if [ -n "$failed" ]; then
            echo "Steps that failed:$failed"
            exit 1
          fi
          echo "All steps succeeded"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (
          github.event.inputs.trigger_descendants == 'true' ||
           contains(github.event.head_commit.message,
           '[trigger descendants]'))
        name: Dispatch descendant workflows
        run: |
          FLAGS=""
          TRIGGER="${{ github.event.inputs.trigger_descendants }}"
          if [ "$TRIGGER" = "true" ]; then
            FLAGS="$FLAGS --trigger-descendants"
          fi
          python3 src/workflowctl/workflowctl.py dispatch-descendant-workflows \
            --workflow api_endpoint_v1_runners_ecs_images_post \
            --repo ${{ github.repository }} \
            $FLAGS
name: Building Docker image for ECS runners
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      trigger_descendants:
        default: false
        description: Trigger descendant workflows after this workflow completes
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
