concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  building-ami:
    name: Building AMI
    needs:
      - declaring-common-variables
      - unit-testing
    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}
      ami_stable_tag: ${{ steps.terraform.outputs.ami_stable_tag }}
      security_group_id: ${{ steps.terraform.outputs.security_group_id }}
      subnet_ids: ${{ steps.terraform.outputs.subnet_ids }}
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - id: terraform
        name: Get infrastructure info from Terraform state
        run: |
          cd src/api
          terraform init -backend=true -input=false
          AMI_PURPOSE_TAG=$(terraform output -raw ec2_runner_ami_purpose_tag)
          AMI_PURPOSE_VALUE=$(terraform output -raw ec2_runner_ami_purpose_value)
          AMI_STABLE_TAG=$(terraform output -raw ec2_runner_ami_stable_tag)
          SECURITY_GROUP_ID=$(terraform output -raw runner_security_group_id)
          SUBNET_IDS=$(terraform output -raw vpc_public_subnet_ids)
          VPC_ID=$(terraform output -raw vpc_id)
          echo "ami_purpose_tag=$AMI_PURPOSE_TAG" >> $GITHUB_OUTPUT
          echo "ami_purpose_value=$AMI_PURPOSE_VALUE" >> $GITHUB_OUTPUT
          echo "ami_stable_tag=$AMI_STABLE_TAG" >> $GITHUB_OUTPUT
          echo "security_group_id=$SECURITY_GROUP_ID" >> $GITHUB_OUTPUT
          echo "subnet_ids=$SUBNET_IDS" >> $GITHUB_OUTPUT
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install paramiko
        run: pip install paramiko
      - id: build
        env:
          OS_ARCH: ${{ needs.declaring-common-variables.outputs.os_architecture }}
          OS_FAMILY: ${{ needs.declaring-common-variables.outputs.os_family }}
          OS_VERSION: ${{ needs.declaring-common-variables.outputs.os_version }}
          RUNNER_VERSION: ${{ needs.declaring-common-variables.outputs.runner_version }}
        name: Build AMI with EC2 Fleet
        run: |
          AMI_ARCH=$([ "$OS_ARCH" = "arm64" ] && echo "arm64" || echo "amd64")
          RUNNER_ARCH=$([ "$OS_ARCH" = "arm64" ] && echo "arm64" || echo "x64")
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SOURCE_AMI=$(aws ec2 describe-images \
            --owners 136693071363 \
            --filters "Name=name,Values=${OS_FAMILY}-${OS_VERSION}-${AMI_ARCH}-*" \
                      "Name=root-device-type,Values=ebs" \
                      "Name=virtualization-type,Values=hvm" \
            --query 'sort_by(Images, &CreationDate)[-1].ImageId' \
            --output text)
          AMI_NAME="github-ec2-runner-${OS_FAMILY}-${OS_VERSION}-${OS_ARCH}-${TIMESTAMP}"
          python3 src/build/image_for_ec2_runners/build_ami.py build src/build/image_for_ec2_runners/config.yml \
            --var "ami_description=GitHub Actions Runner - ${OS_FAMILY^} ${OS_VERSION} ${OS_ARCH}" \
            --var "ami_name=${AMI_NAME}" \
            --var "env.OS_ARCHITECTURE=${OS_ARCH}" \
            --var "env.OS_FAMILY=${OS_FAMILY}" \
            --var "env.RUNNER_ARCH=${RUNNER_ARCH}" \
            --var "env.RUNNER_VERSION=${RUNNER_VERSION}" \
            --var 'instance_types=${{ needs.declaring-common-variables.outputs.spot_instance_types }}' \
            --var "source_ami=${SOURCE_AMI}" \
            --var 'subnet_ids=${{ steps.terraform.outputs.subnet_ids }}' \
            --var "tags.${{ steps.terraform.outputs.ami_purpose_tag }}=${{ steps.terraform.outputs.ami_purpose_value }}" \
            --var "tags.${{ steps.terraform.outputs.ami_stable_tag }}=false" \
            --var "tags.BuildDate=${TIMESTAMP}" \
            --var "tags.ManagedBy=GitHubActions" \
            --var "tags.Name=ami-${AMI_NAME}" \
            --var "tags.OSArchitecture=${OS_ARCH}" \
            --var "tags.OSFamily=${OS_FAMILY^}" \
            --var "tags.OSVersion=${OS_VERSION}" \
            --var "tags.Repository=${{ github.repository }}" \
            --var "tags.RunId=${{ github.run_id }}" \
            --var "tags.RunnerVersion=${RUNNER_VERSION}" \
            --var "tags.Workflow=${{ github.workflow }}" \
            | tee build-output.log
          AMI_ID=$(grep '^ami_id=' build-output.log | cut -d= -f2)
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
      - if: steps.build.outputs.ami_id != ''
        name: Output AMI details
        run: |
          echo "==================================="
          echo "GitHub Runner AMI Built Successfully"
          echo "==================================="
          echo ""
          echo "AMI ID: ${{ steps.build.outputs.ami_id }}"
          echo "Region: ${{ needs.declaring-common-variables.outputs.aws_region }}"
          echo "OS Family: ${{ needs.declaring-common-variables.outputs.os_family }}"
          echo "OS Version: ${{ needs.declaring-common-variables.outputs.os_version }}"
          echo "OS Architecture: ${{ needs.declaring-common-variables.outputs.os_architecture }}"
          echo "Runner Version: ${{ needs.declaring-common-variables.outputs.runner_version }}"
          echo ""
          echo "==================================="
  cleaning-up:
    name: Cleaning up
    needs:
      - declaring-common-variables
      - promoting-ami
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: pip install boto3
      - name: Clean up old AMIs
        run: |
          python src/build/image_for_ec2_runners/cleanup_packer_artifacts.py \
            --region "${{ needs.declaring-common-variables.outputs.aws_region }}" \
            --ssm-parameter-name "${{ needs.promoting-ami.outputs.ami_ssm_parameter }}"
  declaring-common-variables:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
      )
    name: Declaring common variables
    outputs:
      aws_region: ${{ steps.config.outputs.aws_region }}
      github_actions_role_arn: ${{ steps.config.outputs.github_actions_role_arn }}
      os_architecture: ${{ steps.config.outputs.os_architecture }}
      os_family: ${{ steps.config.outputs.os_family }}
      os_version: ${{ steps.config.outputs.os_version }}
      runner_version: ${{ steps.config.outputs.runner_version }}
      spot_instance_types: ${{ steps.config.outputs.spot_instance_types }}
      terraform_version: ${{ steps.config.outputs.terraform_version }}
      test_spot_instance_types: ${{ steps.config.outputs.test_spot_instance_types }}
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: shared
        name: Extract shared configuration values
        run: |
          AWS_REGION=$(grep -A1 'output "aws_region"' src/modules/shared/outputs.tf | grep 'value' | cut -d'"' -f2)
          AWS_ACCOUNT_ID=$(grep -A1 'output "aws_account_id"' src/modules/shared/outputs.tf | grep 'value' | cut -d'"' -f2)
          RESOURCE_PREFIX=$(grep -A1 'output "resource_prefix"' src/modules/shared/outputs.tf | grep 'value' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' src/bootstrap/locals.tf | sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          GITHUB_ACTIONS_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          TERRAFORM_VERSION=$(grep 'required_version' src/api/providers.tf | cut -d'"' -f2 | sed 's/>= //')
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.shared.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.shared.outputs.aws_region }}
          role-to-assume: ${{ steps.shared.outputs.github_actions_role_arn }}
      - id: api
        name: Get API terraform outputs
        run: |
          cd src/api
          terraform init -backend=true -input=false
          OS_ARCHITECTURE=$(terraform output -raw fargate_cpu_architecture | tr '[:upper:]' '[:lower:]')
          SPOT_INSTANCE_TYPES=$(terraform output -json ec2_spot_instance_types)
          echo "os_architecture=$OS_ARCHITECTURE" >> $GITHUB_OUTPUT
          echo "spot_instance_types=$SPOT_INSTANCE_TYPES" >> $GITHUB_OUTPUT
      - name: Install yq
        run: |
          VERSION=v4.44.1
          BINARY=yq_linux_amd64
          wget "https://github.com/mikefarah/yq/releases/download/${VERSION}/${BINARY}" -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
        shell: bash
      - id: config
        name: Extract configuration values
        run: |
          OS_FAMILY=$(yq '.os_family' src/build/image_for_ec2_runners/config.yml)
          OS_VERSION=$(yq '.os_version' src/build/image_for_ec2_runners/config.yml)
          RUNNER_VERSION=$(yq '.runner_version' src/build/image_for_ec2_runners/config.yml)
          TEST_SPOT_INSTANCE_TYPES='${{ github.event.inputs.test_spot_instance_types || '["t4g.xlarge", "m8g.xlarge", "m7g.xlarge"]' }}'
          echo "aws_region=${{ steps.shared.outputs.aws_region }}" >> $GITHUB_OUTPUT
          echo "github_actions_role_arn=${{ steps.shared.outputs.github_actions_role_arn }}" >> $GITHUB_OUTPUT
          echo "os_architecture=${{ steps.api.outputs.os_architecture }}" >> $GITHUB_OUTPUT
          echo "os_family=$OS_FAMILY" >> $GITHUB_OUTPUT
          echo "os_version=$OS_VERSION" >> $GITHUB_OUTPUT
          echo "runner_version=$RUNNER_VERSION" >> $GITHUB_OUTPUT
          echo 'spot_instance_types=${{ steps.api.outputs.spot_instance_types }}' >> $GITHUB_OUTPUT
          echo "terraform_version=${{ steps.shared.outputs.terraform_version }}" >> $GITHUB_OUTPUT
          echo "test_spot_instance_types=$TEST_SPOT_INSTANCE_TYPES" >> $GITHUB_OUTPUT
  e2e-testing:
    name: E2E testing
    needs:
      - building-ami
      - declaring-common-variables
      - integration-testing
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install dependencies
        run: pip install pytest boto3 pyyaml
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Get GitHub PAT from Parameter Store
        run: |
          terraform -chdir=src/bootstrap init -backend=true -input=false > /dev/null
          GITHUB_TOKEN_SECRET_NAME=$(terraform -chdir=src/bootstrap output -raw ssm_parameter_name_for_github_pat)
          GITHUB_PAT=$(aws ssm get-parameter --name "$GITHUB_TOKEN_SECRET_NAME" --with-decryption --query 'Parameter.Value' --output text)
          echo "GITHUB_PAT=$GITHUB_PAT" >> $GITHUB_ENV
      - env:
          TEST_AMI_ID: ${{ needs.building-ami.outputs.ami_id }}
          TEST_SECURITY_GROUP_ID: ${{ needs.building-ami.outputs.security_group_id }}
          TEST_SPOT_INSTANCE_TYPES: ${{ needs.declaring-common-variables.outputs.test_spot_instance_types }}
          TEST_SUBNET_IDS: ${{ needs.building-ami.outputs.subnet_ids }}
        name: Run E2E tests
        run: |
          pytest test/build/image_for_ec2_runners/post_deployment/e2e/ \
            --confcutdir=test/build/image_for_ec2_runners \
            -v
  integration-testing:
    name: Integration testing
    needs:
      - building-ami
      - declaring-common-variables
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: pip install pytest boto3 pyyaml
      - env:
          TEST_AMI_ID: ${{ needs.building-ami.outputs.ami_id }}
          TEST_SECURITY_GROUP_ID: ${{ needs.building-ami.outputs.security_group_id }}
          TEST_SPOT_INSTANCE_TYPES: ${{ needs.declaring-common-variables.outputs.test_spot_instance_types }}
          TEST_SUBNET_IDS: ${{ needs.building-ami.outputs.subnet_ids }}
        name: Run pytest integration tests
        run: |
          pytest test/build/image_for_ec2_runners/post_deployment/integration/ \
            --confcutdir=test/build/image_for_ec2_runners \
            -v
  performing-static-analysis:
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install yamllint
        run: pip install yamllint
      - name: Linting YAML files
        run: |
          DOCUMENT_START='document-start: disable'
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: {max: 300, level: warning}'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$DOCUMENT_START, $EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/image_for_ec2_runners.yml \
            src/build/image_for_ec2_runners/config.yml
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - name: Terraform Format Check
        run: cd src/api && terraform fmt -check terraform.tfvars
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api && \
            tflint --init && \
            tflint --disable-rule=terraform_unused_declarations
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python linting dependencies
        run: pip install boto3 boto3-stubs mypy pylint pytest types-paramiko
      - env:
          PYTHONPATH: test/build/image_for_ec2_runners/post_deployment
        name: Linting Python files
        run: |
          pylint \
            src/build/image_for_ec2_runners/*.py \
            test/build/image_for_ec2_runners/ \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Static type checking Python files with mypy
        run: python -m mypy src/build/image_for_ec2_runners/*.py
  promoting-ami:
    name: Promoting AMI
    needs:
      - building-ami
      - declaring-common-variables
      - e2e-testing
    outputs:
      ami_ssm_parameter: ${{ steps.config.outputs.ami_ssm_parameter }}
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - id: config
        name: Get SSM parameter name from Terraform
        run: |
          cd src/api
          terraform init -backend=true -input=false
          AMI_SSM_PARAMETER=$(terraform output -raw ssm_parameter_name_for_latest_ami)
          echo "ami_ssm_parameter=$AMI_SSM_PARAMETER" >> $GITHUB_OUTPUT
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: pip install boto3
      - name: Promote AMI
        run: |
          python src/build/image_for_ec2_runners/promote_ami.py \
            --ami-id "${{ needs.building-ami.outputs.ami_id }}" \
            --region "${{ needs.declaring-common-variables.outputs.aws_region }}" \
            --run-id "${{ github.run_id }}" \
            --ssm-parameter-name "${{ steps.config.outputs.ami_ssm_parameter }}" \
            --tag-key "${{ needs.building-ami.outputs.ami_stable_tag }}"
  unit-testing:
    name: Unit testing
    needs:
      - declaring-common-variables
      - performing-static-analysis
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: pip install pytest boto3 botocore pyyaml
      - name: Run unit tests
        run: |
          pytest test/build/image_for_ec2_runners/pre_deployment/ \
            --confcutdir=test/build/image_for_ec2_runners \
            -v
name: Building AMI for EC2 self-hosted runners
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/image_for_ec2_runners.yml'
      - 'src/build/image_for_ec2_runners/**'
      - 'test/build/image_for_ec2_runners/**'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      test_spot_instance_types:
        default: '["t4g.xlarge", "m8g.xlarge", "m7g.xlarge"]'
        description: 'Spot instance types for integration/e2e tests (JSON array)'
        required: false
        type: string
permissions:
  contents: read
  id-token: write
