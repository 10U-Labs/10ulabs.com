name: Build AMI for Self-Hosted Runner
on:
  workflow_dispatch:
    inputs:
      debian_version:
        description: 'Debian version (leave empty to use config default)'
        required: false
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      skip_build:
        description: 'Skip build and only validate existing AMI'
        required: false
        type: boolean
        default: false
      ami_id:
        description: 'AMI ID to validate (required if skip_build is true)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'api/resources/image_for_ec2_runners/config.json'
      - 'api/resources/image_for_ec2_runners/**'
      - '.github/workflows/build-ami-for-github_self_hosted_runners.yml'
      - '!**/README.md'
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  performing-static-analysis:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
      )
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install linting dependencies
        run: |
          pip install pylint mypy yamllint &&
          npm install -g jsonlint
      - name: Install project dependencies for linting
        run: pip install boto3
      - name: Linting JSON configuration files
        run: |
          echo "Validating JSON syntax..."
          jsonlint -q src/api/endpoints/v1/image_for_ec2_runners/infrastructure/config.json
      - name: Linting Python files
        run: |
          pylint \
            src/api/endpoints/v1/image_for_ec2_runners/infrastructure/*.py \
            src/api/endpoints/v1/image_for_ec2_runners/infrastructure/lambda/*.py \
            src/api/endpoints/v1/image_for_ec2_runners/logic/*.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Linting YAML files
        run: |
          echo "Running yamllint on workflow files..."
          CONFIG='{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}'
          yamllint --config-data "$CONFIG" .github/workflows/image_for_ec2_runners.yml
      - name: Static type checking Python files with mypy
        run: |
          python -m mypy src/api/endpoints/v1/image_for_ec2_runners/infrastructure/*.py &&
          python -m mypy src/api/endpoints/v1/image_for_ec2_runners/infrastructure/lambda/*.py &&
          python -m mypy src/api/endpoints/v1/image_for_ec2_runners/logic/*.py
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"
      - name: Initialize Packer
        run: |
          cd src/api/endpoints/v1/image_for_ec2_runners/logic
          packer init template.pkr.hcl
      - name: Validating Packer template
        run: |
          cd src/api/endpoints/v1/image_for_ec2_runners/logic
          packer validate \
            -var="debian_version=12" \
            -var="architecture=amd64" \
            -var="runner_version=2.319.1" \
            -var="aws_region=us-east-1" \
            -var="instance_type=t3.medium" \
            -var='spot_instance_types=["t3.medium"]' \
            -var="vpc_id=vpc-dummy" \
            template.pkr.hcl
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          pip install pytest boto3 moto &&
          pip install aws-cdk-lib constructs
      - name: Run unit tests
        run: pytest test/api/image_for_ec2_runners/test_unit.py -v
  build-ami:
    name: Building AMI
    needs: unit-testing
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_build }}
    runs-on: ubuntu-latest
    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jq
        run: |
          sudo apt-get update && sudo apt-get install -y jq
      - name: Load configuration from config file
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws.account_id' api/resources/image_for_ec2_runners/config.json)
          REGION=$(jq -r '.aws.region' api/resources/image_for_ec2_runners/config.json)
          VPC_NAME=$(jq -r '.naming.vpc_name' api/resources/image_for_ec2_runners/config.json)
          BASE_OS=$(jq -r '.base_os.os' api/resources/image_for_ec2_runners/config.json)
          BASE_OS_VERSION=$(jq -r '.base_os.version' api/resources/image_for_ec2_runners/config.json)
          ARCHITECTURE=$(jq -r '.base_os.architecture' api/resources/image_for_ec2_runners/config.json)
          if [ "$BASE_OS" = "debian" ] && [ "$BASE_OS_VERSION" = "stable" ]; then
            DEBIAN_VERSION=$(curl -s https://deb.debian.org/debian/dists/stable/Release | grep -oP '^Version: \K[0-9]+' || echo "13")
            echo "Resolved Debian stable to version $DEBIAN_VERSION (queried from Debian repository)"
          else
            DEBIAN_VERSION="$BASE_OS_VERSION"
          fi
          if [ -n "${{ github.event.inputs.debian_version }}" ]; then
            DEBIAN_VERSION="${{ github.event.inputs.debian_version }}"
            echo "Using Debian version from workflow input: $DEBIAN_VERSION"
          fi
          RUNNER_VERSION=$(jq -r '.github.runner_version' api/resources/image_for_ec2_runners/config.json)
          INSTANCE_TYPE=$(jq -r '.docker_builder.instance_type' api/resources/image_for_ec2_runners/config.json)
          SPOT_INSTANCE_TYPES=$(jq -c '.docker_builder.spot_instance_types' api/resources/image_for_ec2_runners/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "vpc_name=$VPC_NAME" >> $GITHUB_OUTPUT
          echo "debian_version=$DEBIAN_VERSION" >> $GITHUB_OUTPUT
          echo "architecture=$ARCHITECTURE" >> $GITHUB_OUTPUT
          echo "runner_version=$RUNNER_VERSION" >> $GITHUB_OUTPUT
          echo "instance_type=$INSTANCE_TYPE" >> $GITHUB_OUTPUT
          echo "spot_instance_types=$SPOT_INSTANCE_TYPES" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Get VPC info from deployed infrastructure
        id: network
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ steps.config.outputs.vpc_name }}" \
            --query 'Vpcs[0].VpcId' \
            --output json --no-cli-pager | jq -r '.')
          PRIMARY_INSTANCE_TYPE="${{ steps.config.outputs.instance_type }}"
          echo "Querying AWS for AZs that support instance type: $PRIMARY_INSTANCE_TYPE"
          SUPPORTED_AZS=$(aws ec2 describe-instance-type-offerings \
            --location-type availability-zone \
            --filters "Name=instance-type,Values=$PRIMARY_INSTANCE_TYPE" \
            --query 'InstanceTypeOfferings[].Location' \
            --output json --no-cli-pager | jq -r '.[]')
          if [ -z "$SUPPORTED_AZS" ]; then
            echo "ERROR: No AZs found supporting instance type $PRIMARY_INSTANCE_TYPE"
            exit 1
          fi
          echo "AZs supporting $PRIMARY_INSTANCE_TYPE:"
          echo "$SUPPORTED_AZS"
          for AZ in $SUPPORTED_AZS; do
            SUBNET_ID=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" \
                        "Name=map-public-ip-on-launch,Values=true" \
                        "Name=availability-zone,Values=$AZ" \
              --query 'Subnets[0].SubnetId' \
              --output text --no-cli-pager)
            if [ -n "$SUBNET_ID" ] && [ "$SUBNET_ID" != "None" ]; then
              echo "Found subnet $SUBNET_ID in AZ $AZ"
              echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
              echo "subnet_id=$SUBNET_ID" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "ERROR: No suitable subnet found in any supported AZ"
          exit 1
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"
      - name: Initialize Packer
        run: |
          cd api/resources/image_for_ec2_runners
          packer init template.pkr.hcl
      - name: Validate Packer template
        run: |
          cd api/resources/image_for_ec2_runners
          packer validate \
            -var="debian_version=${{ steps.config.outputs.debian_version }}" \
            -var="architecture=${{ steps.config.outputs.architecture }}" \
            -var="runner_version=${{ steps.config.outputs.runner_version }}" \
            -var="aws_region=${{ steps.config.outputs.region }}" \
            -var="instance_type=${{ steps.config.outputs.instance_type }}" \
            -var='spot_instance_types=${{ steps.config.outputs.spot_instance_types }}' \
            -var="vpc_id=${{ steps.network.outputs.vpc_id }}" \
            template.pkr.hcl
      - name: Build AMI with Packer
        id: build
        run: |
          cd api/resources/image_for_ec2_runners
          echo "Building GitHub Runner AMI..."
          echo "Debian Version: ${{ steps.config.outputs.debian_version }}"
          echo "Architecture: ${{ steps.config.outputs.architecture }}"
          echo "Runner Version: ${{ steps.config.outputs.runner_version }}"
          echo "Instance Type: ${{ steps.config.outputs.instance_type }}"
          echo ""
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Build attempt $ATTEMPT of $MAX_ATTEMPTS"
            packer build \
              -var="debian_version=${{ steps.config.outputs.debian_version }}" \
              -var="architecture=${{ steps.config.outputs.architecture }}" \
              -var="runner_version=${{ steps.config.outputs.runner_version }}" \
              -var="aws_region=${{ steps.config.outputs.region }}" \
              -var="instance_type=${{ steps.config.outputs.instance_type }}" \
              -var='spot_instance_types=${{ steps.config.outputs.spot_instance_types }}' \
              -var="vpc_id=${{ steps.network.outputs.vpc_id }}" \
              -var="subnet_id=${{ steps.network.outputs.subnet_id }}" \
              -machine-readable \
              template.pkr.hcl | tee packer-output.log
            BUILD_EXIT_CODE=$?
            if [ $BUILD_EXIT_CODE -eq 0 ]; then
              echo "Build succeeded on attempt $ATTEMPT"
              break
            fi
            if grep -q "Spot Instance interruption" packer-output.log || \
               grep -q "capacity" packer-output.log || \
               grep -q "fleet request" packer-output.log; then
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Spot instance issue detected. Retrying in 30 seconds..."
                sleep 30
                ATTEMPT=$((ATTEMPT + 1))
              else
                echo "Build failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
            else
              echo "Build failed with non-retryable error"
              exit 1
            fi
          done
          AMI_ID=$(grep 'artifact,0,id' packer-output.log | cut -d: -f2 | cut -d, -f1 || echo "")
          if [ -z "$AMI_ID" ]; then
            echo "Failed to extract AMI ID from Packer output"
            exit 1
          fi
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo ""
          echo "AMI built successfully: $AMI_ID"
      - name: Tag AMI
        if: steps.build.outputs.ami_id != ''
        run: |
          aws ec2 create-tags \
            --resources ${{ steps.build.outputs.ami_id }} \
            --tags Key=ManagedBy,Value=GitHubActions Key=Repository,Value=${{ github.repository }} Key=Workflow,Value="${{ github.workflow }}" Key=RunId,Value=${{ github.run_id }} \
            --region ${{ steps.config.outputs.region }}
          echo "Tagged AMI ${{ steps.build.outputs.ami_id }}"
      - name: Output AMI details
        if: steps.build.outputs.ami_id != ''
        run: |
          echo "==================================="
          echo "GitHub Runner AMI Built Successfully"
          echo "==================================="
          echo ""
          echo "AMI ID: ${{ steps.build.outputs.ami_id }}"
          echo "Region: ${{ steps.config.outputs.region }}"
          echo "Debian Version: ${{ steps.config.outputs.debian_version }}"
          echo "Architecture: ${{ steps.config.outputs.architecture }}"
          echo "Runner Version: ${{ steps.config.outputs.runner_version }}"
          echo ""
          echo "To use this AMI, update your CloudFormation template or"
          echo "add it to the config file under docker_builder.custom_ami"
          echo ""
          echo "==================================="
  cleanup-old-amis:
    name: Cleaning up Packer build artifacts
    runs-on: ubuntu-latest
    needs: smoke-test-new-ami
    if: always()
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Load configuration from config file
        id: config
        run: |
          AWS_ACCOUNT_ID=$(jq -r '.aws.account_id' api/resources/image_for_ec2_runners/config.json)
          AWS_REGION=$(jq -r '.aws.region' api/resources/image_for_ec2_runners/config.json)
          IAM_ROLE_NAME=$(jq -r '.aws.iam_role_name' config/auth_between_aws_and_github.json)
          AMI_NAME_PREFIX="github-runner-debian-"
          echo "ami_name_prefix=$AMI_NAME_PREFIX" >> $GITHUB_OUTPUT
          echo "account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "iam_role_name=$IAM_ROLE_NAME" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/${{ steps.config.outputs.iam_role_name }}
          aws-region: ${{ steps.config.outputs.region }}
      - name: Delete old AMIs (keep latest only)
        run: |
          echo "Finding all AMIs with prefix: ${{ steps.config.outputs.ami_name_prefix }}"
          AMIS=$(aws ec2 describe-images \
            --owners self \
            --filters "Name=name,Values=${{ steps.config.outputs.ami_name_prefix }}*" \
            --query 'sort_by(Images, &CreationDate) | reverse(@) | [*].[ImageId,Name,CreationDate]' \
            --output text)
          if [ -z "$AMIS" ]; then
            echo "No AMIs found to clean up"
            exit 0
          fi
          TOTAL_AMIS=$(echo "$AMIS" | wc -l)
          echo "Found $TOTAL_AMIS AMI(s)"
          if [ "$TOTAL_AMIS" -le 1 ]; then
            echo "Only 1 or fewer AMIs exist - keeping all"
            exit 0
          fi
          echo "$AMIS" | tail -n +2 | while read AMI_ID AMI_NAME CREATION_DATE; do
            echo "Deleting old AMI: $AMI_ID ($AMI_NAME) created $CREATION_DATE"
            SNAPSHOTS=$(aws ec2 describe-images --image-ids $AMI_ID \
              --query 'Images[0].BlockDeviceMappings[*].Ebs.SnapshotId' \
              --output text)
            aws ec2 deregister-image --image-id $AMI_ID
            echo "✓ Deregistered AMI: $AMI_ID"
            for SNAPSHOT_ID in $SNAPSHOTS; do
              if [ -n "$SNAPSHOT_ID" ] && [ "$SNAPSHOT_ID" != "None" ]; then
                aws ec2 delete-snapshot --snapshot-id $SNAPSHOT_ID
                echo "✓ Deleted snapshot: $SNAPSHOT_ID"
              fi
            done
          done
          echo "Cleanup complete - kept latest AMI, deleted $(($TOTAL_AMIS - 1)) old AMI(s)"
      - name: Terminate orphaned Packer build instances
        run: |
          echo "Checking for orphaned Packer build instances..."
          INSTANCES=$(aws ec2 describe-instances \
            --filters "Name=instance-state-name,Values=running,stopped" \
                      "Name=tag-key,Values=aws:ec2:fleet-id" \
            --query 'Reservations[*].Instances[*].[InstanceId,LaunchTime,State.Name]' \
            --output text)
          if [ -z "$INSTANCES" ]; then
            echo "No orphaned build instances found"
            exit 0
          fi
          echo "$INSTANCES" | while read INSTANCE_ID LAUNCH_TIME STATE; do
            echo "Terminating orphaned build instance: $INSTANCE_ID (launched $LAUNCH_TIME, state: $STATE)"
            aws ec2 terminate-instances --instance-ids $INSTANCE_ID
            echo "✓ Terminated $INSTANCE_ID"
          done
          TERMINATED_COUNT=$(echo "$INSTANCES" | wc -l)
          echo "Terminated $TERMINATED_COUNT orphaned build instance(s)"
      - name: Delete orphaned EBS volumes
        run: |
          echo "Checking for orphaned EBS volumes..."
          VOLUMES=$(aws ec2 describe-volumes \
            --filters "Name=status,Values=available" \
            --query 'Volumes[?!not_null(Tags[?Key==`aws:ec2:fleet-id`])].VolumeId' \
            --output text)
          if [ -z "$VOLUMES" ]; then
            echo "No orphaned volumes found"
          else
            for VOLUME_ID in $VOLUMES; do
              echo "Deleting orphaned volume: $VOLUME_ID"
              aws ec2 delete-volume --volume-id $VOLUME_ID
              echo "✓ Deleted $VOLUME_ID"
            done
          fi
      - name: Delete orphaned security groups
        run: |
          echo "Checking for orphaned Packer security groups..."
          SECURITY_GROUPS=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=packer_*" \
            --query 'SecurityGroups[*].GroupId' \
            --output text)
          if [ -z "$SECURITY_GROUPS" ]; then
            echo "No orphaned security groups found"
          else
            for SG_ID in $SECURITY_GROUPS; do
              echo "Deleting orphaned security group: $SG_ID"
              aws ec2 delete-security-group --group-id $SG_ID || echo "⚠ Failed to delete $SG_ID (may be in use)"
            done
          fi
      - name: Delete orphaned SSH key pairs
        run: |
          echo "Checking for orphaned Packer SSH keys..."
          KEY_PAIRS=$(aws ec2 describe-key-pairs \
            --filters "Name=key-name,Values=packer_*" \
            --query 'KeyPairs[*].KeyName' \
            --output text)
          if [ -z "$KEY_PAIRS" ]; then
            echo "No orphaned key pairs found"
          else
            for KEY_NAME in $KEY_PAIRS; do
              echo "Deleting orphaned key pair: $KEY_NAME"
              aws ec2 delete-key-pair --key-name $KEY_NAME
              echo "✓ Deleted $KEY_NAME"
            done
          fi
      - name: Delete orphaned network interfaces
        run: |
          echo "Checking for orphaned network interfaces..."
          ENIS=$(aws ec2 describe-network-interfaces \
            --filters "Name=status,Values=available" \
                      "Name=tag-key,Values=aws:ec2:fleet-id" \
            --query 'NetworkInterfaces[*].NetworkInterfaceId' \
            --output text)
          if [ -z "$ENIS" ]; then
            echo "No orphaned network interfaces found"
          else
            for ENI_ID in $ENIS; do
              echo "Deleting orphaned network interface: $ENI_ID"
              aws ec2 delete-network-interface --network-interface-id $ENI_ID || echo "⚠ Failed to delete $ENI_ID"
            done
          fi
  smoke-test-new-ami:
    name: Smoke testing newly built AMI
    needs: build-ami
    if: ${{ !inputs.skip_build && needs.build-ami.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Load configuration from config file
        id: aws-config
        run: |
          ACCOUNT_ID=$(jq -r '.aws.account_id' api/resources/image_for_ec2_runners/config.json)
          REGION=$(jq -r '.aws.region' api/resources/image_for_ec2_runners/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.aws-config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.aws-config.outputs.region }}
      - name: Get VPC and subnet info
        id: network
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=github-runners-vpc" \
            --query 'Vpcs[0].VpcId' \
            --output text --no-cli-pager)
          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=map-public-ip-on-launch,Values=true" \
            --query 'Subnets[0].SubnetId' \
            --output text --no-cli-pager)
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "subnet_id=$SUBNET_ID" >> $GITHUB_OUTPUT
      - name: Load AMI validation config
        id: config
        run: |
          SPOT_INSTANCE_TYPES=$(jq -r '.docker_builder.spot_instance_types | join(" ")' api/resources/image_for_ec2_runners/config.json)
          SPOT_MAX_PRICE=$(jq -r '.docker_builder.spot_max_price' api/resources/image_for_ec2_runners/config.json)
          SPOT_RETRY_ATTEMPTS=$(jq -r '.docker_builder.spot_retry_attempts' api/resources/image_for_ec2_runners/config.json)
          SPOT_RETRY_DELAY=$(jq -r '.docker_builder.spot_retry_delay' api/resources/image_for_ec2_runners/config.json)
          echo "spot_instance_types=$SPOT_INSTANCE_TYPES" >> $GITHUB_OUTPUT
          echo "spot_max_price=$SPOT_MAX_PRICE" >> $GITHUB_OUTPUT
          echo "spot_retry_attempts=$SPOT_RETRY_ATTEMPTS" >> $GITHUB_OUTPUT
          echo "spot_retry_delay=$SPOT_RETRY_DELAY" >> $GITHUB_OUTPUT
      - name: Launch test instance
        id: launch
        env:
          AMI_ID: ${{ needs.build-ami.outputs.ami_id }}
        run: |
          echo "Smoke testing newly built AMI: $AMI_ID"
          INSTANCE_TYPES="${{ steps.config.outputs.spot_instance_types }}"
          MAX_ATTEMPTS=${{ steps.config.outputs.spot_retry_attempts }}
          RETRY_DELAY=${{ steps.config.outputs.spot_retry_delay }}
          INSTANCE_ID=""
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS"
            for instance_type in $INSTANCE_TYPES; do
              echo "Trying spot instance type: $instance_type"
              set +e
              INSTANCE_ID=$(aws ec2 run-instances \
                --image-id $AMI_ID \
                --instance-type $instance_type \
                --subnet-id ${{ steps.network.outputs.subnet_id }} \
                --associate-public-ip-address \
                --iam-instance-profile Name=PackerEC2InstanceProfile \
                --instance-market-options "MarketType=spot,SpotOptions={MaxPrice=${{ steps.config.outputs.spot_max_price }},SpotInstanceType=one-time}" \
                --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=ami-validation-test},{Key=Purpose,Value=temporary-testing}]' \
                --query 'Instances[0].InstanceId' \
                --output text --no-cli-pager 2>&1)
              EXIT_CODE=$?
              set -e
              if [ $EXIT_CODE -eq 0 ] && [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
                echo "Successfully launched $instance_type spot instance: $INSTANCE_ID"
                echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
                echo "instance_type=$instance_type" >> $GITHUB_OUTPUT
                exit 0
              else
                echo "Failed to launch $instance_type: $INSTANCE_ID"
              fi
            done
            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo "No spot capacity available, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done
          echo "Failed to launch spot instance after $MAX_ATTEMPTS attempts"
          exit 1
      - name: Wait for instance to be ready
        run: |
          echo "Waiting for instance to be running..."
          aws ec2 wait instance-running \
            --instance-ids ${{ steps.launch.outputs.instance_id }}
          echo "Waiting for status checks to pass..."
          aws ec2 wait instance-status-ok \
            --instance-ids ${{ steps.launch.outputs.instance_id }}
          echo "Instance is ready"
      - name: Wait for SSM agent to be online
        run: |
          echo "Waiting for SSM agent..."
          TIMEOUT=300
          ELAPSED=0
          SLEEP_TIME=10
          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.launch.outputs.instance_id }}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text --no-cli-pager 2>/dev/null || echo "NotFound")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent is online"
              break
            fi
            echo "SSM agent status: $STATUS - waiting..."
            sleep $SLEEP_TIME
            ELAPSED=$((ELAPSED + SLEEP_TIME))
          done
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "Timeout waiting for SSM agent"
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: |
          pip install pytest boto3
      - name: Run validation tests
        env:
          AMI_ID: ${{ needs.build-ami.outputs.ami_id }}
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
          INSTANCE_TYPE: ${{ steps.config.outputs.instance_type }}
          SUBNET_ID: ${{ steps.network.outputs.subnet_id }}
        run: |
          cd api/resources/image_for_ec2_runners/test
          pytest test_ami_validation.py -v \
            --ami-id=$AMI_ID \
            --instance-id=$INSTANCE_ID \
            --instance-type=$INSTANCE_TYPE \
            --subnet-id=$SUBNET_ID \
            --region=${{ steps.aws-config.outputs.region }}
      - name: Terminate test instance
        if: always()
        run: |
          if [ -n "${{ steps.launch.outputs.instance_id }}" ]; then
            echo "Terminating test instance ${{ steps.launch.outputs.instance_id }}"
            aws ec2 terminate-instances \
              --instance-ids ${{ steps.launch.outputs.instance_id }} \
              --no-cli-pager
            echo "Waiting for instance to terminate..."
            aws ec2 wait instance-terminated \
              --instance-ids ${{ steps.launch.outputs.instance_id }}
            echo "Instance terminated successfully"
          fi