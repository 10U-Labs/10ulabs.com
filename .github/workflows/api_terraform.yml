concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  performing-static-analysis:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      )
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install linting dependencies
        run: |
          pip install pylint mypy yamllint &&
          npm install -g jsonlint
      - name: Install project dependencies for linting
        run: pip install -r src/api/requirements.txt
      - name: Linting JSON configuration files
        run: jsonlint -q src/api/terraform/terraform.tfvars.json || true
      - name: Linting Python files
        run: |
          cd src/api && pylint \
            endpoints/catchall/*.py \
            endpoints/health/*.py \
            endpoints/v1/handler.py \
            endpoints/v1/runners/*.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Linting YAML files
        run: |
          echo "Running yamllint on workflow files..."
          CONFIG='{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}'
          yamllint --config-data "$CONFIG" .github/workflows/api_terraform.yml
      - name: Static type checking Python files with mypy
        run: |
          cd src/api && python -m mypy endpoints/catchall &&
          python -m mypy endpoints/health &&
          python -m mypy endpoints/v1/handler.py &&
          python -m mypy endpoints/v1/runners
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14"
      - name: Terraform fmt check
        run: cd src/api/terraform && terraform fmt -check -recursive
      - name: Terraform init
        run: cd src/api/terraform && terraform init -backend=false
      - name: Terraform validate
        run: cd src/api/terraform && terraform validate
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: |
          pip install pytest &&
          pip install -r src/api/requirements.txt
      - name: Run unit tests
        run: pytest test/api/test_unit.py -v
  ensuring-infrastructure-in-desired-state:
    name: Ensuring infrastructure is in desired state
    needs: unit-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws.account_id' src/api/config.json);
          REGION=$(jq -r '.aws.region' src/api/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14"
      - name: Terraform init
        run: cd src/api/terraform && terraform init
      - name: Terraform plan
        run: cd src/api/terraform && terraform plan -out=tfplan
      - name: Terraform apply
        run: cd src/api/terraform && terraform apply -auto-approve tfplan
  integration-and-e2e-testing:
    name: Integration and E2E testing
    needs: ensuring-infrastructure-in-desired-state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws.account_id' src/api/config.json);
          REGION=$(jq -r '.aws.region' src/api/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14"
          terraform_wrapper: false
      - name: Terraform init
        run: cd src/api/terraform && terraform init
      - name: Install Python dependencies
        run: pip install pytest requests boto3
      - name: Run integration and E2E tests
        run: pytest test/api/test_terraform.py -v
name: Ensuring API infrastructure exists and is properly configured
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api_terraform.yml
      - src/api/terraform/**
      - src/api/endpoints/**
      - src/api/openapi.yml
      - src/api/*.html
      - test/api/**
      - '!**/README.md'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
  workflow_run:
    branches: [main]
    types: [completed]
    workflows: ["Ensuring bootstrap infrastructure exists and is properly configured"]
permissions:
  contents: read
  id-token: write
