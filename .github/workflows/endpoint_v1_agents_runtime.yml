---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.dry_run != 'true'
    name: Deploy Agent Runtime
    runs-on: >-
      ${{
        (vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]'))
        && 'ubuntu-latest'
        || fromJSON(format(
          '["ec2", "general-purpose", "arm", "spot", "runner-{0}"]',
          github.run_id))
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          TF_SHARED_LOCALS="lib/terraform/modules/shared/locals.tf"
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          AWS_REGION=$(grep 'aws_region' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' \
            src/bootstrap/locals.tf | \
            sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          RESOURCE_PREFIX=$(grep 'resource_prefix' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/bootstrap/providers.tf | cut -d'"' -f2 | sed 's/>= //')
          ROLE_PREFIX="arn:aws:iam::${AWS_ACCOUNT_ID}:role"
          ROLE_NAME="${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          GITHUB_ACTIONS_ROLE_ARN="${ROLE_PREFIX}/${ROLE_NAME}"
          ECR_REPO_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_REPO_URL="${ECR_REPO_URL}/agents"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "ecr_repository_url=$ECR_REPO_URL" >> $GITHUB_OUTPUT
          GH_ROLE_ARN="github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN"
          echo "$GH_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.config.outputs.github_actions_role_arn }}
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install \
            pylint mypy yamllint pytest boto3 boto3-stubs requests \
            PyJWT cryptography
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Terraform Format Check
        run: |
          cd src/api/endpoints/agents
          terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: |
          cd src/api/endpoints/agents
          terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api/endpoints/agents
          tflint --init && tflint
      - name: Terraform Plan
        run: |
          cd src/api/endpoints/agents
          terraform plan
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/endpoint_v1_agents_runtime.yml \
            .github/workflows/endpoint_v1_agents_infrastructure.yml
      - env:
          PYTHONPATH: src/bootstrap/lambda_layer
        name: Run pylint
        run: |
          SRC=src/api/endpoints/agents
          python3 -m pylint $SRC/lambdas/ --fail-on=C,R,W --fail-under=10.0
          python3 -m pylint $SRC/runtime/ --fail-on=C,R,W --fail-under=10.0
      - env:
          MYPYPATH: src/bootstrap/lambda_layer:src/api/endpoints/agents/stubs
          PYTHONPATH: src/bootstrap/lambda_layer
        name: Run mypy
        run: |
          python3 -m mypy \
            src/api/endpoints/agents/lambdas/ \
            src/api/endpoints/agents/runtime/
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        name: Extract metadata for Docker
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.config.outputs.ecr_repository_url }}
          tags: |
            type=sha,prefix=runtime-
            type=raw,value=runtime-latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - env:
          DOCKER_BUILD_SUMMARY: false
        name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: src/api/endpoints/agents/runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Terraform Apply
        run: |
          cd src/api/endpoints/agents
          terraform apply -auto-approve
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.skip_descendants != 'true' &&
          !contains(github.event.head_commit.message, '[skip descendants]')
        name: Dispatch descendant workflows
        run: |
          SKIP_FLAG=""
          SKIP_INPUT="${{ github.event.inputs.skip_descendants }}"
          if [ "$SKIP_INPUT" = "true" ]; then SKIP_FLAG="--skip-descendants"; fi
          python3 scripts/dispatch_descendants.py \
            $SKIP_FLAG \
            --workflow endpoint_v1_agents_runtime \
            --repo ${{ github.repository }}
name: Deploying Agent Runtime
on:
  push:
    branches:
      - main
    paths:
      - src/api/endpoints/agents/agentcore.tf
      - src/api/endpoints/agents/lambda.tf
      - src/api/endpoints/agents/iam.tf
      - src/api/endpoints/agents/locals.tf
      - src/api/endpoints/agents/outputs.tf
      - src/api/endpoints/agents/lambdas/**
      - src/api/endpoints/agents/prompts/**
      - src/api/endpoints/agents/runtime/**
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      skip_descendants:
        default: false
        description: Skip dispatching descendant workflows
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
