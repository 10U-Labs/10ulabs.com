---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  test:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.dry_run != 'true'
    name: Test Claude Code hooks
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install pylint mypy yamllint pytest types-PyYAML
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/claude.yml
      - name: Linting hook files with pylint
        run: |
          for file in .claude/hooks/*.py; do
            python3 -m pylint "$file" \
              --fail-on=C,R,W \
              --fail-under=10.0
          done
      - name: Linting test files with pylint
        run: |
          python3 -m pylint test/claude/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Type checking hook files with mypy
        run: |
          for file in .claude/hooks/*.py; do
            python3 -m mypy "$file"
          done
      - name: Type checking test files with mypy
        run: python3 -m mypy test/claude/
      - name: Run unit tests
        run: |
          python3 -m pytest test/claude/ \
            --confcutdir=test/claude \
            --pythonwarnings=error \
            --verbose
name: Testing Claude Code hooks
on:
  push:
    branches:
      - main
    paths:
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - 'test/claude/**'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
permissions:
  contents: read
  id-token: write
