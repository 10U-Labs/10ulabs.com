---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  test:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.dry_run != 'true'
    name: Test Claude Code hooks
    runs-on: >-
      ${{ ( vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - continue-on-error: true
        id: no_linter_configs_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no linter config files (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-linter-config-files@latest
        with:
          directories: ${{ github.workspace }}
          linters: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_linter_configs_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no linter config files (self-hosted)
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - continue-on-error: true
        id: no_inline_disables_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no inline lint disables (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-inline-lint-disables@latest
        with:
          files: ${{ github.workspace }}/**/*
          linters: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_inline_disables_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no inline lint disables (self-hosted)
        run: >-
          assert-no-inline-lint-disables
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/**/*
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            mypy \
            pylint \
            pytest \
            requests \
            types-PyYAML \
            types-requests \
            yamllint
      - continue-on-error: true
        id: yamllint
        name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/claude.yml
      - continue-on-error: true
        id: pylint_source
        name: Run pylint on source
        run: |
          python3 -m pylint lib/python/ .claude/hooks/*.py \
            --fail-on=C,R,W \
            --fail-under=10.0
      - continue-on-error: true
        id: pylint_tests
        name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/ test/conftest.py test/claude/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - continue-on-error: true
        id: mypy_source
        name: Run mypy on source
        run: python3 -m mypy lib/python/ .claude/hooks/*.py
      - continue-on-error: true
        id: mypy_tests
        name: Run mypy on tests
        run: |
          MYPYPATH=lib/python python3 -m mypy \
            lib/python/ test/conftest.py test/claude/
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install jscpd
        run: npm install -g jscpd
      - continue-on-error: true
        id: jscpd_source
        name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ .claude/hooks/
      - continue-on-error: true
        id: jscpd_tests
        name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/
      - continue-on-error: true
        id: unit_tests
        name: Run unit tests
        run: |
          python3 -m pytest test/claude/ \
            --pythonwarnings=error \
            --verbose
      - env:
          S01: ${{ steps.no_linter_configs_gh.outcome }}
          S02: ${{ steps.no_linter_configs_sh.outcome }}
          S03: ${{ steps.no_inline_disables_gh.outcome }}
          S04: ${{ steps.no_inline_disables_sh.outcome }}
          S05: ${{ steps.yamllint.outcome }}
          S06: ${{ steps.pylint_source.outcome }}
          S07: ${{ steps.pylint_tests.outcome }}
          S08: ${{ steps.mypy_source.outcome }}
          S09: ${{ steps.mypy_tests.outcome }}
          S10: ${{ steps.jscpd_source.outcome }}
          S11: ${{ steps.jscpd_tests.outcome }}
          S12: ${{ steps.unit_tests.outcome }}
        name: Assert no step failed
        run: |
          failed=""
          f="failure"
          [ "$S01" = "$f" ] && failed="$failed no_linter_configs_gh"
          [ "$S02" = "$f" ] && failed="$failed no_linter_configs_sh"
          [ "$S03" = "$f" ] && failed="$failed no_inline_disables_gh"
          [ "$S04" = "$f" ] && failed="$failed no_inline_disables_sh"
          [ "$S05" = "$f" ] && failed="$failed yamllint"
          [ "$S06" = "$f" ] && failed="$failed pylint_source"
          [ "$S07" = "$f" ] && failed="$failed pylint_tests"
          [ "$S08" = "$f" ] && failed="$failed mypy_source"
          [ "$S09" = "$f" ] && failed="$failed mypy_tests"
          [ "$S10" = "$f" ] && failed="$failed jscpd_source"
          [ "$S11" = "$f" ] && failed="$failed jscpd_tests"
          [ "$S12" = "$f" ] && failed="$failed unit_tests"
          if [ -n "$failed" ]; then
            echo "Steps that failed:$failed"
            exit 1
          fi
          echo "All steps succeeded"
name: Testing Claude Code hooks
on:
  push:
    branches:
      - main
    paths:
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - 'test/claude/**'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
permissions:
  contents: read
  id-token: write
