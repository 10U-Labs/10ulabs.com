jobs:
  concluding-claude-md-is-already-formatted-properly:
    if: needs.determining-if-claude-md-should-be-formatted.outputs.claude_md_should_be_updated != 'true'
    name: Concluding CLAUDE.md is formatted properly already
    needs: determining-if-claude-md-should-be-formatted
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  concluding-claude-md-should-be-formatted:
    if: needs.determining-if-claude-md-should-be-formatted.outputs.claude_md_should_be_updated == 'true'
    name: Concluding CLAUDE.md should be properly formatted
    needs: determining-if-claude-md-should-be-formatted
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  determining-if-claude-md-should-be-formatted:
    name: Determining if CLAUDE.md should be properly formatted
    needs: linting
    outputs:
      claude_md_should_be_updated: ${{ steps.check.outputs.claude_md_should_be_updated }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install markdownlint-cli2
      run: npm install -g markdownlint-cli2
    - id: check
      name: Check if CLAUDE.md needs formatting
      run: 'python scripts/claude_md.py --check --output-file "$GITHUB_OUTPUT"
        '
  linting:
    if: '(github.event_name == ''workflow_dispatch'') ||
      !contains(github.event.head_commit.message, ''[skip ci]'')
      '
    name: Linting
    outputs:
      claude_md_should_be_updated: ${{ steps.lint.outputs.claude_md_should_be_updated }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: 'npm install -g markdownlint-cli2 && pip install yamllint
        '
    - continue-on-error: true
      id: lint
      name: Linting Markdown files
      run: "if markdownlint-cli2 CLAUDE.md 2>&1 | tee lint-output.txt; then\n  echo \"claude_md_should_be_updated=false\" >> $GITHUB_OUTPUT\n  echo \"\u2713 No linting warnings found\"\nelse\n  echo \"claude_md_should_be_updated=true\" >> $GITHUB_OUTPUT\n  echo \"\u26A0\uFE0F Linting warnings detected:\"\n  cat lint-output.txt\nfi\n"
    - name: Linting YAML files
      run: 'echo "Running yamllint on claude.yml..."
        CONFIG=''{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}''
        yamllint --config-data "$CONFIG" .github/workflows/claude.yml
        '
    - name: Upload lint results
      uses: actions/upload-artifact@v4
      with:
        name: lint-results
        path: lint-output.txt
  updating:
    if: needs.determining-if-claude-md-should-be-formatted.outputs.claude_md_should_be_updated == 'true'
    name: Formatting CLAUDE.md
    needs:
    - determining-if-claude-md-should-be-formatted
    - concluding-claude-md-should-be-formatted
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install markdownlint-cli2
      run: npm install -g markdownlint-cli2
    - name: Fix CLAUDE.md formatting
      run: 'python scripts/claude_md.py --update
        '
    - id: check_changes
      name: Check for changes
      run: 'if git diff --quiet CLAUDE.md; then
          echo "has_changes=false" >> $GITHUB_OUTPUT;
          echo "No changes needed after auto-fix";
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT;
          echo "Changes detected after auto-fix";
          git diff CLAUDE.md;
        fi
        '
    - if: steps.check_changes.outputs.has_changes == 'true'
      name: Commit and push changes
      run: 'git config user.name "github-actions[bot]";
        git config user.email "github-actions[bot]@users.noreply.github.com";
        git add CLAUDE.md;
        git commit -m "Auto-fix CLAUDE.md formatting with markdownlint [skip ci]";
        git push;
        '
name: Ensuring CLAUDE.md is properly formatted
on:
  pull_request:
    paths:
    - CLAUDE.md
    - .github/workflows/claude.yml
  push:
    branches:
    - main
    paths:
    - CLAUDE.md
    - .github/workflows/claude.yml
  workflow_dispatch: null
