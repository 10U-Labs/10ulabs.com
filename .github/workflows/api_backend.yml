---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy API backend
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: config
        name: Extract configuration values
        run: |
          TF_SHARED_LOCALS=lib/terraform/modules/shared/locals.tf
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          AWS_REGION=$(grep 'aws_region' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' \
            src/bootstrap/locals.tf | \
            sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          RESOURCE_PREFIX=$(grep 'resource_prefix' \
            lib/terraform/modules/shared/locals.tf | \
            grep -v '\$' | cut -d'"' -f2)
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/api/backend/backend.tf | cut -d'"' -f2 | sed 's/>= //')
          ROLE_PREFIX="arn:aws:iam::${AWS_ACCOUNT_ID}:role"
          ROLE_NAME="${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          GITHUB_ACTIONS_ROLE_ARN="${ROLE_PREFIX}/${ROLE_NAME}"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.config.outputs.github_actions_role_arn }}
      - id: bootstrap
        name: Get bootstrap outputs
        run: |
          terraform -chdir=src/bootstrap init \
            -backend=true -input=false > /dev/null
          GITHUB_ACTIONS_ROLE_ARN=$(terraform -chdir=src/bootstrap \
            output -raw arn_for_github_actions_role)
          GITHUB_PAT_PARAMETER_NAME=$(terraform -chdir=src/bootstrap \
            output -raw ssm_parameter_name_for_github_pat)
          echo "github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "github_pat_parameter_name=$GITHUB_PAT_PARAMETER_NAME" >> $GITHUB_OUTPUT
      - name: Re-configure AWS credentials with bootstrap role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.bootstrap.outputs.github_actions_role_arn }}
      - if: |
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: |
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install \
            pylint mypy yamllint pytest boto3 boto3-stubs botocore \
            PyYAML types-PyYAML requests types-requests
      - if: |
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: disable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/api_backend.yml
      - name: Run pylint
        run: |
          for file in src/api/backend/lambdas/*.py; do
            python3 -m pylint "$file" \
              --fail-on=C,R,W \
              --fail-under=10.0
          done
          PYTHONPATH=lib/python python3 -m pylint test/api/backend/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run mypy
        run: |
          for file in src/api/backend/lambdas/*.py; do
            python3 -m mypy "$file"
          done
          MYPYPATH=lib/python python3 -m mypy test/api/backend/
      - name: Terraform Format Check
        run: cd src/api/backend && terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: cd src/api/backend && terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: cd src/api/backend && tflint --init && tflint
      - env:
          TF_VAR_recaptcha_secret_key: ${{ secrets.RECAPTCHA_SECRET_KEY }}
        name: Terraform Plan
        run: cd src/api/backend && terraform plan
      - env:
          SSM_PARAMETER_NAME_FOR_GITHUB_PAT: >-
            ${{ steps.bootstrap.outputs.github_pat_parameter_name }}
        name: Run unit tests
        run: |
          python3 -m pytest test/api/backend/pre_deployment/unit/ \
            --verbose --pythonwarnings=error
      - name: Run pre-deployment integration tests
        run: |
          python3 -m pytest test/api/backend/pre_deployment/integration/ \
            --verbose --pythonwarnings=error
      - env:
          TF_VAR_recaptcha_secret_key: ${{ secrets.RECAPTCHA_SECRET_KEY }}
        name: Terraform Apply
        run: cd src/api/backend && terraform apply -auto-approve
      - id: check_files
        name: Check if static files changed
        run: |
          set -e
          set -o pipefail
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE_COMMIT="${{ github.event.before }}"
          else
            BASE_COMMIT="HEAD^"
          fi
          git diff --name-only $BASE_COMMIT ${{ github.sha }} | \
            if grep -qE 'src/www/api/(index\.html|openapi\.json|404\.html)'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Get API domain from Terraform output
        run: |
          API_FQDN=$(cd src/api/backend && terraform output -raw api_domain_name)
          echo "API_FQDN=$API_FQDN" >> $GITHUB_ENV
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Invalidate CloudFront cache
        run: |
          python3 scripts/invalidate_cloudfront.py \
            --fqdn "${{ env.API_FQDN }}" \
            --region "${{ steps.config.outputs.aws_region }}" \
            --paths "/,/index.html,/openapi.json,/404.html"
      - env:
          PAT_PARAM: ${{ steps.bootstrap.outputs.github_pat_parameter_name }}
          REGION: ${{ steps.config.outputs.aws_region }}
        name: Fetch GitHub PAT from Parameter Store
        run: |
          GITHUB_PAT=$(aws ssm get-parameter \
            --name "$PAT_PARAM" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text \
            --region "$REGION")
          echo "GITHUB_PAT=$GITHUB_PAT" >> $GITHUB_ENV
      - env:
          SSM_PARAMETER_NAME_FOR_GITHUB_PAT: >-
            ${{ steps.bootstrap.outputs.github_pat_parameter_name }}
        name: Run post-deployment integration tests
        run: |
          python3 -m pytest test/api/backend/post_deployment/integration/ \
            --verbose --pythonwarnings=error
      - name: Run E2E tests
        run: |
          python3 -m pytest test/api/backend/post_deployment/e2e/ \
            --verbose --pythonwarnings=error
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.skip_descendants != 'true' &&
          !contains(github.event.head_commit.message, '[skip descendants]')
        name: Dispatch descendant workflows
        run: |
          SKIP_FLAG=""
          SKIP_INPUT="${{ github.event.inputs.skip_descendants }}"
          if [ "$SKIP_INPUT" = "true" ]; then SKIP_FLAG="--skip-descendants"; fi
          python3 scripts/dispatch_descendants.py \
            $SKIP_FLAG \
            --workflow api_backend \
            --repo ${{ github.repository }}
name: Ensuring API backend exists and is properly configured
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
      skip_descendants:
        default: false
        description: Skip dispatching descendant workflows
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
