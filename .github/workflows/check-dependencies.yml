---
name: Check workflow dependencies
on:
  workflow_call:
    inputs:
      workflow_name:
        description: Name of the workflow to check dependencies for
        required: true
        type: string
    outputs:
      can_proceed:
        description: Whether the workflow's dependencies are satisfied
        value: ${{ jobs.check.outputs.can_proceed }}
      blocking_workflow:
        description: Name of the blocking workflow if any
        value: ${{ jobs.check.outputs.blocking_workflow }}
jobs:
  check:
    name: Check dependencies for ${{ inputs.workflow_name }}
    outputs:
      blocking_workflow: ${{ steps.check.outputs.blocking_workflow }}
      can_proceed: ${{ steps.check.outputs.can_proceed }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install PyYAML
      - env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
        id: check
        name: Check workflow dependencies
        run: |
          python3 << 'PYTHON'
          import os
          import subprocess
          import sys
          sys.path.insert(0, 'lib')
          
          from workflow_ordering import parse_workflow_order, should_wait_for
          
          workflow_name = os.environ['WORKFLOW_NAME']
          order = parse_workflow_order('.github/workflow-order.yml')
          
          # Get list of recently completed workflow runs
          result = subprocess.run(
              ['gh', 'run', 'list', '--limit', '50', '--json', 'workflowName,status,conclusion'],
              capture_output=True,
              text=True
          )
          
          if result.returncode != 0:
              print(f"Failed to get workflow runs: {result.stderr}")
              # If we can't check, allow proceeding
              print("can_proceed=true", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              print("blocking_workflow=", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              sys.exit(0)
          
          import json
          runs = json.loads(result.stdout)
          
          # Find completed successful workflows from recent runs
          completed = set()
          for run in runs:
              if run['status'] == 'completed' and run['conclusion'] == 'success':
                  # Map workflow display name to key (simplified - assumes name matches)
                  completed.add(run['workflowName'].lower().replace(' ', '_'))
          
          # Check if this workflow can proceed
          blocking = should_wait_for(workflow_name, completed, order)
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              if blocking:
                  print(f"can_proceed=false", file=f)
                  print(f"blocking_workflow={blocking}", file=f)
              else:
                  print(f"can_proceed=true", file=f)
                  print(f"blocking_workflow=", file=f)
          PYTHON
