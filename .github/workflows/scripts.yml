  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install yamllint
        run: |
          python3 -m pip install \
            yamllint
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/scripts.yml
name: scripts
on:
  push:
    branches:
      - main
    paths:
      # src/ is deliberately absent: naming it would start every job here
      # on every push to a lambda.
      - .github/workflows/scripts.yml
      - lib/python/**
      # lib/terraform/common is parsed by lib/python/terraform_config, so a
      # change to it can break the parser whose tests run here.
      - lib/terraform/common/**
      - scripts/**
      - test/__init__.py
      - test/conftest.py
      - test/lib/__init__.py
      - test/lib/python/**
      - test/lib/terraform/__init__.py
      - test/scripts/**
  workflow_dispatch:
permissions:
  contents: read
