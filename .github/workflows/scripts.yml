---
concurrency:
  cancel-in-progress: true
  group: scripts-${{ github.ref }}
jobs:
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-no-comments
        run: |
          python3 -m pip install \
            assert-no-comments
      - name: Assert no comments
        run: >-
          assert-no-comments
          --annotate
          --verbose
          .github/workflows/scripts.yml
          scripts
          lib/python/boto_mocks
          lib/python/lambda_response
          lib/python/module_utils
          lib/python/naming_conventions
          lib/python/repo_utils
          lib/python/terraform_config
          lib/python/test_fixtures
          test/__init__.py
          test/conftest.py
          test/scripts
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-no-inline-directives
        run: |
          python3 -m pip install \
            assert-no-inline-directives
      - name: Assert no inline lint disables
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          .github/workflows/scripts.yml
          scripts
          lib/python/boto_mocks
          lib/python/lambda_response
          lib/python/module_utils
          lib/python/naming_conventions
          lib/python/repo_utils
          lib/python/terraform_config
          lib/python/test_fixtures
          test/__init__.py
          test/conftest.py
          test/scripts
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-no-linter-config-files
        run: |
          python3 -m pip install \
            assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          scripts
          lib/python/boto_mocks
          lib/python/lambda_response
          lib/python/module_utils
          lib/python/naming_conventions
          lib/python/repo_utils
          lib/python/terraform_config
          lib/python/test_fixtures
          test/scripts
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-one-assert-per-pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-one-assert-per-pytest
        run: |
          python3 -m pip install \
            assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          test/__init__.py
          test/conftest.py
          test/scripts
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-pytest-fixture-name-is-needed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-pytest-fixture-name-is-needed
        run: |
          python3 -m pip install \
            assert-pytest-fixture-name-is-needed
      - name: Assert pytest fixture name is needed
        run: >-
          assert-pytest-fixture-name-is-needed
          --verbose
          test/__init__.py
          test/conftest.py
          test/scripts
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
          lib/python/test_fixtures
  assert-python-definition-is-used:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert every definition is named outside its own package's tests
        uses: 10U-Labs/assert-python-definition-is-used@latest
        with:
          dont-search-in: test/lib/python/test_{package}
          search-in: lib/python scripts src test
          trees: lib/python
          verbose: "true"
  assert-python-definition-is-used-in-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert every definition in the tests is called
        uses: 10U-Labs/assert-python-definition-is-used@latest
        with:
          assume-used-decorated-with: pytest.fixture
          assume-used-matching: "test_*,Test*,pytest_*"
          search-in: test lib/python scripts src
          trees: >-
            test/__init__.py
            test/conftest.py
            test/scripts
            test/lib/__init__.py
            test/lib/python/__init__.py
            test/lib/python/test_boto_mocks
            test/lib/python/test_lambda_response
            test/lib/python/test_module_utils
            test/lib/python/test_naming_conventions
            test/lib/python/test_naming_conventions_helpers
            test/lib/python/test_repo_utils
            test/lib/python/test_terraform_config
            test/lib/python/test_test_fixtures
          verbose: "true"
  copy-paste-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            scripts/ \
            lib/python/boto_mocks \
            lib/python/lambda_response \
            lib/python/module_utils \
            lib/python/naming_conventions \
            lib/python/repo_utils \
            lib/python/terraform_config \
            lib/python/test_fixtures
  copy-paste-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            test/scripts \
            test/lib/python/test_boto_mocks \
            test/lib/python/test_lambda_response \
            test/lib/python/test_module_utils \
            test/lib/python/test_naming_conventions \
            test/lib/python/test_naming_conventions_helpers \
            test/lib/python/test_repo_utils \
            test/lib/python/test_terraform_config \
            test/lib/python/test_test_fixtures
  mypy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            mypy \
            pytest \
            requests \
            types-requests
      - name: Run mypy on source
        run: |
          MYPYPATH=lib/python:scripts python3 -m mypy \
            scripts/ \
            lib/python/boto_mocks \
            lib/python/lambda_response \
            lib/python/module_utils \
            lib/python/naming_conventions \
            lib/python/repo_utils \
            lib/python/terraform_config \
            lib/python/test_fixtures
  mypy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            mypy \
            pytest \
            requests \
            types-requests
      - name: Run mypy on tests
        run: |
          MYPYPATH=lib/python:scripts python3 -m mypy \
            test/__init__.py \
            test/conftest.py \
            test/scripts \
            test/lib/__init__.py \
            test/lib/python/__init__.py \
            test/lib/python/test_boto_mocks \
            test/lib/python/test_lambda_response \
            test/lib/python/test_module_utils \
            test/lib/python/test_naming_conventions \
            test/lib/python/test_naming_conventions_helpers \
            test/lib/python/test_repo_utils \
            test/lib/python/test_terraform_config \
            test/lib/python/test_test_fixtures
  pylint-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pylint \
            pytest \
            requests
      - name: Run pylint on source
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            scripts/ \
            lib/python/boto_mocks \
            lib/python/lambda_response \
            lib/python/module_utils \
            lib/python/naming_conventions \
            lib/python/repo_utils \
            lib/python/terraform_config \
            lib/python/test_fixtures \
            --disable=missing-module-docstring \
            --disable=missing-class-docstring \
            --disable=missing-function-docstring \
            --fail-on=C,R,W --fail-under=10.0
  pylint-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pylint \
            pytest \
            requests
      - name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python:scripts python3 -m pylint \
            test/__init__.py \
            test/conftest.py \
            test/scripts \
            test/lib/__init__.py \
            test/lib/python/__init__.py \
            test/lib/python/test_boto_mocks \
            test/lib/python/test_lambda_response \
            test/lib/python/test_module_utils \
            test/lib/python/test_naming_conventions \
            test/lib/python/test_naming_conventions_helpers \
            test/lib/python/test_repo_utils \
            test/lib/python/test_terraform_config \
            test/lib/python/test_test_fixtures \
            --disable=missing-module-docstring \
            --disable=missing-class-docstring \
            --disable=missing-function-docstring \
            --recursive=y --fail-on=C,R,W --fail-under=10.0
  test-boto-mocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run boto_mocks tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_boto_mocks/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=boto_mocks \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-invalidate-cloudfront:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            pytest \
            pytest-cov
      - name: Run unit tests with a full coverage gate
        run: |
          BASE=test/scripts/invalidate_cloudfront
          PYTHONPATH=lib/python:scripts python3 -m pytest \
            $BASE/unit/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=invalidate_cloudfront \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-lambda-response:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run lambda_response tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_lambda_response/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=lambda_response \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-module-utils:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run module_utils tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_module_utils/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=module_utils \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-naming-conventions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run naming_conventions tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_naming_conventions/ \
            test/lib/python/test_naming_conventions_helpers/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=naming_conventions \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-repo-utils:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run repo_utils tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_repo_utils/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=repo_utils \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-terraform-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run terraform_config tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_terraform_config/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=terraform_config \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-test-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run test_fixtures tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_test_fixtures/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=test_fixtures \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install yamllint
        run: |
          python3 -m pip install \
            yamllint
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/scripts.yml
name: scripts
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scripts.yml
      - lib/python/boto_mocks/**
      - lib/python/lambda_response/**
      - lib/python/module_utils/**
      - lib/python/naming_conventions/**
      - lib/python/repo_utils/**
      - lib/python/terraform_config/**
      - lib/python/test_fixtures/**
      - scripts/**
      - test/__init__.py
      - test/conftest.py
      - test/lib/__init__.py
      - test/lib/python/__init__.py
      - test/lib/python/test_boto_mocks/**
      - test/lib/python/test_lambda_response/**
      - test/lib/python/test_module_utils/**
      - test/lib/python/test_naming_conventions/**
      - test/lib/python/test_naming_conventions_helpers/**
      - test/lib/python/test_repo_utils/**
      - test/lib/python/test_terraform_config/**
      - test/lib/python/test_test_fixtures/**
      - test/scripts/**
  workflow_dispatch:
permissions:
  contents: read
