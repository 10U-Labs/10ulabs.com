---
# Non-deploying Python
#
# scripts/ holds the one program the deploys shell out to,
# invalidate_cloudfront.py. It deploys nothing of its own, so it has no
# workflow of its own and this file is what reads it and the one suite that
# covers it. Every check here is its own job, so a red check reports
# alongside the others rather than hiding behind the first failing step.
concurrency:
  cancel-in-progress: true
  group: scripts-${{ github.ref }}
jobs:
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-no-inline-directives
        run: |
          python3 -m pip install \
            assert-no-inline-directives
      - name: Assert no inline lint disables
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          .github/workflows/scripts.yml
          scripts
          test/__init__.py
          test/conftest.py
          test/scripts
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-no-linter-config-files
        run: |
          python3 -m pip install \
            assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          scripts
          test/scripts
  assert-one-assert-per-pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-one-assert-per-pytest
        run: |
          python3 -m pip install \
            assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          test/__init__.py
          test/conftest.py
          test/scripts
  assert-pytest-fixture-name-is-needed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-pytest-fixture-name-is-needed
        run: |
          python3 -m pip install \
            assert-pytest-fixture-name-is-needed
      - name: Assert pytest fixture name is needed
        run: >-
          assert-pytest-fixture-name-is-needed
          --verbose
          test/__init__.py
          test/conftest.py
          test/scripts
  copy-paste-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jscpd
        run: npm install -g jscpd@4.0.5
      - name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            scripts/
  copy-paste-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jscpd
        run: npm install -g jscpd@4.0.5
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            test/scripts
  mypy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            mypy \
            paramiko \
            pylint \
            pytest \
            'python-hcl2<8' \
            PyYAML \
            requests \
            types-PyYAML \
            types-requests
      - name: Run mypy on source
        run: |
          MYPYPATH=scripts python3 -m mypy scripts/
  mypy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            mypy \
            paramiko \
            pylint \
            pytest \
            'python-hcl2<8' \
            PyYAML \
            requests \
            types-PyYAML \
            types-requests
      - name: Run mypy on tests
        run: |
          MYPYPATH=lib/python:scripts python3 -m mypy \
            test/__init__.py \
            test/conftest.py \
            test/scripts
  pylint-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            mypy \
            paramiko \
            pylint \
            pytest \
            'python-hcl2<8' \
            PyYAML \
            requests \
            types-PyYAML \
            types-requests
      - name: Run pylint on source
        run: |
          python3 -m pylint \
            scripts/ --fail-on=C,R,W --fail-under=10.0
  pylint-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            mypy \
            paramiko \
            pylint \
            pytest \
            'python-hcl2<8' \
            PyYAML \
            requests \
            types-PyYAML \
            types-requests
      - name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python:scripts python3 -m pylint \
            test/__init__.py \
            test/conftest.py \
            test/scripts \
            --recursive=y --fail-on=C,R,W --fail-under=10.0
  test-invalidate-cloudfront:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            paramiko \
            pytest \
            pytest-cov \
            'python-hcl2<8' \
            PyYAML \
            requests \
            types-PyYAML \
            types-requests
      - name: Run unit tests with a full coverage gate
        run: |
          BASE=test/scripts/invalidate_cloudfront
          PYTHONPATH=lib/python:scripts python3 -m pytest \
            $BASE/unit/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=invalidate_cloudfront \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install yamllint
        run: |
          python3 -m pip install \
            yamllint
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/scripts.yml
name: scripts
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scripts.yml
      - scripts/**
      - test/__init__.py
      - test/conftest.py
      - test/scripts/**
  workflow_dispatch:
permissions:
  contents: read
