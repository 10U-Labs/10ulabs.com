name: Ensuring CloudTrail and domain name exist and are properly configured
on:
  push:
    branches:
      - main
    paths:
      - 'src/cloudtrail_and_domain_name/**'
      - 'test/cloudtrail_and_domain_name/**'
      - 'config/cloudtrail_and_domain_name.json'
      - 'app.py'
      - 'cdk.json'
      - 'requirements-cdk.txt'
      - '.github/workflows/cloudtrail_and_domain_name.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (skip deployment, just test)'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types:
      - bilateral_authorizations_between_aws_and_github_have_been_established
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read
jobs:
  performing-static-analysis:
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - name: DRY RUN - Skip static analysis
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would run pylint and mypy static analysis"
      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4
      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linting dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: pip install pylint mypy yamllint
      - name: Install project dependencies for linting
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: pip install -r requirements-cdk.txt
      - name: Linting YAML files
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Running yamllint on workflow files..."
          yamllint .github/workflows/cloudtrail_and_domain_name.yml
      - name: Performing lightweight static analysis
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pylint src/cloudtrail_and_domain_name/stack.py src/cloudtrail_and_domain_name/lambda/handler.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Performing heavyweight static analysis
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          MYPYPATH=stubs python -m mypy src/cloudtrail_and_domain_name
  unit-testing-code:
    name: Unit testing code
    runs-on: ubuntu-latest
    needs: performing-static-analysis
    steps:
      - name: DRY RUN - Skip unit tests
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would run unit tests with pytest"
      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4
      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js (required by aws-cdk-lib/jsii)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pip install pytest
          pip install -r requirements-cdk.txt
      - name: Run unit tests
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pytest test/cloudtrail_and_domain_name/pre_deployment/unit/ -v
  integration-testing-code:
    name: Integration testing code
    runs-on: ubuntu-latest
    needs: unit-testing-code
    steps:
      - name: DRY RUN - Skip pre-deployment integration tests
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would run pre-deployment integration tests"
      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4
      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js (required by aws-cdk-lib/jsii)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pip install pytest
          pip install -r requirements-cdk.txt
      - name: Run pre-deployment integration tests
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pytest test/cloudtrail_and_domain_name/pre_deployment/integration/ -v
  building-artifacts:
    name: Building artifacts
    runs-on: ubuntu-latest
    needs: integration-testing-code
    steps:
      - name: DRY RUN - Skip CDK synthesis
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would synthesize AWS CDK domain stack"
      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4
      - name: Load configuration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' config/cloudtrail_and_domain_name.json)
          REGION=$(jq -r '.aws_region' config/cloudtrail_and_domain_name.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Set up Python & Node
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: ${{ github.event.inputs.dry_run != 'true' }}
        with:
          node-version: '20'
      - name: Install CDK
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm install -g aws-cdk
      - name: Install dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: pip install -r requirements-cdk.txt
      - name: Synthesize domain stack
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: cdk synth TenULabsDomainName
  deploying-artifacts:
    name: Deploying artifacts
    needs: building-artifacts
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.dry_run != 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || (
        !contains(github.event.head_commit.message, '[skip-deploy]') &&
        !contains(github.event.head_commit.message, '[skip deploy]')
      ))
    steps:
      - name: DRY RUN - Skip deployment
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would deploy domain infrastructure with CDK"
      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4
      - name: Load configuration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' config/cloudtrail_and_domain_name.json)
          REGION=$(jq -r '.aws_region' config/cloudtrail_and_domain_name.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CDK
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm install -g aws-cdk
      - name: Install dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: pip install -r requirements-cdk.txt
      - name: CDK Bootstrap (if needed)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cdk bootstrap aws://${{ steps.config.outputs.account_id }}/${{ steps.config.outputs.region }}
      - name: CDK Diff
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: cdk diff TenULabsDomainName
      - name: CDK Deploy
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: deploy
        run: |
          cdk deploy TenULabsDomainName \
            --require-approval never \
            --outputs-file domain-outputs.json 2>&1 | tee /tmp/cdk_deploy.log || true
          if grep -qE "(failed|ROLLBACK_COMPLETE|CREATE_FAILED)" /tmp/cdk_deploy.log; then
            echo "deployment_failed=true" >> $GITHUB_OUTPUT
          else
            echo "deployment_failed=false" >> $GITHUB_OUTPUT
          fi
      - name: Fetch CloudWatch Logs
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Fetching CloudWatch logs from Lambda execution..."
          echo "Searching for TenULabsDomainName DomainRegistration Lambda log groups..."
          LOG_GROUPS=$(aws logs describe-log-groups \
            --log-group-name-prefix "/aws/lambda/TenULabsDomainName" \
            --query "logGroups[?contains(logGroupName, 'DomainRegistration')].logGroupName" \
            --output text 2>/dev/null || echo "")
          if [ -z "$LOG_GROUPS" ]; then
            echo "WARNING: No DomainRegistration Lambda log groups found"
            echo "This may mean the Lambda was not created, or log group naming changed"
            echo "Listing all TenULabsDomainName log groups for debugging:"
            aws logs describe-log-groups \
              --log-group-name-prefix "/aws/lambda/TenULabsDomainName" \
              --query 'logGroups[*].logGroupName' \
              --output text 2>/dev/null || echo "No log groups found"
            exit 0
          fi
          LATEST_LOG_GROUP=""
          LATEST_TIMESTAMP=0
          for LOG_GROUP in $LOG_GROUPS; do
            STREAM_INFO=$(aws logs describe-log-streams \
              --log-group-name "$LOG_GROUP" \
              --order-by LastEventTime \
              --descending \
              --max-items 1 \
              --query 'logStreams[0].[logStreamName,creationTime]' \
              --output text 2>/dev/null || echo "")
            if [ -z "$STREAM_INFO" ]; then
              continue
            fi
            STREAM_NAME=$(echo "$STREAM_INFO" | awk '{print $1}')
            TIMESTAMP=$(echo "$STREAM_INFO" | awk '{print $2}')
            if [ -z "$TIMESTAMP" ] || ! [[ "$TIMESTAMP" =~ ^[0-9]+$ ]]; then
              continue
            fi
            if [ "$TIMESTAMP" -gt "$LATEST_TIMESTAMP" ]; then
              LATEST_TIMESTAMP=$TIMESTAMP
              LATEST_LOG_GROUP="$LOG_GROUP"
              LATEST_STREAM="$STREAM_NAME"
            fi
          done
          if [ -z "$LATEST_LOG_GROUP" ]; then
            echo "WARNING: Could not find any log groups with events"
            exit 0
          fi
          echo ""
          echo "Most recent log group: $LATEST_LOG_GROUP"
          echo "Latest log stream: $LATEST_STREAM"
          echo ""
          echo "=========================================="
          echo "   CloudWatch Logs from Lambda Execution"
          echo "=========================================="
          aws logs get-log-events \
            --log-group-name "$LATEST_LOG_GROUP" \
            --log-stream-name "$LATEST_STREAM" \
            --limit 100 \
            --query 'events[*].message' \
            --output text 2>/dev/null || echo "Could not fetch logs"
          echo "=========================================="
          echo ""
      - name: Fail if deployment failed
        if: ${{ github.event.inputs.dry_run != 'true' && steps.deploy.outputs.deployment_failed == 'true' }}
        run: |
          echo "CDK deployment failed. See logs above for details."
          exit 1
      - name: Display outputs
        if: ${{ github.event.inputs.dry_run != 'true' && steps.deploy.outputs.deployment_failed != 'true' }}
        run: |
          echo "Domain infrastructure deployed successfully"
          echo ""
          echo "Stack Outputs:"
          cat domain-outputs.json | jq '.'
  unit-testing-deployed-infrastructure:
    name: Unit testing deployed infrastructure
    runs-on: ubuntu-latest
    needs: deploying-artifacts
    if: ${{ needs.deploying-artifacts.result == 'success' }}
    steps:
      - name: DRY RUN - Skip unit testing deployed infrastructure
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would test newly deployed domain infrastructure with Cinc Auditor"
      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4
      - name: Load configuration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' config/cloudtrail_and_domain_name.json)
          REGION=$(jq -r '.aws_region' config/cloudtrail_and_domain_name.json)
          DOMAIN_NAME=$(jq -r '.domain_name' config/cloudtrail_and_domain_name.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "cloudtrail_and_domain_name=$DOMAIN_NAME" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Install Cinc Auditor
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-auditor
      - name: Run unit tests on deployed infrastructure
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Running unit tests on deployed domain infrastructure"
          cinc-auditor exec test/cloudtrail_and_domain_name/post_deployment/unit \
            --input cloudtrail_and_domain_name="${{ steps.config.outputs.cloudtrail_and_domain_name }}" \
            --reporter cli
  integration-testing-infrastructure:
    name: Integration testing infrastructure
    runs-on: ubuntu-latest
    needs: unit-testing-deployed-infrastructure
    steps:
      - name: DRY RUN - Skip integration tests
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would run integration tests"
      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4
      - name: Load configuration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' config/cloudtrail_and_domain_name.json)
          REGION=$(jq -r '.aws_region' config/cloudtrail_and_domain_name.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pip install pytest boto3
      - name: Run integration tests
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pytest test/cloudtrail_and_domain_name/post_deployment/integration/ -v
  e2e-testing-infrastructure:
    name: E2E testing infrastructure
    runs-on: ubuntu-latest
    needs: integration-testing-infrastructure
    steps:
      - name: DRY RUN - Skip E2E tests
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would run E2E tests"
      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4
      - name: Load configuration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' config/cloudtrail_and_domain_name.json)
          REGION=$(jq -r '.aws_region' config/cloudtrail_and_domain_name.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pip install pytest boto3 dnspython
      - name: Run E2E tests
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pytest test/cloudtrail_and_domain_name/post_deployment/e2e/ -v
  determine-readme-update:
    name: Determining if README.md should be updated
    runs-on: ubuntu-latest
    needs: e2e-testing-infrastructure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      should_update: ${{ steps.check.outputs.should_update }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Load configuration
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' config/cloudtrail_and_domain_name.json)
          REGION=$(jq -r '.aws_region' config/cloudtrail_and_domain_name.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Check if README needs update
        id: check
        run: |
          python src/auth_between_aws_and_github/auth_between_aws_and_github.py readme \
            --module cloudtrail_and_domain_name \
            --check \
            --output-file "$GITHUB_OUTPUT"
  conclude-readme-skip:
    name: Concluding README.md should not be updated
    runs-on: ubuntu-latest
    needs: determine-readme-update
    if: needs.determine-readme-update.outputs.should_update != 'true'
    steps:
      - run: 'true'
  conclude-readme-update:
    name: Concluding README.md should be updated
    runs-on: ubuntu-latest
    needs: determine-readme-update
    if: needs.determine-readme-update.outputs.should_update == 'true'
    steps:
      - run: 'true'
  update-readme:
    name: Updating README.md
    runs-on: ubuntu-latest
    needs: conclude-readme-update
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load configuration
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' config/cloudtrail_and_domain_name.json)
          REGION=$(jq -r '.aws_region' config/cloudtrail_and_domain_name.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Update README with Bedrock
        run: |
          python src/auth_between_aws_and_github/auth_between_aws_and_github.py readme \
            --module cloudtrail_and_domain_name \
            --bedrock-model-id anthropic.claude-3-5-sonnet-20241022-v2:0
      - name: Commit and push README if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if git diff --quiet src/cloudtrail_and_domain_name/README.md; then
            echo "No changes to README.md"
          else
            git add src/cloudtrail_and_domain_name/README.md
            git commit -m "Update cloudtrail_and_domain_name README.md [skip ci]"
            git push
          fi
