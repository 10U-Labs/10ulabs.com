concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  conclude-readme-skip:
    if: needs.determine-readme-update.outputs.readme_should_be_updated != 'true'
    name: Concluding README.md should not be updated
    needs: determine-readme-update
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  conclude-readme-update:
    if: needs.determine-readme-update.outputs.readme_should_be_updated == 'true'
    name: Concluding README.md should be updated
    needs: determine-readme-update
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  ensure-infrastructure:
    if: |
      github.event.inputs.dry_run != 'true' &&
      github.ref == 'refs/heads/main'
    name: Ensuring infrastructure is in desired state
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip deployment
        run: echo "DRY RUN - Would deploy domain infrastructure with CDK"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - id: config
        if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' cloudtrail_and_domain_name/config.json)
          REGION=$(jq -r '.aws_region' cloudtrail_and_domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install CDK
        run: npm install -g aws-cdk
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install dependencies
        run: pip install -r cloudtrail_and_domain_name/requirements.txt
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: CDK Bootstrap (if needed)
        run: |
          cd cloudtrail_and_domain_name && cdk bootstrap aws://${{ steps.config.outputs.account_id }}/${{ steps.config.outputs.region }}
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: CDK Diff
        run: cd cloudtrail_and_domain_name && cdk diff TenULabsDomainName
      - id: deploy
        if: ${{ github.event.inputs.dry_run != 'true' }}
        name: CDK Deploy
        run: |
          cd cloudtrail_and_domain_name && cdk deploy TenULabsDomainName \
            --require-approval never \
            --outputs-file ../../domain-outputs.json 2>&1 | tee /tmp/cdk_deploy.log || true
          if grep -qE "(failed|ROLLBACK_COMPLETE|CREATE_FAILED)" /tmp/cdk_deploy.log; then
            echo "deployment_failed=true" >> $GITHUB_OUTPUT
          else
            echo "deployment_failed=false" >> $GITHUB_OUTPUT
          fi
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Fetch CloudWatch Logs
        run: |
          echo "Fetching CloudWatch logs from Lambda execution..."
          echo "Searching for TenULabsDomainName DomainRegistration Lambda log groups..."
          LOG_GROUPS=$(aws logs describe-log-groups \
            --log-group-name-prefix "/aws/lambda/TenULabsDomainName" \
            --query "logGroups[?contains(logGroupName, 'DomainRegistration')].logGroupName" \
            --output text 2>/dev/null || echo "")
          if [ -z "$LOG_GROUPS" ]; then
            echo "WARNING: No DomainRegistration Lambda log groups found"
            echo "This may mean the Lambda was not created, or log group naming changed"
            echo "Listing all TenULabsDomainName log groups for debugging:"
            aws logs describe-log-groups \
              --log-group-name-prefix "/aws/lambda/TenULabsDomainName" \
              --query 'logGroups[*].logGroupName' \
              --output text 2>/dev/null || echo "No log groups found"
            exit 0
          fi
          LATEST_LOG_GROUP=""
          LATEST_TIMESTAMP=0
          for LOG_GROUP in $LOG_GROUPS; do
            STREAM_INFO=$(aws logs describe-log-streams \
              --log-group-name "$LOG_GROUP" \
              --order-by LastEventTime \
              --descending \
              --max-items 1 \
              --query 'logStreams[0].[logStreamName,creationTime]' \
              --output text 2>/dev/null || echo "")
            if [ -z "$STREAM_INFO" ]; then
              continue
            fi
            STREAM_NAME=$(echo "$STREAM_INFO" | awk '{print $1}')
            TIMESTAMP=$(echo "$STREAM_INFO" | awk '{print $2}')
            if [ -z "$TIMESTAMP" ] || ! [[ "$TIMESTAMP" =~ ^[0-9]+$ ]]; then
              continue
            fi
            if [ "$TIMESTAMP" -gt "$LATEST_TIMESTAMP" ]; then
              LATEST_TIMESTAMP=$TIMESTAMP
              LATEST_LOG_GROUP="$LOG_GROUP"
              LATEST_STREAM="$STREAM_NAME"
            fi
          done
          if [ -z "$LATEST_LOG_GROUP" ]; then
            echo "WARNING: Could not find any log groups with events"
            exit 0
          fi
          echo ""
          echo "Most recent log group: $LATEST_LOG_GROUP"
          echo "Latest log stream: $LATEST_STREAM"
          echo ""
          echo "=========================================="
          echo "   CloudWatch Logs from Lambda Execution"
          echo "=========================================="
          aws logs get-log-events \
            --log-group-name "$LATEST_LOG_GROUP" \
            --log-stream-name "$LATEST_STREAM" \
            --limit 100 \
            --query 'events[*].message' \
            --output text 2>/dev/null || echo "Could not fetch logs"
          echo "=========================================="
          echo ""
      - if: ${{ github.event.inputs.dry_run != 'true' && steps.deploy.outputs.deployment_failed == 'true' }}
        name: Fail if deployment failed
        run: |
          echo "CDK deployment failed. See logs above for details."
          exit 1
      - if: ${{ github.event.inputs.dry_run != 'true' && steps.deploy.outputs.deployment_failed != 'true' }}
        name: Display outputs
        run: |
          echo "Domain infrastructure deployed successfully"
          echo ""
          echo "Stack Outputs:"
          cat domain-outputs.json | jq '.'
  determine-readme-update:
    name: Determining if README.md should be updated
    needs: e2e-tests
    outputs:
      readme_should_be_updated: ${{ steps.check.outputs.readme_should_be_updated }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' cloudtrail_and_domain_name/config.json)
          REGION=$(jq -r '.aws_region' cloudtrail_and_domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - id: check
        name: Check if README needs update
        run: |
          python cloudtrail_and_domain_name/readme.py \
            --check \
            --aws-region "${{ steps.config.outputs.region }}" \
            --output-file "$GITHUB_OUTPUT"
  e2e-tests:
    name: E2E testing
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip E2E tests
        run: echo "DRY RUN - Would run E2E tests"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - id: config
        if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' cloudtrail_and_domain_name/config.json)
          REGION=$(jq -r '.aws_region' cloudtrail_and_domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install dependencies
        run: |
          pip install pytest boto3 dnspython
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run E2E tests
        run: |
          pytest cloudtrail_and_domain_name/test/test_e2e.py -v
  integration-tests:
    name: Integration testing
    needs: ensure-infrastructure
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip integration tests
        run: echo "DRY RUN - Would run integration tests with pytest"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - id: config
        if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' cloudtrail_and_domain_name/config.json)
          REGION=$(jq -r '.aws_region' cloudtrail_and_domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install Python dependencies
        run: |
          pip install pytest boto3
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run pytest integration tests
        run: |
          pytest cloudtrail_and_domain_name/test/test_integration.py -v
  static-analysis:
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip static analysis
        run: echo "DRY RUN - Would run pylint and mypy static analysis"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install linting dependencies
        run: |
          pip install pylint mypy yamllint
          npm install -g markdownlint-cli2
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install project dependencies for linting
        run: pip install -r cloudtrail_and_domain_name/requirements.txt
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Linting YAML files
        run: |
          echo "Running yamllint on workflow files..."
          yamllint --config-data '{extends: default, rules: {line-length: {max: 200, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}}}' .github/workflows/cloudtrail_and_domain_name.yml
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Linting Markdown documentation
        run: |
          if [ -f cloudtrail_and_domain_name/README.md ]; then
            echo "Linting README.md..."
            markdownlint-cli2 cloudtrail_and_domain_name/README.md
          else
            echo "No README.md found, skipping markdown linting"
          fi
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Linting Python files
        run: |
          pylint cloudtrail_and_domain_name/stack.py cloudtrail_and_domain_name/lambda/handler.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Static type checking Python files with mypy
        run: |
          python -m mypy cloudtrail_and_domain_name
  unit-tests:
    name: Unit testing
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip unit tests
        run: echo "DRY RUN - Would run unit tests with pytest"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Node.js (required by aws-cdk-lib/jsii)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install Python dependencies
        run: |
          pip install pytest
          pip install -r cloudtrail_and_domain_name/requirements.txt
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run unit tests
        run: |
          pytest cloudtrail_and_domain_name/test/test_unit.py -v
  update-readme:
    name: Updating README.md
    needs: conclude-readme-update
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' cloudtrail_and_domain_name/config.json)
          REGION=$(jq -r '.aws_region' cloudtrail_and_domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - name: Update README with Bedrock
        run: |
          python cloudtrail_and_domain_name/readme.py \
            --update \
            --aws-region "${{ steps.config.outputs.region }}"
      - name: Commit and push README if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add cloudtrail_and_domain_name/README.md
          if git diff --cached --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "Update cloudtrail_and_domain_name README.md [skip ci]"
            git push
          fi
name: Ensuring CloudTrail and domain name exist and are properly configured
on:
  push:
    branches:
      - main
    paths:
      - 'cloudtrail_and_domain_name/**'
      - '.github/workflows/cloudtrail_and_domain_name.yml'
  repository_dispatch:
    types:
      - bilateral_authorizations_between_aws_and_github_have_been_established
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: 'Dry run mode (skip deployment, just test)'
        required: false
        type: boolean
permissions:
  contents: read
  id-token: write
