---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy API shared routing
    runs-on: >-
      ${{ ( vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - id: terraform
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Extract Terraform version
        run: |
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/api/shared/routing/backend.tf | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> "$GITHUB_OUTPUT"
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - name: Terraform Format Check
        run: cd src/api/shared/routing && terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: cd src/api/shared/routing && terraform init
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: cd src/api/shared/routing && tflint --init && tflint
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install yamllint
        run: python3 -m pip install yamllint
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/api_shared_routing.yml
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install pylint
        run: python3 -m pip install pylint
      - name: Run pylint on source code
        run: |
          for file in src/api/shared/routing/lambdas/*.py; do
            python3 -m pylint "$file" \
              --fail-on=C,R,W \
              --fail-under=10.0
          done
      - name: Run pylint on test code
        run: |
          PYTHONPATH=lib/python python3 -m pylint test/api/shared/routing/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install mypy
        run: python3 -m pip install mypy boto3-stubs types-requests types-PyYAML
      - name: Run mypy on source code
        run: |
          for file in src/api/shared/routing/lambdas/*.py; do
            python3 -m mypy "$file"
          done
      - name: Run mypy on test code
        run: MYPYPATH=lib/python python3 -m mypy test/api/shared/routing/
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install jscpd
        run: npm install -g jscpd
      - name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ src/api/shared/routing/lambdas/
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install pytest dependencies
        run: >-
          python3 -m pip install pytest pytest-dependency boto3 botocore
          PyYAML requests
      - name: Run unit tests
        run: |
          python3 -m pytest \
            test/api/shared/routing/pre_deployment/unit/ \
            --verbose --pythonwarnings=error
      - name: Run pre-deployment integration tests
        run: |
          python3 -m pytest \
            test/api/shared/routing/pre_deployment/integration/ \
            --capture=no --verbose --pythonwarnings=error
      - env:
          TF_VAR_recaptcha_secret_key: ${{ secrets.RECAPTCHA_SECRET_KEY }}
        name: Terraform Apply
        run: cd src/api/shared/routing && terraform apply -auto-approve
      - id: check_files
        name: Check if static files changed
        run: |
          set -e
          set -o pipefail
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE_COMMIT="${{ github.event.before }}"
          else
            BASE_COMMIT="HEAD^"
          fi
          API_PATTERN='src/www/api/(index\.html|openapi\.json|404\.html)'
          git diff --name-only $BASE_COMMIT ${{ github.sha }} | \
            if grep -qE "$API_PATTERN"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Get API domain from Terraform output
        run: |
          API_FQDN=$(cd src/api/shared/routing && \
            terraform output -raw api_domain_name)
          echo "API_FQDN=$API_FQDN" >> "$GITHUB_ENV"
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Invalidate CloudFront cache
        run: |
          python3 scripts/invalidate_cloudfront.py \
            --fqdn "${{ env.API_FQDN }}" \
            --region "${{ vars.AWS_REGION }}" \
            --paths "/,/index.html,/openapi.json,/404.html"
      - name: Run post-deployment integration tests
        run: |
          python3 -m pytest \
            test/api/shared/routing/post_deployment/integration/ \
            --verbose --pythonwarnings=error
      - name: Run E2E tests
        run: |
          python3 -m pytest \
            test/api/shared/routing/post_deployment/e2e/ \
            --verbose --pythonwarnings=error
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (
          github.event.inputs.trigger_descendants == 'true' ||
           contains(github.event.head_commit.message,
           '[trigger descendants]'))
        name: Dispatch descendant workflows
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.trigger_descendants }}" = "true" ]; then
            FLAGS="$FLAGS --trigger-descendants"
          fi
          INV_CF="${{ github.event.inputs.invalidate_cloudfront }}"
          if [ "$INV_CF" = "true" ]; then
            FLAGS="$FLAGS --invalidate-cloudfront"
          fi
          python3 src/workflowctl/workflowctl.py dispatch-descendant-workflows \
            --workflow api_shared_routing \
            --repo ${{ github.repository }} \
            $FLAGS
name: Ensuring API shared routing exists and is properly configured
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      trigger_descendants:
        default: false
        description: Trigger descendant workflows after this workflow completes
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
