---
# Workflow Controller
#
# This workflow responds to push events on main, calculates which root workflow
# needs to run based on changed files, and dispatches it (fire-and-forget).
# Descendant workflows are triggered via dispatch_descendants.py script.
concurrency:
  cancel-in-progress: false
  group: workflowctl-${{ github.ref }}
jobs:
  orchestrate:
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: >-
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    name: Orchestrating workflows
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate required files
        run: |
          echo "Validating required files exist..."
          if [ ! -f "etc/workflow-dependencies.json" ]; then
            echo "Error: etc/workflow-dependencies.json not found"
            exit 1
          fi
          if [ ! -f "src/workflowctl/workflowctl.py" ]; then
            echo "Error: src/workflowctl/workflowctl.py not found"
            exit 1
          fi
          echo "All required files present"
      - id: files
        name: Get changed files
        run: |
          python3 src/workflowctl/workflowctl.py get-changed-files \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install dependencies
        run: |
          echo "Installing Python dependencies..."
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            boto3==1.35.* \
            mypy==1.13.* \
            pylint==3.3.* \
            pytest==8.3.* \
            pyyaml==6.0.* \
            types-PyYAML==6.0.* \
            yamllint==1.35.*
          echo "Dependencies installed successfully"
      - id: check-sa
        name: Check if static analysis should run
        run: |
          python3 src/workflowctl/workflowctl.py should-run \
            --check static-analysis \
            --changed "${{ steps.files.outputs.changed }}" >> "$GITHUB_OUTPUT"
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/workflowctl.yml
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Linting JSON files
        run: jsonlint -q etc/workflow-dependencies.json
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Run pylint
        run: |
          python3 -m pylint src/workflowctl/*.py \
            --fail-on=C,R,W --fail-under=10.0
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Run mypy
        run: python3 -m mypy src/workflowctl/*.py
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            src/workflowctl/
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            test/conftest.py test/workflowctl/
      - id: check-ut
        name: Check if unit tests should run
        run: |
          python3 src/workflowctl/workflowctl.py should-run \
            --check unit-tests \
            --changed "${{ steps.files.outputs.changed }}" >> "$GITHUB_OUTPUT"
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-ut.outputs.should_run == 'true'
        name: Run unit tests
        run: |
          echo "Running unit tests..."
          python3 -m pytest \
            test/workflowctl/ \
            --verbose --pythonwarnings=error
          echo "Unit tests completed"
      - id: running
        name: Get running workflows
        run: |
          echo "Getting currently running workflows..."
          RUNNING=$(python3 src/workflowctl/workflowctl.py get-running \
            --repo ${{ github.repository }} \
            --graph etc/workflow-dependencies.json)
          echo "Running workflows: $RUNNING"
          echo "workflows=$RUNNING" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Compute root workflows
        run: |
          echo "Computing root workflows..."
          GRAPH="etc/workflow-dependencies.json"
          START_FROM="${{ inputs.start_from }}"
          if [ -n "$START_FROM" ]; then
            echo "Manual trigger: starting from '$START_FROM'"
            # Support comma-separated workflows (trim spaces, newlines)
            SED_TRIM='s/^[[:space:]]*//;s/[[:space:]]*$//'
            ROOTS=$(echo "$START_FROM" | tr ',' '\n' | sed "$SED_TRIM")
          else
            CHANGED="${{ steps.files.outputs.changed }}"
            RUNNING='${{ steps.running.outputs.workflows }}'
            echo "Changed files for workflow computation:"
            echo "$CHANGED"
            echo "Running workflows to merge with: $RUNNING"
            # Get level-1 workflows (independent roots), merge with running
            JQ='[.[] | select(.level == 1) | .name] | join("\n")'
            ROOTS=$(echo "$CHANGED" | \
              python3 src/workflowctl/workflowctl.py compute-roots \
              --graph $GRAPH --levels --indexed \
              --running "$RUNNING" | jq -r "$JQ" || echo "")
          fi
          echo "Root workflows computed:"
          echo "$ROOTS"
          # Use a more secure EOF marker
          EOF_MARKER=$(openssl rand -hex 8)
          {
            echo "root_workflows<<$EOF_MARKER"
            echo "$ROOTS"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.root_workflows == ''
        name: No workflows to dispatch
        run: echo "No workflow-related files changed or no workflows computed"
      - if: >-
          steps.plan.outputs.root_workflows != '' &&
          (inputs.dry_run == true ||
           contains(github.event.head_commit.message, '[dry run]'))
        name: Dry run
        run: |
          echo "DRY RUN MODE - Would dispatch the following workflows:"
          ROOTS="${{ steps.plan.outputs.root_workflows }}"
          echo "$ROOTS" | while read -r WORKFLOW; do
            [ -n "$WORKFLOW" ] && echo "  - ${WORKFLOW}.yml"
          done
      - if: >-
          steps.plan.outputs.root_workflows != '' &&
          steps.running.outputs.workflows != '[]' &&
          inputs.dry_run != true &&
          !contains(github.event.head_commit.message, '[dry run]')
        name: Cancel superseded workflows
        run: |
          echo "Canceling workflows that will be re-run from merge roots..."
          ROOTS="${{ steps.plan.outputs.root_workflows }}"
          # Convert newline-separated roots to JSON array
          JQ_FILTER='split("\n") | map(select(length > 0))'
          ROOTS_JSON=$(echo "$ROOTS" | jq -R -s -c "$JQ_FILTER")
          echo "Merge roots: $ROOTS_JSON"
          python3 src/workflowctl/workflowctl.py cancel \
            --repo ${{ github.repository }} \
            --merge-roots "$ROOTS_JSON" \
            --graph etc/workflow-dependencies.json
      - env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        if: >-
          steps.plan.outputs.root_workflows != '' &&
          inputs.dry_run != true &&
          !contains(github.event.head_commit.message, '[dry run]')
        name: Dispatch root workflows (fire-and-forget)
        run: |
          python3 src/workflowctl/workflowctl.py dispatch-roots \
            --repo "${{ github.repository }}" \
            --roots "${{ steps.plan.outputs.root_workflows }}" \
            --changed "${{ steps.files.outputs.changed }}" \
            --trigger-descendants "${{ inputs.trigger_descendants }}"
name: Workflow Controller
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - 'test/claude/**'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        type: boolean
      github_hosted:
        default: false
        description: Use GitHub-hosted runners
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      start_from:
        description: 'Workflow(s) to start from (e.g., "health, bootstrap")'
        type: string
      trigger_descendants:
        default: false
        description: Trigger descendant workflows after root workflows complete
        type: boolean
permissions:
  actions: write
  contents: read
