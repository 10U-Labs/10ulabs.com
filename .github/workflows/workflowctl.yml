---
# Workflow Controller
#
# This workflow responds to push events on main, calculates which root workflow
# needs to run based on changed files, and dispatches it (fire-and-forget).
# Descendant workflows are triggered via dispatch_descendants.py script.
concurrency:
  cancel-in-progress: false
  group: workflowctl-${{ github.ref }}
jobs:
  orchestrate:
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: github.ref == 'refs/heads/main'
    name: Orchestrating workflows
    runs-on: >-
      ${{ ( vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: detect-changes
        if: github.event.inputs.force_testing != 'true'
        name: Detect workflowctl-related changes
        run: |
          echo "Checking for workflowctl-related file changes..."
          WORKFLOWCTL_PATHS=(
            ".github/workflows/workflowctl.yml"
            "etc/workflow_dependencies.json"
            "lib/python/"
            "src/workflowctl/"
            "test/workflowctl/"
          )
          CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" \
            "${{ github.sha }}" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          WORKFLOWCTL_CHANGED="false"
          for path in "${WORKFLOWCTL_PATHS[@]}"; do
            if echo "$CHANGED_FILES" | grep -q "^${path}"; then
              echo "Match found: $path"
              WORKFLOWCTL_CHANGED="true"
              break
            fi
          done
          echo "workflowctl_changed=$WORKFLOWCTL_CHANGED" >> "$GITHUB_OUTPUT"
      - if: >-
          github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true'
        name: Workflowctl testing required
        run: echo "Workflowctl-related files changed. Running tests..."
      - if: >-
          github.event.inputs.force_testing != 'true' &&
          steps.detect-changes.outputs.workflowctl_changed != 'true'
        name: Workflowctl testing not required
        run: echo "No workflowctl-related files changed. Skipping tests."
      - continue-on-error: true
        id: no_linter_configs_gh
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Assert no linter config files (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-linter-config-files@latest
        with:
          directories: ${{ github.workspace }}
          linters: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_linter_configs_sh
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true' &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Assert no linter config files (self-hosted)
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - continue-on-error: true
        id: no_inline_disables_gh
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Assert no inline lint disables (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-inline-lint-disables@latest
        with:
          files: ${{ github.workspace }}/**/*
          linters: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_inline_disables_sh
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true' &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Assert no inline lint disables (self-hosted)
        run: >-
          assert-no-inline-lint-disables
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/**/*
      - continue-on-error: true
        id: one_assert_per_pytest_gh
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Assert one assert per pytest (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-one-assert-per-pytest@latest
        with:
          files: ${{ github.workspace }}/test/**/*.py
          verbose: true
      - continue-on-error: true
        id: one_assert_per_pytest_sh
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true' &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Assert one assert per pytest (self-hosted)
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          (vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')) &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Install yamllint
        run: python3 -m pip install yamllint==1.35.*
      - continue-on-error: true
        id: yamllint
        if: >-
          github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true'
        name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/workflowctl.yml
      - if: >-
          (vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')) &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Install jsonlint
        run: npm install -g jsonlint
      - continue-on-error: true
        id: jsonlint
        if: >-
          github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true'
        name: Linting JSON files
        run: jsonlint -q etc/workflow_dependencies.json
      - if: >-
          (vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')) &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Install pylint dependencies
        run: |
          python3 -m pip install \
            boto3==1.35.* \
            botocore==1.35.* \
            pylint==3.3.* \
            pytest==8.3.* \
            requests==2.32.*
      - continue-on-error: true
        id: pylint_source
        if: >-
          github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true'
        name: Run pylint on source
        run: |
          python3 -m pylint lib/python/ src/workflowctl/ \
            --fail-on=C,R,W --fail-under=10.0
      - if: >-
          (vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')) &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Install pylint test dependencies
        run: |
          python3 -m pip install \
            dnspython==2.7.* \
            python-hcl2==6.0.*
      - continue-on-error: true
        id: pylint_tests
        if: >-
          github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true'
        name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/ test/ \
            --fail-on=C,R,W --fail-under=10.0
      - if: >-
          (vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')) &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Install mypy dependencies
        run: |
          python3 -m pip install \
            boto3-stubs==1.35.* \
            mypy==1.13.* \
            types-dockerfile-parse \
            types-PyYAML==6.0.* \
            types-requests==2.32.*
      - continue-on-error: true
        id: mypy_source
        if: >-
          github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true'
        name: Run mypy on source
        run: python3 -m mypy lib/python/ src/workflowctl/
      - continue-on-error: true
        id: mypy_tests
        if: >-
          github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true'
        name: Run mypy on tests
        run: |
          MYPYPATH=lib/python:src/api/endpoints/runners/lambda python3 -m mypy \
            lib/python/ test/
      - if: >-
          (vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')) &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Install jscpd
        run: npm install -g jscpd
      - continue-on-error: true
        id: jscpd_source
        if: >-
          github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true'
        name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ src/workflowctl/
      - continue-on-error: true
        id: jscpd_tests
        if: >-
          github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true'
        name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/
      - if: >-
          (vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')) &&
          (github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true')
        name: Install pytest dependencies
        run: python3 -m pip install pytest==8.3.* pyyaml==6.0.*
      - continue-on-error: true
        id: unit_tests
        if: >-
          github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true'
        name: Run unit tests
        run: |
          python3 -m pytest \
            test/workflowctl/pre_deployment/unit/ \
            --verbose --pythonwarnings=error
      - continue-on-error: true
        id: pre_integration_tests
        if: >-
          github.event.inputs.force_testing == 'true' ||
          steps.detect-changes.outputs.workflowctl_changed == 'true'
        name: Run pre-deployment integration tests
        run: |
          python3 -m pytest \
            test/workflowctl/pre_deployment/integration/ \
            --verbose --pythonwarnings=error
      - env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        id: files
        name: Get changed files
        run: |
          OUTPUT=$(python3 src/workflowctl/workflowctl.py get-changed-files \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --commits "$COMMITS_JSON")
          # Extract files array and convert to comma-separated
          CHANGED=$(echo "$OUTPUT" | jq -r '.files | join(",")')
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
      - id: running
        name: Get running workflows
        run: |
          CMD="python3 src/workflowctl/workflowctl.py get-running-workflows"
          OUTPUT=$($CMD \
            --repo ${{ github.repository }} \
            --graph etc/workflow_dependencies.json)
          # Extract workflows array as JSON
          RUNNING=$(echo "$OUTPUT" | jq -c '.workflows')
          echo "workflows=$RUNNING" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Compute root workflows
        run: |
          GRAPH="etc/workflow_dependencies.json"
          START_FROM="${{ inputs.start_from }}"
          if [ -n "$START_FROM" ]; then
            # Manual dispatch: use provided workflows directly (comma-separated)
            ROOTS=$(echo "$START_FROM" | tr -d ' ')
          else
            CHANGED="${{ steps.files.outputs.changed }}"
            RUNNING='${{ steps.running.outputs.workflows }}'
            # Get root workflows, merge with running
            CMD="python3 src/workflowctl/workflowctl.py compute-root-workflows"
            OUTPUT=$($CMD \
              --changed-files "$CHANGED" \
              --graph "$GRAPH" \
              --running "$RUNNING")
            # Extract workflow names and convert to comma-separated
            ROOTS=$(echo "$OUTPUT" | jq -r '.workflows | join(",")' || echo "")
          fi
          echo "root_workflows=$ROOTS" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.root_workflows == ''
        name: No workflows to dispatch
        run: echo "No workflow-related files changed or no workflows computed"
      - if: >-
          steps.plan.outputs.root_workflows != '' &&
          steps.running.outputs.workflows != '[]'
        name: Cancel superseded workflows
        run: |
          python3 src/workflowctl/workflowctl.py cancel-superseded-workflows \
            --repo "${{ github.repository }}" \
            --changed-files "${{ steps.files.outputs.changed }}" \
            --running '${{ steps.running.outputs.workflows }}' \
            --graph etc/workflow_dependencies.json
      - env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        if: >-
          steps.plan.outputs.root_workflows != '' &&
          inputs.start_from == ''
        name: Dispatch root workflows (fire-and-forget)
        run: |
          FLAGS=""
          if [ "${{ inputs.trigger_descendants }}" = "true" ]; then
            FLAGS="$FLAGS --trigger-descendants"
          fi
          if [ "${{ inputs.invalidate_cloudfront }}" = "true" ]; then
            FLAGS="$FLAGS --invalidate-cloudfront"
          fi
          python3 src/workflowctl/workflowctl.py dispatch-root-workflows \
            --repo "${{ github.repository }}" \
            --changed-files "${{ steps.files.outputs.changed }}" \
            --running '${{ steps.running.outputs.workflows }}' \
            $FLAGS
      - if: inputs.start_from != ''
        name: Dispatch workflow (fire-and-forget)
        run: |
          FLAGS=""
          if [ "${{ inputs.trigger_descendants }}" = "true" ]; then
            FLAGS="$FLAGS --trigger-descendants"
          fi
          if [ "${{ inputs.invalidate_cloudfront }}" = "true" ]; then
            FLAGS="$FLAGS --invalidate-cloudfront"
          fi
          python3 src/workflowctl/workflowctl.py dispatch-workflow \
            --workflow "${{ inputs.start_from }}" \
            --repo "${{ github.repository }}" \
            $FLAGS
      - env:
          S01: ${{ steps.no_linter_configs_gh.outcome }}
          S02: ${{ steps.no_linter_configs_sh.outcome }}
          S03: ${{ steps.no_inline_disables_gh.outcome }}
          S04: ${{ steps.no_inline_disables_sh.outcome }}
          S05: ${{ steps.one_assert_per_pytest_gh.outcome }}
          S06: ${{ steps.one_assert_per_pytest_sh.outcome }}
          S07: ${{ steps.yamllint.outcome }}
          S08: ${{ steps.jsonlint.outcome }}
          S09: ${{ steps.pylint_source.outcome }}
          S10: ${{ steps.pylint_tests.outcome }}
          S11: ${{ steps.mypy_source.outcome }}
          S12: ${{ steps.mypy_tests.outcome }}
          S13: ${{ steps.jscpd_source.outcome }}
          S14: ${{ steps.jscpd_tests.outcome }}
          S15: ${{ steps.unit_tests.outcome }}
          S16: ${{ steps.pre_integration_tests.outcome }}
        name: Assert no step failed
        run: |
          failed=""
          f="failure"
          [ "$S01" = "$f" ] && failed="$failed no_linter_configs_gh"
          [ "$S02" = "$f" ] && failed="$failed no_linter_configs_sh"
          [ "$S03" = "$f" ] && failed="$failed no_inline_disables_gh"
          [ "$S04" = "$f" ] && failed="$failed no_inline_disables_sh"
          [ "$S05" = "$f" ] && failed="$failed one_assert_per_pytest_gh"
          [ "$S06" = "$f" ] && failed="$failed one_assert_per_pytest_sh"
          [ "$S07" = "$f" ] && failed="$failed yamllint"
          [ "$S08" = "$f" ] && failed="$failed jsonlint"
          [ "$S09" = "$f" ] && failed="$failed pylint_source"
          [ "$S10" = "$f" ] && failed="$failed pylint_tests"
          [ "$S11" = "$f" ] && failed="$failed mypy_source"
          [ "$S12" = "$f" ] && failed="$failed mypy_tests"
          [ "$S13" = "$f" ] && failed="$failed jscpd_source"
          [ "$S14" = "$f" ] && failed="$failed jscpd_tests"
          [ "$S15" = "$f" ] && failed="$failed unit_tests"
          [ "$S16" = "$f" ] && failed="$failed pre_integration_tests"
          if [ -n "$failed" ]; then
            echo "Steps that failed:$failed"
            exit 1
          fi
          echo "All steps succeeded"
name: Workflow Controller
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - 'test/claude/**'
  workflow_dispatch:
    inputs:
      force_testing:
        default: false
        description: Force workflowctl testing to run
        type: boolean
      github_hosted:
        default: false
        description: Use GitHub-hosted runners
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation in descendant workflows
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      start_from:
        description: 'Workflow to start from (e.g., "bootstrap")'
        type: string
      trigger_descendants:
        default: true
        description: Trigger descendant workflows after root workflows complete
        type: boolean
permissions:
  actions: write
  contents: read
