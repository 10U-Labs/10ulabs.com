concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  conclude-readme-skip:
    if: needs.determine-readme-update.outputs.readme_should_be_updated != 'true'
    name: Concluding README.md should not be updated
    needs: determine-readme-update
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  conclude-readme-update:
    if: needs.determine-readme-update.outputs.readme_should_be_updated == 'true'
    name: Concluding README.md should be updated
    needs: determine-readme-update
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  deploying-artifacts:
    if: |
      github.event.inputs.dry_run != 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || (
        !contains(github.event.head_commit.message, '[skip-deploy]') &&
        !contains(github.event.head_commit.message, '[skip deploy]')
      )) &&
      !contains(github.event.head_commit.message, '[post-deployment]')
    name: Ensuring infrastructure is in desired state
    needs: unit-testing-code
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip deployment
        run: echo "DRY RUN - Would deploy Gmail email provider infrastructure with CDK"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - id: config
        if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' gmail_email_provider/config.json)
          REGION=$(jq -r '.aws_region' gmail_email_provider/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install CDK
        run: npm install -g aws-cdk
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install dependencies
        run: pip install -r gmail_email_provider/requirements.txt
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: CDK Bootstrap (if needed)
        run: |
          cd gmail_email_provider && cdk bootstrap aws://${{ steps.config.outputs.account_id }}/${{ steps.config.outputs.region }}
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: CDK Diff
        run: cd gmail_email_provider && cdk diff GmailEmailProvider
      - id: deploy
        if: ${{ github.event.inputs.dry_run != 'true' }}
        name: CDK Deploy
        run: |
          cd gmail_email_provider && cdk deploy GmailEmailProvider \
            --require-approval never \
            --outputs-file ../../gmail-outputs.json 2>&1 | tee /tmp/cdk_deploy.log || true
          if grep -qE "(failed|ROLLBACK_COMPLETE|CREATE_FAILED)" /tmp/cdk_deploy.log; then
            echo "deployment_failed=true" >> $GITHUB_OUTPUT
          else
            echo "deployment_failed=false" >> $GITHUB_OUTPUT
          fi
      - if: ${{ github.event.inputs.dry_run != 'true' && steps.deploy.outputs.deployment_failed == 'true' }}
        name: Fail if deployment failed
        run: |
          echo "CDK deployment failed. See logs above for details."
          exit 1
      - if: ${{ github.event.inputs.dry_run != 'true' && steps.deploy.outputs.deployment_failed != 'true' }}
        name: Display outputs
        run: |
          echo "Gmail email provider infrastructure deployed successfully"
          echo ""
          echo "Stack Outputs:"
          cat gmail-outputs.json | jq '.'
  determine-readme-update:
    if: |
      always() &&
      (needs.e2e-testing-infrastructure.result == 'success' ||
       contains(github.event.head_commit.message, '[post-deployment]')) &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Determining if README.md should be updated
    needs: e2e-testing-infrastructure
    outputs:
      readme_should_be_updated: ${{ steps.check.outputs.readme_should_be_updated }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' gmail_email_provider/config.json)
          REGION=$(jq -r '.aws_region' gmail_email_provider/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - id: check
        name: Check if README needs update
        run: |
          python gmail_email_provider/readme.py \
            --check \
            --aws-region "${{ steps.config.outputs.region }}" \
            --output-file "$GITHUB_OUTPUT"
  e2e-testing-infrastructure:
    if: |
      always() &&
      (needs.integration-testing-infrastructure.result == 'success' ||
       contains(github.event.head_commit.message, '[post-deployment]'))
    name: E2E testing
    needs: integration-testing-infrastructure
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip E2E tests
        run: echo "DRY RUN - Would run E2E tests"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - id: config
        if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' gmail_email_provider/config.json)
          REGION=$(jq -r '.aws_region' gmail_email_provider/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install dependencies
        run: |
          pip install pytest boto3 dnspython
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run E2E tests
        run: |
          pytest gmail_email_provider/test/test_e2e.py -v
  integration-testing-infrastructure:
    if: |
      always() &&
      (needs.deploying-artifacts.result == 'success' ||
       contains(github.event.head_commit.message, '[post-deployment]'))
    name: Integration testing
    needs: deploying-artifacts
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip integration tests
        run: echo "DRY RUN - Would run integration tests with pytest"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - id: config
        if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' gmail_email_provider/config.json)
          REGION=$(jq -r '.aws_region' gmail_email_provider/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install Python dependencies
        run: |
          pip install pytest boto3
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run pytest integration tests
        run: |
          pytest gmail_email_provider/test/test_integration.py -v
  performing-static-analysis:
    if: |
      !contains(github.event.head_commit.message, '[post-deployment]')
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip static analysis
        run: echo "DRY RUN - Would run pylint and mypy static analysis"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install linting dependencies
        run: |
          pip install pylint mypy yamllint
          npm install -g jsonlint markdownlint-cli2
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install project dependencies for linting
        run: pip install -r gmail_email_provider/requirements.txt
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Linting YAML files
        run: |
          echo "Running yamllint on workflow files..."
          yamllint --config-data '{extends: default, rules: {line-length: {max: 200, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}}}' .github/workflows/gmail_email_provider.yml
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Linting JSON configuration files
        run: |
          echo "Validating JSON syntax..."
          jsonlint -q gmail_email_provider/config.json
          jsonlint -q gmail_email_provider/cdk.json
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Linting Markdown documentation
        run: |
          if [ -f gmail_email_provider/README.md ]; then
            echo "Linting README.md..."
            markdownlint-cli2 gmail_email_provider/README.md
          else
            echo "No README.md found, skipping markdown linting"
          fi
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Linting Python files
        run: |
          pylint gmail_email_provider/stack.py gmail_email_provider/app.py gmail_email_provider/readme.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Static type checking Python files with mypy
        run: |
          python -m mypy gmail_email_provider --exclude gmail_email_provider/test
  unit-testing-code:
    if: |
      !contains(github.event.head_commit.message, '[post-deployment]')
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip unit tests
        run: echo "DRY RUN - Would run unit tests with pytest"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Node.js (required by aws-cdk-lib/jsii)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install Python dependencies
        run: |
          pip install pytest
          pip install -r gmail_email_provider/requirements.txt
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run unit tests
        run: |
          pytest gmail_email_provider/test/test_unit.py -v
  update-readme:
    name: Updating README.md
    needs: conclude-readme-update
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' gmail_email_provider/config.json)
          REGION=$(jq -r '.aws_region' gmail_email_provider/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - name: Update README with Bedrock
        run: |
          python gmail_email_provider/readme.py \
            --update \
            --aws-region "${{ steps.config.outputs.region }}"
      - name: Commit and push README if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add gmail_email_provider/README.md
          if git diff --cached --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "Update gmail_email_provider README.md [skip ci]"
            git push
          fi
name: Configuring Gmail as email provider
on:
  push:
    branches:
      - main
    paths:
      - 'gmail_email_provider/**'
      - '.github/workflows/gmail_email_provider.yml'
  repository_dispatch:
    types:
      - domain_name_has_been_registered_successfully
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: 'Dry run mode (skip deployment, just test)'
        required: false
        type: boolean
permissions:
  contents: read
  id-token: write
