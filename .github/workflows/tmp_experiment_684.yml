---
name: tmp experiment 684
"on":
  workflow_dispatch:
jobs:
  a-current-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install assert-python-definition-is-used
      - run: pip show assert-python-definition-is-used | head -3
      - name: Run as the seven jobs run it today
        run: |
          set +e
          assert-python-definition-is-used \
            --search-in lib/python --search-in scripts --search-in src \
            --verbose \
            src/api/common/routing/lambda
          echo "EXIT_CODE=$?"
  b-after-3deaeec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >-
          pip install
          git+https://github.com/10U-Labs/assert-python-definition-is-used@3deaeec
      - name: Same command, tool at 3deaeec
        run: |
          set +e
          assert-python-definition-is-used \
            --search-in lib/python --search-in scripts --search-in src \
            --verbose \
            src/api/common/routing/lambda
          echo "EXIT_CODE=$?"
  c-after-3deaeec-with-proposed-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >-
          pip install
          git+https://github.com/10U-Labs/assert-python-definition-is-used@3deaeec
      - name: Tool at 3deaeec plus the fix issue 684 proposes
        run: |
          set +e
          assert-python-definition-is-used \
            --search-in lib/python --search-in scripts --search-in src \
            --assume-used-matching lambda_handler \
            --verbose \
            src/api/common/routing/lambda
          echo "EXIT_CODE=$?"
