---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Build and deploy AMI for EC2 self-hosted runners
    permissions:
      actions: write
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - continue-on-error: true
        id: no_linter_configs_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no linter config files (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-linter-config-files@latest
        with:
          directories: ${{ github.workspace }}
          linters: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_linter_configs_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no linter config files (self-hosted)
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - continue-on-error: true
        id: no_inline_disables_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no inline lint disables (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-inline-lint-disables@latest
        with:
          files: ${{ github.workspace }}/**/*
          linters: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_inline_disables_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no inline lint disables (self-hosted)
        run: >-
          assert-no-inline-lint-disables
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/**/*
      - continue-on-error: true
        id: one_assert_per_pytest_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert one assert per pytest (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-one-assert-per-pytest@latest
        with:
          files: ${{ github.workspace }}/test/**/*.py
          verbose: true
      - continue-on-error: true
        id: one_assert_per_pytest_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert one assert per pytest (self-hosted)
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            mypy \
            paramiko \
            pylint \
            pytest \
            python-hcl2 \
            pyyaml \
            requests \
            types-paramiko \
            types-requests \
            types-PyYAML \
            yamllint
      - continue-on-error: true
        id: yamllint
        name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/api_endpoint_v1_runners_ec2_images_post.yml
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install npm dependencies
        run: npm install -g jscpd jsonlint
      - continue-on-error: true
        id: jsonlint
        name: Linting JSON files
        run: jsonlint -q src/api/endpoints/runners/ec2/images/post/config.json
      - continue-on-error: true
        id: pylint_source
        name: Run pylint on source
        run: |
          python3 -m pylint \
            lib/python/ec2_fleet/*.py \
            src/api/endpoints/runners/ec2/images/post/*.py \
            --fail-on=C,R,W --fail-under=10.0
      - continue-on-error: true
        id: pylint_tests
        name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/ test/ \
            --fail-on=C,R,W --fail-under=10.0
      - continue-on-error: true
        id: mypy_source
        name: Run mypy on source
        run: |
          SRC=src/api/endpoints/runners/ec2/images/post
          MYPYPATH=lib/python:src/api/endpoints/runners/lambda python3 -m mypy \
            lib/python/ec2_fleet/ $SRC/*.py
      - continue-on-error: true
        id: mypy_tests
        name: Run mypy on tests
        run: |
          MYPYPATH=lib/python:src/api/endpoints/runners/lambda python3 -m mypy \
            lib/python/ test/
      - continue-on-error: true
        id: jscpd_source
        name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ src/api/endpoints/runners/ec2/images/post/
      - continue-on-error: true
        id: jscpd_tests
        name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/
      - continue-on-error: true
        id: unit_tests
        name: Run unit tests
        run: |
          TEST=test/api/endpoints/runners/ec2/images/post/pre_deployment
          python3 -m pytest \
            $TEST/unit/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - continue-on-error: true
        id: pre_integration_tests
        name: Run pre-deployment integration tests
        run: |
          TEST=test/api/endpoints/runners/ec2/images/post/pre_deployment
          python3 -m pytest \
            $TEST/integration/ \
            --capture=no --confcutdir=test --verbose --pythonwarnings=error
      - id: terraform
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Extract Terraform version
        run: |
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/api/common/networking/providers.tf | cut -d'"' -f2 | \
            sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - id: api
        name: Get configuration and networking outputs
        run: |
          # Read tag config from etc/runners.json (source of truth)
          RUNNERS_JSON=etc/runners.json
          AMI_PURPOSE_TAG=$(jq -r '.tags.ec2.ami.purpose_tag' $RUNNERS_JSON)
          AMI_PURPOSE_VALUE=$(jq -r '.tags.ec2.ami.purpose_value' $RUNNERS_JSON)
          AMI_STABLE_TAG=$(jq -r '.tags.ec2.ami.stable_tag' $RUNNERS_JSON)
          AMI_STABLE_VALUE=$(jq -r '.tags.ec2.ami.stable_value' $RUNNERS_JSON)
          # Get instance types from config.json (local to this workflow)
          CONF=src/api/endpoints/runners/ec2/images/post/config.json
          DEFAULT='["m8gd.medium"]'
          ITYPES=$(jq -r ".instance_types // $DEFAULT | join(\",\")" $CONF)
          # Get networking resources from src/api/common/networking remote state
          cd src/api/common/networking
          terraform init -backend=true -input=false
          SG_ID=$(terraform output -raw security_group_id_for_runners)
          SUBNET_IDS=$(terraform output -raw public_subnets_ids)
          echo "instance_types=$ITYPES" >> $GITHUB_OUTPUT
          echo "ami_purpose_tag=$AMI_PURPOSE_TAG" >> $GITHUB_OUTPUT
          echo "ami_purpose_value=$AMI_PURPOSE_VALUE" >> $GITHUB_OUTPUT
          echo "ami_stable_tag=$AMI_STABLE_TAG" >> $GITHUB_OUTPUT
          echo "ami_stable_value=$AMI_STABLE_VALUE" >> $GITHUB_OUTPUT
          echo "security_group_id=$SG_ID" >> $GITHUB_OUTPUT
          echo "subnet_ids=$SUBNET_IDS" >> $GITHUB_OUTPUT
      - id: config
        name: Extract configuration values
        run: |
          CONF=src/api/endpoints/runners/ec2/images/post
          CONF="${CONF}/config.json"
          RUNNER_USER=$(jq -r '.runner_user' "$CONF")
          RUNNER_VERSION=$(jq -r '.runner_version' "$CONF")
          SOURCE_AMI=$(jq -r '.source_ami' "$CONF")
          TERRAFORM_VERSION=$(jq -r '.terraform_version' "$CONF")
          YQ_VERSION=$(jq -r '.yq_version' "$CONF")
          OS_FAMILY=$(echo "$SOURCE_AMI" | cut -d'-' -f1)
          OS_VERSION=$(echo "$SOURCE_AMI" | cut -d'-' -f2)
          OS_ARCH=$(echo "$SOURCE_AMI" | cut -d'-' -f3)
          echo "os_architecture=$OS_ARCH" >> $GITHUB_OUTPUT
          echo "os_family=$OS_FAMILY" >> $GITHUB_OUTPUT
          echo "os_version=$OS_VERSION" >> $GITHUB_OUTPUT
          echo "runner_user=$RUNNER_USER" >> $GITHUB_OUTPUT
          echo "runner_version=$RUNNER_VERSION" >> $GITHUB_OUTPUT
          echo "source_ami=$SOURCE_AMI" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
          echo "yq_version=$YQ_VERSION" >> $GITHUB_OUTPUT
      - env:
          OS_ARCH: ${{ steps.config.outputs.os_architecture }}
          OS_FAMILY: ${{ steps.config.outputs.os_family }}
          OS_VERSION: ${{ steps.config.outputs.os_version }}
          PYTHONPATH: lib/python
        id: build
        name: Build AMI with EC2 Fleet
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BASE="ami-github-ec2-runner"
          AMI_NAME="${BASE}-${OS_FAMILY}-${OS_VERSION}-${OS_ARCH}"
          AMI_NAME="${AMI_NAME}-${TIMESTAMP}"
          DIR=src/api/endpoints/runners/ec2/images/post
          SCRIPT="${DIR}/build_ami.py"
          SETUP="${DIR}/setup.py"
          INST="${{ steps.api.outputs.instance_types }}"
          REG="${{ vars.AWS_REGION }}"
          USR="${{ steps.config.outputs.runner_user }}"
          RVER="${{ steps.config.outputs.runner_version }}"
          SAMI="${{ steps.config.outputs.source_ami }}"
          SNET="${{ steps.api.outputs.subnet_ids }}"
          TFVER="${{ steps.config.outputs.terraform_version }}"
          YQVER="${{ steps.config.outputs.yq_version }}"
          TAG="${{ steps.api.outputs.ami_stable_tag }}"
          PURP="${{ steps.api.outputs.ami_purpose_value }}"
          python3 $SCRIPT \
            --ami-name "$AMI_NAME" \
            --instance-types "$INST" \
            --region "$REG" \
            --runner-user "$USR" \
            --runner-version "$RVER" \
            --setup-script "$SETUP" \
            --source-ami "$SAMI" \
            --subnet-ids "$SNET" \
            --terraform-version "$TFVER" \
            --yq-version "$YQVER" \
            --tag "${TAG}=false" \
            --tag "BuildDate=${TIMESTAMP}" \
            --tag "ManagedBy=GitHubActions" \
            --tag "Name=${AMI_NAME}" \
            --tag "OSArchitecture=${OS_ARCH}" \
            --tag "OSFamily=${OS_FAMILY^}" \
            --tag "OSVersion=${OS_VERSION}" \
            --tag "Purpose=${PURP}" \
            --tag "Repository=${{ github.repository }}" \
            --tag "RunId=${{ github.run_id }}" \
            --tag "Workflow=${{ github.workflow }}" \
            | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            exit $BUILD_EXIT_CODE
          fi
          AMI_ID=$(grep '^AMI_ID=' build.log | cut -d= -f2)
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
      - env:
          INSTANCE_TYPES: ${{ steps.api.outputs.instance_types }}
          PYTHONPATH: lib/python:test/api/endpoints/runners/ec2/images/post
          TEST_AMI_ID: ${{ steps.build.outputs.ami_id }}
          TEST_SECURITY_GROUP_ID: ${{ steps.api.outputs.security_group_id }}
          TEST_SUBNET_IDS: ${{ steps.api.outputs.subnet_ids }}
        name: Run post-deployment integration tests
        run: |
          TEST=test/api/endpoints/runners/ec2/images/post/post_deployment
          python3 -m pytest \
            $TEST/integration/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - name: Get GitHub PAT from Parameter Store
        run: |
          terraform -chdir=src/bootstrap init -backend=true \
            -input=false > /dev/null
          GITHUB_TOKEN_SECRET_NAME=$(terraform \
            -chdir=src/bootstrap output -raw \
            ssm_parameter_name_for_github_pat)
          GITHUB_PAT=$(aws ssm get-parameter \
            --name "$GITHUB_TOKEN_SECRET_NAME" \
            --with-decryption --query 'Parameter.Value' \
            --output text)
          echo "GITHUB_PAT=$GITHUB_PAT" >> $GITHUB_ENV
      - env:
          INSTANCE_TYPES: ${{ steps.api.outputs.instance_types }}
          PYTHONPATH: lib/python:test/api/endpoints/runners/ec2/images/post
          TEST_AMI_ID: ${{ steps.build.outputs.ami_id }}
          TEST_SECURITY_GROUP_ID: ${{ steps.api.outputs.security_group_id }}
          TEST_SUBNET_IDS: ${{ steps.api.outputs.subnet_ids }}
        name: Run E2E tests
        run: |
          TEST=test/api/endpoints/runners/ec2/images/post/post_deployment
          python3 -m pytest \
            $TEST/e2e/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - name: Promote AMI
        run: |
          SCRIPT=src/api/endpoints/runners/ec2/images/post
          SCRIPT="${SCRIPT}/promote_ami.py"
          AMI_ID="${{ steps.build.outputs.ami_id }}"
          REGION="${{ vars.AWS_REGION }}"
          TAG="${{ steps.api.outputs.ami_stable_tag }}"
          python3 $SCRIPT \
            --ami-id "$AMI_ID" \
            --region "$REGION" \
            --tag-key "$TAG"
      - name: Clean up old AMIs
        run: |
          BASE=src/api/endpoints/runners/ec2/images/post
          REGION="${{ vars.AWS_REGION }}"
          PURPOSE_TAG="${{ steps.api.outputs.ami_purpose_tag }}"
          PURPOSE_VALUE="${{ steps.api.outputs.ami_purpose_value }}"
          STABLE_TAG="${{ steps.api.outputs.ami_stable_tag }}"
          STABLE_VALUE="${{ steps.api.outputs.ami_stable_value }}"
          python3 $BASE/cleanup.py \
            --config $BASE/config.json \
            --region "$REGION" \
            --purpose-tag "$PURPOSE_TAG" \
            --purpose-value "$PURPOSE_VALUE" \
            --stable-tag "$STABLE_TAG" \
            --stable-value "$STABLE_VALUE"
      - env:
          S01: ${{ steps.no_linter_configs_gh.outcome }}
          S02: ${{ steps.no_linter_configs_sh.outcome }}
          S03: ${{ steps.no_inline_disables_gh.outcome }}
          S04: ${{ steps.no_inline_disables_sh.outcome }}
          S05: ${{ steps.one_assert_per_pytest_gh.outcome }}
          S06: ${{ steps.one_assert_per_pytest_sh.outcome }}
          S07: ${{ steps.yamllint.outcome }}
          S08: ${{ steps.jsonlint.outcome }}
          S09: ${{ steps.pylint_source.outcome }}
          S10: ${{ steps.pylint_tests.outcome }}
          S11: ${{ steps.mypy_source.outcome }}
          S12: ${{ steps.mypy_tests.outcome }}
          S13: ${{ steps.jscpd_source.outcome }}
          S14: ${{ steps.jscpd_tests.outcome }}
          S15: ${{ steps.unit_tests.outcome }}
          S16: ${{ steps.pre_integration_tests.outcome }}
        name: Assert no step failed
        run: |
          failed=""
          f="failure"
          [ "$S01" = "$f" ] && failed="$failed no_linter_configs_gh"
          [ "$S02" = "$f" ] && failed="$failed no_linter_configs_sh"
          [ "$S03" = "$f" ] && failed="$failed no_inline_disables_gh"
          [ "$S04" = "$f" ] && failed="$failed no_inline_disables_sh"
          [ "$S05" = "$f" ] && failed="$failed one_assert_per_pytest_gh"
          [ "$S06" = "$f" ] && failed="$failed one_assert_per_pytest_sh"
          [ "$S07" = "$f" ] && failed="$failed yamllint"
          [ "$S08" = "$f" ] && failed="$failed jsonlint"
          [ "$S09" = "$f" ] && failed="$failed pylint_source"
          [ "$S10" = "$f" ] && failed="$failed pylint_tests"
          [ "$S11" = "$f" ] && failed="$failed mypy_source"
          [ "$S12" = "$f" ] && failed="$failed mypy_tests"
          [ "$S13" = "$f" ] && failed="$failed jscpd_source"
          [ "$S14" = "$f" ] && failed="$failed jscpd_tests"
          [ "$S15" = "$f" ] && failed="$failed unit_tests"
          [ "$S16" = "$f" ] && failed="$failed pre_integration_tests"
          if [ -n "$failed" ]; then
            echo "Steps that failed:$failed"
            exit 1
          fi
          echo "All steps succeeded"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (
          github.event.inputs.trigger_descendants == 'true' ||
           contains(github.event.head_commit.message,
           '[trigger descendants]'))
        name: Dispatch descendant workflows
        run: |
          FLAGS=""
          TRIGGER="${{ github.event.inputs.trigger_descendants }}"
          if [ "$TRIGGER" = "true" ]; then
            FLAGS="$FLAGS --trigger-descendants"
          fi
          python3 src/workflowctl/workflowctl.py dispatch-descendant-workflows \
            --workflow api_endpoint_v1_runners_ec2_images_post \
            --repo ${{ github.repository }} \
            $FLAGS
      - if: cancelled()
        name: Clean up on cancellation
        run: |
          REGION="${{ vars.AWS_REGION }}"
          RUN_ID="${{ github.run_id }}"
          echo "Cleaning up resources for cancelled run $RUN_ID..."
          INSTANCES=$(aws ec2 describe-instances \
            --region "$REGION" \
            --filters "Name=tag:RunId,Values=$RUN_ID" \
                      "Name=instance-state-name,Values=pending,running" \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text)
          if [ -n "$INSTANCES" ]; then
            echo "Terminating instances: $INSTANCES"
            aws ec2 terminate-instances \
              --region "$REGION" \
              --instance-ids $INSTANCES
          fi
          for LT in $(aws ec2 describe-launch-templates \
            --region "$REGION" \
            --filters "Name=tag:RunId,Values=$RUN_ID" \
            --query 'LaunchTemplates[*].LaunchTemplateId' \
            --output text); do
            echo "Deleting launch template: $LT"
            aws ec2 delete-launch-template \
              --region "$REGION" \
              --launch-template-id "$LT" || true
          done
          for SG in $(aws ec2 describe-security-groups \
            --region "$REGION" \
            --filters "Name=tag:RunId,Values=$RUN_ID" \
            --query 'SecurityGroups[*].GroupId' \
            --output text); do
            echo "Deleting security group: $SG"
            aws ec2 delete-security-group \
              --region "$REGION" \
              --group-id "$SG" || true
          done
          for KP in $(aws ec2 describe-key-pairs \
            --region "$REGION" \
            --filters "Name=tag:RunId,Values=$RUN_ID" \
            --query 'KeyPairs[*].KeyPairId' \
            --output text); do
            echo "Deleting key pair: $KP"
            aws ec2 delete-key-pair \
              --region "$REGION" \
              --key-pair-id "$KP" || true
          done
          echo "Cleanup complete."
name: Building AMI for EC2 self-hosted runners
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      trigger_descendants:
        default: false
        description: Trigger descendant workflows after this workflow completes
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
