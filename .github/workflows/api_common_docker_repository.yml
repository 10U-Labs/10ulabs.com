---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy API common Docker repository
    permissions:
      actions: write
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ec2", "general-purpose", "arm", "spot",
            "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-no-inline-directives \
            assert-no-linter-config-files \
            assert-one-assert-per-pytest \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            mypy \
            pylint \
            pytest \
            pytest-dependency \
            python-hcl2 \
            requests \
            types-PyYAML \
            types-requests \
            yamllint
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - name: Assert no inline lint disables
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/**/*
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/api_common_docker_repository.yml
      - name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python:. python3 -m pylint \
            lib/python/ test/ \
            --fail-on=C,R,W --fail-under=10.0
      - name: Run mypy on tests
        run: |
          MYPYPATH=lib/python
          MYPYPATH=$MYPYPATH:src/api/endpoints/runners/lambda
          MYPYPATH=$MYPYPATH:src/api/endpoints/runners/ecs/lambda
          MYPYPATH=$MYPYPATH python3 -m mypy lib/python/ test/
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install jscpd
        run: npm install -g jscpd
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/
      - id: terraform
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Extract Terraform version
        run: |
          TF_PROVIDERS=src/api/common/docker_repository/providers.tf
          TERRAFORM_VERSION=$(grep 'required_version' $TF_PROVIDERS \
            | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - name: Terraform Format Check
        run: |
          cd src/api/common/docker_repository && \
            terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: |
          cd src/api/common/docker_repository && \
            terraform init
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api/common/docker_repository && \
            tflint --init && \
            tflint
      - name: Run unit tests
        run: |
          TEST=test/api/common/docker_repository
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST/pre_deployment/unit/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - name: Run pre-deployment integration tests
        run: |
          BASE=test/api/common/docker_repository
          PYTHONPATH=lib/python python3 -m pytest \
            $BASE/pre_deployment/integration/ \
            --capture=no --confcutdir=test --verbose --pythonwarnings=error
      - name: Terraform Plan
        run: |
          cd src/api/common/docker_repository && \
            terraform plan
      - name: Terraform Apply
        run: |
          cd src/api/common/docker_repository && \
            terraform apply -auto-approve
      - name: Run post-deployment integration tests
        run: |
          BASE=test/api/common/docker_repository
          PYTHONPATH=lib/python python3 -m pytest \
            $BASE/post_deployment/integration/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - name: Run E2E tests
        run: |
          BASE=test/api/common/docker_repository
          PYTHONPATH=lib/python python3 -m pytest \
            $BASE/post_deployment/e2e/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (
          github.event.inputs.trigger_descendants == 'true' ||
           contains(github.event.head_commit.message,
           '[trigger descendants]'))
        name: Dispatch descendant workflows
        run: |
          FLAGS=""
          TRIGGER="${{ github.event.inputs.trigger_descendants }}"
          INVALIDATE="${{ github.event.inputs.invalidate_cloudfront }}"
          if [ "$TRIGGER" = "true" ]; then
            FLAGS="$FLAGS --trigger-descendants"
          fi
          if [ "$INVALIDATE" = "true" ]; then
            FLAGS="$FLAGS --invalidate-cloudfront"
          fi
          python3 src/workflowctl/workflowctl.py dispatch-descendant-workflows \
            --workflow api_common_docker_repository \
            --repo ${{ github.repository }} \
            $FLAGS
name: >-
  Ensuring API common Docker repository exists and is properly configured
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      trigger_descendants:
        default: true
        description: Trigger descendant workflows after this workflow completes
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
