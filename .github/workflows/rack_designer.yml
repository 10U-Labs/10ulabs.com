concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  declaring-common-variables:
    name: Declaring common variables
    outputs:
      aws_region: ${{ steps.config.outputs.aws_region }}
      github_actions_role_arn: ${{ steps.bootstrap.outputs.github_actions_role_arn }}
      terraform_version: ${{ steps.config.outputs.terraform_version }}
    permissions:
      contents: read
      id-token: write
    runs-on:
      - ecs-fargate-spot
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          AWS_ACCOUNT_ID=$(grep -A1 'output "aws_account_id"' src/shared/modules/outputs.tf | grep 'value' | cut -d'"' -f2)
          AWS_REGION=$(grep -A1 'output "aws_region"' src/shared/modules/outputs.tf | grep 'value' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' src/bootstrap/locals.tf | sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          RESOURCE_PREFIX=$(grep -A1 'output "resource_prefix"' src/shared/modules/outputs.tf | grep 'value' | cut -d'"' -f2)
          TERRAFORM_VERSION=$(grep 'required_version' src/rack_designer/backend.tf | cut -d'"' -f2 | sed 's/>= //')
          GITHUB_ACTIONS_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.config.outputs.github_actions_role_arn }}
      - id: bootstrap
        name: Get bootstrap outputs
        run: |
          terraform -chdir=src/bootstrap init -backend=true -input=false > /dev/null
          GITHUB_ACTIONS_ROLE_ARN=$(terraform -chdir=src/bootstrap output -raw arn_for_github_actions_role)
          echo "github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN" >> $GITHUB_OUTPUT
  e2e-testing:
    name: E2E testing
    needs:
      - declaring-common-variables
      - integration-testing
    runs-on:
      - ecs-fargate-spot
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - name: Run E2E tests
        run: python3 -m pytest test/rack_designer/post_deployment/e2e/ -v
  ensuring-infrastructure-in-desired-state:
    defaults:
      run:
        working-directory: src/rack_designer
    name: Ensuring infrastructure is in desired state
    needs:
      - declaring-common-variables
      - unit-testing
    runs-on:
      - ecs-fargate-spot
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve
      - name: Get website bucket name
        run: |
          terraform -chdir=../home_page init -backend=true -input=false > /dev/null
          BUCKET_NAME=$(terraform -chdir=../home_page output -raw bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/ s3://${{ env.BUCKET_NAME }}/rack-designer/ \
            --delete \
            --cache-control no-cache \
            --storage-class ONEZONE_IA \
            --exclude ".gitkeep"
      - id: check_files
        name: Check if frontend files changed
        run: |
          set -e
          set -o pipefail
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE_COMMIT="${{ github.event.before }}"
          else
            BASE_COMMIT="HEAD^"
          fi
          git diff --name-only $BASE_COMMIT ${{ github.sha }} | \
            if grep -qE 'src/rack_designer/frontend/'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
      - if: steps.check_files.outputs.changed == 'true'
        name: Invalidate CloudFront cache
        run: |
          WEBSITE_FQDN=$(terraform -chdir=../home_page output -raw website_domain_name)
          python3 ../../scripts/invalidate_cloudfront/invalidate_cloudfront.py \
            --fqdn "$WEBSITE_FQDN" \
            --region ${{ needs.declaring-common-variables.outputs.aws_region }} \
            --paths "/rack-designer/*"
  integration-testing:
    name: Integration testing
    needs:
      - declaring-common-variables
      - ensuring-infrastructure-in-desired-state
    runs-on:
      - ecs-fargate-spot
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - name: Run integration tests
        run: python3 -m pytest test/rack_designer/post_deployment/integration/ -v
  performing-static-analysis:
    if: github.ref == 'refs/heads/main'
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on:
      - ecs-fargate-spot
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - name: Linting YAML files
        run: |
          DOCUMENT_START='document-start: disable'
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: {max: 300, level: warning}'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$DOCUMENT_START, $EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/rack_designer.yml
      - name: Run pylint
        run: |
          python3 -m pylint src/rack_designer/lambdas/*.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run mypy
        run: python3 -m mypy src/rack_designer/lambdas/*.py
      - name: Terraform Format Check
        run: cd src/rack_designer && terraform fmt -check -recursive
      - name: Terraform Init
        run: cd src/rack_designer && terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/rack_designer && \
            tflint --init && \
            tflint
      - name: Terraform Plan
        run: cd src/rack_designer && terraform plan
  unit-testing:
    name: Unit testing
    needs:
      - declaring-common-variables
      - performing-static-analysis
    runs-on:
      - ecs-fargate-spot
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m pytest test/rack_designer/pre_deployment/ -v
name: Ensuring Rack Designer exists and is properly configured
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rack_designer.yml'
      - 'src/rack_designer/**'
      - 'test/rack_designer/**'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
