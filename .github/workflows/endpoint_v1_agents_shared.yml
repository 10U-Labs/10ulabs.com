---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.dry_run != 'true'
    name: Deploy Agents Shared Infrastructure
    runs-on:
      - ecs
      - fargate
      - arm
      - spot
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          TF_SHARED_LOCALS="lib/terraform/modules/shared/locals.tf"
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          AWS_REGION=$(grep 'aws_region' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' \
            src/bootstrap/locals.tf | \
            sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          RESOURCE_PREFIX=$(grep 'resource_prefix' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          ROLE_PREFIX="arn:aws:iam::${AWS_ACCOUNT_ID}:role"
          ROLE_NAME="${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          GITHUB_ACTIONS_ROLE_ARN="${ROLE_PREFIX}/${ROLE_NAME}"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          GH_ROLE_ARN="github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN"
          echo "$GH_ROLE_ARN" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.config.outputs.github_actions_role_arn }}
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/endpoint_v1_agents_shared.yml
      - name: Terraform Format Check
        run: |
          cd src/api/endpoints/agents/shared
          terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: cd src/api/endpoints/agents/shared && terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: cd src/api/endpoints/agents/shared && tflint --init && tflint
      - name: Run pylint
        run: |
          python3 -m pylint \
            src/api/endpoints/agents/shared/lambda_layer/github_auth.py \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run mypy
        run: python3 -m mypy src/api/endpoints/agents/shared/lambda_layer/
      - name: Terraform Plan
        run: cd src/api/endpoints/agents/shared && terraform plan
      - name: Run pre-deployment unit tests
        run: |
          python3 -m pytest \
            test/api/endpoints/agents/shared/pre_deployment/unit/ \
            --verbose --pythonwarnings=error
      - name: Run pre-deployment integration tests
        run: |
          python3 -m pytest \
            test/api/endpoints/agents/shared/pre_deployment/integration/ \
            --capture=no --verbose --pythonwarnings=error
      - name: Terraform Apply
        run: cd src/api/endpoints/agents/shared && terraform apply -auto-approve
      - name: Run post-deployment integration tests
        run: |
          python3 -m pytest \
            test/api/endpoints/agents/shared/post_deployment/integration/ \
            --verbose --pythonwarnings=error
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.skip_descendants != 'true' &&
          !contains(github.event.head_commit.message, '[skip descendants]')
        name: Dispatch descendant workflows
        run: |
          SKIP_FLAG=""
          SKIP_INPUT="${{ github.event.inputs.skip_descendants }}"
          if [ "$SKIP_INPUT" = "true" ]; then SKIP_FLAG="--skip-descendants"; fi
          python3 scripts/dispatch_descendants.py \
            $SKIP_FLAG \
            --workflow endpoint_v1_agents_shared \
            --repo ${{ github.repository }}
name: Deploying Agents Shared Infrastructure
on:
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      skip_descendants:
        default: false
        description: Skip dispatching descendant workflows
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
permissions:
  actions: write
  contents: read
  id-token: write
