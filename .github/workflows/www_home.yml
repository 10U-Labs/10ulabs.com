---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-no-comments
        run: |
          python3 -m pip install \
            assert-no-comments
      - name: Assert no comments
        run: >-
          assert-no-comments
          --annotate
          --verbose
          .github/workflows/www_home.yml
          .github/actions/verify-oidc-vars/action.yml
          src/www/paths/home
          lib/python/boto_mocks
          lib/python/lambda_response
          lib/python/module_utils
          lib/python/naming_conventions
          lib/python/repo_utils
          lib/python/terraform_config
          lib/python/test_fixtures
          test/__init__.py
          test/conftest.py
          test/www/conftest.py
          test/www/paths/__init__.py
          test/www/paths/conftest.py
          test/www/paths/home
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-no-inline-directives
      - name: Assert no inline lint disables
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          .github/workflows/www_home.yml
          .github/actions/verify-oidc-vars/action.yml
          src/www/paths/home
          lib/python/boto_mocks
          lib/python/lambda_response
          lib/python/module_utils
          lib/python/naming_conventions
          lib/python/repo_utils
          lib/python/terraform_config
          lib/python/test_fixtures
          test/__init__.py
          test/conftest.py
          test/www/conftest.py
          test/www/paths/__init__.py
          test/www/paths/conftest.py
          test/www/paths/home
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          src/www/paths/home
          lib/python/boto_mocks
          lib/python/lambda_response
          lib/python/module_utils
          lib/python/naming_conventions
          lib/python/repo_utils
          lib/python/terraform_config
          lib/python/test_fixtures
          test/www/paths/home
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-one-assert-per-pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          test/__init__.py
          test/conftest.py
          test/www/conftest.py
          test/www/paths/__init__.py
          test/www/paths/conftest.py
          test/www/paths/home
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-pytest-fixture-name-is-needed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-pytest-fixture-name-is-needed
      - name: Assert pytest fixture name is needed
        run: >-
          assert-pytest-fixture-name-is-needed
          --verbose
          test/__init__.py
          test/conftest.py
          test/www/conftest.py
          test/www/paths/__init__.py
          test/www/paths/conftest.py
          test/www/paths/home
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  copy-paste-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jscpd
        run: npm install -g jscpd@4.0.5
      - name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/boto_mocks \
            lib/python/lambda_response \
            lib/python/module_utils \
            lib/python/naming_conventions \
            lib/python/repo_utils \
            lib/python/terraform_config \
            lib/python/test_fixtures
  copy-paste-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jscpd
        run: npm install -g jscpd@4.0.5
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            test/www/paths/home \
            test/lib/python/test_boto_mocks \
            test/lib/python/test_lambda_response \
            test/lib/python/test_module_utils \
            test/lib/python/test_naming_conventions \
            test/lib/python/test_naming_conventions_helpers \
            test/lib/python/test_repo_utils \
            test/lib/python/test_terraform_config \
            test/lib/python/test_test_fixtures
  e2e-tests:
    if: github.ref == 'refs/heads/main'
    needs: post-deployment-integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install npm dependencies
        run: |
          npm ci --prefix src/www/paths/home
      - name: Install Playwright browsers
        run: |
          npx --prefix src/www/paths/home playwright install chromium
      - env:
          BASE_URL: https://10ulabs.com
        name: Run E2E tests
        run: |
          npm run test:e2e --prefix src/www/paths/home
  jsonlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jsonlint
        run: npm install -g jsonlint
      - name: Linting JSON files
        run: |
          for file in \
            src/www/api/openapi.json \
            src/www/paths/home/components.json \
            src/www/paths/home/package.json
          do
            echo "Validating $file"
            jsonlint -q "$file"
          done
  mypy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            mypy \
            pytest \
            requests \
            types-requests
      - name: Run mypy on source
        run: |
          MYPYPATH=lib/python python3 -m mypy \
            lib/python/boto_mocks \
            lib/python/lambda_response \
            lib/python/module_utils \
            lib/python/naming_conventions \
            lib/python/repo_utils \
            lib/python/terraform_config \
            lib/python/test_fixtures
  mypy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            mypy \
            pytest \
            requests \
            types-requests
      - name: Run mypy
        run: |
          MYPYPATH=lib/python:scripts python3 -m mypy \
            test/__init__.py \
            test/conftest.py \
            test/www/conftest.py \
            test/www/paths/__init__.py \
            test/www/paths/conftest.py \
            test/www/paths/home \
            test/lib/__init__.py \
            test/lib/python/__init__.py \
            test/lib/python/test_boto_mocks \
            test/lib/python/test_lambda_response \
            test/lib/python/test_module_utils \
            test/lib/python/test_naming_conventions \
            test/lib/python/test_naming_conventions_helpers \
            test/lib/python/test_repo_utils \
            test/lib/python/test_terraform_config \
            test/lib/python/test_test_fixtures
  post-deployment-integration-tests:
    if: github.ref == 'refs/heads/main'
    needs: reconciliation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            requests
      - id: terraform
        name: Extract Terraform version
        run: |
          TF_FILE=src/www/common/backend.tf
          TERRAFORM_VERSION=$(grep 'required_version' $TF_FILE \
            | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - name: Install npm dependencies
        run: |
          npm ci --prefix src/www/paths/home
      - name: Install Playwright browsers
        run: |
          npx --prefix src/www/paths/home playwright install chromium
      - env:
          BASE_URL: https://10ulabs.com
        name: Run post-deployment integration tests
        run: |
          npm run test:integration --prefix src/www/paths/home
      - name: Run post-deployment integration tests with pytest
        run: |
          TEST=test/www/paths/home
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST/post_deployment/integration/ \
            --confcutdir=test --verbose --pythonwarnings=error
  pre-deployment-integration-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            requests
      - id: terraform
        name: Extract Terraform version
        run: |
          TF_FILE=src/www/common/backend.tf
          TERRAFORM_VERSION=$(grep 'required_version' $TF_FILE \
            | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - name: Run pre-deployment integration tests
        run: |
          TEST=test/www/paths/home
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST/pre_deployment/integration/ \
            --capture=no --confcutdir=test --verbose --pythonwarnings=error
  pylint-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pylint \
            pytest \
            requests
      - name: Run pylint on source
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/boto_mocks \
            lib/python/lambda_response \
            lib/python/module_utils \
            lib/python/naming_conventions \
            lib/python/repo_utils \
            lib/python/terraform_config \
            lib/python/test_fixtures \
            --recursive=y \
            --disable=missing-module-docstring \
            --disable=missing-class-docstring \
            --disable=missing-function-docstring \
            --fail-on=C,R,W --fail-under=10.0
  pylint-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pylint \
            pytest \
            requests
      - name: Run pylint
        run: |
          PYTHONPATH=lib/python:scripts python3 -m pylint \
            test/__init__.py \
            test/conftest.py \
            test/www/conftest.py \
            test/www/paths/__init__.py \
            test/www/paths/conftest.py \
            test/www/paths/home \
            test/lib/__init__.py \
            test/lib/python/__init__.py \
            test/lib/python/test_boto_mocks \
            test/lib/python/test_lambda_response \
            test/lib/python/test_module_utils \
            test/lib/python/test_naming_conventions \
            test/lib/python/test_naming_conventions_helpers \
            test/lib/python/test_repo_utils \
            test/lib/python/test_terraform_config \
            test/lib/python/test_test_fixtures \
            --recursive=y \
            --disable=missing-module-docstring \
            --disable=missing-class-docstring \
            --disable=missing-function-docstring \
            --fail-on=C,R,W --fail-under=10.0
  reconciliation:
    if: github.ref == 'refs/heads/main'
    needs:
      - assert-no-comments
      - assert-no-inline-directives
      - assert-no-linter-config-files
      - assert-one-assert-per-pytest
      - assert-pytest-fixture-name-is-needed
      - copy-paste-source
      - copy-paste-tests
      - jsonlint
      - mypy-source
      - mypy-tests
      - pre-deployment-integration-tests
      - pylint-source
      - pylint-tests
      - test-boto-mocks
      - test-lambda-response
      - test-module-utils
      - test-naming-conventions
      - test-repo-utils
      - test-terraform-config
      - test-test-fixtures
      - unit-tests
      - yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore
      - id: terraform
        name: Extract Terraform version
        run: |
          TF_FILE=src/www/common/backend.tf
          TERRAFORM_VERSION=$(grep 'required_version' $TF_FILE \
            | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - name: Get bucket name from common Terraform
        run: |
          terraform -chdir=src/www/common init \
            -backend=true -input=false > /dev/null
          BUCKET_NAME=$(terraform -chdir=src/www/common output -raw bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
      - name: Build website
        run: |
          npm ci --prefix src/www/paths/home && \
            npm run build --prefix src/www/paths/home
      - name: Sync website to S3
        run: |
          aws s3 sync src/www/paths/home/dist/ \
            s3://${{ env.BUCKET_NAME }}/home/ --delete \
            --cache-control no-cache \
            --storage-class ONEZONE_IA
      - if: >-
          github.event_name == 'push' ||
          github.event.inputs.invalidate_cloudfront == 'true'
        name: Get website domain from Terraform output
        run: |
          WEBSITE_FQDN=$(terraform -chdir=src/www/common \
            output -raw website_domain_name)
          echo "WEBSITE_FQDN=$WEBSITE_FQDN" >> $GITHUB_ENV
      - if: >-
          github.event_name == 'push' ||
          github.event.inputs.invalidate_cloudfront == 'true'
        name: Invalidate CloudFront cache
        run: |
          python3 scripts/invalidate_cloudfront.py \
            --fqdn "${{ env.WEBSITE_FQDN }}" \
            --region ${{ vars.AWS_REGION }} \
            --paths "/home/*"
  test-boto-mocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run boto_mocks tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_boto_mocks/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=boto_mocks \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-lambda-response:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run lambda_response tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_lambda_response/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=lambda_response \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-module-utils:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run module_utils tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_module_utils/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=module_utils \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-naming-conventions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run naming_conventions tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_naming_conventions/ \
            test/lib/python/test_naming_conventions_helpers/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=naming_conventions \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-repo-utils:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run repo_utils tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_repo_utils/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=repo_utils \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-terraform-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run terraform_config tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_terraform_config/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=terraform_config \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  test-test-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run test_fixtures tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_test_fixtures/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=test_fixtures \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install npm dependencies
        run: |
          npm ci --prefix src/www/paths/home
      - name: Run unit tests
        run: |
          npm test --prefix src/www/paths/home
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            yamllint
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/www_home.yml
name: www_home
on:
  push:
    branches:
      - main
    paths:
      - .github/actions/verify-oidc-vars/action.yml
      - .github/workflows/www_home.yml
      - lib/python/boto_mocks/**
      - lib/python/lambda_response/**
      - lib/python/module_utils/**
      - lib/python/naming_conventions/**
      - lib/python/repo_utils/**
      - lib/python/terraform_config/**
      - lib/python/test_fixtures/**
      - src/www/paths/home/**
      - test/__init__.py
      - test/conftest.py
      - test/lib/__init__.py
      - test/lib/python/__init__.py
      - test/lib/python/test_boto_mocks/**
      - test/lib/python/test_lambda_response/**
      - test/lib/python/test_module_utils/**
      - test/lib/python/test_naming_conventions/**
      - test/lib/python/test_naming_conventions_helpers/**
      - test/lib/python/test_repo_utils/**
      - test/lib/python/test_terraform_config/**
      - test/lib/python/test_test_fixtures/**
      - test/www/__init__.py
      - test/www/conftest.py
      - test/www/paths/__init__.py
      - test/www/paths/conftest.py
      - test/www/paths/home/**
  workflow_dispatch:
    inputs:
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
permissions:
  contents: read
  id-token: write
