---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy home page
    runs-on: >-
      ${{ ( vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - continue-on-error: true
        id: no_linter_configs_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no linter config files (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-linter-config-files@latest
        with:
          directories: ${{ github.workspace }}
          linters: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_linter_configs_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no linter config files (self-hosted)
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - continue-on-error: true
        id: no_inline_disables_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no inline lint disables (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-inline-lint-disables@latest
        with:
          files: ${{ github.workspace }}/**/*
          linters: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_inline_disables_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no inline lint disables (self-hosted)
        run: >-
          assert-no-inline-lint-disables
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/**/*
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            mypy \
            pylint \
            pytest \
            python-hcl2 \
            requests \
            types-PyYAML \
            types-requests \
            yamllint
      - continue-on-error: true
        id: yamllint
        name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/www_home.yml
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install jsonlint
        run: npm install -g jsonlint
      - continue-on-error: true
        id: jsonlint
        name: Linting JSON files
        run: |
          # Note: tsconfig files use JSONC (JSON with Comments) format
          # which jsonlint doesn't support, so we skip them here
          for file in \
            src/www/api/openapi.json \
            src/www/paths/home/components.json \
            src/www/paths/home/package.json
          do
            echo "Validating $file"
            jsonlint -q "$file"
          done
      - continue-on-error: true
        id: pylint
        name: Run pylint
        run: |
          PYTHONPATH=lib/python python3 -m pylint lib/python/ test/www/paths/ \
            --fail-on=C,R,W --fail-under=10.0
      - continue-on-error: true
        id: mypy
        name: Run mypy
        run: |
          MYPYPATH=lib/python:src/api/endpoints/runners/lambda python3 -m mypy \
            lib/python/ test/
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install jscpd
        run: npm install -g jscpd
      - continue-on-error: true
        id: jscpd
        name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/
      - continue-on-error: true
        id: npm_install
        name: Install npm dependencies
        run: npm ci --prefix src/www/paths/home
      - continue-on-error: true
        id: unit_tests
        name: Run unit tests
        run: npm test --prefix src/www/paths/home
      - id: terraform
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Extract Terraform version
        run: |
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/www/common/backend.tf | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - continue-on-error: true
        id: pre_integration_tests
        name: Run pre-deployment integration tests
        run: |
          python3 -m pytest \
            test/www/paths/home/pre_deployment/integration/ \
            --capture=no --verbose --pythonwarnings=error
      - continue-on-error: true
        id: terraform_init
        name: Get bucket name from common Terraform
        run: |
          terraform -chdir=src/www/common init \
            -backend=true -input=false > /dev/null
          BUCKET_NAME=$(terraform -chdir=src/www/common output -raw bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
      - continue-on-error: true
        id: build
        name: Build website
        run: |
          npm ci --prefix src/www/paths/home && \
            npm run build --prefix src/www/paths/home
      - continue-on-error: true
        id: s3_sync
        name: Sync website to S3
        run: |
          aws s3 sync src/www/paths/home/dist/ \
            s3://${{ env.BUCKET_NAME }}/home/ --delete \
            --cache-control no-cache \
            --storage-class ONEZONE_IA
      - id: check_files
        name: Check if website files changed
        run: |
          set -e
          set -o pipefail
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE_COMMIT="${{ github.event.before }}"
          else
            BASE_COMMIT="HEAD^"
          fi
          git diff --name-only $BASE_COMMIT ${{ github.sha }} | \
            if grep -qE 'src/www/paths/home/'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
          '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Get website domain from Terraform output
        run: |
          WEBSITE_FQDN=$(terraform -chdir=src/www/common \
            output -raw website_domain_name)
          echo "WEBSITE_FQDN=$WEBSITE_FQDN" >> $GITHUB_ENV
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
          '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Invalidate CloudFront cache
        run: |
          python3 scripts/invalidate_cloudfront.py \
            --fqdn "${{ env.WEBSITE_FQDN }}" \
            --region ${{ vars.AWS_REGION }} \
            --paths "/home/*"
      - continue-on-error: true
        id: playwright_install
        name: Install Playwright browsers
        run: npx --prefix src/www/paths/home playwright install chromium
      - continue-on-error: true
        env:
          BASE_URL: https://10ulabs.com
        id: post_integration_tests
        name: Run post-deployment integration tests
        run: npm run test:integration --prefix src/www/paths/home
      - continue-on-error: true
        env:
          BASE_URL: https://10ulabs.com
        id: e2e_tests
        name: Run E2E tests
        run: npm run test:e2e --prefix src/www/paths/home
      - env:
          S01: ${{ steps.no_linter_configs_gh.outcome }}
          S02: ${{ steps.no_linter_configs_sh.outcome }}
          S03: ${{ steps.no_inline_disables_gh.outcome }}
          S04: ${{ steps.no_inline_disables_sh.outcome }}
          S05: ${{ steps.yamllint.outcome }}
          S06: ${{ steps.jsonlint.outcome }}
          S07: ${{ steps.pylint.outcome }}
          S08: ${{ steps.mypy.outcome }}
          S09: ${{ steps.jscpd.outcome }}
          S10: ${{ steps.npm_install.outcome }}
          S11: ${{ steps.unit_tests.outcome }}
          S12: ${{ steps.pre_integration_tests.outcome }}
          S13: ${{ steps.terraform_init.outcome }}
          S14: ${{ steps.build.outcome }}
          S15: ${{ steps.s3_sync.outcome }}
          S16: ${{ steps.playwright_install.outcome }}
          S17: ${{ steps.post_integration_tests.outcome }}
          S18: ${{ steps.e2e_tests.outcome }}
        name: Assert no step failed
        run: |
          failed=""
          f="failure"
          [ "$S01" = "$f" ] && failed="$failed no_linter_configs_gh"
          [ "$S02" = "$f" ] && failed="$failed no_linter_configs_sh"
          [ "$S03" = "$f" ] && failed="$failed no_inline_disables_gh"
          [ "$S04" = "$f" ] && failed="$failed no_inline_disables_sh"
          [ "$S05" = "$f" ] && failed="$failed yamllint"
          [ "$S06" = "$f" ] && failed="$failed jsonlint"
          [ "$S07" = "$f" ] && failed="$failed pylint"
          [ "$S08" = "$f" ] && failed="$failed mypy"
          [ "$S09" = "$f" ] && failed="$failed jscpd"
          [ "$S10" = "$f" ] && failed="$failed npm_install"
          [ "$S11" = "$f" ] && failed="$failed unit_tests"
          [ "$S12" = "$f" ] && failed="$failed pre_integration_tests"
          [ "$S13" = "$f" ] && failed="$failed terraform_init"
          [ "$S14" = "$f" ] && failed="$failed build"
          [ "$S15" = "$f" ] && failed="$failed s3_sync"
          [ "$S16" = "$f" ] && failed="$failed playwright_install"
          [ "$S17" = "$f" ] && failed="$failed post_integration_tests"
          [ "$S18" = "$f" ] && failed="$failed e2e_tests"
          if [ -n "$failed" ]; then
            echo "Steps that failed:$failed"
            exit 1
          fi
          echo "All steps succeeded"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (
          github.event.inputs.trigger_descendants == 'true' ||
           contains(github.event.head_commit.message,
           '[trigger descendants]'))
        name: Dispatch descendant workflows
        run: |
          FLAGS=""
          TRIGGER="${{ github.event.inputs.trigger_descendants }}"
          INVALIDATE="${{ github.event.inputs.invalidate_cloudfront }}"
          if [ "$TRIGGER" = "true" ]; then
            FLAGS="$FLAGS --trigger-descendants"
          fi
          if [ "$INVALIDATE" = "true" ]; then
            FLAGS="$FLAGS --invalidate-cloudfront"
          fi
          python3 src/workflowctl/workflowctl.py dispatch-descendant-workflows \
            --workflow www_home \
            --repo ${{ github.repository }} \
            $FLAGS
name: Ensuring www home page exists and is properly configured
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      trigger_descendants:
        default: false
        description: Trigger descendant workflows after this workflow completes
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
