concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  declaring-common-variables:
    if: github.ref == 'refs/heads/main'
    name: Declaring common variables
    outputs:
      aws_region: ${{ steps.shared.outputs.aws_region }}
      github_actions_role_arn: ${{ steps.shared.outputs.github_actions_role_arn }}
      terraform_version: ${{ steps.shared.outputs.terraform_version }}
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate-spot", "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: shared
        name: Extract shared configuration values
        run: |
          AWS_REGION=$(grep -A1 'output "aws_region"' lib/terraform/outputs.tf | grep 'value' | cut -d'"' -f2)
          AWS_ACCOUNT_ID=$(grep -A1 'output "aws_account_id"' lib/terraform/outputs.tf | grep 'value' | cut -d'"' -f2)
          RESOURCE_PREFIX=$(grep -A1 'output "resource_prefix"' lib/terraform/outputs.tf | grep 'value' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' src/bootstrap/locals.tf | sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          GITHUB_ACTIONS_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          TERRAFORM_VERSION=$(grep 'required_version' src/api/endpoints/runners/backend.tf | cut -d'"' -f2 | sed 's/>= //')
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.shared.outputs.terraform_version }}
          terraform_wrapper: false
  ensuring-endpoint-infrastructure-in-desired-state:
    name: Ensuring endpoint infrastructure is in desired state
    needs:
      - declaring-common-variables
      - unit-testing
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate-spot", "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - name: Terraform Init
        run: cd src/api/endpoints/runners && terraform init
      - name: Terraform Apply
        run: cd src/api/endpoints/runners && terraform apply -auto-approve
  integration-testing:
    name: Integration testing
    needs:
      - declaring-common-variables
      - ensuring-endpoint-infrastructure-in-desired-state
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate-spot", "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3 PyYAML requests
      - name: Run integration tests
        run: |
          python3 -m pytest test/api/endpoints/runners/post_deployment/integration/ \
            --confcutdir=test/api/endpoints/runners \
            -v
  performing-static-analysis:
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate-spot", "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install linting dependencies
        run: python3 -m pip install pylint mypy yamllint pytest boto3 boto3-stubs PyYAML types-PyYAML requests types-requests
      - name: Linting YAML files
        run: |
          DOCUMENT_START='document-start: disable'
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: {max: 300, level: warning}'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$DOCUMENT_START, $EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/runners.yml
      - name: Linting Python files
        run: |
          for file in src/api/endpoints/runners/lambdas/*.py; do
            python3 -m pylint "$file" \
              --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
              --fail-on=C,R,W \
              --fail-under=10.0
          done
          python3 -m pylint test/api/endpoints/runners/ \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Static type checking Python files with mypy
        run: |
          for file in src/api/endpoints/runners/lambdas/*.py; do
            python3 -m mypy "$file"
          done
          python3 -m mypy test/api/endpoints/runners/
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - name: Terraform Format Check
        run: cd src/api/endpoints/runners && terraform fmt -check -recursive
      - name: Terraform Init
        run: cd src/api/endpoints/runners && terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api/endpoints/runners && \
            tflint --init && \
            tflint
      - name: Terraform Plan
        run: cd src/api/endpoints/runners && terraform plan
  unit-testing:
    name: Unit testing
    needs:
      - declaring-common-variables
      - performing-static-analysis
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate-spot", "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3 PyYAML
      - name: Run unit tests
        run: |
          python3 -m pytest test/api/endpoints/runners/pre_deployment/ \
            --confcutdir=test/api/endpoints/runners \
            -v
name: Ensuring the /v1/runners API endpoint exists and is properly configured
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/runners.yml'
      - 'src/api/endpoints/runners/**'
      - 'test/api/endpoints/runners/**'
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
permissions:
  contents: read
  id-token: write
