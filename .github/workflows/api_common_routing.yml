---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy API common routing
    runs-on: >-
      ${{ ( vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - continue-on-error: true
        id: no_linter_configs_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no linter config files (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-linter-config-files@latest
        with:
          directories: ${{ github.workspace }}
          linters: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_linter_configs_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no linter config files (self-hosted)
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - continue-on-error: true
        id: no_inline_disables_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no inline lint disables (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-inline-directives@latest
        with:
          files: ${{ github.workspace }}/**/*
          tools: pylint,mypy,yamllint
          verbose: true
      - continue-on-error: true
        id: no_inline_disables_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no inline lint disables (self-hosted)
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/**/*
      - continue-on-error: true
        id: one_assert_per_pytest_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert one assert per pytest (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-one-assert-per-pytest@latest
        with:
          files: ${{ github.workspace }}/test/**/*.py
          verbose: true
      - continue-on-error: true
        id: one_assert_per_pytest_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert one assert per pytest (self-hosted)
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            mypy \
            pylint \
            pytest \
            pytest-dependency \
            python-hcl2 \
            requests \
            types-PyYAML \
            types-requests \
            yamllint
      - continue-on-error: true
        id: yamllint
        name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/api_common_routing.yml
      - continue-on-error: true
        id: pylint_source
        name: Run pylint on source
        run: |
          python3 -m pylint \
            lib/python/ src/api/common/routing/lambdas/*.py \
            --fail-on=C,R,W \
            --fail-under=10.0
      - continue-on-error: true
        id: pylint_tests
        name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/ test/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - continue-on-error: true
        id: mypy_source
        name: Run mypy on source
        run: |
          python3 -m mypy lib/python/ src/api/common/routing/lambdas/*.py
      - continue-on-error: true
        id: mypy_tests
        name: Run mypy on tests
        run: |
          MYPYPATH=lib/python:src/api/endpoints/runners/lambda python3 -m mypy \
            lib/python/ test/
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install jscpd
        run: npm install -g jscpd
      - continue-on-error: true
        id: jscpd_source
        name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ src/api/common/routing/lambdas/
      - continue-on-error: true
        id: jscpd_tests
        name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/
      - id: terraform
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Extract Terraform version
        run: |
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/api/common/routing/backend.tf | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> "$GITHUB_OUTPUT"
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - continue-on-error: true
        id: terraform_fmt
        name: Terraform Format Check
        run: |
          cd src/api/common/routing && terraform fmt -diff -check -recursive
      - continue-on-error: true
        id: terraform_init
        name: Terraform Init
        run: cd src/api/common/routing && terraform init
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        id: tflint
        name: Run tflint
        run: cd src/api/common/routing && tflint --init && tflint
      - continue-on-error: true
        id: unit_tests
        name: Run unit tests
        run: |
          python3 -m pytest \
            test/api/common/routing/pre_deployment/unit/ \
            --verbose --pythonwarnings=error
      - continue-on-error: true
        id: pre_integration_tests
        name: Run pre-deployment integration tests
        run: |
          python3 -m pytest \
            test/api/common/routing/pre_deployment/integration/ \
            --capture=no --verbose --pythonwarnings=error
      - continue-on-error: true
        env:
          TF_VAR_recaptcha_secret_key: ${{ secrets.RECAPTCHA_SECRET_KEY }}
        id: terraform_apply
        name: Terraform Apply
        run: cd src/api/common/routing && terraform apply -auto-approve
      - id: check_files
        name: Check if static files changed
        run: |
          set -e
          set -o pipefail
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE_COMMIT="${{ github.event.before }}"
          else
            BASE_COMMIT="HEAD^"
          fi
          API_PATTERN='src/www/api/(index\.html|openapi\.json|404\.html)'
          git diff --name-only $BASE_COMMIT ${{ github.sha }} | \
            if grep -qE "$API_PATTERN"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Get API domain from Terraform output
        run: |
          API_FQDN=$(cd src/api/common/routing && \
            terraform output -raw api_fqdn)
          echo "API_FQDN=$API_FQDN" >> "$GITHUB_ENV"
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Invalidate CloudFront cache
        run: |
          python3 scripts/invalidate_cloudfront.py \
            --fqdn "${{ env.API_FQDN }}" \
            --region "${{ vars.AWS_REGION }}" \
            --paths "/,/index.html,/openapi.json,/404.html"
      - continue-on-error: true
        id: post_integration_tests
        name: Run post-deployment integration tests
        run: |
          python3 -m pytest \
            test/api/common/routing/post_deployment/integration/ \
            --verbose --pythonwarnings=error
      - continue-on-error: true
        id: e2e_tests
        name: Run E2E tests
        run: |
          python3 -m pytest \
            test/api/common/routing/post_deployment/e2e/ \
            --verbose --pythonwarnings=error
      - env:
          S01: ${{ steps.no_linter_configs_gh.outcome }}
          S02: ${{ steps.no_linter_configs_sh.outcome }}
          S03: ${{ steps.no_inline_disables_gh.outcome }}
          S04: ${{ steps.no_inline_disables_sh.outcome }}
          S05: ${{ steps.one_assert_per_pytest_gh.outcome }}
          S06: ${{ steps.one_assert_per_pytest_sh.outcome }}
          S07: ${{ steps.yamllint.outcome }}
          S08: ${{ steps.pylint_source.outcome }}
          S09: ${{ steps.pylint_tests.outcome }}
          S10: ${{ steps.mypy_source.outcome }}
          S11: ${{ steps.mypy_tests.outcome }}
          S12: ${{ steps.jscpd_source.outcome }}
          S13: ${{ steps.jscpd_tests.outcome }}
          S14: ${{ steps.terraform_fmt.outcome }}
          S15: ${{ steps.terraform_init.outcome }}
          S16: ${{ steps.tflint.outcome }}
          S17: ${{ steps.unit_tests.outcome }}
          S18: ${{ steps.pre_integration_tests.outcome }}
          S19: ${{ steps.terraform_apply.outcome }}
          S20: ${{ steps.post_integration_tests.outcome }}
          S21: ${{ steps.e2e_tests.outcome }}
        name: Assert no step failed
        run: |
          failed=""
          f="failure"
          [ "$S01" = "$f" ] && failed="$failed no_linter_configs_gh"
          [ "$S02" = "$f" ] && failed="$failed no_linter_configs_sh"
          [ "$S03" = "$f" ] && failed="$failed no_inline_disables_gh"
          [ "$S04" = "$f" ] && failed="$failed no_inline_disables_sh"
          [ "$S05" = "$f" ] && failed="$failed one_assert_per_pytest_gh"
          [ "$S06" = "$f" ] && failed="$failed one_assert_per_pytest_sh"
          [ "$S07" = "$f" ] && failed="$failed yamllint"
          [ "$S08" = "$f" ] && failed="$failed pylint_source"
          [ "$S09" = "$f" ] && failed="$failed pylint_tests"
          [ "$S10" = "$f" ] && failed="$failed mypy_source"
          [ "$S11" = "$f" ] && failed="$failed mypy_tests"
          [ "$S12" = "$f" ] && failed="$failed jscpd_source"
          [ "$S13" = "$f" ] && failed="$failed jscpd_tests"
          [ "$S14" = "$f" ] && failed="$failed terraform_fmt"
          [ "$S15" = "$f" ] && failed="$failed terraform_init"
          [ "$S16" = "$f" ] && failed="$failed tflint"
          [ "$S17" = "$f" ] && failed="$failed unit_tests"
          [ "$S18" = "$f" ] && failed="$failed pre_integration_tests"
          [ "$S19" = "$f" ] && failed="$failed terraform_apply"
          [ "$S20" = "$f" ] && failed="$failed post_integration_tests"
          [ "$S21" = "$f" ] && failed="$failed e2e_tests"
          if [ -n "$failed" ]; then
            echo "Steps that failed:$failed"
            exit 1
          fi
          echo "All steps succeeded"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (
          github.event.inputs.trigger_descendants == 'true' ||
           contains(github.event.head_commit.message,
           '[trigger descendants]'))
        name: Dispatch descendant workflows
        run: |
          FLAGS=""
          TRIGGER="${{ github.event.inputs.trigger_descendants }}"
          INVALIDATE="${{ github.event.inputs.invalidate_cloudfront }}"
          if [ "$TRIGGER" = "true" ]; then
            FLAGS="$FLAGS --trigger-descendants"
          fi
          if [ "$INVALIDATE" = "true" ]; then
            FLAGS="$FLAGS --invalidate-cloudfront"
          fi
          python3 src/workflowctl/workflowctl.py dispatch-descendant-workflows \
            --workflow api_common_routing \
            --repo ${{ github.repository }} \
            $FLAGS
name: Ensuring API common routing exists and is properly configured
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      trigger_descendants:
        default: false
        description: Trigger descendant workflows after this workflow completes
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
