---
concurrency:
  cancel-in-progress: false
  group: website/terraform.tfstate
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy www_common infrastructure
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-no-inline-directives \
            assert-no-linter-config-files \
            assert-one-assert-per-pytest \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            mypy \
            pylint \
            pytest \
            pytest-dependency \
            'python-hcl2<8' \
            requests \
            types-PyYAML \
            types-requests \
            yamllint
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - name: Assert no inline lint disables
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}/**/*
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/www_common.yml
      - name: Run pylint on source
        run: |
          python3 -m pylint \
            src/www/common/lambda/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/ test/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run mypy on source
        run: |
          python3 -m mypy \
            src/www/common/lambda/
      - name: Run mypy on tests
        run: |
          MYPYPATH=lib/python:scripts python3 -m mypy lib/python/ test/
      - name: Install jscpd
        run: npm install -g jscpd@4.0.5
      - name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            src/www/common/lambda/
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/
      - id: terraform
        name: Extract Terraform version
        run: |
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/www/common/backend.tf | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - name: Terraform Format Check
        run: cd src/www/common && terraform fmt -diff -check -recursive
      - name: Terraform Format Check on s3_bucket module
        run: cd lib/terraform/s3_bucket && terraform fmt -diff -check
      - name: Terraform Init
        run: cd src/www/common && terraform init
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: cd src/www/common && tflint --init && tflint
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint on s3_bucket module
        run: cd lib/terraform/s3_bucket && tflint --init && tflint
      - name: Run module unit tests
        run: |
          TEST_DIRS="test/lib/terraform/s3_bucket/unit/"
          TEST_DIRS="$TEST_DIRS test/lib/terraform/write_ahead_queue/unit/"
          TEST_DIRS="$TEST_DIRS test/lib/terraform/common/unit/"
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST_DIRS \
            --confcutdir=test --verbose --pythonwarnings=error
      - name: Run unit tests
        run: |
          TEST=test/www/common
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST/pre_deployment/unit/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - name: Run pre-deployment integration tests
        run: |
          TEST=test/www/common
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST/pre_deployment/integration/ \
            --capture=no --confcutdir=test --verbose --pythonwarnings=error
      - name: Terraform Plan
        run: |
          cd src/www/common && \
            terraform plan
      - name: Terraform Apply
        run: cd src/www/common && terraform apply -auto-approve
      - if: >-
          github.event_name == 'push' ||
          github.event.inputs.invalidate_cloudfront == 'true'
        name: Get website domain from Terraform output
        run: |
          WEBSITE_FQDN=$(cd src/www/common && \
            terraform output -raw website_domain_name)
          echo "WEBSITE_FQDN=$WEBSITE_FQDN" >> $GITHUB_ENV
      - if: >-
          github.event_name == 'push' ||
          github.event.inputs.invalidate_cloudfront == 'true'
        name: Invalidate CloudFront cache
        run: |
          python3 scripts/invalidate_cloudfront.py \
            --fqdn "${{ env.WEBSITE_FQDN }}" \
            --region "${{ vars.AWS_REGION }}" \
            --paths "/*"
      - name: Run post-deployment integration tests
        run: |
          TEST=test/www/common
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST/post_deployment/integration/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - name: Run E2E tests
        run: |
          TEST=test/www/common
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST/post_deployment/e2e/ \
            --confcutdir=test --verbose --pythonwarnings=error
name: www_common
on:
  push:
    branches:
      - main
    paths:
      - .github/actions/verify-oidc-vars/action.yml
      - .github/workflows/www_common.yml
      - lib/terraform/common/**
      - lib/terraform/s3_bucket/**
      - lib/terraform/write_ahead_queue/**
      - src/www/common/**
      - test/__init__.py
      - test/conftest.py
      - test/lib/terraform/common/**
      - test/lib/terraform/conftest.py
      - test/lib/terraform/s3_bucket/**
      - test/lib/terraform/write_ahead_queue/**
      - test/www/common/**
      - test/www/conftest.py
  workflow_dispatch:
    inputs:
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
permissions:
  contents: read
  id-token: write
