---
# Workflow Orchestrator
#
# This workflow responds to push events on main, calculates which root workflow
# needs to run based on changed files, and dispatches it (fire-and-forget).
# Descendant workflows are triggered automatically via workflow_run events.
concurrency:
  cancel-in-progress: true
  group: orchestrator-${{ github.ref }}
jobs:
  orchestrate:
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: >-
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    name: Orchestrating workflows
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        name: Get changed files
        run: |
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          EOF_MARKER=$(openssl rand -hex 8)
          {
            echo "changed<<$EOF_MARKER"
            echo "$CHANGED"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - id: plan
        name: Compute root workflow
        run: |
          GRAPH="etc/workflow-dependencies.yml"
          START_FROM="${{ inputs.start_from }}"
          if [ -n "$START_FROM" ]; then
            echo "Manual trigger: starting from '$START_FROM'"
            ROOT="$START_FROM"
          else
            CHANGED="${{ steps.files.outputs.changed }}"
            ROOT=$(echo "$CHANGED" | python3 scripts/compute_root_workflows.py \
              --graph $GRAPH --levels --indexed | jq -r '.[0].name // empty')
          fi
          echo "Root workflow: $ROOT"
          echo "root_workflow=$ROOT" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.root_workflow == ''
        name: No workflows to dispatch
        run: echo "No workflow-related files changed"
      - if: >-
          steps.plan.outputs.root_workflow != '' &&
          (inputs.dry_run == true ||
           contains(github.event.head_commit.message, '[dry run]'))
        name: Dry run
        run: |
          echo "Would dispatch: ${{ steps.plan.outputs.root_workflow }}.yml"
      - if: >-
          steps.plan.outputs.root_workflow != '' &&
          inputs.dry_run != true &&
          !contains(github.event.head_commit.message, '[dry run]')
        name: Dispatch root workflow (fire-and-forget)
        run: |
          WORKFLOW="${{ steps.plan.outputs.root_workflow }}"
          echo "Dispatching ${WORKFLOW}.yml..."
          gh workflow run ".github/workflows/${WORKFLOW}.yml" \
            --repo ${{ github.repository }}
          echo "Root workflow dispatched (fire-and-forget)"
          echo "Descendants will trigger automatically via workflow_run"
name: Workflow Orchestrator
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        type: boolean
      github_hosted:
        default: false
        description: Use GitHub-hosted runners
        type: boolean
      start_from:
        description: 'Workflow to start from (e.g., "health", "bootstrap")'
        type: string
permissions:
  actions: write
  contents: read
