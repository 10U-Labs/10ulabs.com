---
# Workflow Orchestrator
#
# This is the ONLY workflow that responds to push events on main.
# It analyzes changed files and triggers the appropriate root workflows.
#
# Root workflows are those whose files changed but have no ancestors that
# also changed. The orchestrator executes all workflows sequentially.
concurrency:
  cancel-in-progress: true
  group: orchestrator-${{ github.ref }}
jobs:
  concluding-no-workflows-should-be-dispatched:
    if: >-
      needs.determining.outputs.has_roots != 'true' ||
      contains(github.event.head_commit.message, '[skip ci]')
    name: Concluding no workflows should be dispatched
    needs: determining
    runs-on: ubuntu-latest
    steps:
      - name: No workflows to trigger
        run: |
          echo "No root workflows to trigger for this commit."
          echo "Either:"
          echo "  - No workflow-related files were changed"
          echo "  - Commit message contains [skip ci]"
  concluding-workflows-should-be-dispatched:
    if: >-
      needs.determining.outputs.has_roots == 'true' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    name: Concluding workflows should be dispatched
    needs: determining
    outputs:
      execution_plan: ${{ needs.determining.outputs.execution_plan }}
      root_workflows: ${{ needs.determining.outputs.root_workflows }}
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "Root workflows:"
          echo '${{ needs.determining.outputs.root_workflows }}' | jq -r '.[]'
          echo ""
          echo "Full execution plan:"
          echo '${{ needs.determining.outputs.execution_plan }}' | jq -r '.[]'
  determining:
    if: github.ref == 'refs/heads/main'
    name: Determining if workflows should be dispatched or not
    outputs:
      execution_plan: ${{ steps.compute.outputs.execution_plan }}
      has_roots: ${{ steps.compute.outputs.has_roots }}
      root_workflows: ${{ steps.compute.outputs.roots }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        name: Get changed files
        run: |
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          EOF_MARKER=$(openssl rand -hex 8)
          {
            echo "changed<<$EOF_MARKER"
            echo "$CHANGED"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - id: compute
        name: Compute root workflows and execution plan
        run: |
          GRAPH="etc/workflow-dependencies.yml"
          ROOTS=$(echo "${{ steps.files.outputs.changed }}" | \
            python3 scripts/compute_root_workflows.py --graph $GRAPH)
          PLAN=$(echo "${{ steps.files.outputs.changed }}" | \
            python3 scripts/compute_root_workflows.py --graph $GRAPH --execution-plan)
          echo "Root workflows: $ROOTS"
          echo "Execution plan: $PLAN"
          echo "roots=$ROOTS" >> "$GITHUB_OUTPUT"
          echo "execution_plan=$PLAN" >> "$GITHUB_OUTPUT"
          if [ "$ROOTS" = "[]" ]; then
            echo "has_roots=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_roots=true" >> "$GITHUB_OUTPUT"
          fi
  dispatching-workflows:
    name: Dispatching workflows
    needs: concluding-workflows-should-be-dispatched
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Execute workflow plan sequentially
        run: |
          GITHUB_HOSTED_FLAG=""
          if [[ "${{ github.event.head_commit.message }}" == *"[github-hosted]"* ]]; then
            GITHUB_HOSTED_FLAG="--github-hosted"
          fi
          python3 scripts/execute_workflow_plan.py \
            --plan '${{ needs.concluding-workflows-should-be-dispatched.outputs.execution_plan }}' \
            $GITHUB_HOSTED_FLAG
name: Workflow Orchestrator
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  actions: write
  contents: read
