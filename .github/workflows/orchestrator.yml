---
# Workflow Orchestrator
#
# This workflow responds to push events on main, calculates which root workflow
# needs to run based on changed files, and dispatches it (fire-and-forget).
# Descendant workflows are triggered via dispatch_descendants.py script.
concurrency:
  cancel-in-progress: true
  group: orchestrator-${{ github.ref }}
jobs:
  orchestrate:
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: >-
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    name: Orchestrating workflows
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate required files
        run: |
          echo "Validating required files exist..."
          if [ ! -f "etc/workflow-dependencies.json" ]; then
            echo "Error: etc/workflow-dependencies.json not found"
            exit 1
          fi
          if [ ! -f "scripts/compute_root_workflows.py" ]; then
            echo "Error: scripts/compute_root_workflows.py not found"
            exit 1
          fi
          if [ ! -f "scripts/get_running_workflows.py" ]; then
            echo "Error: scripts/get_running_workflows.py not found"
            exit 1
          fi
          if [ ! -f "scripts/cancel_workflows.py" ]; then
            echo "Error: scripts/cancel_workflows.py not found"
            exit 1
          fi
          if [ ! -f "scripts/workflow_utils.py" ]; then
            echo "Error: scripts/workflow_utils.py not found"
            exit 1
          fi
          echo "All required files present"
      - id: files
        name: Get changed files
        run: |
          echo "Getting changed files..."
          echo "Event before: ${{ github.event.before }}"
          echo "Current SHA: ${{ github.sha }}"
          # More robust base commit detection
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$ZERO" ]; then
            # Initial commit or force push
            BASE="HEAD~1"
            echo "Using HEAD~1 for initial/force push"
          elif git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
            echo "Using event.before: $BASE"
          else
            # Fallback for shallow clone issues
            BASE="HEAD~1"
            echo "Fallback to HEAD~1 due to missing commit"
          fi
          # Get changed files with error handling
          SHA="${{ github.sha }}"
          if CHANGED=$(git diff --name-only "$BASE" "$SHA" 2>/dev/null); then
            echo "Successfully got changed files using git diff"
          else
            echo "Warning: git diff failed, using git show for current commit"
            CHANGED=$(git show --name-only --format="" "$SHA" || echo "")
          fi
          echo "Changed files:"
          echo "$CHANGED"
          # Use a more secure EOF marker
          EOF_MARKER=$(openssl rand -hex 8)
          {
            echo "changed<<$EOF_MARKER"
            echo "$CHANGED"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: check-sa
        name: Check if static analysis should run
        run: |
          CHANGED="${{ steps.files.outputs.changed }}"
          echo "Checking if static analysis should run..."
          echo "Changed files: $CHANGED"
          PATTERNS=(
            ".github/workflows/orchestrator.yml"
            "etc/workflow-dependencies.json"
            "scripts/cancel_workflows.py"
            "scripts/compute_root_workflows.py"
            "scripts/execute_workflow_plan.py"
            "scripts/get_running_workflows.py"
            "scripts/workflow_utils.py"
          )
          SHOULD_RUN="false"
          for pattern in "${PATTERNS[@]}"; do
            if echo "$CHANGED" | grep -qE "^${pattern}$"; then
              SHOULD_RUN="true"
              echo "Pattern matched: $pattern"
              break
            fi
          done
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Should run static analysis: $SHOULD_RUN"
      - id: check-ut
        name: Check if unit testing should run
        run: |
          CHANGED="${{ steps.files.outputs.changed }}"
          echo "Checking if unit testing should run..."
          echo "Changed files: $CHANGED"
          PATTERNS=(
            "scripts/cancel_workflows.py"
            "scripts/compute_root_workflows.py"
            "scripts/execute_workflow_plan.py"
            "scripts/get_running_workflows.py"
            "scripts/workflow_utils.py"
            "test/orchestrator/"
          )
          SHOULD_RUN="false"
          for pattern in "${PATTERNS[@]}"; do
            if echo "$CHANGED" | grep -qE "^${pattern}"; then
              SHOULD_RUN="true"
              echo "Pattern matched: $pattern"
              break
            fi
          done
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Should run unit testing: $SHOULD_RUN"
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install dependencies
        run: |
          echo "Installing Python dependencies..."
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            boto3==1.35.* \
            mypy==1.13.* \
            pylint==3.3.* \
            pytest==8.3.* \
            pyyaml==6.0.* \
            types-PyYAML==6.0.* \
            yamllint==1.35.*
          echo "Dependencies installed successfully"
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Lint config files
        run: |
          echo "Running linting..."
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/orchestrator.yml
          jsonlint -q etc/workflow-dependencies.json
          echo "Linting completed"
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Run pylint
        run: |
          echo "Running pylint..."
          python3 -m pylint \
            scripts/cancel_workflows.py \
            scripts/compute_root_workflows.py \
            scripts/execute_workflow_plan.py \
            scripts/get_running_workflows.py \
            scripts/workflow_utils.py \
            --fail-on=C,R,W \
            --fail-under=10.0
          echo "Pylint completed"
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Run mypy
        run: |
          echo "Running mypy..."
          python3 -m mypy \
            scripts/cancel_workflows.py \
            scripts/compute_root_workflows.py \
            scripts/execute_workflow_plan.py \
            scripts/get_running_workflows.py \
            scripts/workflow_utils.py
          echo "Mypy completed"
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-ut.outputs.should_run == 'true'
        name: Run unit tests
        run: |
          echo "Running unit tests..."
          python3 -m pytest \
            test/orchestrator/ \
            --verbose --pythonwarnings=error
          echo "Unit tests completed"
      - id: running
        name: Get running workflows
        run: |
          echo "Getting currently running workflows..."
          RUNNING=$(python3 scripts/get_running_workflows.py \
            --repo ${{ github.repository }} \
            --graph etc/workflow-dependencies.json)
          echo "Running workflows: $RUNNING"
          echo "workflows=$RUNNING" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Compute root workflows
        run: |
          echo "Computing root workflows..."
          GRAPH="etc/workflow-dependencies.json"
          START_FROM="${{ inputs.start_from }}"
          if [ -n "$START_FROM" ]; then
            echo "Manual trigger: starting from '$START_FROM'"
            # Support comma-separated workflows (trim spaces, newlines)
            SED_TRIM='s/^[[:space:]]*//;s/[[:space:]]*$//'
            ROOTS=$(echo "$START_FROM" | tr ',' '\n' | sed "$SED_TRIM")
          else
            CHANGED="${{ steps.files.outputs.changed }}"
            RUNNING='${{ steps.running.outputs.workflows }}'
            echo "Changed files for workflow computation:"
            echo "$CHANGED"
            echo "Running workflows to merge with: $RUNNING"
            # Get level-1 workflows (independent roots), merge with running
            JQ='[.[] | select(.level == 1) | .name] | join("\n")'
            ROOTS=$(echo "$CHANGED" | \
              python3 scripts/compute_root_workflows.py \
              --graph $GRAPH --levels --indexed \
              --running "$RUNNING" | jq -r "$JQ" || echo "")
          fi
          echo "Root workflows computed:"
          echo "$ROOTS"
          # Use a more secure EOF marker
          EOF_MARKER=$(openssl rand -hex 8)
          {
            echo "root_workflows<<$EOF_MARKER"
            echo "$ROOTS"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.root_workflows == ''
        name: No workflows to dispatch
        run: echo "No workflow-related files changed or no workflows computed"
      - if: >-
          steps.plan.outputs.root_workflows != '' &&
          (inputs.dry_run == true ||
           contains(github.event.head_commit.message, '[dry run]'))
        name: Dry run
        run: |
          echo "DRY RUN MODE - Would dispatch the following workflows:"
          ROOTS="${{ steps.plan.outputs.root_workflows }}"
          echo "$ROOTS" | while read -r WORKFLOW; do
            [ -n "$WORKFLOW" ] && echo "  - ${WORKFLOW}.yml"
          done
      - if: >-
          steps.plan.outputs.root_workflows != '' &&
          steps.running.outputs.workflows != '[]' &&
          inputs.dry_run != true &&
          !contains(github.event.head_commit.message, '[dry run]')
        name: Cancel superseded workflows
        run: |
          echo "Canceling workflows that will be re-run from merge roots..."
          ROOTS="${{ steps.plan.outputs.root_workflows }}"
          # Convert newline-separated roots to JSON array
          JQ_FILTER='split("\n") | map(select(length > 0))'
          ROOTS_JSON=$(echo "$ROOTS" | jq -R -s -c "$JQ_FILTER")
          echo "Merge roots: $ROOTS_JSON"
          python3 scripts/cancel_workflows.py \
            --repo ${{ github.repository }} \
            --merge-roots "$ROOTS_JSON" \
            --graph etc/workflow-dependencies.json
      - if: >-
          steps.plan.outputs.root_workflows != '' &&
          inputs.dry_run != true &&
          !contains(github.event.head_commit.message, '[dry run]')
        name: Dispatch root workflows (fire-and-forget)
        run: |
          echo "Dispatching root workflows..."
          ROOTS="${{ steps.plan.outputs.root_workflows }}"
          # Check if gh CLI is available and authenticated
          if ! command -v gh >/dev/null 2>&1; then
            echo "Error: gh CLI not found"
            exit 1
          fi
          # Verify authentication
          if ! gh auth status >/dev/null 2>&1; then
            echo "Error: gh CLI not authenticated"
            echo "GH_TOKEN length: ${#GH_TOKEN}"
            exit 1
          fi
          # Check for skip_descendants input or [skip descendants]
          SKIP_DESCENDANTS=""
          if [ "${{ inputs.skip_descendants }}" = "true" ]; then
            echo "skip_descendants input is true"
            SKIP_DESCENDANTS="-f skip_descendants=true"
          else
            # Heredoc with single-quoted delimiter prevents bash
            # interpreting ${...} patterns in commit messages
            COMMIT_MSG=$(cat <<'COMMIT_EOF'
          ${{ github.event.head_commit.message }}
          COMMIT_EOF
            )
            if echo "$COMMIT_MSG" | grep -qi '\[skip descendants\]'; then
              echo "Found [skip descendants] in commit message"
              SKIP_DESCENDANTS="-f skip_descendants=true"
            fi
          fi
          DISPATCH_COUNT=0
          echo "$ROOTS" | while read -r WORKFLOW; do
            if [ -n "$WORKFLOW" ]; then
              echo "Dispatching ${WORKFLOW}.yml..."
              WORKFLOW_FILE=".github/workflows/${WORKFLOW}.yml"
              # Verify workflow file exists
              if [ ! -f "$WORKFLOW_FILE" ]; then
                echo "Warning: Workflow file $WORKFLOW_FILE not found, skipping"
                continue
              fi
              # Check if workflow accepts skip_descendants input
              REPO="${{ github.repository }}"
              if [ -n "$SKIP_DESCENDANTS" ]; then
                if grep -q 'skip_descendants:' "$WORKFLOW_FILE"; then
                  gh workflow run "$WORKFLOW_FILE" --repo "$REPO" \
                    -f skip_descendants=true && RESULT=0 || RESULT=1
                else
                  echo "  (workflow does not accept skip_descendants)"
                  gh workflow run "$WORKFLOW_FILE" --repo "$REPO" \
                    && RESULT=0 || RESULT=1
                fi
              else
                gh workflow run "$WORKFLOW_FILE" --repo "$REPO" \
                  && RESULT=0 || RESULT=1
              fi
              if [ "$RESULT" -eq 0 ]; then
                echo "  ✓ Successfully dispatched ${WORKFLOW}.yml"
                DISPATCH_COUNT=$((DISPATCH_COUNT + 1))
              else
                echo "  ✗ Failed to dispatch ${WORKFLOW}.yml"
              fi
            fi
          done
          echo "Workflow dispatch completed"
          echo "Successfully dispatched $DISPATCH_COUNT workflow(s)"
          if [ -n "$SKIP_DESCENDANTS" ]; then
            echo "Note: Descendants skipped due to [skip descendants]"
          else
            echo "Descendants triggered by each workflow's dispatch step"
          fi
name: Workflow Orchestrator
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - 'test/claude/**'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        type: boolean
      github_hosted:
        default: false
        description: Use GitHub-hosted runners
        type: boolean
      skip_descendants:
        default: false
        description: Skip dispatching descendant workflows
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      start_from:
        description: 'Workflow(s) to start from (e.g., "health, bootstrap")'
        type: string
permissions:
  actions: write
  contents: read
