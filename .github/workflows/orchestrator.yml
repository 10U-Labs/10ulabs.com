---
# Workflow Orchestrator
#
# This is the ONLY workflow that responds to push events on main.
# It analyzes changed files and triggers the appropriate root workflows.
#
# Root workflows are those whose files changed but have no ancestors that
# also changed. The orchestrator executes all workflows sequentially.
concurrency:
  cancel-in-progress: true
  group: orchestrator-${{ github.ref }}
jobs:
  concluding-no-workflows-should-be-dispatched:
    if: >-
      needs.determining.outputs.count == '0' ||
      contains(github.event.head_commit.message, '[skip ci]')
    name: Concluding no workflows should be dispatched
    needs: determining
    runs-on: ubuntu-latest
    steps:
      - name: No workflows to trigger
        run: |
          echo "No root workflows to trigger for this commit."
          echo "Either:"
          echo "  - No workflow-related files were changed"
          echo "  - Commit message contains [skip ci]"
  concluding-workflows-should-be-dispatched:
    if: >-
      needs.determining.outputs.count != '0' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    name: Concluding workflows should be dispatched
    needs: determining
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "Workflows to dispatch: ${{ needs.determining.outputs.count }}"
          echo "Execution plan:"
          for key in "${{ needs.determining.outputs.key_01 }}" \
                     "${{ needs.determining.outputs.key_02 }}" \
                     "${{ needs.determining.outputs.key_03 }}" \
                     "${{ needs.determining.outputs.key_04 }}" \
                     "${{ needs.determining.outputs.key_05 }}" \
                     "${{ needs.determining.outputs.key_06 }}" \
                     "${{ needs.determining.outputs.key_07 }}" \
                     "${{ needs.determining.outputs.key_08 }}" \
                     "${{ needs.determining.outputs.key_09 }}" \
                     "${{ needs.determining.outputs.key_10 }}"; do
            [ -n "$key" ] && echo "  - $key"
          done
  determining:
    if: github.ref == 'refs/heads/main'
    name: Determining which workflows should be dispatched
    needs: unit-testing
    outputs:
      count: ${{ steps.plan.outputs.count }}
      key_01: ${{ steps.plan.outputs.key_01 }}
      key_02: ${{ steps.plan.outputs.key_02 }}
      key_03: ${{ steps.plan.outputs.key_03 }}
      key_04: ${{ steps.plan.outputs.key_04 }}
      key_05: ${{ steps.plan.outputs.key_05 }}
      key_06: ${{ steps.plan.outputs.key_06 }}
      key_07: ${{ steps.plan.outputs.key_07 }}
      key_08: ${{ steps.plan.outputs.key_08 }}
      key_09: ${{ steps.plan.outputs.key_09 }}
      key_10: ${{ steps.plan.outputs.key_10 }}
      key_11: ${{ steps.plan.outputs.key_11 }}
      key_12: ${{ steps.plan.outputs.key_12 }}
      key_13: ${{ steps.plan.outputs.key_13 }}
      key_14: ${{ steps.plan.outputs.key_14 }}
      key_15: ${{ steps.plan.outputs.key_15 }}
      key_16: ${{ steps.plan.outputs.key_16 }}
      key_17: ${{ steps.plan.outputs.key_17 }}
      key_18: ${{ steps.plan.outputs.key_18 }}
      key_19: ${{ steps.plan.outputs.key_19 }}
      key_20: ${{ steps.plan.outputs.key_20 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        name: Get changed files
        run: |
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          EOF_MARKER=$(openssl rand -hex 8)
          {
            echo "changed<<$EOF_MARKER"
            echo "$CHANGED"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - id: plan
        name: Compute execution plan
        run: |
          GRAPH="etc/workflow-dependencies.yml"
          START_FROM="${{ inputs.start_from }}"
          if [ -n "$START_FROM" ]; then
            echo "Manual trigger: starting from '$START_FROM'"
            python3 scripts/compute_root_workflows.py \
              --graph $GRAPH --start-from "$START_FROM" \
              --execution-plan --slots 20 >> "$GITHUB_OUTPUT"
          else
            CHANGED="${{ steps.files.outputs.changed }}"
            echo "$CHANGED" | python3 scripts/compute_root_workflows.py \
              --graph $GRAPH --execution-plan --slots 20 >> "$GITHUB_OUTPUT"
          fi
  dispatching-01:
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: >-
      always() && !failure() && !cancelled() &&
      needs.determining.outputs.key_01 != ''
    name: ${{ needs.determining.outputs.key_01 || '—' }}
    needs:
      - determining
      - concluding-workflows-should-be-dispatched
    runs-on: ubuntu-latest
    steps:
      - if: inputs.dry_run == true
        name: Dry run
        run: echo "Would dispatch ${{ needs.determining.outputs.key_01 }}"
      - if: inputs.dry_run != true
        name: Dispatch and wait
        run: |
          WORKFLOW="${{ needs.determining.outputs.key_01 }}.yml"
          gh workflow run ".github/workflows/$WORKFLOW" \
            --repo ${{ github.repository }}
          sleep 5
          RUN_ID=$(gh run list --workflow "$WORKFLOW" \
            --repo ${{ github.repository }} --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          echo "Waiting for $WORKFLOW (run $RUN_ID)..."
          gh run watch "$RUN_ID" --repo ${{ github.repository }} --exit-status
  dispatching-02:
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: >-
      always() && !failure() && !cancelled() &&
      needs.determining.outputs.key_02 != ''
    name: ${{ needs.determining.outputs.key_02 || '—' }}
