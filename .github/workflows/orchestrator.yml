---
# Workflow Orchestrator
#
# This workflow responds to push events on main, calculates which root workflow
# needs to run based on changed files, and dispatches it (fire-and-forget).
# Descendant workflows are triggered via dispatch_descendants.py script.
concurrency:
  cancel-in-progress: true
  group: orchestrator-${{ github.ref }}
jobs:
  orchestrate:
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: >-
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    name: Orchestrating workflows
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "on-demand", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: files
        name: Get changed files
        run: |
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          EOF_MARKER=$(openssl rand -hex 8)
          {
            echo "changed<<$EOF_MARKER"
            echo "$CHANGED"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: check-sa
        name: Check if static analysis should run
        run: |
          CHANGED="${{ steps.files.outputs.changed }}"
          PATTERNS=(
            ".github/workflows/orchestrator.yml"
            "etc/workflow-dependencies.yml"
            "scripts/compute_root_workflows.py"
            "scripts/execute_workflow_plan.py"
          )
          SHOULD_RUN="false"
          for pattern in "${PATTERNS[@]}"; do
            if echo "$CHANGED" | grep -qE "^${pattern}$"; then
              SHOULD_RUN="true"
              break
            fi
          done
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Should run static analysis: $SHOULD_RUN"
      - id: check-ut
        name: Check if unit testing should run
        run: |
          CHANGED="${{ steps.files.outputs.changed }}"
          PATTERNS=(
            "scripts/compute_root_workflows.py"
            "scripts/execute_workflow_plan.py"
            "test/orchestrator/"
          )
          SHOULD_RUN="false"
          for pattern in "${PATTERNS[@]}"; do
            if echo "$CHANGED" | grep -qE "^${pattern}"; then
              SHOULD_RUN="true"
              break
            fi
          done
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Should run unit testing: $SHOULD_RUN"
      - name: Install dependencies
        run: >-
          python3 -m pip install --upgrade pip &&
          python3 -m pip install
          boto3
          mypy
          pylint
          pytest
          pyyaml
          types-PyYAML
          yamllint
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Lint YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/orchestrator.yml \
            etc/workflow-dependencies.yml
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Run pylint
        run: |
          python3 -m pylint \
            scripts/compute_root_workflows.py \
            scripts/execute_workflow_plan.py \
            --fail-on=C,R,W \
            --fail-under=10.0
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-sa.outputs.should_run == 'true'
        name: Run mypy
        run: |
          python3 -m mypy \
            scripts/compute_root_workflows.py \
            scripts/execute_workflow_plan.py
      - if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.check-ut.outputs.should_run == 'true'
        name: Run unit tests
        run: |
          python3 -m pytest test/orchestrator/ \
            --verbose --pythonwarnings=error
      - id: plan
        name: Compute root workflows
        run: |
          GRAPH="etc/workflow-dependencies.yml"
          START_FROM="${{ inputs.start_from }}"
          if [ -n "$START_FROM" ]; then
            echo "Manual trigger: starting from '$START_FROM'"
            # Support comma-separated workflows (trim spaces, convert to newlines)
            ROOTS=$(echo "$START_FROM" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          else
            CHANGED="${{ steps.files.outputs.changed }}"
            # Get all level-1 workflows (independent roots)
            JQ='[.[] | select(.level == 1) | .name] | join("\n")'
            ROOTS=$(echo "$CHANGED" | \
              python3 scripts/compute_root_workflows.py \
              --graph $GRAPH --levels --indexed | jq -r "$JQ")
          fi
          echo "Root workflows:"
          echo "$ROOTS"
          EOF_MARKER=$(openssl rand -hex 8)
          {
            echo "root_workflows<<$EOF_MARKER"
            echo "$ROOTS"
            echo "$EOF_MARKER"
          } >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.root_workflows == ''
        name: No workflows to dispatch
        run: echo "No workflow-related files changed"
      - if: >-
          steps.plan.outputs.root_workflows != '' &&
          (inputs.dry_run == true ||
           contains(github.event.head_commit.message, '[dry run]'))
        name: Dry run
        run: |
          echo "Would dispatch the following workflows:"
          ROOTS="${{ steps.plan.outputs.root_workflows }}"
          echo "$ROOTS" | while read -r WORKFLOW; do
            [ -n "$WORKFLOW" ] && echo "  - ${WORKFLOW}.yml"
          done
      - if: >-
          steps.plan.outputs.root_workflows != '' &&
          inputs.dry_run != true &&
          !contains(github.event.head_commit.message, '[dry run]')
        name: Dispatch root workflows (fire-and-forget)
        run: |
          # Verify GitHub CLI is authenticated
          if ! gh auth status >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI not authenticated"
            echo "Token status:"
            echo "GH_TOKEN length: ${#GH_TOKEN}"
            echo "First 10 chars: ${GH_TOKEN:0:10}..."
            exit 1
          fi
          
          ROOTS="${{ steps.plan.outputs.root_workflows }}"
          if [ -z "$ROOTS" ]; then
            echo "No root workflows to dispatch"
            exit 0
          fi
          
          echo "$ROOTS" | while read -r WORKFLOW; do
            if [ -n "$WORKFLOW" ]; then
              WORKFLOW_FILE=".github/workflows/${WORKFLOW}.yml"
              if [ -f "$WORKFLOW_FILE" ]; then
                echo "Dispatching ${WORKFLOW}.yml..."
                if gh workflow run "$WORKFLOW_FILE" --repo ${{ github.repository }}; then
                  echo "Successfully dispatched $WORKFLOW"
                else
                  echo "Failed to dispatch $WORKFLOW"
                  exit 1
                fi
              else
                echo "WARNING: Workflow file $WORKFLOW_FILE not found"
              fi
            fi
          done
          echo "Root workflows dispatched (fire-and-forget)"
          echo "Descendants triggered by each workflow's dispatch step"
name: Workflow Orchestrator
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - 'test/claude/**'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        type: boolean
      github_hosted:
        default: false
        description: Use GitHub-hosted runners
        type: boolean
      start_from:
        description: 'Workflow(s) to start from, comma-separated (e.g., "health, bootstrap")'
        type: string
permissions:
  actions: write
  contents: read