---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  building-agent-container:
    defaults:
      run:
        working-directory: src/agents/workflow_fixer/agent-code
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.dry_run != 'true'
    name: Building agent container
    needs:
      - declaring-common-variables
      - ensuring-backend-is-in-desired-state
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.github_actions_role_arn
            }}
      - id: ecr-login
        name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        name: Extract metadata for Docker
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ needs.declaring-common-variables.outputs.ecr_repository_url }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - env:
          DOCKER_BUILD_SUMMARY: false
        name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: src/agents/workflow_fixer/agent-code
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
  declaring-common-variables:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.dry_run != 'true'
    name: Declaring common variables
    outputs:
      aws_region: ${{ steps.config.outputs.aws_region }}
      ecr_repository_url: ${{ steps.config.outputs.ecr_repository_url }}
      github_actions_role_arn: >-
        ${{ steps.config.outputs.github_actions_role_arn }}
      terraform_version: ${{ steps.config.outputs.terraform_version }}
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          TF_SHARED_LOCALS="lib/terraform/modules/shared/locals.tf"
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          AWS_REGION=$(grep 'aws_region' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' \
            src/bootstrap/locals.tf | \
            sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          RESOURCE_PREFIX=$(grep 'resource_prefix' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/bootstrap/providers.tf | cut -d'"' -f2 | sed 's/>= //')
          ROLE_PREFIX="arn:aws:iam::${AWS_ACCOUNT_ID}:role"
          ROLE_NAME="${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          GITHUB_ACTIONS_ROLE_ARN="${ROLE_PREFIX}/${ROLE_NAME}"
          ECR_REPO_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_REPO_URL="${ECR_REPO_URL}/tenulabs-workflow-fixer-agent"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "ecr_repository_url=$ECR_REPO_URL" >> $GITHUB_OUTPUT
          echo "github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN" \
            >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
  ensuring-agent-is-in-desired-state:
    defaults:
      run:
        working-directory: src/agents/workflow_fixer
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.dry_run != 'true'
    name: Ensuring agent is in desired state
    needs:
      - building-agent-container
      - declaring-common-variables
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.github_actions_role_arn
            }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: >-
            ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve
  ensuring-backend-is-in-desired-state:
    defaults:
      run:
        working-directory: src/agents/workflow_fixer
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.dry_run != 'true'
    name: Ensuring backend is in desired state
    needs:
      - declaring-common-variables
      - integration-testing-pre-deployment
      - unit-testing
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.github_actions_role_arn
            }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: >-
            ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply (backend only)
        run: >-
          terraform apply -auto-approve
          -target=aws_ecr_repository.agent
          -target=aws_ecr_lifecycle_policy.agent
  integration-testing-post-deployment:
    name: Post-deployment integration testing
    needs:
      - declaring-common-variables
      - ensuring-agent-is-in-desired-state
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.github_actions_role_arn
            }}
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3 requests
      - name: Run integration tests
        run: |
          python3 -m pytest \
            test/agents/workflow_fixer/post_deployment/integration/ \
            --verbose --pythonwarnings=error
  integration-testing-pre-deployment:
    name: Pre-deployment integration testing
    needs:
      - declaring-common-variables
      - unit-testing
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: >-
            ${{ needs.declaring-common-variables.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.github_actions_role_arn
            }}
      - name: Run pre-deployment integration tests
        run: |
          python3 -m pytest \
            test/agents/workflow_fixer/pre_deployment/integration/ \
            --verbose --pythonwarnings=error
  performing-static-analysis:
    name: Performing static analysis
    needs:
      - declaring-common-variables
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: >-
            ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.github_actions_role_arn
            }}
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Install linting dependencies
        run: |
          python3 -m pip install \
            pylint mypy yamllint pytest boto3 boto3-stubs
      - name: Terraform Format Check
        run: >-
          cd src/agents/workflow_fixer && terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: cd src/agents/workflow_fixer && terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: cd src/agents/workflow_fixer && tflint --init && tflint
      - name: Terraform Plan
        run: cd src/agents/workflow_fixer && terraform plan
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/agents_workflow_fixer.yml
      - name: Run pylint
        run: |
          python3 -m pylint \
            src/agents/workflow_fixer/webhook-lambda/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run mypy
        run: |
          python3 -m mypy \
            src/agents/workflow_fixer/webhook-lambda/
  unit-testing:
    name: Unit testing
    needs:
      - declaring-common-variables
      - performing-static-analysis
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3
      - name: Run unit tests
        run: |
          python3 -m pytest \
            test/agents/workflow_fixer/pre_deployment/unit/ \
            --verbose --pythonwarnings=error
name: Deploying Workflow Fixer Agent
on:
  workflow_call:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
permissions:
  contents: read
  id-token: write
