concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  declaring-common-variables:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
      )
    name: Declaring common variables
    outputs:
      aws_account_id: ${{ steps.config.outputs.aws_account_id }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      ecr_repository_name: ${{ steps.config.outputs.ecr_repository_name }}
      fargate_cpu_architecture: ${{ steps.config.outputs.fargate_cpu_architecture }}
      github_actions_role_arn: ${{ steps.config.outputs.github_actions_role_arn }}
      terraform_version: ${{ steps.config.outputs.terraform_version }}
    runs-on: ${{ (github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')) && 'ubuntu-latest' || 'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          AWS_REGION=$(grep -A1 'output "aws_region"' src/modules/shared/outputs.tf | grep 'value' | cut -d'"' -f2)
          AWS_ACCOUNT_ID=$(grep -A1 'output "aws_account_id"' src/modules/shared/outputs.tf | grep 'value' | cut -d'"' -f2)
          ECR_REPOSITORY_NAME=$(grep -A1 'output "ecr_repository_name"' src/modules/shared/outputs.tf | grep 'value' | cut -d'"' -f2)
          FARGATE_CPU_ARCHITECTURE=$(grep 'fargate_cpu_architecture' src/api/terraform.tfvars | cut -d'"' -f2 | tr '[:upper:]' '[:lower:]')
          RESOURCE_PREFIX=$(grep -A1 'output "resource_prefix"' src/modules/shared/outputs.tf | grep 'value' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' src/bootstrap/locals.tf | sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          GITHUB_ACTIONS_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          TERRAFORM_VERSION=$(grep 'required_version' src/image_for_docker_runners/backend.tf | cut -d'"' -f2 | sed 's/>= //')
          echo "aws_account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "ecr_repository_name=$ECR_REPOSITORY_NAME" >> $GITHUB_OUTPUT
          echo "fargate_cpu_architecture=$FARGATE_CPU_ARCHITECTURE" >> $GITHUB_OUTPUT
          echo "github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
  e2e-testing:
    name: E2E testing
    needs:
      - declaring-common-variables
      - integration-testing
    runs-on: ephemeral-ec2-spot-instance
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Get GitHub PAT from Parameter Store
        run: |
          terraform -chdir=src/bootstrap init -backend=true -input=false > /dev/null
          GITHUB_TOKEN_SECRET_NAME=$(terraform -chdir=src/bootstrap output -raw ssm_parameter_name_for_github_pat)
          GITHUB_PAT=$(aws ssm get-parameter --name "$GITHUB_TOKEN_SECRET_NAME" --with-decryption --query 'Parameter.Value' --output text)
          echo "GITHUB_PAT=$GITHUB_PAT" >> $GITHUB_ENV
      - name: Run E2E tests
        run: |
          pytest test/image_for_docker_runners/post_deployment/e2e/ \
            --confcutdir=test/image_for_docker_runners \
            -v
  ensuring-infrastructure-in-desired-state:
    name: Ensuring infrastructure is in desired state
    needs:
      - declaring-common-variables
      - unit-testing
    outputs:
      ecr_repository: ${{ steps.build.outputs.ecr_repository }}
      image_tag: ${{ steps.build.outputs.image_tag }}
    permissions:
      contents: read
      id-token: write
    runs-on: ephemeral-ec2-spot-instance
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - name: Terraform Init
        run: cd src/image_for_docker_runners && terraform init
      - name: Terraform Apply
        run: cd src/image_for_docker_runners && terraform apply -auto-approve
      - id: config
        name: Load Docker build configuration
        run: |
          NODE_VERSION=$(yq '.node_version' src/image_for_docker_runners/files/config.yml)
          RUNNER_VERSION=$(yq '.runner_version' src/image_for_docker_runners/files/config.yml)
          TERRAFORM_VERSION=$(yq '.terraform_version' src/image_for_docker_runners/files/config.yml)
          YQ_VERSION=$(yq '.yq_version' src/image_for_docker_runners/files/config.yml)
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "runner_version=$RUNNER_VERSION" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
          echo "yq_version=$YQ_VERSION" >> $GITHUB_OUTPUT
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - id: build
        name: Build and push Docker image
        run: |
          cd src/image_for_docker_runners/files
          BUILD_TAG=$(date -u +%Y-%m-%d-%H-%M-%S-%3N)
          ECR_URL="${{ needs.declaring-common-variables.outputs.aws_account_id }}.dkr.ecr.${{ needs.declaring-common-variables.outputs.aws_region }}.amazonaws.com/${{ needs.declaring-common-variables.outputs.ecr_repository_name }}"
          docker buildx build \
            --build-arg NODE_VERSION=${{ steps.config.outputs.node_version }} \
            --build-arg RUNNER_ARCH=${{ needs.declaring-common-variables.outputs.fargate_cpu_architecture }} \
            --build-arg RUNNER_VERSION=${{ steps.config.outputs.runner_version }} \
            --build-arg TERRAFORM_VERSION=${{ steps.config.outputs.terraform_version }} \
            --build-arg YQ_VERSION=${{ steps.config.outputs.yq_version }} \
            -t $ECR_URL:available \
            -t $ECR_URL:$BUILD_TAG \
            --push \
            .
          echo "image_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "ecr_repository=${{ needs.declaring-common-variables.outputs.ecr_repository_name }}" >> $GITHUB_OUTPUT
  integration-testing:
    name: Integration testing
    needs:
      - declaring-common-variables
      - ensuring-infrastructure-in-desired-state
    runs-on: ephemeral-ec2-spot-instance
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - name: Run pytest integration tests
        run: |
          pytest test/image_for_docker_runners/post_deployment/integration/ \
            --confcutdir=test/image_for_docker_runners \
            -v
  performing-static-analysis:
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on: ${{ (github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')) && 'ubuntu-latest' || 'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install linting dependencies
        run: pip install pylint mypy yamllint pytest boto3 boto3-stubs[ecr] botocore dockerfile-parse types-dockerfile-parse types-PyYAML
      - name: Linting YAML files
        run: |
          DOCUMENT_START='document-start: disable'
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: {max: 300, level: warning}'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$DOCUMENT_START, $EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/image_for_docker_runners.yml \
            src/image_for_docker_runners/files/config.yml
      - name: Run pylint
        run: |
          for file in src/image_for_docker_runners/*.py src/image_for_docker_runners/files/*.py src/image_for_docker_runners/lambdas/*.py; do
            pylint "$file" \
              --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
              --fail-on=C,R,W \
              --fail-under=10.0
          done
          PYTHONPATH=src/image_for_docker_runners:src/image_for_docker_runners/files pylint test/image_for_docker_runners/ \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run mypy
        run: |
          for file in src/image_for_docker_runners/*.py src/image_for_docker_runners/files/*.py src/image_for_docker_runners/lambdas/*.py; do
            python3 -m mypy "$file"
          done
          MYPYPATH=src/image_for_docker_runners:src/image_for_docker_runners/files python3 -m mypy test/image_for_docker_runners/
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install hadolint
        run: |
          HADOLINT_VERSION=$(curl -fsSL https://api.github.com/repos/hadolint/hadolint/releases/latest | jq -r '.tag_name')
          sudo curl -fsSL -o /usr/local/bin/hadolint "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint
      - name: Validate Dockerfile
        run: hadolint --ignore DL3008 --ignore DL3013 --ignore DL3015 --ignore DL3016 src/image_for_docker_runners/files/Dockerfile
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - name: Terraform Format Check
        run: cd src/image_for_docker_runners && terraform fmt -check -recursive
      - name: Terraform Init
        run: cd src/image_for_docker_runners && terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/image_for_docker_runners && \
            tflint --init && \
            tflint
      - name: Terraform Plan
        run: cd src/image_for_docker_runners && terraform plan
  promoting-image:
    name: Promoting image
    needs:
      - declaring-common-variables
      - e2e-testing
      - ensuring-infrastructure-in-desired-state
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ (github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')) && 'ubuntu-latest' || 'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: pip install boto3
      - name: Promote image
        run: |
          python3 src/image_for_docker_runners/promote_docker_image.py \
            --repository "${{ needs.ensuring-infrastructure-in-desired-state.outputs.ecr_repository }}" \
            --image-tag "${{ needs.ensuring-infrastructure-in-desired-state.outputs.image_tag }}" \
            --region "${{ needs.declaring-common-variables.outputs.aws_region }}"
  unit-testing:
    name: Unit testing
    needs:
      - declaring-common-variables
      - performing-static-analysis
    runs-on: ${{ (github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')) && 'ubuntu-latest' || 'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: pip install pytest boto3 botocore dockerfile-parse pyyaml
      - name: Run unit tests
        run: |
          pytest test/image_for_docker_runners/pre_deployment/ \
            --confcutdir=test/image_for_docker_runners \
            -v
name: Building Docker image for runners
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/image_for_docker_runners.yml'
      - 'src/image_for_docker_runners/**'
      - 'test/image_for_docker_runners/**'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
permissions:
  contents: read
  id-token: write
