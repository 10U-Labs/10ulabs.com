concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  build-docker-image:
    name: Building image
    needs: pre-build-integration-tests
    runs-on: [self-hosted, docker-builder, ephemeral-ec2-spot-instance]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          RUNNER_VERSION=$(jq -r '.github.runner_version' api/resources/ami_for_ec2_runners/config.json)
          ARCHITECTURE=$(jq -r '.base_os.architecture' api/resources/ami_for_ec2_runners/config.json)
          ECR_REPO=$(jq -r '.fargate_runners.ecr_repository' api/resources/ami_for_ec2_runners/config.json)
          ACCOUNT_ID=$(jq -r '.aws.account_id' api/resources/ami_for_ec2_runners/config.json)
          REGION=$(jq -r '.aws.region' api/resources/ami_for_ec2_runners/config.json)
          echo "runner_version=$RUNNER_VERSION" >> $GITHUB_OUTPUT
          echo "architecture=$ARCHITECTURE" >> $GITHUB_OUTPUT
          echo "ecr_repo=$ECR_REPO" >> $GITHUB_OUTPUT
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials (EC2 instance already has IAM role)
        run: |
          echo "Using EC2 instance role for AWS credentials"
      - name: Build and push Docker image (native ARM64, no emulation!)
        run: |
          cd api/resources/docker_runner
          BUILD_TAG="${{ github.run_number }}-$(git rev-parse --short HEAD)"
          ECR_URL="${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}"
          aws ecr get-login-password --region ${{ steps.config.outputs.region }} | \
            sudo docker login --username AWS --password-stdin $ECR_URL
          sudo docker build \
            --build-arg RUNNER_VERSION=${{ steps.config.outputs.runner_version }} \
            --build-arg RUNNER_ARCH=${{ steps.config.outputs.architecture }} \
            -t $ECR_URL:latest \
            -t $ECR_URL:stable \
            -t $ECR_URL:$BUILD_TAG \
            .
          sudo docker push $ECR_URL:latest
          sudo docker push $ECR_URL:stable
          sudo docker push $ECR_URL:$BUILD_TAG
          echo "✓ Docker image built and pushed to ECR"
          echo "  Repository: $ECR_URL"
          echo "  Tags: latest, stable, $BUILD_TAG"
          echo "  Built on native ARM64 (no emulation)"
  performing-static-analysis:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
      )
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install linting dependencies
        run: |
          pip install pylint mypy yamllint &&
          npm install -g jsonlint
      - name: Install project dependencies for linting
        run: pip install -r src/api/requirements.txt
      - name: Linting JSON configuration files
        run: |
          echo "Validating JSON syntax..."
          jsonlint -q src/api/config.json
          jsonlint -q src/api/cdk.json
      - name: Linting Python files
        run: |
          cd src/api && pylint \
            *.py \
            endpoints/catchall/*.py \
            endpoints/health/*.py \
            endpoints/root/*.py \
            endpoints/v1/handler.py \
            endpoints/v1/runners/*.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Linting YAML files
        run: |
          echo "Running yamllint on workflow files..."
          CONFIG='{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}'
          yamllint --config-data "$CONFIG" .github/workflows/api.yml
      - name: Static type checking Python files with mypy
        run: |
          cd src/api && python -m mypy *.py &&
          python -m mypy endpoints/catchall &&
          python -m mypy endpoints/health &&
          python -m mypy endpoints/root &&
          python -m mypy endpoints/v1/handler.py &&
          python -m mypy endpoints/v1/runners
  post-build-e2e-tests:
    name: E2E testing
    needs: [pre-build-integration-tests, post-build-integration-tests]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.pre-build-integration-tests.outputs.region }}
          role-to-assume: arn:aws:iam::${{ needs.pre-build-integration-tests.outputs.account_id }}:role/GitHubActionsRole
      - name: Verify Fargate infrastructure exists
        run: |
          CLUSTER=$(aws ecs describe-clusters \
            --clusters github-runners-cluster \
            --query 'clusters[0].clusterName' \
            --output text 2>/dev/null || echo "")
          if [ -z "$CLUSTER" ] || [ "$CLUSTER" == "None" ]; then
            echo "SKIP: ECS cluster not deployed yet"
            echo "Image is built and in ECR, ready for when infrastructure is deployed"
            exit 0
          fi
          echo "✓ ECS cluster exists"
          echo "✓ Docker image ready for Fargate deployment"
  post-build-integration-tests:
    name: Integration testing
    needs: [pre-build-integration-tests, post-build-unit-tests]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.pre-build-integration-tests.outputs.region }}
          role-to-assume: arn:aws:iam::${{ needs.pre-build-integration-tests.outputs.account_id }}:role/GitHubActionsRole
      - name: Pull Docker image from ECR
        run: |
          aws ecr get-login-password | \
            docker login --username AWS --password-stdin ${{ needs.pre-build-integration-tests.outputs.account_id }}.dkr.ecr.${{ needs.pre-build-integration-tests.outputs.region }}.amazonaws.com
          docker pull ${{ needs.pre-build-integration-tests.outputs.account_id }}.dkr.ecr.${{ needs.pre-build-integration-tests.outputs.region }}.amazonaws.com/${{ needs.pre-build-integration-tests.outputs.ecr_repo }}:latest
          echo "✓ Successfully pulled image from ECR"
      - name: Inspect image
        run: |
          IMAGE="${{ needs.pre-build-integration-tests.outputs.account_id }}.dkr.ecr.${{ needs.pre-build-integration-tests.outputs.region }}.amazonaws.com/${{ needs.pre-build-integration-tests.outputs.ecr_repo }}:latest"
          docker inspect $IMAGE
          ARCH=$(docker inspect $IMAGE --format='{{.Architecture}}')
          echo "Image architecture: $ARCH"
          if [ "$ARCH" != "arm64" ]; then
            echo "ERROR: Expected arm64, got $ARCH"
            exit 1
          fi
          echo "✓ Image is ARM64 as expected"
  post-build-unit-tests:
    name: Unit testing
    needs: [pre-build-integration-tests, build-docker-image]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.pre-build-integration-tests.outputs.region }}
          role-to-assume: arn:aws:iam::${{ needs.pre-build-integration-tests.outputs.account_id }}:role/GitHubActionsRole
      - name: Verify image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name ${{ needs.pre-build-integration-tests.outputs.ecr_repo }} \
            --image-ids imageTag=latest
          echo "✓ Docker image exists in ECR with 'latest' tag"
      - name: Verify image tags
        run: |
          TAGS=$(aws ecr describe-images \
            --repository-name ${{ needs.pre-build-integration-tests.outputs.ecr_repo }} \
            --query 'imageDetails[0].imageTags' \
            --output json)
          echo "Image tags: $TAGS"
          if ! echo "$TAGS" | jq -e '. | contains(["latest"])' > /dev/null; then
            echo "ERROR: 'latest' tag not found!"
            exit 1
          fi
          echo "✓ Image has 'latest' tag"
  pre-build-integration-tests:
    name: Integration testing build prerequisites
    needs: performing-static-analysis
    outputs:
      account_id: ${{ steps.config.outputs.account_id }}
      ami_id: ${{ steps.ami-check.outputs.ami_id }}
      ecr_repo: ${{ steps.config.outputs.ecr_repo }}
      region: ${{ steps.config.outputs.region }}
      subnet_id: ${{ steps.network.outputs.subnet_id }}
      vpc_id: ${{ steps.network.outputs.vpc_id }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws.account_id' api/resources/ami_for_ec2_runners/config.json)
          REGION=$(jq -r '.aws.region' api/resources/ami_for_ec2_runners/config.json)
          ECR_REPO=$(jq -r '.fargate_runners.ecr_repository' api/resources/ami_for_ec2_runners/config.json)
          VPC_NAME=$(jq -r '.naming.vpc_name' api/resources/ami_for_ec2_runners/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "ecr_repo=$ECR_REPO" >> $GITHUB_OUTPUT
          echo "vpc_name=$VPC_NAME" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - id: ami-check
        name: Verify GitHub runner AMI exists
        run: |
          AMI_ID=$(aws ec2 describe-images \
            --owners self \
            --filters "Name=name,Values=github-runner-debian-*" \
            --query 'sort_by(Images, &CreationDate) | reverse(@) | [0].ImageId' \
            --output text)
          if [ "$AMI_ID" == "None" ] || [ -z "$AMI_ID" ]; then
            echo "ERROR: No github-runner AMI found!"
            echo "Run AMI builder workflow first."
            exit 1
          fi
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "✓ Found AMI: $AMI_ID"
      - id: network
        name: Verify VPC and subnet exist
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ steps.config.outputs.vpc_name }}" \
            --query 'Vpcs[0].VpcId' \
            --output text)
          if [ "$VPC_ID" == "None" ] || [ -z "$VPC_ID" ]; then
            echo "ERROR: VPC not found! Run infrastructure workflow first."
            exit 1
          fi
          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=map-public-ip-on-launch,Values=true" \
            --query 'Subnets[0].SubnetId' \
            --output text)
          if [ "$SUBNET_ID" == "None" ] || [ -z "$SUBNET_ID" ]; then
            echo "ERROR: No public subnet found!"
            exit 1
          fi
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "subnet_id=$SUBNET_ID" >> $GITHUB_OUTPUT
          echo "✓ Found VPC: $VPC_ID"
          echo "✓ Found Subnet: $SUBNET_ID"
name: Build Docker Image for Self-Hosted Runner
on:
  push:
    branches:
      - main
    paths:
      - 'api/resources/ami_for_ec2_runners/config.json'
      - 'api/resources/docker_runner/**'
      - 'api/resources/image_for_docker_runners/**'
      - '.github/workflows/build_docker_image_for_github_self_hosted_runners.yml'
      - '!**/README.md'
  workflow_dispatch:
