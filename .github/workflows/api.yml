concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  concluding-readme-should-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated == 'true'
    name: Concluding README.md should be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  concluding-readme-should-not-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated != 'true'
    name: Concluding README.md should not be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  determining-if-readme-should-be-updated:
    name: Determining if README.md should be updated
    needs: e2e-testing
    outputs:
      readme_should_be_updated: ${{ steps.check.outputs.readme_should_be_updated }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: 'ACCOUNT_ID=$(jq -r ''.aws.account_id'' src/api/infrastructure/config.json);
          REGION=$(jq -r ''.aws.region'' src/api/infrastructure/config.json);
          MODEL_ID=$(jq -r ''.aws.bedrock.model_id'' src/api/infrastructure/config.json);
          MAX_TOKENS_REASONING=$(jq -r ''.aws.bedrock.max_tokens_reasoning'' src/api/infrastructure/config.json);
          MAX_TOKENS_GENERATION=$(jq -r ''.aws.bedrock.max_tokens_generation'' src/api/infrastructure/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
          '
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - id: check
        name: Check if README needs update
        run: "python scripts/readme/generator.py \\\n  --project-dir src/api/infrastructure \\\n  --test-dir test/api \\\n  --check \\\n  --prompt-check scripts/readme/prompt_check.md \\\n  --prompt-update scripts/readme/prompt_update.md \\\n  --aws-region \"${{ steps.config.outputs.region }}\" \\\n  --bedrock-model-id \"${{ steps.config.outputs.model_id }}\" \\\n  --max-tokens-reasoning \"${{ steps.config.outputs.max_tokens_reasoning }}\" \\\n  --max-tokens-generation \"${{ steps.config.outputs.max_tokens_generation }}\" \\\n  --output-file \"$GITHUB_OUTPUT\"\n"
  e2e-testing:
    name: E2E testing
    needs: integration-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: 'ACCOUNT_ID=$(jq -r ''.aws.account_id'' src/api/infrastructure/config.json);
          REGION=$(jq -r ''.aws.region'' src/api/infrastructure/config.json);
          MODEL_ID=$(jq -r ''.aws.bedrock.model_id'' src/api/infrastructure/config.json);
          MAX_TOKENS_REASONING=$(jq -r ''.aws.bedrock.max_tokens_reasoning'' src/api/infrastructure/config.json);
          MAX_TOKENS_GENERATION=$(jq -r ''.aws.bedrock.max_tokens_generation'' src/api/infrastructure/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
          '
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: 'pip install pytest boto3 requests
          '
      - name: Run E2E tests
        run: 'pytest test/api/test_e2e.py -v
          '
  ensuring-infrastructure-in-desired-state:
    name: Ensuring infrastructure is in desired state
    needs: unit-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: 'ACCOUNT_ID=$(jq -r ''.aws.account_id'' src/api/infrastructure/config.json);
          REGION=$(jq -r ''.aws.region'' src/api/infrastructure/config.json);
          MODEL_ID=$(jq -r ''.aws.bedrock.model_id'' src/api/infrastructure/config.json);
          MAX_TOKENS_REASONING=$(jq -r ''.aws.bedrock.max_tokens_reasoning'' src/api/infrastructure/config.json);
          MAX_TOKENS_GENERATION=$(jq -r ''.aws.bedrock.max_tokens_generation'' src/api/infrastructure/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
          '
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CDK
        run: npm install -g aws-cdk
      - name: Install dependencies
        run: pip install -r src/api/infrastructure/requirements.txt
      - name: CDK Bootstrap (if needed)
        run: 'cd src/api/infrastructure && cdk bootstrap aws://${{ steps.config.outputs.account_id }}/${{ steps.config.outputs.region }}
          '
      - name: CDK Diff
        run: cd src/api/infrastructure && cdk diff TenULabsApi
      - id: deploy
        name: CDK Deploy
        run: "cd src/api/infrastructure && cdk deploy TenULabsApi \\\n  --require-approval never 2>&1 | tee /tmp/cdk_deploy.log || true\nif grep -qE \"(failed|ROLLBACK_COMPLETE|CREATE_FAILED)\" /tmp/cdk_deploy.log; then\n  echo \"deployment_failed=true\" >> $GITHUB_OUTPUT\nelse\n  echo \"deployment_failed=false\"\
          \ >> $GITHUB_OUTPUT\nfi\n"
      - if: steps.deploy.outputs.deployment_failed == 'true'
        name: Fail if deployment failed
        run: 'echo "CDK deployment failed. See logs above for details."
          exit 1
          '
  integration-testing:
    name: Integration testing
    needs: ensuring-infrastructure-in-desired-state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: 'ACCOUNT_ID=$(jq -r ''.aws.account_id'' src/api/infrastructure/config.json);
          REGION=$(jq -r ''.aws.region'' src/api/infrastructure/config.json);
          MODEL_ID=$(jq -r ''.aws.bedrock.model_id'' src/api/infrastructure/config.json);
          MAX_TOKENS_REASONING=$(jq -r ''.aws.bedrock.max_tokens_reasoning'' src/api/infrastructure/config.json);
          MAX_TOKENS_GENERATION=$(jq -r ''.aws.bedrock.max_tokens_generation'' src/api/infrastructure/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
          '
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: 'pip install pytest boto3 requests
          '
      - name: Run pytest integration tests
        run: 'pytest test/api/test_integration.py -v
          '
  performing-static-analysis:
    if: "github.ref == 'refs/heads/main' && (\n  (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||\n  (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')\n)\n"
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linting dependencies
        run: 'pip install pylint mypy yamllint &&
          npm install -g jsonlint
          '
      - name: Install project dependencies for linting
        run: pip install -r src/api/infrastructure/requirements.txt
      - name: Linting JSON configuration files
        run: 'echo "Validating JSON syntax..."
          jsonlint -q src/api/infrastructure/config.json
          jsonlint -q src/api/infrastructure/cdk.json
          '
      - name: Linting Python files
        run: "pylint \\\n  src/api/infrastructure/*.py \\\n  src/api/endpoints/root/*.py \\\n  src/api/endpoints/health/*.py \\\n  src/api/endpoints/v1/echo/*.py \\\n  --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \\\n  --fail-under=10.0\n"
      - name: Linting YAML files
        run: 'echo "Running yamllint on workflow files..."
          CONFIG=''{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}''
          yamllint --config-data "$CONFIG" .github/workflows/api.yml
          '
      - name: Static type checking Python files with mypy
        run: 'python -m mypy src/api/infrastructure &&
          python -m mypy src/api/endpoints/root &&
          python -m mypy src/api/endpoints/health &&
          python -m mypy src/api/endpoints/v1/echo &&
          python -m mypy scripts/readme/generator.py
          '
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js (required by aws-cdk-lib/jsii)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: 'pip install pytest &&
          pip install -r src/api/infrastructure/requirements.txt
          '
      - name: Run unit tests
        run: 'pytest test/api/test_unit.py -v
          '
  updating-readme:
    name: Updating README.md
    needs: concluding-readme-should-be-updated
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: config
        name: Load configuration
        run: 'ACCOUNT_ID=$(jq -r ''.aws.account_id'' src/api/infrastructure/config.json);
          REGION=$(jq -r ''.aws.region'' src/api/infrastructure/config.json);
          MODEL_ID=$(jq -r ''.aws.bedrock.model_id'' src/api/infrastructure/config.json);
          MAX_TOKENS_REASONING=$(jq -r ''.aws.bedrock.max_tokens_reasoning'' src/api/infrastructure/config.json);
          MAX_TOKENS_GENERATION=$(jq -r ''.aws.bedrock.max_tokens_generation'' src/api/infrastructure/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
          '
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - name: Update README with Bedrock
        run: "python scripts/readme/generator.py \\\n  --project-dir src/api/infrastructure \\\n  --test-dir test/api \\\n  --update \\\n  --prompt-check scripts/readme/prompt_check.md \\\n  --prompt-update scripts/readme/prompt_update.md \\\n  --aws-region \"${{ steps.config.outputs.region }}\" \\\n  --bedrock-model-id \"${{ steps.config.outputs.model_id }}\" \\\n  --max-tokens-reasoning \"${{ steps.config.outputs.max_tokens_reasoning }}\" \\\n  --max-tokens-generation \"${{ steps.config.outputs.max_tokens_generation }}\" \\\n  --output-file \"$GITHUB_OUTPUT\"\n"
      - name: Commit and push README if changed
        run: "git config user.name \"GitHub Actions\"\ngit config user.email \"actions@github.com\"\ngit add src/api/infrastructure/README.md\nif git diff --cached --quiet; then\n  echo \"No changes to README.md\"\nelse\n  git commit -m \"Update api README.md [skip ci]\"\n  for i in {1..5}; do\n    if git\
          \ push; then\n      echo \"Successfully pushed README update\"\n      exit 0\n    fi\n    echo \"Push failed (attempt $i/5), pulling and retrying...\"\n    git pull --rebase origin main\n    sleep $((2 ** i))\n  done\n  echo \"Failed to push after 5 attempts\"\n  exit 1\nfi\n"
name: Ensuring API infrastructure exists and is properly configured
on:
  push:
    branches:
      - main
    paths:
      - src/api/infrastructure/**
      - src/api/endpoints/**
      - src/api/openapi.yaml
      - test/api/**
      - .github/workflows/api.yml
  workflow_dispatch:
    inputs:
      dry_run:
        default: true
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
permissions:
  contents: read
  id-token: write
