concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  concluding-readme-should-not-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated != 'true'
    name: Concluding README.md should not be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  concluding-readme-should-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated == 'true'
    name: Concluding README.md should be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  determining-if-readme-should-be-updated:
    name: Determining if README.md should be updated
    needs: e2e-testing
    outputs:
      readme_should_be_updated: ${{ steps.check.outputs.readme_should_be_updated }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Load configuration
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws.account_id' src/api/infrastructure/config.json)
          REGION=$(jq -r '.aws.region' src/api/infrastructure/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Install boto3
        run: pip install boto3
      - name: Check if README needs update
        id: check
        run: |
          python scripts/readme.py \
            --project-dir src/api/infrastructure \
            --check \
            --aws-region "${{ steps.config.outputs.region }}" \
            --output-file "$GITHUB_OUTPUT"
  e2e-testing:
    name: E2E testing
    needs: integration-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Load configuration
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws.account_id' src/api/infrastructure/config.json)
          REGION=$(jq -r '.aws.region' src/api/infrastructure/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pytest boto3 requests
      - name: Run E2E tests
        run: |
          pytest test/api/test_e2e.py -v
  ensuring-infrastructure-in-desired-state:
    name: Ensuring infrastructure is in desired state
    needs: unit-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Load configuration
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws.account_id' src/api/infrastructure/config.json)
          REGION=$(jq -r '.aws.region' src/api/infrastructure/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CDK
        run: npm install -g aws-cdk
      - name: Install dependencies
        run: pip install -r src/api/infrastructure/requirements.txt
      - name: CDK Bootstrap (if needed)
        run: |
          cd src/api/infrastructure && cdk bootstrap aws://${{ steps.config.outputs.account_id }}/${{ steps.config.outputs.region }}
      - name: CDK Diff
        run: cd src/api/infrastructure && cdk diff TenULabsApi
      - name: CDK Deploy
        id: deploy
        run: |
          cd src/api/infrastructure && cdk deploy TenULabsApi \
            --require-approval never 2>&1 | tee /tmp/cdk_deploy.log || true
          if grep -qE "(failed|ROLLBACK_COMPLETE|CREATE_FAILED)" /tmp/cdk_deploy.log; then
            echo "deployment_failed=true" >> $GITHUB_OUTPUT
          else
            echo "deployment_failed=false" >> $GITHUB_OUTPUT
          fi
      - name: Fail if deployment failed
        if: steps.deploy.outputs.deployment_failed == 'true'
        run: |
          echo "CDK deployment failed. See logs above for details."
          exit 1
      - name: Validate API propagation
        if: steps.deploy.outputs.deployment_failed != 'true'
        run: |
          API_ENDPOINT="https://$(jq -r '.domain_names.subdomain' src/api/infrastructure/config.json)"
          python src/api/infrastructure/poll_api_until_it_has_propagated.py --api-endpoint "$API_ENDPOINT"
  integration-testing:
    name: Integration testing
    needs: ensuring-infrastructure-in-desired-state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Load configuration
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws.account_id' src/api/infrastructure/config.json)
          REGION=$(jq -r '.aws.region' src/api/infrastructure/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          pip install pytest boto3 requests
      - name: Run pytest integration tests
        run: |
          pytest test/api/test_integration.py -v
  performing-static-analysis:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
      )
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linting dependencies
        run: |
          pip install pylint mypy yamllint
          npm install -g jsonlint
      - name: Install project dependencies for linting
        run: pip install -r src/api/infrastructure/requirements.txt
      - name: Linting JSON configuration files
        run: |
          echo "Validating JSON syntax..."
          jsonlint -q src/api/infrastructure/config.json
          jsonlint -q src/api/infrastructure/cdk.json
      - name: Linting Python files
        run: |
          find src/api -name "*.py" -type f | xargs pylint \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Linting YAML files
        run: |
          echo "Running yamllint on workflow files..."
          yamllint --config-data '{extends: default, rules: {line-length: {max: 200, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}}}' .github/workflows/api.yml
      - name: Static type checking Python files with mypy
        run: |
          find src/api -name "*.py" -type f -exec python -m mypy {} \;
          python -m mypy scripts/readme.py
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js (required by aws-cdk-lib/jsii)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          pip install pytest
          pip install -r src/api/infrastructure/requirements.txt
      - name: Run unit tests
        run: |
          pytest test/api/test_unit.py -v
  updating-readme:
    name: Updating README.md
    needs: concluding-readme-should-be-updated
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load configuration
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws.account_id' src/api/infrastructure/config.json)
          REGION=$(jq -r '.aws.region' src/api/infrastructure/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}
      - name: Install boto3
        run: pip install boto3
      - name: Update README with Bedrock
        run: |
          python scripts/readme.py \
            --project-dir src/api/infrastructure \
            --update \
            --aws-region "${{ steps.config.outputs.region }}"
      - name: Commit and push README if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add src/api/infrastructure/README.md
          if git diff --cached --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "Update api README.md [skip ci]"

            for i in {1..5}; do
              if git push; then
                echo "Successfully pushed README update"
                exit 0
              fi
              echo "Push failed (attempt $i/5), pulling and retrying..."
              git pull --rebase origin main
              sleep $((2 ** i))
            done

            echo "Failed to push after 5 attempts"
            exit 1
          fi
name: Ensuring API infrastructure exists and is properly configured
on:
  push:
    branches:
      - main
    paths:
      - 'src/api/infrastructure/**'
      - 'src/api/endpoints/**'
      - 'src/api/openapi.yaml'
      - 'test/api/**'
      - 'scripts/readme.py'
      - '.github/workflows/api.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        default: true
        description: 'Dry run mode (show structure without executing)'
        required: false
        type: boolean
permissions:
  contents: read
  id-token: write
