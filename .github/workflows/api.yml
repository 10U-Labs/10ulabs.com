concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  declaring-common-variables:
    name: Declaring common variables
    outputs:
      aws_account_id: ${{ steps.config.outputs.aws_account_id }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      github_actions_role: ${{ steps.config.outputs.github_actions_role }}
      github_pat_parameter_name: ${{ steps.config.outputs.github_pat_parameter_name }}
      terraform_version: ${{ steps.config.outputs.terraform_version }}
    runs-on: ${{ (github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')) && 'ubuntu-latest' || 'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          AWS_REGION=$(grep 'aws_region' src/api/terraform.tfvars | cut -d'"' -f2)
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' src/api/terraform.tfvars | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE=$(grep 'github_actions_role_name' src/bootstrap/terraform.tfvars | cut -d'"' -f2)
          GITHUB_PAT_PARAMETER_NAME=$(grep 'name.*=' src/bootstrap/github_pat.tf | grep -v '#' | cut -d'"' -f2)
          TERRAFORM_VERSION=$(grep 'required_version' src/api/providers.tf | cut -d'"' -f2 | sed 's/>= //')
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "aws_account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "github_actions_role=$GITHUB_ACTIONS_ROLE" >> $GITHUB_OUTPUT
          echo "github_pat_parameter_name=$GITHUB_PAT_PARAMETER_NAME" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
  e2e-testing:
    name: E2E testing
    needs:
      - declaring-common-variables
      - integration-testing
    runs-on: ${{ (github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')) && 'ubuntu-latest' || 'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install pytest boto3 PyYAML requests
      - name: Run E2E tests
        run: pytest test/api/test_e2e.py -v
  ensuring-infrastructure-in-desired-state:
    defaults:
      run:
        working-directory: src/api
    name: Ensuring infrastructure is in desired state
    needs:
      - declaring-common-variables
      - unit-testing
    runs-on: ${{ (github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')) && 'ubuntu-latest' || 'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve
      - id: check_files
        name: Check if static files changed
        run: |
          set -e
          set -o pipefail
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} | \
            if grep -qE 'src/api/files/(index\.html|openapi\.yml|404\.html)'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
      - if: steps.check_files.outputs.changed == 'true'
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: steps.check_files.outputs.changed == 'true'
        name: Install Python dependencies
        run: pip install boto3
      - if: steps.check_files.outputs.changed == 'true'
        name: Extract domain from terraform.tfvars
        run: |
          DOMAIN_SUBDOMAIN=$(grep 'domain_subdomain' terraform.tfvars | cut -d'"' -f2)
          echo "DOMAIN_SUBDOMAIN=$DOMAIN_SUBDOMAIN" >> $GITHUB_ENV
      - if: steps.check_files.outputs.changed == 'true'
        name: Invalidate CloudFront cache
        run: |
          python ../../scripts/invalidate_cloudfront/invalidate_cloudfront.py \
            --fqdn "${{ env.DOMAIN_SUBDOMAIN }}" \
            --region ${{ needs.declaring-common-variables.outputs.aws_region }}
  integration-testing:
    name: Integration testing
    needs:
      - ensuring-infrastructure-in-desired-state
      - declaring-common-variables
    runs-on: ${{ (github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')) && 'ubuntu-latest' || 'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install pytest boto3 PyYAML
      - name: Fetch GitHub PAT from Parameter Store
        run: |
          GITHUB_PAT=$(aws ssm get-parameter \
            --name ${{ needs.declaring-common-variables.outputs.github_pat_parameter_name }} \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text \
            --region ${{ needs.declaring-common-variables.outputs.aws_region }})
          echo "GITHUB_PAT=$GITHUB_PAT" >> $GITHUB_ENV
      - name: Run integration tests
        run: pytest test/api/test_integration.py -v
  performing-static-analysis:
    if: github.ref == 'refs/heads/main'
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on: ${{ (github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')) && 'ubuntu-latest' || 'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Install linting dependencies
        run: pip install pylint mypy yamllint pytest boto3 PyYAML requests
      - name: Linting YAML files
        run: |
          DOCUMENT_START='document-start: disable'
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: {max: 300, level: warning}'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$DOCUMENT_START, $EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/api.yml
      - name: Run pylint
        run: |
          pylint \
            test/api/conftest.py \
            test/api/test_e2e.py \
            test/api/test_integration.py \
            test/api/test_unit.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Terraform Format Check
        run: cd src/api && terraform fmt -check -recursive
      - name: Terraform Init
        run: cd src/api && terraform init
      - name: Terraform Validate
        run: cd src/api && terraform validate
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api && \
            tflint --init && \
            tflint --disable-rule=terraform_unused_declarations
      - name: Terraform Plan
        run: cd src/api && terraform plan
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ${{ (github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')) && 'ubuntu-latest' || 'ephemeral-ecs-fargate-spot' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install pytest boto3 PyYAML
      - name: Run unit tests
        run: pytest test/api/test_unit.py -v
name: Ensuring API exists and is properly configured
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/api.yml'
      - 'src/api/**'
      - '!src/api/build/**'
      - 'test/api/conftest.py'
      - 'test/api/test_e2e.py'
      - 'test/api/test_integration.py'
      - 'test/api/test_unit.py'
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
permissions:
  contents: read
  id-token: write
