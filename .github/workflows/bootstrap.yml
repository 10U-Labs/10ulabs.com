concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  checking-oidc-availability:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
      )
    name: Checking OIDC availability
    needs: declaring-common-variables
    outputs:
      oidc_available: ${{ steps.oidc.outcome == 'success' }}
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate", "runner-{0}"]', github.run_id)) }}
    steps:
      - continue-on-error: true
        id: oidc
        name: Test OIDC authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          retry-max-attempts: 1
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
  declaring-common-variables:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
      )
    name: Declaring common variables
    outputs:
      aws_region: ${{ steps.config.outputs.aws_region }}
      github_actions_role_arn: ${{ steps.config.outputs.github_actions_role_arn }}
      terraform_version: ${{ steps.config.outputs.terraform_version }}
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate", "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          AWS_ACCOUNT_ID=$(grep -A1 'output "aws_account_id"' lib/terraform/outputs.tf | grep 'value' | cut -d'"' -f2)
          AWS_REGION=$(grep -A1 'output "aws_region"' lib/terraform/outputs.tf | grep 'value' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' src/bootstrap/locals.tf | sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          RESOURCE_PREFIX=$(grep -A1 'output "resource_prefix"' lib/terraform/outputs.tf | grep 'value' | cut -d'"' -f2)
          TERRAFORM_VERSION=$(grep 'required_version' src/bootstrap/providers.tf | cut -d'"' -f2 | sed 's/>= //')
          GITHUB_ACTIONS_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
  e2e-testing:
    name: E2E testing
    needs:
      - checking-oidc-availability
      - declaring-common-variables
      - integration-testing
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate", "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: needs.checking-oidc-availability.outputs.oidc_available == 'true'
        name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - if: needs.checking-oidc-availability.outputs.oidc_available != 'true'
        name: Configure AWS credentials via static keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3 dnspython
      - name: Run E2E tests
        run: python3 -m pytest test/bootstrap/post_deployment/e2e/ -v
  ensuring-infrastructure-in-desired-state:
    defaults:
      run:
        working-directory: src/bootstrap
    name: Ensuring infrastructure is in desired state
    needs:
      - checking-oidc-availability
      - declaring-common-variables
      - unit-testing
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate", "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: needs.checking-oidc-availability.outputs.oidc_available == 'true'
        name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - if: needs.checking-oidc-availability.outputs.oidc_available != 'true'
        name: Configure AWS credentials via static keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: |
          terraform apply \
            -auto-approve \
            -var="github_pat=${{ secrets.GH_PAT }}"
  integration-testing:
    name: Integration testing
    needs:
      - checking-oidc-availability
      - declaring-common-variables
      - ensuring-infrastructure-in-desired-state
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate", "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: needs.checking-oidc-availability.outputs.oidc_available == 'true'
        name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - if: needs.checking-oidc-availability.outputs.oidc_available != 'true'
        name: Configure AWS credentials via static keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3
      - name: Run integration tests
        run: python3 -m pytest test/bootstrap/post_deployment/integration/ -v
  performing-static-analysis:
    name: Performing static analysis
    needs:
      - checking-oidc-availability
      - declaring-common-variables
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate", "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - if: needs.checking-oidc-availability.outputs.oidc_available == 'true'
        name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: ${{ needs.declaring-common-variables.outputs.github_actions_role_arn }}
      - if: needs.checking-oidc-availability.outputs.oidc_available != 'true'
        name: Configure AWS credentials via static keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install linting dependencies
        run: python3 -m pip install pylint mypy yamllint pytest boto3 boto3-stubs dnspython python-hcl2
      - name: Terraform Format Check
        run: cd src/bootstrap && terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: cd src/bootstrap && terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: cd src/bootstrap && tflint --init && tflint
      - name: Terraform Plan
        run: |
          cd src/bootstrap && \
            terraform plan \
            -var="github_pat=${{ secrets.GH_PAT }}"
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/bootstrap.yml
      - name: Run pylint
        run: |
          python3 -m pylint \
            test/bootstrap/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run mypy
        run: |
          python3 -m mypy \
            test/bootstrap/
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs-fargate", "runner-{0}"]', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: github.event.inputs.github_hosted == 'true' || contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3 python-hcl2
      - name: Run unit tests
        run: python3 -m pytest test/bootstrap/pre_deployment/ -v
name: Ensuring bootstrap infrastructure exists and is properly configured
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'src/bootstrap/**'
      - 'test/bootstrap/**'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
permissions:
  contents: read
  id-token: write
