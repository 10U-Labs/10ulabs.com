---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy bootstrap infrastructure
    runs-on: >-
      ${{ ( vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - continue-on-error: true
        id: no_linter_configs_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no linter config files (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-linter-config-files@latest
        with:
          directories: ${{ github.workspace }}
          linters: pylint,mypy,yamllint
      - continue-on-error: true
        id: no_linter_configs_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no linter config files (self-hosted)
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          ${{ github.workspace }}
      - continue-on-error: true
        id: no_inline_disables_gh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true'
        name: Assert no inline lint disables (GitHub-hosted)
        uses: 10U-Labs-LLC/assert-no-inline-lint-disables@latest
        with:
          files: ${{ github.workspace }}/**/*
          linters: pylint,mypy,yamllint
      - continue-on-error: true
        id: no_inline_disables_sh
        if: vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS != 'true'
        name: Assert no inline lint disables (self-hosted)
        run: >-
          assert-no-inline-lint-disables
          --linters pylint,mypy,yamllint
          ${{ github.workspace }}/**/*
      - id: terraform
        if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Extract Terraform version
        run: |
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/bootstrap/providers.tf | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
      - continue-on-error: true
        id: terraform_fmt
        name: Terraform Format Check
        run: cd src/bootstrap && terraform fmt -diff -check -recursive
      - id: oidc
        name: Check OIDC availability
        run: |
          if [ -n "${{ vars.AWS_REGION }}" ] && \
             [ -n "${{ vars.OIDC_ROLE_ARN }}" ]; then
            echo "is_available=true" >> $GITHUB_OUTPUT
          else
            echo "is_available=false" >> $GITHUB_OUTPUT
          fi
      - if: steps.oidc.outputs.is_available == 'true'
        name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - if: steps.oidc.outputs.is_available != 'true'
        name: Extract AWS region (cold start)
        run: |
          AWS_REGION=$(grep 'aws_region' \
            lib/terraform/common/locals.tf \
            | grep -v '\$' | cut -d'"' -f2)
          echo "aws_region=$AWS_REGION" >> $GITHUB_ENV
      - if: steps.oidc.outputs.is_available != 'true'
        name: Configure AWS credentials via static keys (cold start)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ env.aws_region }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Terraform Init
        run: cd src/bootstrap && terraform init
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        id: tflint
        name: Run tflint
        run: cd src/bootstrap && tflint --init && tflint
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install yamllint
        run: python3 -m pip install yamllint
      - continue-on-error: true
        id: yamllint
        name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/bootstrap.yml
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install pylint
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            dnspython \
            pylint \
            pytest \
            python-hcl2 \
            requests
      - continue-on-error: true
        id: pylint
        name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/ test/ \
            --fail-on=C,R,W --fail-under=10.0
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install mypy
        run: |
          python3 -m pip install \
            boto3-stubs \
            mypy \
            types-dockerfile-parse \
            types-PyYAML \
            types-requests
      - continue-on-error: true
        id: mypy
        name: Run mypy on tests
        run: |
          MYPYPATH=lib/python:src/api/endpoints/runners/lambda python3 -m mypy \
            lib/python/ test/
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install jscpd
        run: npm install -g jscpd
      - continue-on-error: true
        id: jscpd
        name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/
      - if: >-
          vars.WORKFLOWS_MUST_USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install pytest dependencies
        run: >-
          python3 -m pip install pytest pytest-dependency boto3 dnspython
          python-hcl2
      - continue-on-error: true
        id: unit_tests
        name: Run unit tests
        run: |
          python3 -m pytest \
            test/bootstrap/pre_deployment/unit/ \
            --verbose --pythonwarnings=error
      - continue-on-error: true
        id: pre_integration_tests
        name: Run pre-deployment integration tests
        run: |
          python3 -m pytest \
            test/bootstrap/pre_deployment/integration/ \
            --verbose --pythonwarnings=error
      - continue-on-error: true
        id: terraform_apply
        name: Terraform Apply
        run: |
          cd src/bootstrap && \
            terraform apply \
            -auto-approve \
            -var="github_pat=${{ secrets.GH_PAT }}" \
            -var="github_app_private_key=${{ secrets.GH_APP_PRIVATE_KEY }}"
      - continue-on-error: true
        id: post_integration_tests
        name: Run post-deployment integration tests
        run: |
          python3 -m pytest \
            test/bootstrap/post_deployment/integration/ \
            --verbose --pythonwarnings=error
      - continue-on-error: true
        id: e2e_tests
        name: Run E2E tests
        run: |
          python3 -m pytest \
            test/bootstrap/post_deployment/e2e/ \
            --verbose --pythonwarnings=error
      - env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        name: Set GitHub variables for OIDC authentication
        run: |
          AWS_REGION=$(grep 'aws_region' \
            lib/terraform/common/locals.tf \
            | grep -v '\$' | cut -d'"' -f2)
          ROLE_ARN=$(cd src/bootstrap && \
            terraform output -raw arn_for_github_actions_role)
          gh variable set AWS_REGION --body "$AWS_REGION"
          gh variable set OIDC_ROLE_ARN --body "$ROLE_ARN"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.trigger_descendants == 'true' ||
           contains(github.event.head_commit.message, '[trigger descendants]'))
        name: Dispatch descendant workflows
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.trigger_descendants }}" = "true" ]; then
            FLAGS="$FLAGS --trigger-descendants"
          fi
          INV="${{ github.event.inputs.invalidate_cloudfront }}"
          if [ "$INV" = "true" ]; then
            FLAGS="$FLAGS --invalidate-cloudfront"
          fi
          python3 src/workflowctl/workflowctl.py dispatch-descendant-workflows \
            --workflow bootstrap \
            --repo ${{ github.repository }} \
            $FLAGS
      - env:
          E2E_TESTS: ${{ steps.e2e_tests.outcome }}
          JSCPD: ${{ steps.jscpd.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          NO_INLINE_DISABLES_GH: ${{ steps.no_inline_disables_gh.outcome }}
          NO_INLINE_DISABLES_SH: ${{ steps.no_inline_disables_sh.outcome }}
          NO_LINTER_CONFIGS_GH: ${{ steps.no_linter_configs_gh.outcome }}
          NO_LINTER_CONFIGS_SH: ${{ steps.no_linter_configs_sh.outcome }}
          POST_INTEGRATION_TESTS: ${{ steps.post_integration_tests.outcome }}
          PRE_INTEGRATION_TESTS: ${{ steps.pre_integration_tests.outcome }}
          PYLINT: ${{ steps.pylint.outcome }}
          TERRAFORM_APPLY: ${{ steps.terraform_apply.outcome }}
          TERRAFORM_FMT: ${{ steps.terraform_fmt.outcome }}
          TFLINT: ${{ steps.tflint.outcome }}
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          YAMLLINT: ${{ steps.yamllint.outcome }}
        name: Assert no step failed
        run: |
          failed=""
          [ "$NO_LINTER_CONFIGS_GH" = "failure" ] && failed="$failed no_linter_configs_gh"
          [ "$NO_LINTER_CONFIGS_SH" = "failure" ] && failed="$failed no_linter_configs_sh"
          [ "$NO_INLINE_DISABLES_GH" = "failure" ] && failed="$failed no_inline_disables_gh"
          [ "$NO_INLINE_DISABLES_SH" = "failure" ] && failed="$failed no_inline_disables_sh"
          [ "$TERRAFORM_FMT" = "failure" ] && failed="$failed terraform_fmt"
          [ "$TFLINT" = "failure" ] && failed="$failed tflint"
          [ "$YAMLLINT" = "failure" ] && failed="$failed yamllint"
          [ "$PYLINT" = "failure" ] && failed="$failed pylint"
          [ "$MYPY" = "failure" ] && failed="$failed mypy"
          [ "$JSCPD" = "failure" ] && failed="$failed jscpd"
          [ "$UNIT_TESTS" = "failure" ] && failed="$failed unit_tests"
          [ "$PRE_INTEGRATION_TESTS" = "failure" ] && failed="$failed pre_integration_tests"
          [ "$TERRAFORM_APPLY" = "failure" ] && failed="$failed terraform_apply"
          [ "$POST_INTEGRATION_TESTS" = "failure" ] && failed="$failed post_integration_tests"
          [ "$E2E_TESTS" = "failure" ] && failed="$failed e2e_tests"
          if [ -n "$failed" ]; then
            echo "Steps that failed:$failed"
            exit 1
          fi
          echo "All steps succeeded"
name: Ensuring bootstrap infrastructure exists and is properly configured
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      trigger_descendants:
        default: true
        description: Trigger descendant workflows after this workflow completes
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
