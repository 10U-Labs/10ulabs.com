concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  e2e-testing:
    name: E2E testing
    needs:
      - extracting-config
      - integration-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.extracting-config.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.extracting-config.outputs.aws_account_id }}:role/${{ needs.extracting-config.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install pytest boto3 dnspython
      - name: Run E2E tests
        run: pytest test/foundation/test_e2e.py -v
  ensuring-infrastructure-in-desired-state:
    defaults:
      run:
        working-directory: src/foundation
    name: Ensuring infrastructure is in desired state
    needs:
      - extracting-config
      - snapshot-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.extracting-config.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.extracting-config.outputs.aws_account_id }}:role/${{ needs.extracting-config.outputs.github_actions_role }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10"
      - name: Terraform Init
        run: terraform init
      - name: Terraform Plan
        run: terraform plan -out=tfplan
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
  extracting-config:
    name: Extract configuration from tfvars
    outputs:
      aws_account_id: ${{ steps.tfvars.outputs.aws_account_id }}
      aws_region: ${{ steps.tfvars.outputs.aws_region }}
      github_actions_role: ${{ steps.tfvars.outputs.github_actions_role }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: tfvars
        name: Extract AWS values from tfvars
        run: |
          AWS_REGION=$(grep 'aws_region' src/foundation/terraform.tfvars | cut -d'"' -f2)
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' src/foundation/terraform.tfvars | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE=$(grep 'github_actions_role_name' src/foundation/terraform.tfvars | cut -d'"' -f2)
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "aws_account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "github_actions_role=$GITHUB_ACTIONS_ROLE" >> $GITHUB_OUTPUT
  integration-testing:
    name: Integration testing
    needs:
      - ensuring-infrastructure-in-desired-state
      - extracting-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.extracting-config.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.extracting-config.outputs.aws_account_id }}:role/${{ needs.extracting-config.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install pytest boto3
      - name: Run integration tests
        run: pytest test/foundation/test_integration.py -v
  performing-static-analysis:
    if: github.ref == 'refs/heads/main'
    name: Performing static analysis
    needs: extracting-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10"
      - name: Install tflint
        run: |
          TFLINT_INSTALL_URL='https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh'
          curl -s "$TFLINT_INSTALL_URL" | bash
      - name: Install linting dependencies
        run: pip install pylint mypy yamllint
      - name: Terraform Format Check
        run: cd src/foundation && terraform fmt -check -recursive
      - name: Terraform Init
        run: cd src/foundation && terraform init
      - name: Terraform Validate
        run: cd src/foundation && terraform validate
      - name: Run tflint
        run: cd src/foundation && tflint --init && tflint
      - name: Linting YAML files
        run: |
          DOCUMENT_START='document-start: disable'
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: {max: 300, level: warning}'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$DOCUMENT_START, $EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/foundation.yml
  snapshot-testing:
    defaults:
      run:
        working-directory: src/foundation
    name: Snapshot testing
    needs:
      - extracting-config
      - unit-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10"
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.extracting-config.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.extracting-config.outputs.aws_account_id }}:role/${{ needs.extracting-config.outputs.github_actions_role }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > ../../tfplan.json
      - name: Install Python dependencies
        run: pip install pytest
      - name: Run snapshot tests
        run: pytest ../../test/foundation/test_snapshot.py -v
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install pytest boto3
      - name: Run unit tests
        run: pytest test/foundation/test_unit.py -v
name: Ensuring foundational infrastructure exists and is properly configured
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/foundation.yml'
      - 'src/foundation/**'
      - 'test/foundation/**'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
