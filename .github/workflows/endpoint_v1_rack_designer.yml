---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.dry_run != 'true'
    name: Deploy Rack Designer endpoint
    runs-on:
      - ecs
      - fargate
      - arm
      - spot
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: config
        name: Extract configuration values
        run: |
          TF_SHARED_LOCALS="lib/terraform/modules/shared/locals.tf"
          LOCALS="src/bootstrap/locals.tf"
          BACKEND="src/api/endpoints/rack_designer/backend.tf"
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          AWS_REGION=$(grep 'aws_region' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          ROLE_SUFFIX=$(grep 'name_for_github_actions_role' $LOCALS \
            | sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          RESOURCE_PREFIX=$(grep 'resource_prefix' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          TF_VER=$(grep 'required_version' $BACKEND \
            | cut -d'"' -f2 | sed 's/>= //')
          ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RESOURCE_PREFIX}${ROLE_SUFFIX}"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "github_actions_role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
          echo "terraform_version=$TF_VER" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.config.outputs.github_actions_role_arn }}
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/endpoint_v1_rack_designer.yml
      - name: Run pylint on source
        run: |
          python3 -m pylint \
            lib/python/ src/api/endpoints/rack_designer/lambdas/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/ test/conftest.py test/api/conftest.py \
            test/api/endpoints/conftest.py test/api/endpoints/rack_designer/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run mypy on source
        run: |
          python3 -m mypy \
            lib/python/ src/api/endpoints/rack_designer/lambdas/
      - name: Run mypy on tests
        run: |
          MYPYPATH=lib/python python3 -m mypy \
            lib/python/ test/conftest.py test/api/conftest.py \
            test/api/endpoints/conftest.py test/api/endpoints/rack_designer/
      - name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ src/api/endpoints/rack_designer/lambdas/
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/conftest.py test/api/conftest.py \
            test/api/endpoints/conftest.py test/api/endpoints/rack_designer/
      - name: Terraform Format Check
        run: |
          cd src/api/endpoints/rack_designer
          terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: |
          cd src/api/endpoints/rack_designer
          terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api/endpoints/rack_designer && \
            tflint --init && \
            tflint
      - name: Terraform Plan
        run: cd src/api/endpoints/rack_designer && terraform plan
      - name: Run unit tests
        run: |
          TESTS="test/api/endpoints/rack_designer/pre_deployment/unit/"
          python3 -m pytest \
            $TESTS --verbose --pythonwarnings=error
      - name: Run pre-deployment integration tests
        run: |
          TESTS="test/api/endpoints/rack_designer/pre_deployment/integration/"
          python3 -m pytest \
            $TESTS --capture=no --verbose --pythonwarnings=error
      - name: Terraform Apply
        run: cd src/api/endpoints/rack_designer && terraform apply -auto-approve
      - name: Get website bucket name
        run: |
          WWW="-chdir=src/www/shared"
          terraform $WWW init -backend=true -input=false > /dev/null
          BUCKET_NAME=$(terraform $WWW output -raw bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
      - name: Sync frontend to S3
        run: |
          SRC="src/www/paths/rack_designer/"
          DEST="s3://${{ env.BUCKET_NAME }}/rack-designer/"
          aws s3 sync $SRC $DEST --delete --cache-control no-cache \
            --storage-class ONEZONE_IA --exclude ".gitkeep"
      - id: check_files
        name: Check if frontend files changed
        run: |
          set -e
          set -o pipefail
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE_COMMIT="${{ github.event.before }}"
          else
            BASE_COMMIT="HEAD^"
          fi
          git diff --name-only $BASE_COMMIT ${{ github.sha }} | \
            if grep -qE 'src/www/paths/rack_designer/'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Invalidate CloudFront cache
        run: |
          WWW="-chdir=src/www/shared"
          FQDN=$(terraform $WWW output -raw website_domain_name)
          python3 scripts/invalidate_cloudfront.py \
            --fqdn "$FQDN" \
            --region ${{ steps.config.outputs.aws_region }} \
            --paths "/rack-designer/*"
      - name: Run post-deployment integration tests
        run: |
          TESTS="test/api/endpoints/rack_designer/post_deployment/integration/"
          python3 -m pytest \
            $TESTS --verbose --pythonwarnings=error
      - name: Run e2e tests
        run: |
          TESTS="test/api/endpoints/rack_designer/post_deployment/e2e/"
          python3 -m pytest \
            $TESTS --verbose --pythonwarnings=error
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (
          github.event.inputs.trigger_descendants == 'true' ||
           contains(github.event.head_commit.message,
           '[trigger descendants]'))
        name: Dispatch descendant workflows
        run: |
          TRIGGER_FLAG=""
          TRIGGER_INPUT="${{ github.event.inputs.trigger_descendants }}"
          if [ "$TRIGGER_INPUT" = "true" ]
          then TRIGGER_FLAG="--trigger-descendants"
          fi
          python3 src/workflowctl/workflowctl.py dispatch \
            $TRIGGER_FLAG \
            --workflow endpoint_v1_rack_designer \
            --repo ${{ github.repository }}
name: >-
  Ensuring /v1/rack-designer API endpoint exists and is properly configured
on:
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      trigger_descendants:
        default: false
        description: Trigger descendant workflows after this workflow completes
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
