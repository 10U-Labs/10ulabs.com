---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  common-vars:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    name: Declaring common variables
    outputs:
      aws_region: ${{ steps.config.outputs.aws_region }}
      role_arn: ${{ steps.bootstrap.outputs.role_arn }}
      terraform_version: ${{ steps.config.outputs.terraform_version }}
    permissions:
      contents: read
      id-token: write
    runs-on:
      - ecs
      - fargate
      - on-demand
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          TF="lib/terraform/modules/shared/outputs.tf"
          TF_LOCALS="lib/terraform/modules/shared/locals.tf"
          LOCALS="src/bootstrap/locals.tf"
          BACKEND="src/api/endpoints/rack_designer/backend.tf"
          AWS_ACCOUNT_ID=$(grep -A1 'output "aws_account_id"' $TF \
            | grep 'value' | cut -d'"' -f2)
          AWS_REGION=$(grep -A1 'output "aws_region"' $TF \
            | grep 'value' | cut -d'"' -f2)
          ROLE_SUFFIX=$(grep 'name_for_github_actions_role' $LOCALS \
            | sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          RESOURCE_PREFIX=$(grep 'resource_prefix' $TF_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          TF_VER=$(grep 'required_version' $BACKEND \
            | cut -d'"' -f2 | sed 's/>= //')
          ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RESOURCE_PREFIX}${ROLE_SUFFIX}"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
          echo "terraform_version=$TF_VER" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.config.outputs.role_arn }}
      - id: bootstrap
        name: Get bootstrap outputs
        run: |
          CHDIR="-chdir=src/bootstrap"
          terraform $CHDIR init -backend=true -input=false > /dev/null
          ROLE_ARN=$(terraform $CHDIR output -raw arn_for_github_actions_role)
          echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
  ensuring-infrastructure-in-desired-state:
    defaults:
      run:
        working-directory: src/api/endpoints/rack_designer
    name: Ensuring infrastructure is in desired state
    needs:
      - common-vars
      - integration-testing-pre-deployment
      - unit-testing
    runs-on:
      - ecs
      - fargate
      - on-demand
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.common-vars.outputs.aws_region }}
          role-to-assume: ${{ needs.common-vars.outputs.role_arn }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve
      - name: Get website bucket name
        run: |
          WWW="-chdir=../../../www/shared"
          terraform $WWW init -backend=true -input=false > /dev/null
          BUCKET_NAME=$(terraform $WWW output -raw bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
      - name: Sync frontend to S3
        run: |
          SRC="../../../www/paths/rack_designer/"
          DEST="s3://${{ env.BUCKET_NAME }}/rack-designer/"
          aws s3 sync $SRC $DEST --delete --cache-control no-cache \
            --storage-class ONEZONE_IA --exclude ".gitkeep"
      - id: check_files
        name: Check if frontend files changed
        run: |
          set -e
          set -o pipefail
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE_COMMIT="${{ github.event.before }}"
          else
            BASE_COMMIT="HEAD^"
          fi
          git diff --name-only $BASE_COMMIT ${{ github.sha }} | \
            if grep -qE 'src/www/paths/rack_designer/'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Invalidate CloudFront cache
        run: |
          WWW="-chdir=../../../www/shared"
          FQDN=$(terraform $WWW output -raw website_domain_name)
          python3 ../../../../scripts/invalidate_cloudfront.py \
            --fqdn "$FQDN" \
            --region ${{ needs.common-vars.outputs.aws_region }} \
            --paths "/rack-designer/*"
        working-directory: src/api/endpoints/rack_designer
  integration-testing-post-deployment:
    name: Post-deployment integration testing
    needs:
      - common-vars
      - ensuring-infrastructure-in-desired-state
    runs-on:
      - ecs
      - fargate
      - on-demand
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.common-vars.outputs.aws_region }}
          role-to-assume: ${{ needs.common-vars.outputs.role_arn }}
      - name: Run integration tests
        run: |
          TESTS="test/api/endpoints/rack_designer/post_deployment/integration/"
          python3 -m pytest $TESTS --verbose --pythonwarnings=error
  integration-testing-pre-deployment:
    name: Pre-deployment integration testing
    needs:
      - common-vars
      - unit-testing
    permissions:
      contents: read
      id-token: write
    runs-on:
      - ecs
      - fargate
      - on-demand
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: >-
            ${{ needs.common-vars.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.common-vars.outputs.aws_region }}
          role-to-assume: ${{ needs.common-vars.outputs.role_arn }}
      - name: Run pre-deployment integration tests
        run: |
          TESTS="test/api/endpoints/rack_designer/pre_deployment/integration/"
          python3 -m pytest $TESTS --verbose --pythonwarnings=error
  performing-static-analysis:
    if: github.ref == 'refs/heads/main'
    name: Performing static analysis
    needs: common-vars
    runs-on:
      - ecs
      - fargate
      - on-demand
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.common-vars.outputs.aws_region }}
          role-to-assume: ${{ needs.common-vars.outputs.role_arn }}
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: disable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/endpoint_v1_rack_designer.yml
      - name: Run pylint
        run: |
          for file in src/api/endpoints/rack_designer/lambdas/*.py; do
            python3 -m pylint "$file" \
              --fail-on=C,R,W \
              --fail-under=10.0
          done
          python3 -m pylint test/api/endpoints/rack_designer/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run mypy
        run: |
          for file in src/api/endpoints/rack_designer/lambdas/*.py; do
            python3 -m mypy "$file"
          done
          python3 -m mypy test/api/endpoints/rack_designer/
      - name: Terraform Format Check
        run: |
          cd src/api/endpoints/rack_designer
          terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: |
          cd src/api/endpoints/rack_designer
          terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api/endpoints/rack_designer && \
            tflint --init && \
            tflint
      - name: Terraform Plan
        run: cd src/api/endpoints/rack_designer && terraform plan
  unit-testing:
    name: Unit testing
    needs:
      - common-vars
      - performing-static-analysis
    runs-on:
      - ecs
      - fargate
      - on-demand
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          TESTS="test/api/endpoints/rack_designer/pre_deployment/unit/"
          python3 -m pytest $TESTS --verbose --pythonwarnings=error
name: Ensuring Rack Designer exists and is properly configured
on:
  workflow_call:
    inputs:
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
  workflow_dispatch:
    inputs:
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
permissions:
  contents: read
  id-token: write
