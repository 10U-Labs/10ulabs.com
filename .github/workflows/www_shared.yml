---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy www_shared infrastructure
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: config
        name: Extract configuration values
        run: |
          TF=lib/terraform/modules/shared/outputs.tf
          TF_SHARED_LOCALS=lib/terraform/modules/shared/locals.tf
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          AWS_REGION=$(grep 'aws_region' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' \
            src/bootstrap/locals.tf | \
            sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          RESOURCE_PREFIX=$(grep 'resource_prefix' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/www/shared/backend.tf | cut -d'"' -f2 | sed 's/>= //')
          ROLE_PREFIX="arn:aws:iam::${AWS_ACCOUNT_ID}:role"
          ROLE_NAME="${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          GITHUB_ACTIONS_ROLE_ARN="${ROLE_PREFIX}/${ROLE_NAME}"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          GH_ROLE_ARN="github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN"
          echo "$GH_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.config.outputs.github_actions_role_arn }}
      - id: bootstrap
        name: Get bootstrap outputs
        run: |
          terraform -chdir=src/bootstrap init \
            -backend=true -input=false > /dev/null
          GITHUB_ACTIONS_ROLE_ARN=$(terraform -chdir=src/bootstrap \
            output -raw arn_for_github_actions_role)
          GH_ROLE="github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN"
          echo "$GH_ROLE" >> $GITHUB_OUTPUT
      - name: Re-configure AWS credentials with bootstrap role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.bootstrap.outputs.github_actions_role_arn }}
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install \
            'boto3>=1.35.76' boto3-stubs botocore mypy pylint pytest \
            pytest-dependency requests types-requests yamllint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/www_shared.yml
      - name: Run pylint
        run: |
          PYTHONPATH=lib/python python3 -m pylint test/www/shared/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run mypy
        run: MYPYPATH=lib/python python3 -m mypy test/www/shared/
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/conftest.py test/www/shared/ \
            test/lib/terraform/modules/
      - name: Terraform Format Check
        run: cd src/www/shared && terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: cd src/www/shared && terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: cd src/www/shared && tflint --init && tflint
      - name: Run module unit tests
        run: |
          python3 -m pytest \
            test/lib/terraform/modules/s3_bucket/unit/ \
            test/lib/terraform/modules/cloudfront_waf/unit/ \
            --verbose --pythonwarnings=error
      - name: Run unit tests
        run: |
          python3 -m pytest \
            test/www/shared/pre_deployment/unit/ \
            --verbose --pythonwarnings=error
      - name: Run pre-deployment integration tests
        run: |
          python3 -m pytest \
            test/www/shared/pre_deployment/integration/ \
            --capture=no --verbose --pythonwarnings=error
      - name: Terraform Apply
        run: cd src/www/shared && terraform apply -auto-approve
      - id: check_files
        name: Check if CloudFront config changed
        run: |
          set -e
          set -o pipefail
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE_COMMIT="${{ github.event.before }}"
          else
            BASE_COMMIT="HEAD^"
          fi
          git diff --name-only $BASE_COMMIT ${{ github.sha }} | \
            if grep -qE 'src/www/shared/cloudfront_s3\.tf'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Get website domain from Terraform output
        run: |
          WEBSITE_FQDN=$(cd src/www/shared && \
            terraform output -raw website_domain_name)
          echo "WEBSITE_FQDN=$WEBSITE_FQDN" >> $GITHUB_ENV
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Invalidate CloudFront cache
        run: |
          python3 scripts/invalidate_cloudfront.py \
            --fqdn "${{ env.WEBSITE_FQDN }}" \
            --region "${{ steps.config.outputs.aws_region }}" \
            --paths "/*"
      - name: Run post-deployment integration tests
        run: |
          python3 -m pytest \
            test/www/shared/post_deployment/integration/ \
            --verbose --pythonwarnings=error
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (
          github.event.inputs.trigger_descendants == 'true' ||
           contains(github.event.head_commit.message,
           '[trigger descendants]'))
        name: Dispatch descendant workflows
        run: |
          TRIGGER_FLAG=""
          TRIGGER_INPUT="${{ github.event.inputs.trigger_descendants }}"
          if [ "$TRIGGER_INPUT" = "true" ]
          then TRIGGER_FLAG="--trigger-descendants"
          fi
          python3 src/workflowctl/workflowctl.py dispatch \
            $TRIGGER_FLAG \
            --workflow www_shared \
            --repo ${{ github.repository }}
name: Ensuring www shared infrastructure exists and is properly configured
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      trigger_descendants:
        default: false
        description: Trigger descendant workflows after this workflow completes
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
