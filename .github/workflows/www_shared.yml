---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  declaring-common-variables:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    name: Declaring common variables
    outputs:
      aws_region: ${{ steps.config.outputs.aws_region }}
      github_actions_role_arn: >-
        ${{ steps.bootstrap.outputs.github_actions_role_arn }}
      terraform_version: ${{ steps.config.outputs.terraform_version }}
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: >-
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}
          terraform_wrapper: false
      - id: config
        name: Extract configuration values
        run: |
          AWS_ACCOUNT_ID=$(grep -A1 'output "aws_account_id"' \
            lib/terraform/outputs.tf | grep 'value' | cut -d'"' -f2)
          AWS_REGION=$(grep -A1 'output "aws_region"' \
            lib/terraform/outputs.tf | grep 'value' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' \
            src/bootstrap/locals.tf | \
            sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          RESOURCE_PREFIX=$(grep -A1 'output "resource_prefix"' \
            lib/terraform/outputs.tf | grep 'value' | cut -d'"' -f2)
          TERRAFORM_VERSION=$(grep 'required_version' \
            src/www/shared/backend.tf | cut -d'"' -f2 | sed 's/>= //')
          ROLE_PREFIX="arn:aws:iam::${AWS_ACCOUNT_ID}:role"
          ROLE_NAME="${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          GITHUB_ACTIONS_ROLE_ARN="${ROLE_PREFIX}/${ROLE_NAME}"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN" \
            >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.config.outputs.github_actions_role_arn }}
      - id: bootstrap
        name: Get bootstrap outputs
        run: |
          terraform -chdir=src/bootstrap init \
            -backend=true -input=false > /dev/null
          GITHUB_ACTIONS_ROLE_ARN=$(terraform -chdir=src/bootstrap \
            output -raw arn_for_github_actions_role)
          echo "github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN" \
            >> $GITHUB_OUTPUT
  ensuring-infrastructure-in-desired-state:
    defaults:
      run:
        working-directory: src/www/shared
    name: Ensuring infrastructure is in desired state
    needs:
      - declaring-common-variables
      - unit-testing
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.github_actions_role_arn
            }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve
      - id: check_files
        name: Check if CloudFront config changed
        run: |
          set -e
          set -o pipefail
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE_COMMIT="${{ github.event.before }}"
          else
            BASE_COMMIT="HEAD^"
          fi
          git diff --name-only $BASE_COMMIT ${{ github.sha }} | \
            if grep -qE 'src/www/shared/cloudfront_s3\.tf'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Get website domain from Terraform output
        run: |
          WEBSITE_FQDN=$(terraform output -raw website_domain_name)
          echo "WEBSITE_FQDN=$WEBSITE_FQDN" >> $GITHUB_ENV
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
            '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Invalidate CloudFront cache
        run: |
          REGION=${{ needs.declaring-common-variables.outputs.aws_region }}
          python3 ../../../scripts/invalidate_cloudfront.py \
            --fqdn "${{ env.WEBSITE_FQDN }}" \
            --region "$REGION" \
            --paths "/*"
  integration-testing:
    name: Integration testing
    needs:
      - declaring-common-variables
      - ensuring-infrastructure-in-desired-state
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.github_actions_role_arn
            }}
      - if: >-
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3 requests
      - name: Run integration tests
        run: |
          python3 -m pytest \
            test/www/shared/post_deployment/integration/ -v
  performing-static-analysis:
    if: github.ref == 'refs/heads/main'
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.github_actions_role_arn
            }}
      - if: >-
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install \
            pylint mypy yamllint pytest boto3 boto3-stubs types-requests
      - if: >-
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: >-
            ${{ needs.declaring-common-variables.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/www_shared.yml
      - name: Run pylint
        run: |
          python3 -m pylint test/www/shared/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Run mypy
        run: python3 -m mypy test/www/shared/
      - name: Terraform Format Check
        run: cd src/www/shared && terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: cd src/www/shared && terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/www/shared && \
            tflint --init && \
            tflint
      - name: Terraform Plan
        run: cd src/www/shared && terraform plan
  unit-testing:
    name: Unit testing
    needs:
      - declaring-common-variables
      - performing-static-analysis
    runs-on: >-
      ${{ ( github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: >-
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3
      - name: Run unit tests
        run: python3 -m pytest test/www/shared/pre_deployment/ -v
name: Ensuring www shared infrastructure exists and is properly configured
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/www_shared.yml'
      - 'src/www/shared/**'
      - 'test/www/shared/**'
  workflow_call:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
  workflow_run:
    branches:
      - main
    types:
      - completed
    workflows:
      - 'Ensuring bootstrap infrastructure exists and is properly configured'
permissions:
  contents: read
  id-token: write
