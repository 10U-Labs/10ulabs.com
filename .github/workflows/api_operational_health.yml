  tflint:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - id: terraform
        name: Extract Terraform version
        run: |
          TF_FILE=src/api/operational/health/backend.tf
          TERRAFORM_VERSION=$(grep 'required_version' $TF_FILE \
            | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Terraform Init
        run: |
          cd src/api/operational/health && \
            terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api/operational/health && \
            tflint --init && \
            tflint
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            requests
      - name: Run unit tests
        run: |
          TEST=test/api/operational/health
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST/pre_deployment/unit/ \
            --confcutdir=test --verbose --pythonwarnings=error
  unit-tests-module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest
      - name: Run module unit tests
        run: |
          TEST_DIRS="test/lib/terraform/common/unit/"
          TEST_DIRS="$TEST_DIRS test/lib/terraform/unit/"
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST_DIRS \
            --confcutdir=test --verbose --pythonwarnings=error
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            yamllint
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/api_operational_health.yml
name: api_operational_health
on:
  push:
    branches:
      - main
    paths:
      - .github/actions/verify-oidc-vars/action.yml
      - .github/workflows/api_operational_health.yml
      - lib/python/boto_mocks/**
      - lib/python/lambda_response/**
      - lib/python/module_utils/**
      - lib/python/repo_utils/**
      - lib/python/terraform_config/**
      - lib/python/terraform_drift/**
      - lib/python/test_fixtures/**
      - lib/terraform/common/**
      - src/api/operational/health/**
      - test/api/conftest.py
      - test/api/operational/conftest.py
      - test/api/operational/health/**
      - test/conftest.py
      - test/lib/python/test_boto_mocks/**
      - test/lib/python/test_lambda_response/**
      - test/lib/python/test_module_utils/**
      - test/lib/python/test_repo_utils/**
      - test/lib/python/test_terraform_config/**
      - test/lib/python/test_terraform_drift/**
      - test/lib/python/test_test_fixtures/**
      - test/lib/terraform/common/**
      - test/lib/terraform/conftest.py
      - test/lib/terraform/unit/**
  workflow_dispatch:
  workflow_run:
    types:
      - completed
    workflows:
      - api_common_routing
permissions:
  contents: read
  id-token: write
