---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy /v1/webhooks/github/jit-runner-requests endpoint
    permissions:
      actions: write
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED_RUNNERS == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - id: config
        name: Extract configuration values
        run: |
          BACKEND=src/api/endpoints/webhooks/github/jit_runner_requests/backend.tf
          TERRAFORM_VERSION=$(grep 'required_version' $BACKEND \
            | cut -d'"' -f2 | sed 's/>= //')
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - if: >-
          vars.USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - if: >-
          vars.USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - if: >-
          vars.USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Terraform Format Check
        run: |
          cd src/api/endpoints/webhooks/github/jit_runner_requests
          terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: |
          cd src/api/endpoints/webhooks/github/jit_runner_requests
          terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api/endpoints/webhooks/github/jit_runner_requests
          tflint --init && tflint
      - if: >-
          vars.USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install yamllint
        run: python3 -m pip install yamllint
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/webhooks_github_jit_runner_requests.yml
      - if: >-
          vars.USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install pylint
        run: python3 -m pip install pylint
      - name: Run pylint on source
        run: |
          SRC=src/api/endpoints/webhooks/github/jit_runner_requests
          python3 -m pylint lib/python/ $SRC/lambdas/ --fail-under=10.0
      - name: Run pylint on tests
        run: |
          TEST=test/api/endpoints/webhooks/github/jit_runner_requests
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/ test/conftest.py test/api/conftest.py \
            test/api/endpoints/conftest.py $TEST/ --fail-under=10.0
      - if: >-
          vars.USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install mypy
        run: python3 -m pip install mypy boto3-stubs types-requests types-PyYAML
      - name: Run mypy on source
        run: |
          SRC=src/api/endpoints/webhooks/github/jit_runner_requests
          python3 -m mypy lib/python/ $SRC/lambdas/
      - name: Run mypy on tests
        run: |
          TEST=test/api/endpoints/webhooks/github/jit_runner_requests
          MYPYPATH=lib/python python3 -m mypy \
            lib/python/ test/conftest.py test/api/conftest.py \
            test/api/endpoints/conftest.py $TEST/
      - if: >-
          vars.USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install jscpd
        run: npm install -g jscpd
      - name: Check for duplicate code in source Python files
        run: |
          SRC=src/api/endpoints/webhooks/github/jit_runner_requests
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ $SRC/lambdas/
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/
      - if: >-
          vars.USE_GITHUB_HOSTED_RUNNERS == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install pytest dependencies
        run: python3 -m pip install pytest boto3 PyYAML requests
      - name: Run unit tests
        run: |
          TEST=test/api/endpoints/webhooks/github/jit_runner_requests
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST/pre_deployment/unit/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - name: Run pre-deployment integration tests
        run: |
          BASE=test/api/endpoints/webhooks/github/jit_runner_requests
          PYTHONPATH=lib/python python3 -m pytest \
            $BASE/pre_deployment/integration/ \
            --capture=no --confcutdir=test --verbose --pythonwarnings=error
      - name: Terraform Apply
        run: |
          cd src/api/endpoints/webhooks/github/jit_runner_requests
          terraform apply -auto-approve
      - name: Run post-deployment integration tests
        run: |
          BASE=test/api/endpoints/webhooks/github/jit_runner_requests
          PYTHONPATH=lib/python python3 -m pytest \
            $BASE/post_deployment/integration/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - name: Run E2E tests
        run: |
          BASE=test/api/endpoints/webhooks/github/jit_runner_requests
          PYTHONPATH=lib/python python3 -m pytest \
            $BASE/post_deployment/e2e/ \
            --confcutdir=test --verbose --pythonwarnings=error
      - env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        name: Disable USE_GITHUB_HOSTED variable
        run: |
          echo "Jit runner requests workflow completed successfully."
          echo "Disabling USE_GITHUB_HOSTED to switch future workflows to ECS."
          gh variable set USE_GITHUB_HOSTED --body "false" \
            --repo ${{ github.repository }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (
          github.event.inputs.trigger_descendants == 'true' ||
           contains(github.event.head_commit.message,
           '[trigger descendants]'))
        name: Dispatch descendant workflows
        run: |
          TRIGGER_FLAG=""
          TRIGGER_INPUT="${{ github.event.inputs.trigger_descendants }}"
          if [ "$TRIGGER_INPUT" = "true" ]
          then TRIGGER_FLAG="--trigger-descendants"
          fi
          python3 src/workflowctl/workflowctl.py dispatch \
            $TRIGGER_FLAG \
            --workflow webhooks_github_jit_runner_requests \
            --repo ${{ github.repository }}
name: >-
  Ensuring the /v1/webhooks/github/jit-runner-requests API endpoint
  exists and is properly configured
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      trigger_descendants:
        default: false
        description: Trigger descendant workflows after this workflow completes
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
