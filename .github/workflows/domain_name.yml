name: Domain Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'src/domain_name/**'
      - 'test/domain_name/**'
      - 'app.py'
      - 'cdk.json'
      - 'requirements-cdk.txt'
      - '.github/workflows/domain_name.yml'
  pull_request:
    paths:
      - 'src/domain_name/**'
      - 'test/domain_name/**'
      - 'app.py'
      - 'cdk.json'
      - 'requirements-cdk.txt'
      - '.github/workflows/domain_name.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (skip deployment, just test)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:

  performing-static-analysis:
    name: Performing static analysis
    runs-on: ubuntu-latest

    steps:
      - name: DRY RUN - Skip static analysis
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would run pylint and mypy static analysis"

      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: pip install pylint mypy

      - name: Install project dependencies for linting
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: pip install -r requirements-cdk.txt

      - name: Performing lightweight static analysis
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pylint src/domain_name/**/*.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0

      - name: Performing heavyweight static analysis
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          mypy src/domain_name --ignore-missing-imports

  unit-testing-code:
    name: Unit testing code
    runs-on: ubuntu-latest
    needs: performing-static-analysis

    steps:
      - name: DRY RUN - Skip unit tests
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would run unit tests with pytest"

      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js (required by aws-cdk-lib/jsii)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pip install pytest
          pip install -r requirements-cdk.txt

      - name: Run unit tests
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pytest test/domain_name/pre_deployment/unit/ -v

  integration-testing-code:
    name: Integration testing code
    runs-on: ubuntu-latest
    needs: unit-testing-code

    steps:
      - name: DRY RUN - Skip pre-deployment integration tests
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would run pre-deployment integration tests"

      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js (required by aws-cdk-lib/jsii)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pip install pytest
          pip install -r requirements-cdk.txt

      - name: Run pre-deployment integration tests
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pytest test/domain_name/pre_deployment/integration/ -v


  building-artifacts:
    name: Building artifacts
    runs-on: ubuntu-latest
    needs: integration-testing-code

    steps:
      - name: DRY RUN - Skip CDK synthesis
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would synthesize AWS CDK domain stack"

      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4

      - name: Load configuration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' src/domain_name/config.json)
          REGION=$(jq -r '.aws_region' src/domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}

      - name: Set up Python & Node
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        if: ${{ github.event.inputs.dry_run != 'true' }}
        with:
          node-version: '20'

      - name: Install CDK
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm install -g aws-cdk

      - name: Install dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: pip install -r requirements-cdk.txt

      - name: Synthesize domain stack
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: cdk synth TenUFOrgDomain


  deploying-artifacts:
    name: Deploying artifacts
    needs: building-artifacts
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.dry_run != 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || (
        !contains(github.event.head_commit.message, '[skip-deploy]') &&
        !contains(github.event.head_commit.message, '[skip deploy]')
      ))

    steps:
      - name: DRY RUN - Skip deployment
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would deploy domain infrastructure with CDK"

      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4

      - name: Load configuration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' src/domain_name/config.json)
          REGION=$(jq -r '.aws_region' src/domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}

      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm install -g aws-cdk

      - name: Install dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: pip install -r requirements-cdk.txt

      - name: CDK Bootstrap (if needed)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cdk bootstrap aws://${{ steps.config.outputs.account_id }}/${{ steps.config.outputs.region }}

      - name: CDK Diff
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: cdk diff TenUFOrgDomain

      - name: CDK Deploy
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cdk deploy TenUFOrgDomain \
            --require-approval never \
            --outputs-file domain-outputs.json

      - name: Display outputs
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Domain infrastructure deployed successfully"
          echo ""
          echo "Stack Outputs:"
          cat domain-outputs.json | jq '.'


  unit-testing-deployed-infrastructure:
    name: Unit testing deployed infrastructure
    runs-on: ubuntu-latest
    needs: deploying-artifacts
    if: ${{ needs.deploying-artifacts.result == 'success' }}

    steps:
      - name: DRY RUN - Skip unit testing deployed infrastructure
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would test newly deployed domain infrastructure with Cinc Auditor"

      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4

      - name: Load configuration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' src/domain_name/config.json)
          REGION=$(jq -r '.aws_region' src/domain_name/config.json)
          DOMAIN_NAME=$(jq -r '.domain_name' src/domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "domain_name=$DOMAIN_NAME" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials via OIDC
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}

      - name: Install Cinc Auditor
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-auditor

      - name: Run unit tests on deployed infrastructure
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Running unit tests on deployed domain infrastructure"

          cinc-auditor exec test/domain_name/post_deployment/unit \
            --input domain_name="${{ steps.config.outputs.domain_name }}" \
            --reporter cli


  integration-testing-infrastructure:
    name: Integration testing infrastructure
    runs-on: ubuntu-latest
    needs: unit-testing-deployed-infrastructure

    steps:
      - name: DRY RUN - Skip integration tests
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would run integration tests"

      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4

      - name: Load configuration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' src/domain_name/config.json)
          REGION=$(jq -r '.aws_region' src/domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials via OIDC
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}

      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pip install pytest boto3

      - name: Run integration tests
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pytest test/domain_name/post_deployment/integration/ -v


  e2e-testing-infrastructure:
    name: E2E testing infrastructure
    runs-on: ubuntu-latest
    needs: integration-testing-infrastructure

    steps:
      - name: DRY RUN - Skip E2E tests
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN - Would run E2E tests"

      - name: Checkout code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/checkout@v4

      - name: Load configuration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' src/domain_name/config.json)
          REGION=$(jq -r '.aws_region' src/domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials via OIDC
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}

      - name: Set up Python
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pip install pytest boto3 dnspython

      - name: Run E2E tests
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          pytest test/domain_name/post_deployment/e2e/ -v


  determine-readme-update:
    name: Determining if README.md should be updated
    runs-on: ubuntu-latest
    needs: e2e-testing-infrastructure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      should_update: ${{ steps.check.outputs.should_update }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load configuration
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' src/domain_name/config.json)
          REGION=$(jq -r '.aws_region' src/domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}

      - name: Check if README needs update
        id: check
        run: |
          python src/bootstrap/bootstrap.py readme \
            --module domain_name \
            --check \
            --output-file "$GITHUB_OUTPUT"


  conclude-readme-skip:
    name: Concluding README.md should not be updated
    runs-on: ubuntu-latest
    needs: determine-readme-update
    if: needs.determine-readme-update.outputs.should_update != 'true'

    steps:
      - run: 'true'


  conclude-readme-update:
    name: Concluding README.md should be updated
    runs-on: ubuntu-latest
    needs: determine-readme-update
    if: needs.determine-readme-update.outputs.should_update == 'true'

    steps:
      - run: 'true'


  update-readme:
    name: Updating README.md
    runs-on: ubuntu-latest
    needs: conclude-readme-update
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load configuration
        id: config
        run: |
          ACCOUNT_ID=$(jq -r '.aws_account_id' src/domain_name/config.json)
          REGION=$(jq -r '.aws_region' src/domain_name/config.json)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
          aws-region: ${{ steps.config.outputs.region }}

      - name: Update README with Bedrock
        run: |
          python src/bootstrap/bootstrap.py readme \
            --module domain_name \
            --bedrock-model-id anthropic.claude-3-5-sonnet-20241022-v2:0

      - name: Commit and push README if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if git diff --quiet src/domain_name/README.md; then
            echo "No changes to README.md"
          else
            git add src/domain_name/README.md
            git commit -m "Update domain_name README.md [skip ci]"
            git push
          fi
