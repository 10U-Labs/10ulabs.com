concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  concluding-readme-should-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated == 'true'
    name: Concluding README.md should be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  concluding-readme-should-not-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated != 'true'
    name: Concluding README.md should not be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  determining-if-readme-should-be-updated:
    name: Determining if README.md should be updated
    needs: e2e-testing
    outputs:
      readme_should_be_updated: ${{ steps.check.outputs.readme_should_be_updated }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.account_id' scripts/transform_to_compliant_markdown/config.json);
          REGION=$(jq -r '.region' scripts/transform_to_compliant_markdown/config.json);
          MODEL_ID=$(jq -r '.bedrock.model_id' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_REASONING=$(jq -r '.bedrock.max_tokens_reasoning' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_GENERATION=$(jq -r '.bedrock.max_tokens' scripts/transform_to_compliant_markdown/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - id: check
        name: Check if README needs update
        run: |
          python scripts/readme/readme.py \
            --project-dir scripts/transform_to_compliant_markdown \
            --test-dir test/transform_to_compliant_markdown \
            --check \
            --prompt-check scripts/readme/prompt_check.md \
            --prompt-update scripts/readme/prompt_update.md \
            --aws-region "${{ steps.config.outputs.region }}" \
            --bedrock-model-id "${{ steps.config.outputs.model_id }}" \
            --max-tokens-reasoning "${{ steps.config.outputs.max_tokens_reasoning }}" \
            --max-tokens-generation "${{ steps.config.outputs.max_tokens_generation }}" \
            --output-file "$GITHUB_OUTPUT"
  e2e-testing:
    name: E2E testing
    needs: integration-testing
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.account_id' scripts/transform_to_compliant_markdown/config.json);
          REGION=$(jq -r '.region' scripts/transform_to_compliant_markdown/config.json);
          MODEL_ID=$(jq -r '.bedrock.model_id' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_REASONING=$(jq -r '.bedrock.max_tokens_reasoning' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_GENERATION=$(jq -r '.bedrock.max_tokens' scripts/transform_to_compliant_markdown/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pytest boto3
      - name: Run E2E tests
        run: pytest test/transform_to_compliant_markdown/test_e2e.py -v
  integration-testing:
    name: Integration testing
    needs: unit-testing
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.account_id' scripts/transform_to_compliant_markdown/config.json);
          REGION=$(jq -r '.region' scripts/transform_to_compliant_markdown/config.json);
          MODEL_ID=$(jq -r '.bedrock.model_id' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_REASONING=$(jq -r '.bedrock.max_tokens_reasoning' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_GENERATION=$(jq -r '.bedrock.max_tokens' scripts/transform_to_compliant_markdown/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install pytest boto3
      - name: Run pytest integration tests
        run: pytest test/transform_to_compliant_markdown/test_integration.py -v
  performing-static-analysis:
    if: |
      github.ref == 'refs/heads/main' &&
      (
        (
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, '[dry run]')
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run != 'true'
        )
      )
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install linting dependencies
        run: |
          pip install pylint mypy yamllint boto3 boto3-stubs[bedrock-runtime]
          npm install -g jsonlint markdownlint-cli2
      - name: Linting JSON configuration files
        run: |
          echo "Validating JSON syntax..."
          jsonlint -q scripts/transform_to_compliant_markdown/config.json
      - name: Linting markdown files
        run: |
          echo "Running markdownlint on CLAUDE.md..."
          markdownlint-cli2 CLAUDE.md || true
      - name: Linting Python files
        run: |
          pylint scripts/transform_to_compliant_markdown/transform_to_compliant_markdown.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Linting YAML files
        run: |
          echo "Running yamllint on transform_to_compliant_markdown.yml..."
          yamllint --config-data '{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}' .github/workflows/transform_to_compliant_markdown.yml
      - name: Static type checking Python files with mypy
        run: python -m mypy scripts/transform_to_compliant_markdown/transform_to_compliant_markdown.py
      - name: Validating prompt files exist
        run: |
          echo "Checking prompt files..."
          test -f scripts/readme/prompt_check.md || (echo "ERROR: prompt_check.md not found" && exit 1)
          test -f scripts/readme/prompt_update.md || (echo "ERROR: prompt_update.md not found" && exit 1)
          echo "All prompt files found"
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install pytest boto3 boto3-stubs[bedrock-runtime]
      - name: Run unit tests
        run: pytest test/transform_to_compliant_markdown/test_unit.py -v
  updating-readme:
    name: Updating README.md
    needs: concluding-readme-should-be-updated
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.account_id' scripts/transform_to_compliant_markdown/config.json);
          REGION=$(jq -r '.region' scripts/transform_to_compliant_markdown/config.json);
          MODEL_ID=$(jq -r '.bedrock.model_id' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_REASONING=$(jq -r '.bedrock.max_tokens_reasoning' scripts/transform_to_compliant_markdown/config.json);
          MAX_TOKENS_GENERATION=$(jq -r '.bedrock.max_tokens' scripts/transform_to_compliant_markdown/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - name: Update README with Bedrock
        run: |
          python scripts/readme/readme.py \
            --project-dir scripts/transform_to_compliant_markdown \
            --test-dir test/transform_to_compliant_markdown \
            --update \
            --prompt-check scripts/readme/prompt_check.md \
            --prompt-update scripts/readme/prompt_update.md \
            --aws-region "${{ steps.config.outputs.region }}" \
            --bedrock-model-id "${{ steps.config.outputs.model_id }}" \
            --max-tokens-reasoning "${{ steps.config.outputs.max_tokens_reasoning }}" \
            --max-tokens-generation "${{ steps.config.outputs.max_tokens_generation }}" \
            --output-file "$GITHUB_OUTPUT"
      - name: Commit and push README if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add scripts/transform_to_compliant_markdown/README.md
          if git diff --cached --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "Update transform_to_compliant_markdown README.md [skip ci]"
            for i in {1..5}; do
              if git push; then
                echo "Successfully pushed README update"
                exit 0
              fi
              echo "Push failed (attempt $i/5), pulling and retrying..."
              git pull --rebase origin main
              sleep $((2 ** i))
            done
            echo "Failed to push after 5 attempts"
            exit 1
          fi
name: Ensure transform_to_compliant_markdown script works properly
on:
  push:
    branches:
      - main
    paths:
      - scripts/transform_to_compliant_markdown/**
      - test/transform_to_compliant_markdown/**
      - .github/workflows/transform_to_compliant_markdown.yml
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (skip deployment, just test)
        required: false
        type: boolean
permissions:
  contents: read
  id-token: write
