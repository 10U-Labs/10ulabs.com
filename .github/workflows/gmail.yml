concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  determining-if-rest-of-workflow-should-run:
    name: Determining if the rest of the workflow should run
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        name: Check if foundation files were modified
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Workflow triggered by ${{ github.event_name }}, will run"
          else
            FOUNDATION_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '^(src/foundation/|test/foundation/|\.github/workflows/foundation\.yml)' || true)
            if [ -z "$FOUNDATION_FILES" ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "No foundation files modified, will run"
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "Foundation files modified, skipping (will run via workflow_run after foundation succeeds)"
            fi
          fi
  concluding-rest-of-workflow-should-run:
    name: Concluding the rest of the workflow should run
    needs: determining-if-rest-of-workflow-should-run
    if: needs.determining-if-rest-of-workflow-should-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Workflow completed successfully
        run: echo "Gmail workflow completed successfully"
  concluding-rest-of-workflow-should-not-run:
    name: Concluding the rest of the workflow should not run
    needs: determining-if-rest-of-workflow-should-run
    if: needs.determining-if-rest-of-workflow-should-run.outputs.should_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Workflow skipped
        run: echo "Gmail workflow skipped - foundation files were modified, will run after foundation workflow completes"
  declaring-common-variables:
    name: Declaring common variables
    needs: concluding-rest-of-workflow-should-run
    outputs:
      aws_account_id: ${{ steps.load_config.outputs.aws_account_id }}
      aws_region: ${{ steps.load_config.outputs.aws_region }}
      github_actions_role: GitHubActionsRole
      terraform_version: ${{ steps.extract_tf_version.outputs.terraform_version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: load_config
        name: Load configuration
        run: |
          ACCOUNT_ID=$(jq -r '.aws.account_id' src/gmail/config.json)
          REGION=$(jq -r '.aws.region' src/gmail/config.json)
          echo "aws_account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "aws_region=$REGION" >> $GITHUB_OUTPUT
      - id: extract_tf_version
        name: Extract Terraform version from providers.tf
        run: |
          TF_VERSION=$(grep 'required_version' src/gmail/providers.tf | sed -E 's/.*">= ([0-9.]+)".*/\1/')
          echo "terraform_version=$TF_VERSION" >> $GITHUB_OUTPUT
  e2e-testing:
    name: E2E testing
    needs:
      - declaring-common-variables
      - integration-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pytest boto3 dnspython
      - name: Run E2E tests
        run: pytest test/gmail/test_e2e.py -v
  ensuring-infrastructure-in-desired-state:
    defaults:
      run:
        working-directory: src/gmail
    name: Ensuring infrastructure is in desired state
    needs:
      - declaring-common-variables
      - unit-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve
  integration-testing:
    name: Integration testing
    needs:
      - declaring-common-variables
      - ensuring-infrastructure-in-desired-state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install pytest boto3
      - name: Run pytest integration tests
        run: pytest test/gmail/test_integration.py -v
  performing-static-analysis:
    defaults:
      run:
        working-directory: src/gmail
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      )
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Install tflint
        run: |
          TFLINT_INSTALL_URL='https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh'
          curl -s "$TFLINT_INSTALL_URL" | bash
      - name: Install linting dependencies
        run: pip install pylint mypy yamllint
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      - name: Terraform Init
        run: terraform init
      - name: Terraform Validate
        run: terraform validate
      - name: Run tflint
        run: tflint --init && tflint
      - name: Terraform Plan
        run: terraform plan
      - name: Linting YAML files
        run: |
          DOCUMENT_START='document-start: disable'
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: {max: 300, level: warning}'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$DOCUMENT_START, $EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint \
            --config-data "{extends: default, rules: {$RULES}}" \
            ../../.github/workflows/gmail.yml
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install pytest boto3
      - name: Run unit tests
        run: pytest test/gmail/test_unit.py -v
name: Ensuring DNS allows Gmail to be email provider
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gmail.yml
      - src/gmail/**
      - test/gmail/**
      - '!**/README.md'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (skip deployment, just test)
        required: false
        type: boolean
  workflow_run:
    branches: [main]
    types: [completed]
    workflows: ["Ensuring foundational infrastructure exists and is properly configured"]
permissions:
  contents: read
  id-token: write
