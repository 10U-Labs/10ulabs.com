---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  declaring-common-variables:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_call' ||
       github.event_name == 'push' &&
       !contains(toJSON(github.event.commits),
         '.github/workflows/endpoint_v1_image_for_ecs_runners.yml') &&
       !contains(toJSON(github.event.commits),
         'src/api/endpoints/image_for_ecs_runners/') &&
       !contains(toJSON(github.event.commits),
         'test/api/endpoints/image_for_ecs_runners/') &&
       !contains(toJSON(github.event.commits),
         '.github/workflows/endpoint_v1_runners.yml') &&
       !contains(toJSON(github.event.commits),
         'src/api/endpoints/runners/') &&
       !contains(toJSON(github.event.commits),
         'test/api/endpoints/runners/'))
    name: Declaring common variables
    outputs:
      aws_region: ${{ steps.shared.outputs.aws_region }}
      role_arn: ${{ steps.shared.outputs.role_arn }}
      tf_version: ${{ steps.shared.outputs.tf_version }}
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: shared
        name: Extract shared configuration values
        run: |
          OUTPUTS=lib/terraform/outputs.tf
          LOCALS=src/bootstrap/locals.tf
          BACKEND=src/api/endpoints/ecs_runner/backend.tf
          AWS_REGION=$(grep -A1 'output "aws_region"' $OUTPUTS \
            | grep 'value' | cut -d'"' -f2)
          AWS_ACCOUNT_ID=$(grep -A1 'output "aws_account_id"' $OUTPUTS \
            | grep 'value' | cut -d'"' -f2)
          RESOURCE_PREFIX=$(grep -A1 'output "resource_prefix"' $OUTPUTS \
            | grep 'value' | cut -d'"' -f2)
          ROLE_SUFFIX=$(grep 'name_for_github_actions_role' $LOCALS \
            | sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/"
          ROLE_ARN="${ROLE_ARN}${RESOURCE_PREFIX}${ROLE_SUFFIX}"
          TF_VERSION=$(grep 'required_version' $BACKEND \
            | cut -d'"' -f2 | sed 's/>= //')
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
          echo "tf_version=$TF_VERSION" >> $GITHUB_OUTPUT
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.shared.outputs.tf_version }}
          terraform_wrapper: false
  e2e-testing:
    name: E2E testing
    needs:
      - declaring-common-variables
      - integration-testing
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.role_arn }}
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3 PyYAML requests
      - env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        name: Run E2E tests
        run: |
          python3 -m pytest test/api/endpoints/ecs_runner/post_deployment/e2e/ \
            --confcutdir=test/api/endpoints/ecs_runner \
            -v
  ensuring-endpoint-infrastructure-in-desired-state:
    name: Ensuring endpoint infrastructure is in desired state
    needs:
      - declaring-common-variables
      - unit-testing
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.role_arn }}
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: >-
            ${{ needs.declaring-common-variables.outputs.tf_version }}
      - name: Terraform Init
        run: cd src/api/endpoints/ecs_runner && terraform init
      - name: Terraform Apply
        run: cd src/api/endpoints/ecs_runner && terraform apply -auto-approve
  integration-testing:
    name: Integration testing
    needs:
      - declaring-common-variables
      - ensuring-endpoint-infrastructure-in-desired-state
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.role_arn }}
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3 PyYAML requests
      - name: Run integration tests
        run: |
          TEST_DIR=test/api/endpoints/ecs_runner
          python3 -m pytest $TEST_DIR/post_deployment/integration/ \
            --confcutdir=$TEST_DIR -v
  performing-static-analysis:
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: >-
            ${{ needs.declaring-common-variables.outputs.tf_version }}
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Install linting dependencies
        run: |
          python3 -m pip install pylint mypy yamllint pytest boto3 \
            boto3-stubs PyYAML types-PyYAML requests types-requests
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: disable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/endpoint_v1_ecs_runner.yml
      - name: Linting Python files
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            src/api/endpoints/ecs_runner/lambda/handler.py \
            test/api/endpoints/ecs_runner/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Static type checking Python files with mypy
        run: |
          MYPYPATH=lib/python python3 -m mypy \
            src/api/endpoints/ecs_runner/lambda/handler.py
          MYPYPATH=lib/python python3 -m mypy --explicit-package-bases \
            test/api/endpoints/ecs_runner/
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: >-
            ${{ needs.declaring-common-variables.outputs.role_arn }}
      - name: Terraform Format Check
        run: |
          cd src/api/endpoints/ecs_runner
          terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: cd src/api/endpoints/ecs_runner && terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api/endpoints/ecs_runner && \
            tflint --init && \
            tflint
      - name: Terraform Plan
        run: cd src/api/endpoints/ecs_runner && terraform plan
  switching-to-ecs-runners:
    if: success()
    name: Switching to ECS runners
    needs: e2e-testing
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Disable USE_GITHUB_HOSTED variable
        run: |
          echo "ECS runner workflow completed successfully."
          echo "Disabling USE_GITHUB_HOSTED to switch future workflows to ECS."
          gh variable set USE_GITHUB_HOSTED --body "false" \
            --repo ${{ github.repository }}
  unit-testing:
    name: Unit testing
    needs:
      - declaring-common-variables
      - performing-static-analysis
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ||
            contains(github.event.workflow_run.head_commit.message,
              '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]') ||
          contains(github.event.workflow_run.head_commit.message,
            '[github-hosted]')
        name: Install Python dependencies
        run: python3 -m pip install pytest boto3 PyYAML
      - name: Run unit tests
        run: |
          python3 -m pytest test/api/endpoints/ecs_runner/pre_deployment/ \
            --confcutdir=test/api/endpoints/ecs_runner \
            -v
name: Ensuring the /v1/ecs-runner API endpoint exists and is properly configured
on:
  workflow_call:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
