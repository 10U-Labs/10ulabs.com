---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.dry_run != 'true'
    name: Deploy home page
    runs-on:
      - ecs
      - fargate
      - arm
      - spot
      - runner-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: config
        name: Extract configuration values
        run: |
          TF_SHARED_LOCALS="lib/terraform/modules/shared/locals.tf"
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          AWS_REGION=$(grep 'aws_region' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE_SUFFIX=$(grep 'name_for_github_actions_role' \
            src/bootstrap/locals.tf | \
            sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          RESOURCE_PREFIX=$(grep 'resource_prefix' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          ROLE_PREFIX="arn:aws:iam::${AWS_ACCOUNT_ID}:role"
          ROLE_NAME="${RESOURCE_PREFIX}${GITHUB_ACTIONS_ROLE_SUFFIX}"
          GITHUB_ACTIONS_ROLE_ARN="${ROLE_PREFIX}/${ROLE_NAME}"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          GH_ROLE_ARN="github_actions_role_arn=$GITHUB_ACTIONS_ROLE_ARN"
          echo "$GH_ROLE_ARN" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.config.outputs.github_actions_role_arn }}
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: disable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/www_index.yml
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Install npm dependencies
        run: npm ci --prefix src/www/paths/index
      - name: Run unit tests
        run: npm test --prefix src/www/paths/index
      - name: Run pre-deployment integration tests
        run: |
          python3 -m pytest \
            test/www/index/pre_deployment/integration/ \
            --verbose --pythonwarnings=error
      - name: Get bucket name from shared Terraform
        run: |
          terraform -chdir=src/www/shared init \
            -backend=true -input=false > /dev/null
          BUCKET_NAME=$(terraform -chdir=src/www/shared output -raw bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
      - env:
          VITE_API_URL: https://api.10ulabs.com
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        name: Build website
        run: |
          npm ci --prefix src/www/paths/index && \
            npm run build --prefix src/www/paths/index
      - name: Sync website to S3
        run: |
          aws s3 sync src/www/paths/index/dist/ s3://${{ env.BUCKET_NAME }}/ \
            --delete \
            --cache-control no-cache \
            --storage-class ONEZONE_IA \
            --exclude "rack-designer/*" \
            --exclude "simulations/*"
      - id: check_files
        name: Check if website files changed
        run: |
          set -e
          set -o pipefail
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            BASE_COMMIT="${{ github.event.before }}"
          else
            BASE_COMMIT="HEAD^"
          fi
          git diff --name-only $BASE_COMMIT ${{ github.sha }} | \
            if grep -qE 'src/www/paths/index/'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
          '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Get website domain from Terraform output
        run: |
          WEBSITE_FQDN=$(terraform -chdir=src/www/shared \
            output -raw website_domain_name)
          echo "WEBSITE_FQDN=$WEBSITE_FQDN" >> $GITHUB_ENV
      - if: >-
          github.event.inputs.invalidate_cloudfront == 'true' ||
          contains(github.event.head_commit.message,
          '[invalidate cloudfront]') ||
          steps.check_files.outputs.changed == 'true'
        name: Invalidate CloudFront cache
        run: |
          python3 scripts/invalidate_cloudfront.py \
            --fqdn "${{ env.WEBSITE_FQDN }}" \
            --region ${{ steps.config.outputs.aws_region }} \
            --paths "/*"
      - name: Install Playwright browsers
        run: npx --prefix src/www/paths/index playwright install chromium
      - env:
          BASE_URL: https://10ulabs.com
        name: Run post-deployment integration tests
        run: npm run test:integration --prefix src/www/paths/index
      - env:
          BASE_URL: https://10ulabs.com
        name: Run E2E tests
        run: npm run test:e2e --prefix src/www/paths/index
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.skip_descendants != 'true' &&
          !contains(github.event.head_commit.message, '[skip descendants]')
        name: Dispatch descendant workflows
        run: |
          SKIP_FLAG=""
          SKIP_INPUT="${{ github.event.inputs.skip_descendants }}"
          if [ "$SKIP_INPUT" = "true" ]; then SKIP_FLAG="--skip-descendants"; fi
          python3 scripts/dispatch_descendants.py \
            $SKIP_FLAG \
            --workflow www_index \
            --repo ${{ github.repository }}
name: Ensuring www index (home page) exists and is properly configured
on:
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
      skip_descendants:
        default: false
        description: Skip dispatching descendant workflows
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
