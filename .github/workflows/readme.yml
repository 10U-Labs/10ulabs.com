concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  concluding-readme-should-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated == 'true'
    name: Concluding README.md should be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  concluding-readme-should-not-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated != 'true'
    name: Concluding README.md should not be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  determining-if-readme-should-be-updated:
    name: Determining if README.md should be updated
    needs: e2e-testing
    outputs:
      readme_should_be_updated: ${{ steps.check.outputs.readme_should_be_updated }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install boto3
        run: pip install boto3
      - id: check
        name: Check if README needs update
        run: "python scripts/readme/readme.py \\\n  --project-dir scripts/readme \\\n  --check \\\n  --prompt-check scripts/readme/prompt_check.md \\\n  --aws-region us-east-1 \\\n  --bedrock-model-id us.anthropic.claude-3-7-sonnet-20250219-v1:0 \\\n  --max-tokens-reasoning 4096 \\\n  --max-tokens-generation 16384 \\\n  --output-file \"$GITHUB_OUTPUT\"\n"
  e2e-testing:
    name: E2E testing
    needs: integration-testing
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip E2E tests
        run: echo "DRY RUN - Would run E2E tests"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install dependencies
        run: 'pip install pytest boto3
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run E2E tests
        run: 'pytest test/readme/test_e2e.py -v
          '
  ensuring-infrastructure-in-desired-state:
    name: Ensuring infrastructure is in desired state
    needs: unit-testing
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip deployment
        run: echo "DRY RUN - Would ensure infrastructure for README script"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: No infrastructure to deploy
        run: echo "README script has no infrastructure - skipping deployment"
  integration-testing:
    name: Integration testing
    needs: ensuring-infrastructure-in-desired-state
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip integration tests
        run: echo "DRY RUN - Would run integration tests with pytest"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install Python dependencies
        run: 'pip install pytest boto3
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run pytest integration tests
        run: 'pytest test/readme/test_integration.py -v
          '
  performing-static-analysis:
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip static analysis
        run: echo "DRY RUN - Would run pylint, mypy, and yamllint static analysis"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install linting dependencies
        run: 'pip install pylint mypy yamllint boto3 boto3-stubs[bedrock-runtime]
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Linting Python files
        run: "pylint scripts/readme/readme.py \\\n  --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \\\n  --fail-under=10.0\n"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Linting YAML files
        run: 'echo "Running yamllint on readme.yml..."
          yamllint --config-data ''{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}'' .github/workflows/readme.yml
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Static type checking Python files with mypy
        run: 'python -m mypy scripts/readme/readme.py
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Validating prompt files exist
        run: 'echo "Checking prompt files..."
          test -f scripts/readme/prompt_check.md || (echo "ERROR: prompt_check.md not found" && exit 1)
          test -f scripts/readme/prompt_update.md || (echo "ERROR: prompt_update.md not found" && exit 1)
          echo "All prompt files found"
          '
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip unit tests
        run: echo "DRY RUN - Would run unit tests with pytest"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install Python dependencies
        run: 'pip install pytest boto3 boto3-stubs[bedrock-runtime]
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run unit tests
        run: 'pytest test/readme/test_unit.py -v
          '
  updating-readme:
    name: Updating README.md
    needs: concluding-readme-should-be-updated
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install boto3
        run: pip install boto3
      - name: Update README with Bedrock
        run: "python scripts/readme/readme.py \\\n  --project-dir scripts/readme \\\n  --update \\\n  --prompt-update scripts/readme/prompt_update.md \\\n  --aws-region us-east-1 \\\n  --bedrock-model-id us.anthropic.claude-3-7-sonnet-20250219-v1:0 \\\n  --max-tokens-reasoning 4096 \\\n  --max-tokens-generation 16384 \\\n  --output-file \"$GITHUB_OUTPUT\"\n"
      - name: Commit and push README if changed
        run: "git config user.name \"GitHub Actions\"\ngit config user.email \"actions@github.com\"\ngit add scripts/readme/README.md\nif git diff --cached --quiet; then\n  echo \"No changes to README.md\"\nelse\n  git commit -m \"Update readme README.md [skip ci]\"\n  for i in {1..5}; do\n    if git push; then\n      echo \"Successfully pushed README update\"\n      exit 0\n    fi\n    echo \"Push failed (attempt $i/5), pulling and retrying...\"\n    git pull --rebase origin main\n    sleep $((2 ** i))\n  done\n  echo \"Failed to push after 5 attempts\"\n  exit 1\nfi\n"
name: Ensuring README script passes static analysis
on:
  push:
    branches:
      - main
    paths:
      - scripts/readme/**
      - test/readme/**
      - .github/workflows/readme.yml
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (skip deployment, just test)
        required: false
        type: boolean
permissions:
  contents: read
  id-token: write
