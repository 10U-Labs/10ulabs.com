concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  concluding-readme-should-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated == 'true'
    name: Concluding README.md should be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  concluding-readme-should-not-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated != 'true'
    name: Concluding README.md should not be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  determining-if-readme-should-be-updated:
    name: Determining if README.md should be updated
    needs: e2e-testing
    outputs:
      readme_should_be_updated: ${{ steps.check.outputs.readme_should_be_updated }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: 'ACCOUNT_ID=$(jq -r ''.aws.account_id'' scripts/readme/config.json);
          REGION=$(jq -r ''.aws.region'' scripts/readme/config.json);
          MODEL_ID=$(jq -r ''.aws.bedrock.model_id'' scripts/readme/config.json);
          MAX_TOKENS_REASONING=$(jq -r ''.aws.bedrock.max_tokens_reasoning'' scripts/readme/config.json);
          MAX_TOKENS_GENERATION=$(jq -r ''.aws.bedrock.max_tokens_generation'' scripts/readme/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
          '
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - id: check
        name: Check if README needs update
        run: "python scripts/readme/readme.py \\\n  --project-dir scripts/readme \\\n  --test-dir test/readme \\\n  --check \\\n  --prompt-check scripts/readme/prompt_check.md \\\n  --prompt-update scripts/readme/prompt_update.md \\\n  --aws-region \"${{ steps.config.outputs.region }}\" \\\n  --bedrock-model-id \"${{ steps.config.outputs.model_id }}\" \\\n  --max-tokens-reasoning \"${{ steps.config.outputs.max_tokens_reasoning }}\" \\\n  --max-tokens-generation \"${{ steps.config.outputs.max_tokens_generation }}\" \\\n  --output-file \"$GITHUB_OUTPUT\"\n"
  e2e-testing:
    name: E2E testing
    needs: integration-testing
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: 'ACCOUNT_ID=$(jq -r ''.aws.account_id'' scripts/readme/config.json);
          REGION=$(jq -r ''.aws.region'' scripts/readme/config.json);
          MODEL_ID=$(jq -r ''.aws.bedrock.model_id'' scripts/readme/config.json);
          MAX_TOKENS_REASONING=$(jq -r ''.aws.bedrock.max_tokens_reasoning'' scripts/readme/config.json);
          MAX_TOKENS_GENERATION=$(jq -r ''.aws.bedrock.max_tokens_generation'' scripts/readme/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
          '
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: 'pip install pytest boto3
          '
      - name: Run E2E tests
        run: 'pytest test/readme/test_e2e.py -v
          '
  integration-testing:
    name: Integration testing
    needs: unit-testing
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: 'ACCOUNT_ID=$(jq -r ''.aws.account_id'' scripts/readme/config.json);
          REGION=$(jq -r ''.aws.region'' scripts/readme/config.json);
          MODEL_ID=$(jq -r ''.aws.bedrock.model_id'' scripts/readme/config.json);
          MAX_TOKENS_REASONING=$(jq -r ''.aws.bedrock.max_tokens_reasoning'' scripts/readme/config.json);
          MAX_TOKENS_GENERATION=$(jq -r ''.aws.bedrock.max_tokens_generation'' scripts/readme/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
          '
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: 'pip install pytest boto3
          '
      - name: Run pytest integration tests
        run: 'pytest test/readme/test_integration.py -v
          '
  performing-static-analysis:
    if: "github.ref == 'refs/heads/main' && (\n  (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||\n  (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')\n)\n"
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linting dependencies
        run: 'pip install pylint mypy yamllint boto3 boto3-stubs[bedrock-runtime]
          '
      - name: Linting Python files
        run: "pylint scripts/readme/readme.py \\\n  --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \\\n  --fail-under=10.0\n"
      - name: Linting YAML files
        run: 'echo "Running yamllint on readme.yml..."
          yamllint --config-data ''{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}'' .github/workflows/readme.yml
          '
      - name: Static type checking Python files with mypy
        run: 'python -m mypy scripts/readme/readme.py
          '
      - name: Validating prompt files exist
        run: "echo \"Checking prompt files...\"\ntest -f scripts/readme/prompt_check.md || (echo \"ERROR: prompt_check.md not found\" && exit 1)\ntest -f scripts/readme/prompt_update.md || (echo \"ERROR: prompt_update.md not found\" && exit 1)\necho \"All prompt files found\"\n"
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: 'pip install pytest boto3 boto3-stubs[bedrock-runtime]
          '
      - name: Run unit tests
        run: 'pytest test/readme/test_unit.py -v
          '
  updating-readme:
    name: Updating README.md
    needs: concluding-readme-should-be-updated
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: config
        name: Load configuration
        run: 'ACCOUNT_ID=$(jq -r ''.aws.account_id'' scripts/readme/config.json);
          REGION=$(jq -r ''.aws.region'' scripts/readme/config.json);
          MODEL_ID=$(jq -r ''.aws.bedrock.model_id'' scripts/readme/config.json);
          MAX_TOKENS_REASONING=$(jq -r ''.aws.bedrock.max_tokens_reasoning'' scripts/readme/config.json);
          MAX_TOKENS_GENERATION=$(jq -r ''.aws.bedrock.max_tokens_generation'' scripts/readme/config.json);
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT;
          echo "region=$REGION" >> $GITHUB_OUTPUT;
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT;
          echo "max_tokens_reasoning=$MAX_TOKENS_REASONING" >> $GITHUB_OUTPUT;
          echo "max_tokens_generation=$MAX_TOKENS_GENERATION" >> $GITHUB_OUTPUT;
          '
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account_id }}:role/GitHubActionsRole
      - name: Install boto3
        run: pip install boto3
      - name: Update README with Bedrock
        run: "python scripts/readme/readme.py \\\n  --project-dir scripts/readme \\\n  --test-dir test/readme \\\n  --update \\\n  --prompt-check scripts/readme/prompt_check.md \\\n  --prompt-update scripts/readme/prompt_update.md \\\n  --aws-region \"${{ steps.config.outputs.region }}\" \\\n  --bedrock-model-id \"${{ steps.config.outputs.model_id }}\" \\\n  --max-tokens-reasoning \"${{ steps.config.outputs.max_tokens_reasoning }}\" \\\n  --max-tokens-generation \"${{ steps.config.outputs.max_tokens_generation }}\" \\\n  --output-file \"$GITHUB_OUTPUT\"\n"
      - name: Commit and push README if changed
        run: "git config user.name \"GitHub Actions\"\ngit config user.email \"actions@github.com\"\ngit add scripts/readme/README.md\nif git diff --cached --quiet; then\n  echo \"No changes to README.md\"\nelse\n  git commit -m \"Update readme README.md [skip ci]\"\n  for i in {1..5}; do\n    if git push; then\n      echo \"Successfully pushed README update\"\n      exit 0\n    fi\n    echo \"Push failed (attempt $i/5), pulling and retrying...\"\n    git pull --rebase origin main\n    sleep $((2 ** i))\n  done\n  echo \"Failed to push after 5 attempts\"\n  exit 1\nfi\n"
name: Ensure readme script works properly
on:
  push:
    branches:
      - main
    paths:
      - scripts/readme/**
      - test/readme/**
      - .github/workflows/readme.yml
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (skip deployment, just test)
        required: false
        type: boolean
permissions:
  contents: read
  id-token: write
