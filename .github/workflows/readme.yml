concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  e2e-testing:
    name: E2E testing
    needs: integration-testing
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip E2E tests
        run: echo "DRY RUN - Would run E2E tests"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install dependencies
        run: 'pip install pytest boto3
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run E2E tests
        run: 'pytest test/readme/test_e2e.py -v
          '
  integration-testing:
    name: Integration testing
    needs: unit-testing
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip integration tests
        run: echo "DRY RUN - Would run integration tests with pytest"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install Python dependencies
        run: 'pip install pytest boto3
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run pytest integration tests
        run: 'pytest test/readme/test_integration.py -v
          '
  performing-static-analysis:
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip static analysis
        run: echo "DRY RUN - Would run pylint, mypy, and yamllint static analysis"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install linting dependencies
        run: 'pip install pylint mypy yamllint boto3 boto3-stubs[bedrock-runtime]
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Linting Python files
        run: "pylint scripts/readme/readme.py \\\n  --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \\\n  --fail-under=10.0\n"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Linting YAML files
        run: 'echo "Running yamllint on readme.yml..."
          yamllint --config-data ''{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}'' .github/workflows/readme.yml
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Static type checking Python files with mypy
        run: 'python -m mypy scripts/readme/readme.py
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Validating prompt files exist
        run: 'echo "Checking prompt files..."
          test -f scripts/readme/prompt_check.md || (echo "ERROR: prompt_check.md not found" && exit 1)
          test -f scripts/readme/prompt_update.md || (echo "ERROR: prompt_update.md not found" && exit 1)
          echo "All prompt files found"
          '
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        name: DRY RUN - Skip unit tests
        run: echo "DRY RUN - Would run unit tests with pytest"
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Install Python dependencies
        run: 'pip install pytest boto3 boto3-stubs[bedrock-runtime]
          '
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        name: Run unit tests
        run: 'pytest test/readme/test_unit.py -v
          '
name: Ensuring README script passes static analysis
on:
  push:
    branches:
      - main
    paths:
      - scripts/readme/**
      - test/readme/**
      - .github/workflows/readme.yml
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (skip deployment, just test)
        required: false
        type: boolean
