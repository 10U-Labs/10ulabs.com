concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  concluding-readme-should-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated == 'true'
    name: Concluding README.md should be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  concluding-readme-should-not-be-updated:
    if: needs.determining-if-readme-should-be-updated.outputs.readme_should_be_updated == 'false'
    name: Concluding README.md should not be updated
    needs: determining-if-readme-should-be-updated
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  determining-if-readme-should-be-updated:
    name: Determining if README.md should be updated
    needs: e2e-testing
    outputs:
      readme_should_be_updated: ${{ steps.check.outputs.readme_should_be_updated }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Read auth_between_aws_and_github config
        run: |
          aws_account_id=$(jq -r '.aws.account_id' src/auth_between_aws_and_github/config.json);
          aws_region=$(jq -r '.aws.region' src/auth_between_aws_and_github/config.json);
          aws_iam_role_name=$(jq -r '.aws.iam_role_name' src/auth_between_aws_and_github/config.json);
          bedrock_model_id=$(jq -r '.aws.bedrock.model_id' src/auth_between_aws_and_github/config.json);
          bedrock_max_tokens=$(jq -r '.aws.bedrock.max_tokens' src/auth_between_aws_and_github/config.json);
          bedrock_budget_tokens=$(jq -r '.aws.bedrock.budget_tokens' src/auth_between_aws_and_github/config.json);
          echo "aws_account_id=$aws_account_id" >> $GITHUB_OUTPUT;
          echo "aws_region=$aws_region" >> $GITHUB_OUTPUT;
          echo "aws_iam_role_name=$aws_iam_role_name" >> $GITHUB_OUTPUT;
          echo "bedrock_model_id=$bedrock_model_id" >> $GITHUB_OUTPUT;
          echo "bedrock_max_tokens=$bedrock_max_tokens" >> $GITHUB_OUTPUT;
          echo "bedrock_budget_tokens=$bedrock_budget_tokens" >> $GITHUB_OUTPUT;
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install boto3
        run: pip install boto3
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.aws_account_id }}:role/${{ steps.config.outputs.aws_iam_role_name }}
      - id: check
        name: Check if README needs update
        run: |
          python scripts/readme/readme.py \
            --project-dir src/auth_between_aws_and_github \
            --test-dir test/auth_between_aws_and_github \
            --check \
            --prompt-check scripts/readme/prompt_check.md \
            --prompt-update scripts/readme/prompt_update.md \
            --aws-region "${{ steps.config.outputs.aws_region }}" \
            --bedrock-model-id "${{ steps.config.outputs.bedrock_model_id }}" \
            --max-tokens "${{ steps.config.outputs.bedrock_max_tokens }}" \
            --budget-tokens "${{ steps.config.outputs.bedrock_budget_tokens }}" \
            --output-file "$GITHUB_OUTPUT"
  e2e-testing:
    name: E2E testing
    needs: integration-testing
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Read auth_between_aws_and_github config
        run: |
          aws_account_id=$(jq -r '.aws.account_id' src/auth_between_aws_and_github/config.json);
          aws_region=$(jq -r '.aws.region' src/auth_between_aws_and_github/config.json);
          aws_iam_role_name=$(jq -r '.aws.iam_role_name' src/auth_between_aws_and_github/config.json);
          echo "aws_account_id=$aws_account_id" >> $GITHUB_OUTPUT;
          echo "aws_region=$aws_region" >> $GITHUB_OUTPUT;
          echo "aws_iam_role_name=$aws_iam_role_name" >> $GITHUB_OUTPUT;
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.aws_account_id }}:role/${{ steps.config.outputs.aws_iam_role_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pytest boto3
      - name: Run E2E tests
        run: pytest test/auth_between_aws_and_github/test_e2e.py -v
  ensuring-infrastructure-exists-in-defined-state:
    name: Ensuring infrastructure exists in defined state
    needs: unit-testing
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Read auth_between_aws_and_github config
        run: |
          aws_account_id=$(jq -r '.aws.account_id' src/auth_between_aws_and_github/config.json);
          aws_region=$(jq -r '.aws.region' src/auth_between_aws_and_github/config.json);
          aws_iam_role_name=$(jq -r '.aws.iam_role_name' src/auth_between_aws_and_github/config.json);
          github_pat_secret_name=$(jq -r '.aws.secrets_manager.github_pat_secret_name' src/auth_between_aws_and_github/config.json);
          echo "aws_account_id=$aws_account_id" >> $GITHUB_OUTPUT;
          echo "aws_region=$aws_region" >> $GITHUB_OUTPUT;
          echo "aws_iam_role_name=$aws_iam_role_name" >> $GITHUB_OUTPUT;
          echo "github_pat_secret_name=$github_pat_secret_name" >> $GITHUB_OUTPUT;
      - continue-on-error: true
        id: oidc-auth
        name: Try OIDC authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.aws_account_id }}:role/${{ steps.config.outputs.aws_iam_role_name }}
      - id: auth-check
        name: Check authentication method
        run: |
          if aws sts get-caller-identity &>/dev/null; then
            echo "✓ OIDC authentication successful"
            echo "using_oidc=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ OIDC authentication failed, will use static credentials"
            echo "using_oidc=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk
      - name: Install Python dependencies
        run: pip install -r src/auth_between_aws_and_github/requirements.txt
      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
        if: steps.auth-check.outputs.using_oidc == 'false'
        name: Ensure secret exists with GitHub PAT (if using static credentials)
        run: |
          SECRET_NAME="${{ steps.config.outputs.github_pat_secret_name }}"
          GITHUB_ORG="${{ github.repository_owner }}"
          GITHUB_REPO="${{ github.event.repository.name }}"
          SECRET_VALUE=$(cat <<EOF
          {
            "personal_access_token": "$GH_RUNNER_PAT",
            "github_org": "$GITHUB_ORG",
            "github_repo": "$GITHUB_REPO",
            "created_by": "github-actions",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          )
          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" &>/dev/null; then
            echo "Secret exists, updating..."
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_NAME" \
              --secret-string "$SECRET_VALUE"
          else
            echo "Secret does not exist, creating..."
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "GitHub PAT for $GITHUB_ORG/$GITHUB_REPO authentication" \
              --secret-string "$SECRET_VALUE"
          fi
      - if: steps.auth-check.outputs.using_oidc == 'true'
        name: Deploy with OIDC credentials
        run: |
          echo "Deploying with OIDC authentication..."
          cd src/auth_between_aws_and_github
          cdk deploy --require-approval never
      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        if: steps.auth-check.outputs.using_oidc == 'false'
        name: Deploy with static credentials
        run: |
          echo "Deploying with static credentials..."
          cd src/auth_between_aws_and_github
          cdk deploy --require-approval never
  integration-testing:
    name: Integration testing
    needs: ensuring-infrastructure-exists-in-defined-state
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Read auth_between_aws_and_github config
        run: |
          aws_account_id=$(jq -r '.aws.account_id' src/auth_between_aws_and_github/config.json);
          aws_region=$(jq -r '.aws.region' src/auth_between_aws_and_github/config.json);
          aws_iam_role_name=$(jq -r '.aws.iam_role_name' src/auth_between_aws_and_github/config.json);
          echo "aws_account_id=$aws_account_id" >> $GITHUB_OUTPUT;
          echo "aws_region=$aws_region" >> $GITHUB_OUTPUT;
          echo "aws_iam_role_name=$aws_iam_role_name" >> $GITHUB_OUTPUT;
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.aws_account_id }}:role/${{ steps.config.outputs.aws_iam_role_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pytest boto3
      - name: Run integration tests
        run: pytest test/auth_between_aws_and_github/test_integration.py -v
  performing-static-analysis:
    if: "github.ref == 'refs/heads/main' && (\n  (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||\n  (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')\n)\n"
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install linting dependencies
        run: |
          pip install pylint mypy yamllint &&
          npm install -g jsonlint
      - name: Install project dependencies for linting
        run: pip install -r src/auth_between_aws_and_github/requirements.txt
      - name: Linting JSON configuration files
        run: |
          echo "Validating JSON syntax..."
          jsonlint -q src/auth_between_aws_and_github/config.json
          jsonlint -q src/auth_between_aws_and_github/cdk.json
      - name: Linting Python files
        run: |
          pylint src/auth_between_aws_and_github/stack.py \
            src/auth_between_aws_and_github/app.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Linting YAML files
        run: |
          echo "Running yamllint on workflow files..."
          yamllint --config-data '{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}' .github/workflows/auth_between_aws_and_github.yml
      - name: Static type checking Python files with mypy
        run: python -m mypy src/auth_between_aws_and_github
  unit-testing:
    name: Unit testing
    needs: performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up Node.js (required by aws-cdk-lib/jsii)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          pip install pytest &&
          pip install -r src/auth_between_aws_and_github/requirements.txt
      - name: Run unit tests
        run: pytest test/auth_between_aws_and_github/test_unit.py -v
  updating-readme:
    name: Updating README.md
    needs: concluding-readme-should-be-updated
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Read auth_between_aws_and_github config
        run: |
          aws_account_id=$(jq -r '.aws.account_id' src/auth_between_aws_and_github/config.json);
          aws_region=$(jq -r '.aws.region' src/auth_between_aws_and_github/config.json);
          aws_iam_role_name=$(jq -r '.aws.iam_role_name' src/auth_between_aws_and_github/config.json);
          bedrock_model_id=$(jq -r '.aws.bedrock.model_id' src/auth_between_aws_and_github/config.json);
          bedrock_max_tokens=$(jq -r '.aws.bedrock.max_tokens' src/auth_between_aws_and_github/config.json);
          bedrock_budget_tokens=$(jq -r '.aws.bedrock.budget_tokens' src/auth_between_aws_and_github/config.json);
          echo "aws_account_id=$aws_account_id" >> $GITHUB_OUTPUT;
          echo "aws_region=$aws_region" >> $GITHUB_OUTPUT;
          echo "aws_iam_role_name=$aws_iam_role_name" >> $GITHUB_OUTPUT;
          echo "bedrock_model_id=$bedrock_model_id" >> $GITHUB_OUTPUT;
          echo "bedrock_max_tokens=$bedrock_max_tokens" >> $GITHUB_OUTPUT;
          echo "bedrock_budget_tokens=$bedrock_budget_tokens" >> $GITHUB_OUTPUT;
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install boto3
        run: pip install boto3
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.aws_account_id }}:role/${{ steps.config.outputs.aws_iam_role_name }}
      - name: Update README
        run: |
          python scripts/readme/readme.py \
            --project-dir src/auth_between_aws_and_github \
            --test-dir test/auth_between_aws_and_github \
            --update \
            --prompt-check scripts/readme/prompt_check.md \
            --prompt-update scripts/readme/prompt_update.md \
            --aws-region "${{ steps.config.outputs.aws_region }}" \
            --bedrock-model-id "${{ steps.config.outputs.bedrock_model_id }}" \
            --max-tokens "${{ steps.config.outputs.bedrock_max_tokens }}" \
            --budget-tokens "${{ steps.config.outputs.bedrock_budget_tokens }}" \
            --output-file "$GITHUB_OUTPUT"
      - name: Commit and push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/auth_between_aws_and_github/README.md
          git diff --staged --quiet || git commit -m "Update auth_between_aws_and_github README via Bedrock"
          for i in {1..5}; do
            if git push; then
              echo "Successfully pushed README update"
              exit 0
            fi
            echo "Push failed (attempt $i/5), pulling and retrying..."
            git pull --rebase origin main
            sleep $((2 ** i))
          done
          echo "Failed to push after 5 attempts"
          exit 1
name: Ensuring appropriate bilateral authorizations between AWS and GitHub
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/auth_between_aws_and_github.yml
      - src/auth_between_aws_and_github/**
      - test/auth_between_aws_and_github/**
      - '!**/README.md'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
permissions:
  contents: read
  id-token: write
