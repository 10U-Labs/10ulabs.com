concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  building-image:
    name: Building image
    needs: performing-static-analysis
    runs-on: [self-hosted, docker-builder, ephemeral-ec2-spot-instance]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          RUNNER_VERSION=$(jq -r '.github.runner_version' api/resources/ami_for_ec2_runners/config.json)
          ARCHITECTURE=$(jq -r '.base_os.architecture' api/resources/ami_for_ec2_runners/config.json)
          ECR_REPO=$(jq -r '.fargate_runners.ecr_repository' api/resources/ami_for_ec2_runners/config.json)
          ACCOUNT_ID=$(jq -r '.aws.account_id' api/resources/ami_for_ec2_runners/config.json)
          REGION=$(jq -r '.aws.region' api/resources/ami_for_ec2_runners/config.json)
          echo "runner_version=$RUNNER_VERSION" >> $GITHUB_OUTPUT
          echo "architecture=$ARCHITECTURE" >> $GITHUB_OUTPUT
          echo "ecr_repo=$ECR_REPO" >> $GITHUB_OUTPUT
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials (EC2 instance already has IAM role)
        run: |
          echo "Using EC2 instance role for AWS credentials"
      - name: Build and push Docker image (native ARM64, no emulation!)
        run: |
          cd api/resources/docker_runner
          BUILD_TAG="${{ github.run_number }}-$(git rev-parse --short HEAD)"
          ECR_URL="${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}"
          aws ecr get-login-password --region ${{ steps.config.outputs.region }} | \
            sudo docker login --username AWS --password-stdin $ECR_URL
          sudo docker build \
            --build-arg RUNNER_VERSION=${{ steps.config.outputs.runner_version }} \
            --build-arg RUNNER_ARCH=${{ steps.config.outputs.architecture }} \
            -t $ECR_URL:latest \
            -t $ECR_URL:stable \
            -t $ECR_URL:$BUILD_TAG \
            .
          sudo docker push $ECR_URL:latest
          sudo docker push $ECR_URL:stable
          sudo docker push $ECR_URL:$BUILD_TAG
          echo "✓ Docker image built and pushed to ECR"
          echo "  Repository: $ECR_URL"
          echo "  Tags: latest, stable, $BUILD_TAG"
          echo "  Built on native ARM64 (no emulation)"
  performing-static-analysis:
    if: |
      github.ref == 'refs/heads/main' && (
        !contains(github.event.head_commit.message, '[dry run]') ||
        github.event.inputs.dry_run != 'true'
      )
    name: Performing static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install linting dependencies
        run: |
          pip install pylint mypy yamllint &&
          npm install -g jsonlint
      - name: Install project dependencies for linting
        run: pip install -r src/api/requirements.txt
      - name: Linting JSON configuration files
        run: |
          echo "Validating JSON syntax..."
          jsonlint -q src/api/config.json
          jsonlint -q src/api/cdk.json
      - name: Linting Python files
        run: |
          cd src/api && pylint \
            *.py \
            endpoints/catchall/*.py \
            endpoints/health/*.py \
            endpoints/root/*.py \
            endpoints/v1/handler.py \
            endpoints/v1/runners/*.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Linting YAML files
        run: |
          echo "Running yamllint on workflow files..."
          CONFIG='{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}'
          yamllint --config-data "$CONFIG" .github/workflows/api.yml
      - name: Static type checking Python files with mypy
        run: |
          cd src/api && python -m mypy *.py &&
          python -m mypy endpoints/catchall &&
          python -m mypy endpoints/health &&
          python -m mypy endpoints/root &&
          python -m mypy endpoints/v1/handler.py &&
          python -m mypy endpoints/v1/runners
name: Build Docker Image for Self-Hosted Runner
on:
  push:
    branches:
      - main
    paths:
      - 'api/resources/ami_for_ec2_runners/config.json'
      - 'api/resources/docker_runner/**'
      - '.github/workflows/image_for_docker_runners_post.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
