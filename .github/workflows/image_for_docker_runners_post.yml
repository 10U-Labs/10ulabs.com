concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  building-image:
    name: Building image
    needs:
      - declaring-common-variables
      - unit-testing
    outputs:
      ecr_repository: ${{ steps.config.outputs.ecr_repo }}
      image_tag: ${{ steps.build.outputs.image_tag }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          ARCHITECTURE=$(grep 'os_architecture' src/api/terraform.tfvars | cut -d'"' -f2)
          ECR_REPO=$(grep 'ecr_repository_name' src/api/terraform.tfvars | cut -d'"' -f2)
          RUNNER_VERSION=$(grep 'github_runner_version' src/api/terraform.tfvars | cut -d'"' -f2)
          echo "architecture=$ARCHITECTURE" >> $GITHUB_OUTPUT
          echo "ecr_repo=$ECR_REPO" >> $GITHUB_OUTPUT
          echo "runner_version=$RUNNER_VERSION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: build
        name: Build and push Docker image for ARM64
        run: |
          cd src/api/docker_runner
          BUILD_TAG=$(date -u +%Y-%m-%d-%H-%M-%S-%3N)
          ECR_URL="${{ needs.declaring-common-variables.outputs.aws_account_id }}.dkr.ecr.${{ needs.declaring-common-variables.outputs.aws_region }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}"
          docker buildx build \
            --platform linux/arm64 \
            --build-arg RUNNER_VERSION=${{ steps.config.outputs.runner_version }} \
            --build-arg RUNNER_ARCH=${{ steps.config.outputs.architecture }} \
            -t $ECR_URL:available \
            -t $ECR_URL:$BUILD_TAG \
            --push \
            .
          echo "image_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo ""
          echo "==================================="
          echo "Docker Image Built Successfully"
          echo "==================================="
          echo ""
          echo "Repository: $ECR_URL"
          echo "Tags: available, $BUILD_TAG"
          echo "Architecture: ARM64 (cross-compiled via QEMU)"
          echo ""
          echo "==================================="
  declaring-common-variables:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
      )
    name: Declaring common variables
    outputs:
      aws_account_id: ${{ steps.config.outputs.aws_account_id }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      github_actions_role: ${{ steps.config.outputs.github_actions_role }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' src/api/terraform.tfvars | cut -d'"' -f2)
          AWS_REGION=$(grep 'aws_region' src/api/terraform.tfvars | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE=$(grep 'github_actions_role_name' src/bootstrap/terraform.tfvars | cut -d'"' -f2)
          echo "aws_account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "github_actions_role=$GITHUB_ACTIONS_ROLE" >> $GITHUB_OUTPUT
  e2e-testing:
    name: E2E testing
    needs:
      - building-image
      - declaring-common-variables
      - integration-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install pytest boto3
      - name: Get GitHub PAT from Parameter Store
        run: |
          GITHUB_PAT=$(aws ssm get-parameter --name /github/pat --with-decryption --query 'Parameter.Value' --output text)
          echo "GITHUB_PAT=$GITHUB_PAT" >> $GITHUB_ENV
      - env:
          TEST_AMI_ID: ${{ needs.building-image.outputs.ami_id }}
          TEST_SECURITY_GROUP_ID: ${{ needs.building-image.outputs.security_group_id }}
          TEST_SUBNET_ID: ${{ needs.building-image.outputs.subnet_id }}
        name: Run E2E tests
        run: |
          pytest test/api/workflows/image_for_docker_runners_post/test_e2e.py \
            --confcutdir=test/api/workflows/image_for_docker_runners_post \
            -v
  integration-testing:
    name: Integration testing
    needs:
      - building-image
      - declaring-common-variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install pytest boto3
      - env:
          TEST_AMI_ID: ${{ needs.building-image.outputs.ami_id }}
          TEST_SECURITY_GROUP_ID: ${{ needs.building-image.outputs.security_group_id }}
          TEST_SUBNET_ID: ${{ needs.building-image.outputs.subnet_id }}
        name: Run pytest integration tests
        run: |
          pytest test/api/workflows/image_for_docker_runners_post/test_integration.py \
            --confcutdir=test/api/workflows/image_for_docker_runners_post \
            -v
  performing-static-analysis:
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install linting dependencies
        run: pip install pylint mypy yamllint pytest boto3 boto3-stubs[ecr] botocore dockerfile-parse
      - name: Linting YAML files
        run: |
          DOCUMENT_START='document-start: disable'
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: {max: 300, level: warning}'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$DOCUMENT_START, $EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/image_for_docker_runners_post.yml
      - name: Run pylint
        run: |
          pylint \
            src/api/docker_runner/entrypoint.py \
            test/api/workflows/image_for_docker_runners_post/ \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Run mypy
        run: |
          python -m mypy \
            src/api/docker_runner/entrypoint.py \
            test/api/workflows/image_for_docker_runners_post/
      - name: Validate Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/api/docker_runner/Dockerfile
          ignore: DL3008,DL3013,DL3015,DL3016
  promoting-image:
    name: Promoting image
    needs:
      - building-image
      - declaring-common-variables
      - e2e-testing
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install boto3
      - name: Promote image
        run: |
          python scripts/promote_docker_image/promote_docker_image.py \
            --repository "${{ needs.building-image.outputs.ecr_repository }}" \
            --image-tag "${{ needs.building-image.outputs.image_tag }}" \
            --region "${{ needs.declaring-common-variables.outputs.aws_region }}"
  unit-testing:
    name: Unit testing
    needs:
      - declaring-common-variables
      - performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install pytest boto3 botocore dockerfile-parse
      - name: Run unit tests
        run: |
          pytest test/api/workflows/image_for_docker_runners_post/test_unit.py \
            --confcutdir=test/api/workflows/image_for_docker_runners_post \
            -v
name: Building Docker image for runners
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/image_for_docker_runners_post.yml'
      - 'src/api/docker_runner/**'
      - 'src/api/terraform.tfvars'
      - 'test/api/workflows/image_for_docker_runners_post/**'
      - '!**/README.md'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
permissions:
  contents: read
  id-token: write
