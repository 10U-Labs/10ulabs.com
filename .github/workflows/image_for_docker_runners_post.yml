concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  building-image:
    name: Building image
    needs:
      - declaring-common-variables
      - unit-testing
    outputs:
      ecr_repository: ${{ steps.config.outputs.ecr_repo }}
      image_tag: ${{ steps.build.outputs.image_tag }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration
        run: |
          ARCHITECTURE=$(grep 'os_architecture' src/api/terraform.tfvars | cut -d'"' -f2)
          ECR_REPO=$(grep 'ecr_repository_name' src/api/terraform.tfvars | cut -d'"' -f2)
          RUNNER_VERSION=$(grep 'github_runner_version' src/api/terraform.tfvars | cut -d'"' -f2)
          echo "architecture=$ARCHITECTURE" >> $GITHUB_OUTPUT
          echo "ecr_repo=$ECR_REPO" >> $GITHUB_OUTPUT
          echo "runner_version=$RUNNER_VERSION" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - id: build
        name: Build and push Docker image (native ARM64, no emulation!)
        run: |
          cd src/api/docker_runner
          BUILD_TAG="${{ github.run_number }}-$(git rev-parse --short HEAD)"
          ECR_URL="${{ needs.declaring-common-variables.outputs.aws_account_id }}.dkr.ecr.${{ needs.declaring-common-variables.outputs.aws_region }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}"
          docker build \
            --build-arg RUNNER_VERSION=${{ steps.config.outputs.runner_version }} \
            --build-arg RUNNER_ARCH=${{ steps.config.outputs.architecture }} \
            -t $ECR_URL:latest \
            -t $ECR_URL:stable \
            -t $ECR_URL:$BUILD_TAG \
            .
          docker push $ECR_URL:latest
          docker push $ECR_URL:stable
          docker push $ECR_URL:$BUILD_TAG
          echo "image_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo ""
          echo "==================================="
          echo "Docker Image Built Successfully"
          echo "==================================="
          echo ""
          echo "Repository: $ECR_URL"
          echo "Tags: latest, stable, $BUILD_TAG"
          echo "Architecture: ARM64 (native build)"
          echo ""
          echo "==================================="
  declaring-common-variables:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
      )
    name: Declaring common variables
    outputs:
      aws_account_id: ${{ steps.config.outputs.aws_account_id }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      github_actions_role: ${{ steps.config.outputs.github_actions_role }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          AWS_REGION=$(grep 'aws_region' src/api/terraform.tfvars | cut -d'"' -f2)
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' src/api/terraform.tfvars | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE=$(grep 'github_actions_role_name' src/bootstrap/terraform.tfvars | cut -d'"' -f2)
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "aws_account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "github_actions_role=$GITHUB_ACTIONS_ROLE" >> $GITHUB_OUTPUT
  cleaning-up:
    name: Cleaning up
    needs:
      - building-image
      - declaring-common-variables
      - e2e-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install boto3
      - name: Clean up old Docker images from ECR
        run: |
          python scripts/cleanup_ecr_images/cleanup_ecr_images.py \
            --region "${{ needs.declaring-common-variables.outputs.aws_region }}" \
            --repository "${{ needs.building-image.outputs.ecr_repository }}" \
            --keep-count 10
  e2e-testing:
    name: E2E testing
    needs:
      - building-image
      - declaring-common-variables
      - integration-testing
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Verify Fargate infrastructure exists
        run: |
          CLUSTER=$(aws ecs describe-clusters \
            --clusters github-runners-cluster \
            --query 'clusters[0].clusterName' \
            --output text 2>/dev/null || echo "")
          if [ -z "$CLUSTER" ] || [ "$CLUSTER" == "None" ]; then
            echo "SKIP: ECS cluster not deployed yet"
            echo "Image is built and in ECR, ready for when infrastructure is deployed"
            exit 0
          fi
          echo "✓ ECS cluster exists"
          echo "✓ Docker image ready for Fargate deployment"
  integration-testing:
    name: Integration testing
    needs:
      - building-image
      - declaring-common-variables
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Pull Docker image from ECR
        run: |
          ECR_URL="${{ needs.declaring-common-variables.outputs.aws_account_id }}.dkr.ecr.${{ needs.declaring-common-variables.outputs.aws_region }}.amazonaws.com/${{ needs.building-image.outputs.ecr_repository }}"
          docker pull $ECR_URL:latest
          echo "✓ Successfully pulled image from ECR"
      - name: Inspect image architecture
        run: |
          IMAGE="${{ needs.declaring-common-variables.outputs.aws_account_id }}.dkr.ecr.${{ needs.declaring-common-variables.outputs.aws_region }}.amazonaws.com/${{ needs.building-image.outputs.ecr_repository }}:latest"
          docker inspect $IMAGE
          ARCH=$(docker inspect $IMAGE --format='{{.Architecture}}')
          echo "Image architecture: $ARCH"
          if [ "$ARCH" != "arm64" ]; then
            echo "ERROR: Expected arm64, got $ARCH"
            exit 1
          fi
          echo "✓ Image is ARM64 as expected"
  performing-static-analysis:
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install yamllint
        run: pip install yamllint
      - name: Linting YAML files
        run: |
          DOCUMENT_START='document-start: disable'
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: {max: 300, level: warning}'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$DOCUMENT_START, $EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/image_for_docker_runners_post.yml
      - name: Validate Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint < src/api/docker_runner/Dockerfile || true
          echo "✓ Dockerfile validated"
  unit-testing:
    name: Unit testing
    needs:
      - declaring-common-variables
      - performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install pytest
      - name: Run unit tests
        run: |
          if [ -d "test/api/workflows/image_for_docker_runners_post" ]; then
            pytest test/api/workflows/image_for_docker_runners_post/test_unit.py \
              --confcutdir=test/api/workflows/image_for_docker_runners_post \
              -v
          else
            echo "No unit tests found, skipping..."
          fi
name: Building Docker image for Fargate self-hosted runners
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/image_for_docker_runners_post.yml'
      - 'src/api/docker_runner/**'
      - 'src/api/terraform.tfvars'
      - 'test/api/workflows/image_for_docker_runners_post/**'
      - '!**/README.md'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
permissions:
  contents: read
  id-token: write
