---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy /v1/image-for-ec2-runners endpoint
    permissions:
      actions: write
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "on-demand", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          TF_SHARED_LOCALS="lib/terraform/modules/shared/locals.tf"
          AWS_REGION=$(grep 'aws_region' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          RESOURCE_PREFIX=$(grep 'resource_prefix' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          LOCALS="src/bootstrap/locals.tf"
          ROLE_SUFFIX=$(grep 'name_for_github_actions_role' $LOCALS \
            | sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RESOURCE_PREFIX}${ROLE_SUFFIX}"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.config.outputs.role_arn }}
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install Python dependencies
        run: |
          python3 -m pip install \
            pylint mypy yamllint pytest boto3 boto3-stubs botocore \
            requests types-requests paramiko PyYAML
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: disable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/endpoint_v1_image_for_ec2_runners.yml
      - name: Linting Python files
        run: |
          pylint \
            src/api/endpoints/image_for_ec2_runners/lambda/handler.py \
            test/api/endpoints/image_for_ec2_runners/endpoint/ \
            --fail-on=C,R,W \
            --fail-under=10.0
      - name: Static type checking Python files with mypy
        run: |
          SRC="src/api/endpoints/image_for_ec2_runners/lambda/handler.py"
          TEST="test/api/endpoints/image_for_ec2_runners/endpoint/"
          MYPYPATH=lib/python python3 -m mypy $SRC
          MYPYPATH=lib/python python3 -m mypy --explicit-package-bases $TEST
      - name: Terraform Format Check
        run: |
          cd src/api/endpoints/image_for_ec2_runners
          terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: cd src/api/endpoints/image_for_ec2_runners && terraform init
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api/endpoints/image_for_ec2_runners && \
            tflint --init && \
            tflint
      - name: Terraform Plan
        run: cd src/api/endpoints/image_for_ec2_runners && terraform plan
      - name: Run unit tests
        run: |
          ENDPOINT="test/api/endpoints/image_for_ec2_runners/endpoint"
          pytest $ENDPOINT/pre_deployment/unit/ --confcutdir=$ENDPOINT \
            --verbose --pythonwarnings=error
      - name: Run pre-deployment integration tests
        run: |
          ENDPOINT="test/api/endpoints/image_for_ec2_runners/endpoint"
          pytest $ENDPOINT/pre_deployment/integration/ \
            --confcutdir=$ENDPOINT --verbose --pythonwarnings=error
      - name: Terraform Apply
        run: |
          cd src/api/endpoints/image_for_ec2_runners
          terraform apply -auto-approve
      - name: Run post-deployment integration tests
        run: |
          ENDPOINT="test/api/endpoints/image_for_ec2_runners/endpoint"
          pytest $ENDPOINT/post_deployment/integration/ \
            --confcutdir=$ENDPOINT --verbose --pythonwarnings=error
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'workflow_dispatch'
        name: Dispatch descendant workflows
        run: |
          python3 -m pip install pyyaml
          python3 scripts/dispatch_descendants.py \
            --workflow endpoint_v1_image_for_ec2_runners \
            --repo ${{ github.repository }}
name: Ensuring /v1/image-for-ec2-runners exists and is properly configured
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
