---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy /v1/image-for-ec2-runners endpoint
    permissions:
      actions: write
      contents: read
      id-token: write
    runs-on: >-
      ${{ ( vars.USE_GITHUB_HOSTED == 'true' ||
            github.event.inputs.github_hosted == 'true' ||
            contains(github.event.head_commit.message, '[github-hosted]') ) &&
          'ubuntu-latest' ||
          fromJSON(format('["ecs", "fargate", "arm", "spot", "runner-{0}"]',
            github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          TF_SHARED_LOCALS="lib/terraform/modules/shared/locals.tf"
          AWS_REGION=$(grep 'aws_region' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          RESOURCE_PREFIX=$(grep 'resource_prefix' $TF_SHARED_LOCALS \
            | grep -v '\$' | cut -d'"' -f2)
          LOCALS="src/bootstrap/locals.tf"
          ROLE_SUFFIX=$(grep 'name_for_github_actions_role' $LOCALS \
            | sed 's/.*\${local\.resource_prefix}//' | cut -d'"' -f1)
          ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RESOURCE_PREFIX}${ROLE_SUFFIX}"
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-to-assume: ${{ steps.config.outputs.role_arn }}
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        run: |
          cd src/api/endpoints/image_for_ec2_runners
          terraform fmt -diff -check -recursive
      - name: Terraform Init
        run: cd src/api/endpoints/image_for_ec2_runners && terraform init
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api/endpoints/image_for_ec2_runners && \
            tflint --init && \
            tflint
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install yamllint
        run: python3 -m pip install yamllint
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/endpoint_v1_image_for_ec2_runners.yml
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install pylint
        run: python3 -m pip install pylint
      - name: Run pylint on source
        run: |
          SRC=src/api/endpoints/image_for_ec2_runners/lambda/handler.py
          python3 -m pylint lib/python/ $SRC \
            --fail-on=C,R,W --fail-under=10.0
      - name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/ test/conftest.py test/api/conftest.py \
            test/api/endpoints/conftest.py \
            test/api/endpoints/image_for_ec2_runners/endpoint/ \
            --fail-on=C,R,W --fail-under=10.0
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install mypy
        run: python3 -m pip install mypy boto3-stubs types-requests
      - name: Run mypy on source
        run: |
          SRC=src/api/endpoints/image_for_ec2_runners/lambda/handler.py
          python3 -m mypy lib/python/ $SRC
      - name: Run mypy on tests
        run: |
          MYPYPATH=lib/python python3 -m mypy \
            lib/python/ test/conftest.py test/api/conftest.py \
            test/api/endpoints/conftest.py \
            test/api/endpoints/image_for_ec2_runners/endpoint/
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install jscpd
        run: npm install -g jscpd
      - name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ src/api/endpoints/image_for_ec2_runners/lambda/
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/ test/conftest.py test/api/conftest.py \
            test/api/endpoints/conftest.py \
            test/api/endpoints/image_for_ec2_runners/endpoint/
      - name: Terraform Plan
        run: cd src/api/endpoints/image_for_ec2_runners && terraform plan
      - if: >-
          vars.USE_GITHUB_HOSTED == 'true' ||
          github.event.inputs.github_hosted == 'true' ||
          contains(github.event.head_commit.message, '[github-hosted]')
        name: Install pytest dependencies
        run: |
          python3 -m pip install \
            pytest boto3 boto3-stubs requests paramiko PyYAML
      - name: Run unit tests
        run: |
          TEST_DIR=test/api/endpoints/image_for_ec2_runners/endpoint
          python3 -m pytest \
            $TEST_DIR/pre_deployment/unit/ \
            --verbose --pythonwarnings=error
      - name: Run pre-deployment integration tests
        run: |
          TEST_DIR=test/api/endpoints/image_for_ec2_runners/endpoint
          python3 -m pytest \
            $TEST_DIR/pre_deployment/integration/ \
            --capture=no --verbose --pythonwarnings=error
      - name: Terraform Apply
        run: |
          cd src/api/endpoints/image_for_ec2_runners
          terraform apply -auto-approve
      - name: Run post-deployment integration tests
        run: |
          TEST_DIR=test/api/endpoints/image_for_ec2_runners/endpoint
          python3 -m pytest \
            $TEST_DIR/post_deployment/integration/ \
            --verbose --pythonwarnings=error
      - name: Run e2e tests
        run: |
          TEST_DIR=test/api/endpoints/image_for_ec2_runners/endpoint
          python3 -m pytest \
            $TEST_DIR/post_deployment/e2e/ \
            --verbose --pythonwarnings=error
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (
          github.event.inputs.trigger_descendants == 'true' ||
           contains(github.event.head_commit.message,
           '[trigger descendants]'))
        name: Dispatch descendant workflows
        run: |
          TRIGGER_FLAG=""
          TRIGGER_INPUT="${{ github.event.inputs.trigger_descendants }}"
          if [ "$TRIGGER_INPUT" = "true" ]
          then TRIGGER_FLAG="--trigger-descendants"
          fi
          python3 src/workflowctl/workflowctl.py dispatch \
            $TRIGGER_FLAG \
            --workflow endpoint_v1_image_for_ec2_runners \
            --repo ${{ github.repository }}
name: >-
  Ensuring the /v1/image-for-ec2-runners API endpoint exists and is properly
  configured
on:
  workflow_dispatch:
    inputs:
      github_hosted:
        default: false
        description: 'Use GitHub-hosted runner instead of ephemeral ECS'
        type: boolean
      spot_recovery_reason:
        description: Spot recovery trigger reason
        required: false
        type: string
      trigger_descendants:
        default: false
        description: Trigger descendant workflows after this workflow completes
        type: boolean
permissions:
  actions: write
  contents: read
  id-token: write
