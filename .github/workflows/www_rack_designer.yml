---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-no-comments
        run: |
          python3 -m pip install \
            assert-no-comments
      - name: Assert no comments
        run: >-
          assert-no-comments
          --annotate
          --verbose
          .github/workflows/www_rack_designer.yml
          .github/actions/verify-oidc-vars/action.yml
          src/www/paths/rack_designer
          lib/python/boto_mocks
          lib/python/lambda_response
          lib/python/module_utils
          lib/python/naming_conventions
          lib/python/repo_utils
          lib/python/terraform_config
          lib/python/test_fixtures
          test/__init__.py
          test/conftest.py
          test/www/conftest.py
          test/www/paths/__init__.py
          test/www/paths/conftest.py
          test/www/paths/rack_designer
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-no-inline-directives
      - name: Assert no inline lint disables
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          .github/workflows/www_rack_designer.yml
          .github/actions/verify-oidc-vars/action.yml
          src/www/paths/rack_designer
          lib/python/boto_mocks
          lib/python/lambda_response
          lib/python/module_utils
          lib/python/naming_conventions
          lib/python/repo_utils
          lib/python/terraform_config
          lib/python/test_fixtures
          test/__init__.py
          test/conftest.py
          test/www/conftest.py
          test/www/paths/__init__.py
          test/www/paths/conftest.py
          test/www/paths/rack_designer
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          src/www/paths/rack_designer
          lib/python/boto_mocks
          lib/python/lambda_response
          lib/python/module_utils
          lib/python/naming_conventions
          lib/python/repo_utils
          lib/python/terraform_config
          lib/python/test_fixtures
          test/www/paths/rack_designer
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-one-assert-per-pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          test/__init__.py
          test/conftest.py
          test/www/conftest.py
          test/www/paths/__init__.py
          test/www/paths/conftest.py
          test/www/paths/rack_designer
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
  assert-opentofu-resource-is-used:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert every OpenTofu resource is reached by something
        uses: 10U-Labs/assert-opentofu-resource-is-used@latest
        with:
          directories: >-
            src/www/common
            lib/terraform/common
            lib/terraform/s3_bucket
          search-in: .
          verbose: "true"
  assert-pytest-fixture-name-is-needed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-pytest-fixture-name-is-needed
      - name: Assert pytest fixture name is needed
        run: >-
          assert-pytest-fixture-name-is-needed
          --verbose
          test/__init__.py
          test/conftest.py
          test/www/conftest.py
          test/www/paths/__init__.py
          test/www/paths/conftest.py
          test/www/paths/rack_designer
          test/lib/__init__.py
          test/lib/python/__init__.py
          test/lib/python/test_boto_mocks
          test/lib/python/test_lambda_response
          test/lib/python/test_module_utils
          test/lib/python/test_naming_conventions
          test/lib/python/test_naming_conventions_helpers
          test/lib/python/test_repo_utils
          test/lib/python/test_terraform_config
          test/lib/python/test_test_fixtures
          lib/python/test_fixtures
  assert-python-definition-is-used-in-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert every definition in the tests is called
        uses: 10U-Labs/assert-python-definition-is-used@latest
        with:
          assume-used-decorated-with: pytest.fixture
          assume-used-matching: "test_*,Test*,pytest_*"
          search-in: test lib/python scripts src
          trees: >-
            test/__init__.py
            test/conftest.py
            test/www/conftest.py
            test/www/paths/__init__.py
            test/www/paths/conftest.py
            test/www/paths/rack_designer
            test/lib/__init__.py
            test/lib/python/__init__.py
            test/lib/python/test_boto_mocks
            test/lib/python/test_lambda_response
            test/lib/python/test_module_utils
            test/lib/python/test_naming_conventions
            test/lib/python/test_naming_conventions_helpers
            test/lib/python/test_repo_utils
            test/lib/python/test_terraform_config
            test/lib/python/test_test_fixtures
          verbose: "true"
  copy-paste-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            lib/python/boto_mocks \
            lib/python/lambda_response \
            lib/python/module_utils \
            lib/python/naming_conventions \
            lib/python/repo_utils \
            lib/python/terraform_config \
            lib/python/test_fixtures
  copy-paste-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            test/www/paths/rack_designer \
            test/lib/python/test_boto_mocks \
            test/lib/python/test_lambda_response \
            test/lib/python/test_module_utils \
            test/lib/python/test_naming_conventions \
            test/lib/python/test_naming_conventions_helpers \
            test/lib/python/test_repo_utils \
            test/lib/python/test_terraform_config \
            test/lib/python/test_test_fixtures
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install eslint
        run: npm install --no-save eslint @eslint/js globals
      - name: Run eslint
        run: |
          npx eslint \
            --config src/www/paths/rack_designer/eslint.config.mjs \
            --max-warnings 0 \
            src/www/paths/rack_designer/js
  mypy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            mypy \
            pytest \
            requests \
            types-requests
      - name: Run mypy
        run: |
          MYPYPATH=lib/python python3 -m mypy \
            lib/python/boto_mocks \
            lib/python/lambda_response \
            lib/python/module_utils \
            lib/python/naming_conventions \
            lib/python/repo_utils \
            lib/python/terraform_config \
            lib/python/test_fixtures
  mypy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            mypy \
            pytest \
            requests \
            types-requests
      - name: Run mypy
        run: |
          MYPYPATH=lib/python:scripts python3 -m mypy \
            test/__init__.py \
            test/conftest.py \
            test/www/conftest.py \
            test/www/paths/__init__.py \
            test/www/paths/conftest.py \
            test/www/paths/rack_designer \
            test/lib/__init__.py \
            test/lib/python/__init__.py \
            test/lib/python/test_boto_mocks \
            test/lib/python/test_lambda_response \
            test/lib/python/test_module_utils \
            test/lib/python/test_naming_conventions \
            test/lib/python/test_naming_conventions_helpers \
            test/lib/python/test_repo_utils \
            test/lib/python/test_terraform_config \
            test/lib/python/test_test_fixtures
  pylint-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pylint \
            pytest \
            requests
      - name: Run pylint
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            lib/python/boto_mocks \
            lib/python/lambda_response \
            lib/python/module_utils \
            lib/python/naming_conventions \
            lib/python/repo_utils \
            lib/python/terraform_config \
            lib/python/test_fixtures \
            --recursive=y \
            --disable=missing-module-docstring \
            --disable=missing-class-docstring \
            --disable=missing-function-docstring \
            --fail-on=C,R,W --fail-under=10.0
  pylint-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pylint \
            pytest \
            requests
      - name: Run pylint
        run: |
          PYTHONPATH=lib/python:scripts python3 -m pylint \
            test/__init__.py \
            test/conftest.py \
            test/www/conftest.py \
            test/www/paths/__init__.py \
            test/www/paths/conftest.py \
            test/www/paths/rack_designer \
            test/lib/__init__.py \
            test/lib/python/__init__.py \
            test/lib/python/test_boto_mocks \
            test/lib/python/test_lambda_response \
            test/lib/python/test_module_utils \
            test/lib/python/test_naming_conventions \
            test/lib/python/test_naming_conventions_helpers \
            test/lib/python/test_repo_utils \
            test/lib/python/test_terraform_config \
            test/lib/python/test_test_fixtures \
            --recursive=y \
            --disable=missing-module-docstring \
            --disable=missing-class-docstring \
            --disable=missing-function-docstring \
            --fail-on=C,R,W --fail-under=10.0
  reconciliation:
    if: github.ref == 'refs/heads/main'
    needs:
      - assert-no-comments
      - assert-no-inline-directives
      - assert-no-linter-config-files
      - assert-one-assert-per-pytest
      - assert-opentofu-resource-is-used
      - assert-pytest-fixture-name-is-needed
      - assert-python-definition-is-used-in-tests
      - copy-paste-source
      - copy-paste-tests
      - eslint
      - mypy-source
      - mypy-tests
      - pylint-source
      - pylint-tests
      - test-boto-mocks
      - test-lambda-response
      - test-module-utils
      - test-naming-conventions
      - test-repo-utils
      - test-terraform-config
      - test-test-fixtures
      - unit-tests
      - yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore
      - id: terraform
        name: Extract Terraform version
        run: |
          TF_FILE=src/www/common/backend.tf
          TERRAFORM_VERSION=$(grep 'required_version' $TF_FILE \
            | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - name: Get website bucket name
        run: |
          terraform -chdir=src/www/common init \
            -backend=true -input=false > /dev/null
          BUCKET_NAME=$(terraform -chdir=src/www/common output -raw bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
      - name: Sync frontend to S3
        run: |
          aws s3 sync src/www/paths/rack_designer/ \
            s3://${{ env.BUCKET_NAME }}/rack-designer/ \
            --delete \
            --cache-control no-cache \
            --storage-class ONEZONE_IA \
            --exclude ".gitkeep"
      - if: >-
          github.event_name == 'push' ||
          github.event.inputs.invalidate_cloudfront == 'true'
        name: Invalidate CloudFront cache
        run: |
          WEBSITE_FQDN=$(terraform -chdir=src/www/common output \
            -raw website_domain_name)
          python3 scripts/invalidate_cloudfront.py \
            --fqdn "$WEBSITE_FQDN" \
            --region ${{ vars.AWS_REGION }} \
            --paths "/rack-designer/*"
  test-boto-mocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run boto_mocks tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_boto_mocks/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=boto_mocks \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
