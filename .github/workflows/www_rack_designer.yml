---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install assert-no-comments
        run: |
          python3 -m pip install \
            assert-no-comments
      - name: Assert no comments
        run: >-
          assert-no-comments
          --annotate
          --verbose
          .
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-no-inline-directives
      - name: Assert no inline lint disables
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          .
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          .
  assert-no-pytest-plugin-declarations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-no-pytest-plugin-declarations
      - name: Assert no pytest plugin declarations
        run: >-
          assert-no-pytest-plugin-declarations
          --verbose
          test/
          lib/
  assert-one-assert-per-pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          test/
          lib/
  assert-opentofu-resource-is-used:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert every OpenTofu resource is reached by something
        uses: 10U-Labs/assert-opentofu-resource-is-used@latest
        with:
          directories: >-
            src/www/common
            lib/terraform/common
            lib/terraform/s3_bucket
          search-in: .
          verbose: "true"
  assert-pytest-class-holds-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-pytest-class-holds-state
      - name: Assert pytest class holds state
        run: >-
          assert-pytest-class-holds-state
          --verbose
          test/
          lib/
  assert-pytest-fixture-is-requested:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-pytest-fixture-is-requested \
            boto3 \
            botocore \
            dnspython \
            pytest \
            requests
      - name: Assert pytest fixture is requested
        run: |
          PYTHONPATH=lib/python:scripts \
            assert-pytest-fixture-is-requested \
            --defined-in lib/python \
            --dont-search-in 'test/lib/python/test_{package}' \
            --pytest-argument=--confcutdir=test \
            --verbose \
            test/ \
            lib/
  assert-pytest-fixture-name-is-needed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-pytest-fixture-name-is-needed
      - name: Assert pytest fixture name is needed
        run: >-
          assert-pytest-fixture-name-is-needed
          --verbose
          test/
          lib/
  assert-pytest-test-can-fail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            assert-pytest-test-can-fail
      - name: Assert pytest test can fail
        run: >-
          assert-pytest-test-can-fail
          --verbose
          test/
          lib/
  assert-python-definition-is-used:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert every definition is named outside its own package's tests
        uses: 10U-Labs/assert-python-definition-is-used@latest
        with:
          dont-search-in: test/lib/python/test_{package}
          search-in: lib/python scripts src test
          trees: lib/python
          verbose: "true"
  assert-python-definition-is-used-in-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert every definition in the tests is called
        uses: 10U-Labs/assert-python-definition-is-used@latest
        with:
          assume-used-decorated-with: pytest.fixture
          assume-used-matching: "test_*,Test*,pytest_*"
          search-in: test lib/python scripts src
          trees: >-
            test/conftest.py
            test/www/conftest.py
            test/www/paths/conftest.py
            test/www/paths/rack_designer
            test/lib/python
          verbose: "true"
  assert-python-definition-is-used-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Assert every package is imported outside its own tests
        uses: 10U-Labs/assert-python-definition-is-used@latest
        with:
          dont-search-in: test/lib/python/test_{package}
          search-in: lib/python scripts src test
          trees: lib/python
          unimported-packages: "true"
          verbose: "true"
  copy-paste-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Check for duplicate code in source Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            src/ lib/
  copy-paste-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Check for duplicate code in test Python files
        run: |
          jscpd --pattern "**/*.py" --threshold 0 --reporters console \
            test/ lib/
  discover-repo-libraries:
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: list
        name: List the packages under lib/python
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          import pathlib
          root = pathlib.Path("lib/python")
          names = [
              p.name for p in root.iterdir()
              if (p / "__init__.py").is_file()
          ]
          print("packages=" + json.dumps(sorted(names)))
          PY
  e2e-tests:
    if: github.ref == 'refs/heads/main'
    needs: reconciliation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            requests
      - name: Run E2E tests
        run: |
          TEST=test/www/paths/rack_designer
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST/post_deployment/e2e/ \
            --confcutdir=test --verbose --pythonwarnings=error
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install eslint
        run: npm install --no-save eslint @eslint/js globals
      - name: Run eslint
        run: |
          npx eslint \
            --config src/www/paths/rack_designer/eslint.config.mjs \
            --max-warnings 0 \
            src/www/paths/rack_designer/js
  mypy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            mypy \
            pytest \
            requests \
            types-requests
      - name: Run mypy on source
        run: |
          MYPYPATH=lib/python python3 -m mypy \
            --explicit-package-bases \
            --disallow-untyped-defs \
            src/ lib/
  mypy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            boto3-stubs \
            botocore \
            dnspython \
            mypy \
            pytest \
            requests \
            types-requests
      - name: Run mypy on tests
        run: |
          MYPYPATH=lib/python:scripts python3 -m mypy \
            --explicit-package-bases \
            --disallow-untyped-defs \
            test/ lib/
  pylint-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pylint \
            pytest \
            requests
      - name: Run pylint on source
        run: |
          PYTHONPATH=lib/python python3 -m pylint \
            src/ lib/ \
            --recursive=y \
            --disable=missing-module-docstring \
            --disable=missing-class-docstring \
            --disable=missing-function-docstring \
            --fail-on=C,R,W --fail-under=10.0
  pylint-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            dnspython \
            pylint \
            pytest \
            requests
      - name: Run pylint on tests
        run: |
          PYTHONPATH=lib/python:scripts python3 -m pylint \
            test/ lib/ \
            --recursive=y \
            --disable=missing-module-docstring \
            --disable=missing-class-docstring \
            --disable=missing-function-docstring \
            --fail-on=C,R,W --fail-under=10.0
  reconciliation:
    if: github.ref == 'refs/heads/main'
    needs:
      - assert-no-comments
      - assert-no-inline-directives
      - assert-no-linter-config-files
      - assert-no-pytest-plugin-declarations
      - assert-one-assert-per-pytest
      - assert-opentofu-resource-is-used
      - assert-pytest-class-holds-state
      - assert-pytest-fixture-is-requested
      - assert-pytest-fixture-name-is-needed
      - assert-pytest-test-can-fail
      - assert-python-definition-is-used
      - assert-python-definition-is-used-in-tests
      - assert-python-definition-is-used-packages
      - copy-paste-source
      - copy-paste-tests
      - eslint
      - mypy-source
      - mypy-tests
      - pylint-source
      - pylint-tests
      - test-repo-libraries
      - unit-tests
      - yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify OIDC variables
        uses: ./.github/actions/verify-oidc-vars
        with:
          aws_region: ${{ vars.AWS_REGION }}
          oidc_role_arn: ${{ vars.OIDC_ROLE_ARN }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore
      - id: terraform
        name: Extract Terraform version
        run: |
          TF_FILE=src/www/common/backend.tf
          TERRAFORM_VERSION=$(grep 'required_version' $TF_FILE \
            | cut -d'"' -f2 | sed 's/>= //')
          echo "version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - name: Get website bucket name
        run: |
          terraform -chdir=src/www/common init \
            -backend=true -input=false > /dev/null
          BUCKET_NAME=$(terraform -chdir=src/www/common output -raw bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
      - name: Sync frontend to S3
        run: |
          aws s3 sync src/www/paths/rack_designer/ \
            s3://${{ env.BUCKET_NAME }}/rack-designer/ \
            --delete \
            --cache-control no-cache \
            --storage-class ONEZONE_IA \
            --exclude ".gitkeep"
      - if: >-
          github.event_name == 'push' ||
          github.event.inputs.invalidate_cloudfront == 'true'
        name: Invalidate CloudFront cache
        run: |
          WEBSITE_FQDN=$(terraform -chdir=src/www/common output \
            -raw website_domain_name)
          python3 scripts/invalidate_cloudfront.py \
            --fqdn "$WEBSITE_FQDN" \
            --region ${{ vars.AWS_REGION }} \
            --paths "/rack-designer/*"
  test-repo-libraries:
    needs: discover-repo-libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest \
            pytest-cov \
            requests
      - name: Run the ${{ matrix.package }} tests with a full coverage gate
        run: |
          PYTHONPATH=lib/python python3 -m pytest \
            test/lib/python/test_${{ matrix.package }}/ \
            --confcutdir=test --verbose --pythonwarnings=error \
            --cov=${{ matrix.package }} \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-repo-libraries.outputs.packages) }}
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            boto3 \
            botocore \
            pytest
      - name: Run unit tests
        run: |
          TEST=test/www/paths/rack_designer
          PYTHONPATH=lib/python python3 -m pytest \
            $TEST/pre_deployment/unit/ \
            --confcutdir=test --verbose --pythonwarnings=error
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python3 -m pip install \
            yamllint
      - name: Linting YAML files
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING"
          RULES="$RULES, $NEWLINE_AT_EOF, $TRUTHY"
          python3 -m yamllint --strict \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/www_rack_designer.yml
name: www_rack_designer
on:
  push:
    branches:
      - main
    paths:
      - .github/actions/verify-oidc-vars/action.yml
      - .github/workflows/www_rack_designer.yml
      - lib/python/**
      - lib/terraform/common/**
      - lib/terraform/s3_bucket/**
      - src/www/common/**
      - src/www/paths/rack_designer/**
      - test/conftest.py
      - test/lib/python/**
      - test/www/conftest.py
      - test/www/paths/conftest.py
      - test/www/paths/rack_designer/**
  workflow_dispatch:
    inputs:
      invalidate_cloudfront:
        default: false
        description: Force CloudFront cache invalidation
        type: boolean
permissions:
  contents: read
  id-token: write
