concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  building-ami:
    name: Building AMI
    needs:
      - declaring-common-variables
      - unit-testing
    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}
      security_group_id: ${{ steps.terraform.outputs.security_group_id }}
      subnet_id: ${{ steps.network.outputs.subnet_id }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - id: terraform
        name: Get infrastructure info from Terraform state
        run: |
          cd src/api
          terraform init -backend=true -input=false
          SUBNET_IDS=$(terraform output -raw vpc_public_subnet_ids)
          SECURITY_GROUP_ID=$(terraform output -raw runner_security_group_id)
          echo "Subnet IDs from Terraform: $SUBNET_IDS"
          echo "Security Group ID from Terraform: $SECURITY_GROUP_ID"
          echo "subnet_ids=$SUBNET_IDS" >> $GITHUB_OUTPUT
          echo "security_group_id=$SECURITY_GROUP_ID" >> $GITHUB_OUTPUT
      - id: network
        name: Find suitable subnet for instance types
        run: |
          if python3 src/api/packer/image_for_ec2_runners_post/find_suitable_subnet.py \
            check \
            --instance-types '${{ needs.declaring-common-variables.outputs.spot_instance_types }}' \
            --subnet-ids '${{ steps.terraform.outputs.subnet_ids }}'; then
            SUBNET_ID=$(python3 src/api/packer/image_for_ec2_runners_post/find_suitable_subnet.py \
              get \
              --instance-types '${{ needs.declaring-common-variables.outputs.spot_instance_types }}' \
              --subnet-ids '${{ steps.terraform.outputs.subnet_ids }}')
            echo "subnet_id=$SUBNET_ID" >> $GITHUB_OUTPUT
          else
            echo "ERROR: No suitable subnet found for instance types ${{ needs.declaring-common-variables.outputs.spot_instance_types }}" && \
            echo "in region ${{ needs.declaring-common-variables.outputs.aws_region }}" >&2
            exit 1
          fi
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"
      - name: Initialize Packer
        run: |
          cd src/api/packer/image_for_ec2_runners_post
          packer init template.pkr.hcl
      - id: build
        name: Build AMI with Packer
        run: |
          cd src/api/packer/image_for_ec2_runners_post
          echo "Building GitHub Runner AMI..."
          echo "OS Family: ${{ needs.declaring-common-variables.outputs.os_family }}"
          echo "OS Version: ${{ needs.declaring-common-variables.outputs.os_version }}"
          echo "Architecture: ${{ needs.declaring-common-variables.outputs.os_architecture }}"
          echo "Runner Version: ${{ needs.declaring-common-variables.outputs.runner_version }}"
          echo ""
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Build attempt $ATTEMPT of $MAX_ATTEMPTS"
            packer build \
              -var="aws_region=${{ needs.declaring-common-variables.outputs.aws_region }}" \
              -var="github_repository=${{ github.repository }}" \
              -var="github_run_id=${{ github.run_id }}" \
              -var="github_workflow=${{ github.workflow }}" \
              -var="os_architecture=${{ needs.declaring-common-variables.outputs.os_architecture }}" \
              -var="os_family=${{ needs.declaring-common-variables.outputs.os_family }}" \
              -var="os_version=${{ needs.declaring-common-variables.outputs.os_version }}" \
              -var="runner_version=${{ needs.declaring-common-variables.outputs.runner_version }}" \
              -var='spot_instance_types=${{ needs.declaring-common-variables.outputs.spot_instance_types }}' \
              -var="stable_tag_key=${{ needs.declaring-common-variables.outputs.stable_tag_key }}" \
              -var="subnet_id=${{ steps.network.outputs.subnet_id }}" \
              -machine-readable \
              template.pkr.hcl | tee packer-output.log
            BUILD_EXIT_CODE=$?
            if [ $BUILD_EXIT_CODE -eq 0 ]; then
              echo "Build succeeded on attempt $ATTEMPT"
              break
            fi
            if grep -q "Spot Instance interruption" packer-output.log || \
               grep -q "capacity" packer-output.log || \
               grep -q "fleet request" packer-output.log; then
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Spot instance issue detected. Retrying in 30 seconds..."
                sleep 30
                ATTEMPT=$((ATTEMPT + 1))
              else
                echo "Build failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
            else
              echo "Build failed with non-retryable error"
              exit 1
            fi
          done
          AMI_ID=$(grep 'artifact,0,id' packer-output.log | cut -d: -f2 | cut -d, -f1 || echo "")
          if [ -z "$AMI_ID" ]; then
            echo "Failed to extract AMI ID from Packer output"
            exit 1
          fi
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo ""
          echo "AMI built successfully: $AMI_ID"
      - if: steps.build.outputs.ami_id != ''
        name: Output AMI details
        run: |
          echo "==================================="
          echo "GitHub Runner AMI Built Successfully"
          echo "==================================="
          echo ""
          echo "AMI ID: ${{ steps.build.outputs.ami_id }}"
          echo "Region: ${{ needs.declaring-common-variables.outputs.aws_region }}"
          echo "OS Family: ${{ needs.declaring-common-variables.outputs.os_family }}"
          echo "OS Version: ${{ needs.declaring-common-variables.outputs.os_version }}"
          echo "OS Architecture: ${{ needs.declaring-common-variables.outputs.os_architecture }}"
          echo "Runner Version: ${{ needs.declaring-common-variables.outputs.runner_version }}"
          echo ""
          echo "==================================="
  cleaning-up:
    name: Cleaning up
    needs:
      - declaring-common-variables
      - promoting-ami
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install boto3
      - name: Clean up Packer artifacts
        run: |
          python scripts/cleanup_packer_artifacts/cleanup_packer_artifacts.py ec2 \
            --region "${{ needs.declaring-common-variables.outputs.aws_region }}" \
            --ssm-parameter-name "${{ needs.promoting-ami.outputs.ami_ssm_parameter }}"
  declaring-common-variables:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
      )
    name: Declaring common variables
    outputs:
      aws_account_id: ${{ steps.config.outputs.aws_account_id }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      github_actions_role: ${{ steps.config.outputs.github_actions_role }}
      os_architecture: ${{ steps.config.outputs.os_architecture }}
      os_family: ${{ steps.config.outputs.os_family }}
      os_version: ${{ steps.config.outputs.os_version }}
      runner_version: ${{ steps.config.outputs.runner_version }}
      spot_instance_types: ${{ steps.config.outputs.spot_instance_types }}
      stable_tag_key: ${{ steps.config.outputs.stable_tag_key }}
      terraform_version: ${{ steps.config.outputs.terraform_version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          AWS_REGION=$(grep 'aws_region' src/api/terraform.tfvars | cut -d'"' -f2)
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' src/api/terraform.tfvars | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE=$(grep 'github_actions_role_name' src/bootstrap/terraform.tfvars | cut -d'"' -f2)
          OS_ARCHITECTURE=$(grep 'os_architecture' src/api/terraform.tfvars | cut -d'"' -f2)
          OS_FAMILY=$(grep 'os_family' src/api/terraform.tfvars | cut -d'"' -f2)
          OS_VERSION=$(grep 'os_version' src/api/terraform.tfvars | cut -d'"' -f2)
          RUNNER_VERSION=$(grep 'github_runner_version' src/api/terraform.tfvars | cut -d'"' -f2)
          SPOT_INSTANCE_TYPES=$(grep 'ec2_spot_instance_types' src/api/terraform.tfvars | grep -o '\[.*\]')
          STABLE_TAG_KEY=$(grep 'ami_promotion_stable_tag' src/api/terraform.tfvars | cut -d'"' -f2)
          TERRAFORM_VERSION=$(grep 'required_version' src/api/providers.tf | cut -d'"' -f2 | sed 's/>= //')
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "aws_account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "github_actions_role=$GITHUB_ACTIONS_ROLE" >> $GITHUB_OUTPUT
          echo "os_architecture=$OS_ARCHITECTURE" >> $GITHUB_OUTPUT
          echo "os_family=$OS_FAMILY" >> $GITHUB_OUTPUT
          echo "os_version=$OS_VERSION" >> $GITHUB_OUTPUT
          echo "runner_version=$RUNNER_VERSION" >> $GITHUB_OUTPUT
          echo "spot_instance_types=$SPOT_INSTANCE_TYPES" >> $GITHUB_OUTPUT
          echo "stable_tag_key=$STABLE_TAG_KEY" >> $GITHUB_OUTPUT
          echo "terraform_version=$TERRAFORM_VERSION" >> $GITHUB_OUTPUT
  e2e-testing:
    name: E2E testing
    needs:
      - building-ami
      - declaring-common-variables
      - integration-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install pytest boto3
      - name: Get GitHub PAT from Parameter Store
        run: |
          GITHUB_PAT=$(aws ssm get-parameter --name /github/pat --with-decryption --query 'Parameter.Value' --output text)
          echo "GITHUB_PAT=$GITHUB_PAT" >> $GITHUB_ENV
      - env:
          TEST_AMI_ID: ${{ needs.building-ami.outputs.ami_id }}
          TEST_SECURITY_GROUP_ID: ${{ needs.building-ami.outputs.security_group_id }}
          TEST_SUBNET_ID: ${{ needs.building-ami.outputs.subnet_id }}
        name: Run E2E tests
        run: |
          pytest test/api/workflows/image_for_ec2_runners_post/test_e2e.py \
            --confcutdir=test/api/workflows/image_for_ec2_runners_post \
            -v
  integration-testing:
    name: Integration testing
    needs:
      - building-ami
      - declaring-common-variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install pytest boto3
      - env:
          TEST_AMI_ID: ${{ needs.building-ami.outputs.ami_id }}
          TEST_SECURITY_GROUP_ID: ${{ needs.building-ami.outputs.security_group_id }}
          TEST_SUBNET_ID: ${{ needs.building-ami.outputs.subnet_id }}
        name: Run pytest integration tests
        run: |
          pytest test/api/workflows/image_for_ec2_runners_post/test_integration.py \
            --confcutdir=test/api/workflows/image_for_ec2_runners_post \
            -v
  performing-static-analysis:
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install yamllint
        run: pip install yamllint
      - name: Linting YAML files
        run: |
          DOCUMENT_START='document-start: disable'
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          LINE_LENGTH='line-length: {max: 300, level: warning}'
          NEWLINE_AT_EOF='new-line-at-end-of-file: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$DOCUMENT_START, $EMPTY_LINES, $KEY_ORDERING, $LINE_LENGTH, $NEWLINE_AT_EOF, $TRUTHY"
          yamllint \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/image_for_ec2_runners_post.yml
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.declaring-common-variables.outputs.terraform_version }}
      - name: Terraform Format Check
        run: cd src/api && terraform fmt -check terraform.tfvars
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Run tflint
        run: |
          cd src/api && \
            tflint --init && \
            tflint --disable-rule=terraform_unused_declarations
      - name: Install Python linting dependencies
        run: pip install pylint mypy boto3-stubs boto3
      - name: Linting Python files
        run: |
          pylint \
            src/api/packer/image_for_ec2_runners_post/*.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Static type checking Python files with mypy
        run: python -m mypy src/api/packer/image_for_ec2_runners_post/*.py
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"
      - name: Initialize Packer
        run: |
          cd src/api/packer/image_for_ec2_runners_post
          packer init template.pkr.hcl
      - name: Validating Packer template
        run: |
          cd src/api/packer/image_for_ec2_runners_post
          packer validate \
            -var="aws_region=${{ needs.declaring-common-variables.outputs.aws_region }}" \
            -var="os_architecture=${{ needs.declaring-common-variables.outputs.os_architecture }}" \
            -var="os_family=${{ needs.declaring-common-variables.outputs.os_family }}" \
            -var="os_version=${{ needs.declaring-common-variables.outputs.os_version }}" \
            -var="runner_version=${{ needs.declaring-common-variables.outputs.runner_version }}" \
            -var='spot_instance_types=${{ needs.declaring-common-variables.outputs.spot_instance_types }}' \
            -var="stable_tag_key=${{ needs.declaring-common-variables.outputs.stable_tag_key }}" \
            -var="subnet_id=subnet-dummy" \
            template.pkr.hcl
  promoting-ami:
    name: Promoting AMI
    needs:
      - building-ami
      - declaring-common-variables
      - e2e-testing
    outputs:
      ami_ssm_parameter: ${{ steps.config.outputs.ami_ssm_parameter }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration from terraform.tfvars
        run: |
          AMI_SSM_PARAMETER=$(grep 'ami_promotion_ssm_parameter' src/api/terraform.tfvars | cut -d'"' -f2)
          AMI_TAG_KEY=$(grep 'ami_promotion_stable_tag' src/api/terraform.tfvars | cut -d'"' -f2)
          echo "ami_ssm_parameter=$AMI_SSM_PARAMETER" >> $GITHUB_OUTPUT
          echo "ami_tag_key=$AMI_TAG_KEY" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install boto3
      - name: Promote AMI
        run: |
          python src/api/packer/image_for_ec2_runners_post/promote_ami.py \
            --ami-id "${{ needs.building-ami.outputs.ami_id }}" \
            --region "${{ needs.declaring-common-variables.outputs.aws_region }}" \
            --run-id "${{ github.run_id }}" \
            --ssm-parameter-name "${{ steps.config.outputs.ami_ssm_parameter }}" \
            --tag-key "${{ steps.config.outputs.ami_tag_key }}"
  unit-testing:
    name: Unit testing
    needs:
      - declaring-common-variables
      - performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install pytest boto3 botocore
      - name: Run unit tests
        run: |
          pytest test/api/workflows/image_for_ec2_runners_post/test_unit.py \
            --confcutdir=test/api/workflows/image_for_ec2_runners_post \
            -v
name: Building AMI for EC2 self-hosted runners
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/image_for_ec2_runners_post.yml'
      - 'src/api/packer/image_for_ec2_runners_post/**'
      - 'src/api/terraform.tfvars'
      - 'test/api/workflows/image_for_ec2_runners_post/**'
      - '!**/README.md'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
permissions:
  contents: read
  id-token: write
