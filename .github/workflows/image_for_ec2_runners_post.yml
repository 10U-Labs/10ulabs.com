concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow_ref }}-${{ github.ref }}
jobs:
  building-ami:
    name: Building AMI
    needs:
      - declaring-common-variables
      - unit-testing
    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration from terraform.tfvars
        run: |
          VPC_NAME=$(grep 'vpc_name' src/api/terraform.tfvars | cut -d'"' -f2)
          OS_FAMILY=$(grep 'os_family' src/api/terraform.tfvars | cut -d'"' -f2)
          OS_VERSION=$(grep 'os_version' src/api/terraform.tfvars | cut -d'"' -f2)
          OS_ARCHITECTURE=$(grep 'os_architecture' src/api/terraform.tfvars | cut -d'"' -f2)
          if [ "$OS_FAMILY" = "debian" ] && [ "$OS_VERSION" = "stable" ]; then
            RESOLVED_VERSION=$(curl -s https://deb.debian.org/debian/dists/stable/Release | grep -oP '^Version: \K[0-9]+' || echo "13")
            echo "Resolved Debian stable to version $RESOLVED_VERSION (queried from Debian repository)"
          else
            RESOLVED_VERSION="$OS_VERSION"
          fi
          RUNNER_VERSION=$(grep 'github_runner_version' src/api/terraform.tfvars | cut -d'"' -f2)
          INSTANCE_TYPE=$(grep 'packer_instance_type' src/api/terraform.tfvars | cut -d'"' -f2)
          SPOT_INSTANCE_TYPES=$(grep 'ec2_spot_instance_types' src/api/terraform.tfvars | grep -o '\[.*\]')
          echo "vpc_name=$VPC_NAME" >> $GITHUB_OUTPUT
          echo "os_version=$RESOLVED_VERSION" >> $GITHUB_OUTPUT
          echo "os_architecture=$OS_ARCHITECTURE" >> $GITHUB_OUTPUT
          echo "runner_version=$RUNNER_VERSION" >> $GITHUB_OUTPUT
          echo "instance_type=$INSTANCE_TYPE" >> $GITHUB_OUTPUT
          echo "spot_instance_types=$SPOT_INSTANCE_TYPES" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - id: network
        name: Get VPC info from deployed infrastructure
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ steps.config.outputs.vpc_name }}" \
            --query 'Vpcs[0].VpcId' \
            --output json --no-cli-pager | jq -r '.')
          PRIMARY_INSTANCE_TYPE="${{ steps.config.outputs.instance_type }}"
          echo "Querying AWS for AZs that support instance type: $PRIMARY_INSTANCE_TYPE"
          SUPPORTED_AZS=$(aws ec2 describe-instance-type-offerings \
            --location-type availability-zone \
            --filters "Name=instance-type,Values=$PRIMARY_INSTANCE_TYPE" \
            --query 'InstanceTypeOfferings[].Location' \
            --output json --no-cli-pager | jq -r '.[]')
          if [ -z "$SUPPORTED_AZS" ]; then
            echo "ERROR: No AZs found supporting instance type $PRIMARY_INSTANCE_TYPE"
            exit 1
          fi
          echo "AZs supporting $PRIMARY_INSTANCE_TYPE:"
          echo "$SUPPORTED_AZS"
          for AZ in $SUPPORTED_AZS; do
            SUBNET_ID=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" \
                        "Name=map-public-ip-on-launch,Values=true" \
                        "Name=availability-zone,Values=$AZ" \
              --query 'Subnets[0].SubnetId' \
              --output text --no-cli-pager)
            if [ -n "$SUBNET_ID" ] && [ "$SUBNET_ID" != "None" ]; then
              echo "Found subnet $SUBNET_ID in AZ $AZ"
              echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
              echo "subnet_id=$SUBNET_ID" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "ERROR: No suitable subnet found in any supported AZ"
          exit 1
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"
      - name: Initialize Packer
        run: |
          cd src/api/packer/image_for_ec2_runners_post
          packer init template.pkr.hcl
      - name: Validate Packer template
        run: |
          cd src/api/packer/image_for_ec2_runners_post
          packer validate \
            -var="os_version=${{ steps.config.outputs.os_version }}" \
            -var="os_architecture=${{ steps.config.outputs.os_architecture }}" \
            -var="runner_version=${{ steps.config.outputs.runner_version }}" \
            -var="aws_region=${{ needs.declaring-common-variables.outputs.aws_region }}" \
            -var="instance_type=${{ steps.config.outputs.instance_type }}" \
            -var='spot_instance_types=${{ steps.config.outputs.spot_instance_types }}' \
            -var="vpc_id=${{ steps.network.outputs.vpc_id }}" \
            -var="subnet_id=${{ steps.network.outputs.subnet_id }}" \
            template.pkr.hcl
      - id: build
        name: Build AMI with Packer
        run: |
          cd src/api/packer/image_for_ec2_runners_post
          echo "Building GitHub Runner AMI..."
          echo "Debian Version: ${{ steps.config.outputs.os_version }}"
          echo "Architecture: ${{ steps.config.outputs.os_architecture }}"
          echo "Runner Version: ${{ steps.config.outputs.runner_version }}"
          echo "Instance Type: ${{ steps.config.outputs.instance_type }}"
          echo ""
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Build attempt $ATTEMPT of $MAX_ATTEMPTS"
            packer build \
              -var="os_version=${{ steps.config.outputs.os_version }}" \
              -var="os_architecture=${{ steps.config.outputs.os_architecture }}" \
              -var="runner_version=${{ steps.config.outputs.runner_version }}" \
              -var="aws_region=${{ needs.declaring-common-variables.outputs.aws_region }}" \
              -var="instance_type=${{ steps.config.outputs.instance_type }}" \
              -var='spot_instance_types=${{ steps.config.outputs.spot_instance_types }}' \
              -var="vpc_id=${{ steps.network.outputs.vpc_id }}" \
              -var="subnet_id=${{ steps.network.outputs.subnet_id }}" \
              -machine-readable \
              template.pkr.hcl | tee packer-output.log
            BUILD_EXIT_CODE=$?
            if [ $BUILD_EXIT_CODE -eq 0 ]; then
              echo "Build succeeded on attempt $ATTEMPT"
              break
            fi
            if grep -q "Spot Instance interruption" packer-output.log || \
               grep -q "capacity" packer-output.log || \
               grep -q "fleet request" packer-output.log; then
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Spot instance issue detected. Retrying in 30 seconds..."
                sleep 30
                ATTEMPT=$((ATTEMPT + 1))
              else
                echo "Build failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
            else
              echo "Build failed with non-retryable error"
              exit 1
            fi
          done
          AMI_ID=$(grep 'artifact,0,id' packer-output.log | cut -d: -f2 | cut -d, -f1 || echo "")
          if [ -z "$AMI_ID" ]; then
            echo "Failed to extract AMI ID from Packer output"
            exit 1
          fi
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo ""
          echo "AMI built successfully: $AMI_ID"
      - if: steps.build.outputs.ami_id != ''
        name: Tag AMI
        run: |
          aws ec2 create-tags \
            --resources ${{ steps.build.outputs.ami_id }} \
            --tags Key=ManagedBy,Value=GitHubActions Key=Repository,Value=${{ github.repository }} Key=Workflow,Value="${{ github.workflow }}" Key=RunId,Value=${{ github.run_id }} \
            --region ${{ needs.declaring-common-variables.outputs.aws_region }}
          echo "Tagged AMI ${{ steps.build.outputs.ami_id }}"
      - if: steps.build.outputs.ami_id != ''
        name: Output AMI details
        run: |
          echo "==================================="
          echo "GitHub Runner AMI Built Successfully"
          echo "==================================="
          echo ""
          echo "AMI ID: ${{ steps.build.outputs.ami_id }}"
          echo "Region: ${{ needs.declaring-common-variables.outputs.aws_region }}"
          echo "Debian Version: ${{ steps.config.outputs.os_version }}"
          echo "Architecture: ${{ steps.config.outputs.os_architecture }}"
          echo "Runner Version: ${{ steps.config.outputs.runner_version }}"
          echo ""
          echo "To use this AMI, update your CloudFormation template or"
          echo "add it to the config file under docker_builder.custom_ami"
          echo ""
          echo "==================================="
  declaring-common-variables:
    name: Declaring common variables
    outputs:
      aws_account_id: ${{ steps.config.outputs.aws_account_id }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      github_actions_role: ${{ steps.config.outputs.github_actions_role }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Extract configuration values
        run: |
          AWS_REGION=$(grep 'aws_region' src/api/terraform.tfvars | cut -d'"' -f2)
          AWS_ACCOUNT_ID=$(grep 'aws_account_id' src/api/terraform.tfvars | cut -d'"' -f2)
          GITHUB_ACTIONS_ROLE='GitHubActionsRole'
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "aws_account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "github_actions_role=$GITHUB_ACTIONS_ROLE" >> $GITHUB_OUTPUT
  e2e-testing:
    name: E2E testing
    needs:
      - declaring-common-variables
      - integration-testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install pytest boto3 requests
      - name: Run E2E tests
        run: pytest test/api/image_for_ec2_runners_post/test_e2e.py -v
  integration-testing:
    name: Integration testing
    needs:
      - building-ami
      - declaring-common-variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install pytest boto3 requests
      - name: Run pytest integration tests
        run: pytest test/api/image_for_ec2_runners_post/test_integration.py -v
  performing-static-analysis:
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(github.event.head_commit.message, '[dry run]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      )
    name: Performing static analysis
    needs: declaring-common-variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Install linting dependencies
        run: pip install pylint mypy yamllint boto3-stubs
      - name: Install project dependencies for linting
        run: pip install boto3
      - name: Terraform Format Check
        run: cd src/api && terraform fmt -check terraform.tfvars
      - name: Run tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cd src/api && tflint --init && tflint
      - name: Linting Python files
        run: |
          pylint \
            src/api/packer/image_for_ec2_runners_post/*.py \
            --disable=line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,too-many-lines \
            --fail-under=10.0
      - name: Linting YAML files
        run: |
          echo "Running yamllint on workflow files..."
          CONFIG='{extends: default, rules: {line-length: {max: 300, level: warning}, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}, empty-lines: {max: 0, max-start: 0, max-end: 1}, new-line-at-end-of-file: enable, key-ordering: enable}}'
          yamllint --config-data "$CONFIG" .github/workflows/image_for_ec2_runners_post.yml
      - name: Static type checking Python files with mypy
        run: python -m mypy src/api/packer/image_for_ec2_runners_post/*.py
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"
      - name: Initialize Packer
        run: |
          cd src/api/packer/image_for_ec2_runners_post
          packer init template.pkr.hcl
      - id: packer-config
        name: Load Packer validation config
        run: |
          OS_ARCHITECTURE=$(grep 'os_architecture' src/api/terraform.tfvars | cut -d'"' -f2)
          OS_VERSION=$(grep 'os_version' src/api/terraform.tfvars | cut -d'"' -f2)
          RUNNER_VERSION=$(grep 'github_runner_version' src/api/terraform.tfvars | cut -d'"' -f2)
          SPOT_INSTANCE_TYPES=$(grep 'ec2_spot_instance_types' src/api/terraform.tfvars | grep -o '\[.*\]')
          FIRST_INSTANCE_TYPE=$(grep 'ec2_spot_instance_types' src/api/terraform.tfvars | grep -o '\[.*\]' | sed 's/\[//;s/\]//;s/"//g;s/,.*//;s/ //')
          echo "os_architecture=$OS_ARCHITECTURE" >> $GITHUB_OUTPUT
          echo "os_version=$OS_VERSION" >> $GITHUB_OUTPUT
          echo "runner_version=$RUNNER_VERSION" >> $GITHUB_OUTPUT
          echo "spot_instance_types=$SPOT_INSTANCE_TYPES" >> $GITHUB_OUTPUT
          echo "first_instance_type=$FIRST_INSTANCE_TYPE" >> $GITHUB_OUTPUT
      - name: Validating Packer template
        run: |
          cd src/api/packer/image_for_ec2_runners_post
          packer validate \
            -var="os_version=${{ steps.packer-config.outputs.os_version }}" \
            -var="os_architecture=${{ steps.packer-config.outputs.os_architecture }}" \
            -var="runner_version=${{ steps.packer-config.outputs.runner_version }}" \
            -var="aws_region=${{ needs.declaring-common-variables.outputs.aws_region }}" \
            -var="instance_type=${{ steps.packer-config.outputs.first_instance_type }}" \
            -var='spot_instance_types=${{ steps.packer-config.outputs.spot_instance_types }}' \
            -var="vpc_id=vpc-dummy" \
            -var="subnet_id=subnet-dummy" \
            template.pkr.hcl
  promoting-ami:
    name: Promoting AMI
    needs:
      - declaring-common-variables
      - e2e-testing
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: config
        name: Load configuration from terraform.tfvars
        run: |
          AMI_SSM_PARAMETER=$(grep 'ami_promotion_ssm_parameter' src/api/terraform.tfvars | cut -d'"' -f2)
          AMI_TAG_KEY=$(grep 'ami_promotion_stable_tag' src/api/terraform.tfvars | cut -d'"' -f2)
          echo "ami_ssm_parameter=$AMI_SSM_PARAMETER" >> $GITHUB_OUTPUT
          echo "ami_tag_key=$AMI_TAG_KEY" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.declaring-common-variables.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ needs.declaring-common-variables.outputs.aws_account_id }}:role/${{ needs.declaring-common-variables.outputs.github_actions_role }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install boto3
      - name: Promote AMI
        run: |
          python src/api/packer/image_for_ec2_runners_post/promote_ami.py \
            --ami-id "${{ needs.building-ami.outputs.ami_id }}" \
            --region "${{ needs.declaring-common-variables.outputs.aws_region }}" \
            --run-id "${{ github.run_id }}" \
            --ssm-parameter-name "${{ steps.config.outputs.ami_ssm_parameter }}" \
            --tag-key "${{ steps.config.outputs.ami_tag_key }}"
  unit-testing:
    name: Unit testing
    needs:
      - declaring-common-variables
      - performing-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          pip install pytest boto3 moto &&
          pip install aws-cdk-lib constructs
      - name: Run unit tests
        run: pytest test/api/image_for_ec2_runners_post/test_unit.py -v
name: Building AMI for EC2 self-hosted runners
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/image_for_ec2_runners_post.yml'
      - 'src/api/packer/image_for_ec2_runners_post/**'
      - 'src/api/terraform.tfvars'
      - 'test/api/image_for_ec2_runners_post/**'
      - '!**/README.md'
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        description: Dry run mode (show structure without executing)
        required: false
        type: boolean
  workflow_run:
    branches: [main]
    types: [completed]
    workflows: ["Ensuring API infrastructure exists and is properly configured"]
permissions:
  contents: read
  id-token: write
